f biggest(a, b, c):\n    return max(a, b, c)\n","bestCode":"biggest=max\n"}},{"id":"golf-08-fizz","region":"golf-shrine","order":8,"title":"Fizz or Buzz","story":"Hole 8, the back nine's final flag.","goal":"Write fizz(n): 'Fizz' if n divides by 3, 'Buzz' if by 5, 'FizzBuzz' if both, otherwise str(n).","type":"write-code","starter":"def fizz(n):\n    # write it any way you like, then make it SHORTER\n    pass\n","tests":[{"kind":"eval","label":"3","expr":"fizz(3)","expect":"'Fizz'"},{"kind":"eval","label":"10","expr":"fizz(10)","expect":"'Buzz'"},{"kind":"eval","label":"15","expr":"fizz(15)","expect":"'FizzBuzz'"},{"kind":"eval","label":"7","expr":"fizz(7)","expect":"'7'","hidden":true},{"kind":"eval","label":"30","expr":"fizz(30)","expect":"'FizzBuzz'","hidden":true}],"hints":["Check the both-case first.","A string times 0 is empty, and an empty string is falsy, so 'or' can supply the number.","def fizz(n):\n    if n % 15 == 0:\n        return 'FizzBuzz'\n    if n % 3 == 0:\n        return 'Fizz'\n    if n % 5 == 0:\n        return 'Buzz'\n    return str(n)\n"],"socratic":["What is the plainest way to do it?","Which words or spaces can disappear?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Fizz or Buzz”?","xp":25,"skills":["golf"],"requires":["golf-07-max3"],"solution":"def fizz(n):\n    if n % 15 == 0:\n        return 'FizzBuzz'\n    if n % 3 == 0:\n        return 'Fizz'\n    if n % 5 == 0:\n        return 'Buzz'\n    return str(n)\n","alt":"fizz=lambda n:'Fizz'*(n%3<1)+'Buzz'*(n%5<1)or str(n)\n","golf":{"par":158,"best":52,"parCode":"def fizz(n):\n    if n % 15 == 0:\n        return 'FizzBuzz'\n    if n % 3 == 0:\n        return 'Fizz'\n    if n % 5 == 0:\n        return 'Buzz'\n    return str(n)\n","bestCode":"fizz=lambda n:'Fizz'*(n%3<1)+'Buzz'*(n%5<1)or str(n)\n"}},{"id":"ip-anagram","region":"interview-prep","order":3,"title":"Anagram Check","story":"Are two words made of exactly the same letters?","goal":"Write is_anagram(a, b): True if b is a rearrangement of a (ignore case).","type":"write-code","starter":"def is_anagram(a, b):\n    # compare sorted letters or counts\n    pass\n","tests":[{"kind":"eval","label":"yes","expr":"is_anagram(\"listen\", \"silent\")","expect":"True"},{"kind":"eval","label":"no","expr":"is_anagram(\"apple\", \"papel1\")","expect":"False"},{"kind":"eval","label":"case","expr":"is_anagram(\"Dusty\", \"study\")","expect":"True","hidden":true},{"kind":"eval","label":"different length","expr":"is_anagram(\"ab\", \"abc\")","expect":"False","hidden":true}],"hints":["If two words are anagrams, their sorted letters are equal.","Lowercase both first.","def is_anagram(a, b):\n    return sorted(a.lower()) == sorted(b.lower())\n"],"socratic":["What is the same about two anagrams?","What about capital letters?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Anagram Check”?","xp":30,"skills":["interview","strings"],"requires":["ip-brackets"],"solution":"def is_anagram(a, b):\n    return sorted(a.lower()) == sorted(b.lower())\n","alt":"from collections import Counter\n\ndef is_anagram(a, b):\n    return Counter(a.lower()) == Counter(b.lower())\n"},{"id":"ip-boss-bsearch","region":"interview-prep","order":11,"title":"Boss: Broken Binary Search","story":"The interviewer hands you a binary search that sometimes loops forever and sometimes misses the last item.","goal":"Fix search(items, target) for a SORTED list: return the index of target, or -1 if it is missing.","type":"fix-the-bug","starter":"def search(items, target):\n    lo, hi = 0, len(items)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            lo = mid\n        else:\n            hi = mid\n    return -1\n","tests":[{"kind":"eval","label":"middle","expr":"search([1, 3, 5, 7, 9], 5)","expect":"2"},{"kind":"eval","label":"last","expr":"search([1, 3, 5, 7, 9], 9)","expect":"4"},{"kind":"eval","label":"first","expr":"search([1, 3, 5, 7, 9], 1)","expect":"0"},{"kind":"eval","label":"missing","expr":"search([1, 3, 5, 7], 4)","expect":"-1"},{"kind":"eval","label":"empty","expr":"search([], 1)","expect":"-1","hidden":true},{"kind":"eval","label":"single","expr":"search([4], 4)","expect":"0","hidden":true},{"kind":"eval","label":"single miss","expr":"search([4], 5)","expect":"-1","hidden":true}],"hints":["Trace it with [1, 3] and target 3: lo = mid never moves past the middle, so it loops forever.","After checking mid, move past it: lo = mid + 1 or hi = mid - 1, and decide whether hi is inclusive.","def search(items, target):\n    lo, hi = 0, len(items) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n"],"socratic":["What happens to lo when mid equals lo?","Is hi included in the search range or not?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":50,"skills":["interview","debugging"],"requires":["ip-running-sum"],"solution":"def search(items, target):\n    lo, hi = 0, len(items) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n","alt":"def search(items, target):\n    lo, hi = 0, len(items)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return -1\n","boss":true},{"id":"ip-brackets","region":"interview-prep","order":2,"title":"Valid Brackets","story":"Does every bracket have a partner in the right order?","goal":"Write valid(s): True if the brackets ()[]{} in s are balanced and properly nested, otherwise False.","type":"write-code","starter":"def valid(s):\n    # use a stack (list)\n    pass\n","tests":[{"kind":"eval","label":"ok","expr":"valid(\"([]{})\")","expect":"True"},{"kind":"eval","label":"crossed","expr":"valid(\"([)]\")","expect":"False"},{"kind":"eval","label":"unclosed","expr":"valid(\"((\")","expect":"False"},{"kind":"eval","label":"extra close","expr":"valid(\"())\")","expect":"False","hidden":true},{"kind":"eval","label":"empty","expr":"valid(\"\")","expect":"True","hidden":true}],"hints":["Push openers on a list. When you see a closer, it must match the last opener.","At the end the stack must be empty.","def valid(s):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n"],"socratic":["Which bracket must close first?","What should be left at the end?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Valid Brackets”?","xp":45,"skills":["interview","stack"],"requires":["ip-two-sum"],"solution":"def valid(s):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n","alt":"def valid(s):\n    prev = None\n    while prev != s:\n        prev = s\n        s = s.replace(\"()\", \"\").replace(\"[]\", \"\").replace(\"{}\", \"\")\n    return s == \"\"\n"},{"id":"ip-first-unique","region":"interview-prep","order":4,"title":"First Unique Letter","story":"Find the first character that appears only once.","goal":"Write first_unique(s): return the first character that appears exactly once in s, or \"\" if there is none.","type":"write-code","starter":"def first_unique(s):\n    # count first, then scan\n    pass\n","tests":[{"kind":"eval","label":"middle","expr":"first_unique(\"aabbcd\")","expect":"'c'"},{"kind":"eval","label":"start","expr":"first_unique(\"xaabb\")","expect":"'x'"},{"kind":"eval","label":"none","expr":"first_unique(\"aabb\")","expect":"''","hidden":true},{"kind":"eval","label":"empty","expr":"first_unique(\"\")","expect":"''","hidden":true}],"hints":["Count every letter first.","Then scan from the left and return the first with count 1.","def first_unique(s):\n    counts = {}\n    for ch in s:\n        counts[ch] = counts.get(ch, 0) + 1\n    for ch in s:\n        if counts[ch] == 1:\n            return ch\n    return \"\"\n"],"socratic":["Why two passes?","What do you return when nothing is unique?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “First Unique Letter”?","xp":30,"skills":["interview","strings"],"requires":["ip-anagram"],"solution":"def first_unique(s):\n    counts = {}\n    for ch in s:\n        counts[ch] = counts.get(ch, 0) + 1\n    for ch in s:\n        if counts[ch] == 1:\n            return ch\n    return \"\"\n","alt":"def first_unique(s):\n    for ch in s:\n        if s.count(ch) == 1:\n            return ch\n    return \"\"\n"},{"id":"ip-flatten","region":"interview-prep","order":8,"title":"Flatten","story":"Lists inside lists inside lists. Make one flat list.","goal":"Write flatten(items): return a flat list of every non-list item, in order, however deeply nested.","type":"write-code","starter":"def flatten(items):\n    # recursion\n    pass\n","tests":[{"kind":"eval","label":"nested","expr":"flatten([1, [2, [3, 4]], 5])","expect":"[1, 2, 3, 4, 5]"},{"kind":"eval","label":"flat","expr":"flatten([1, 2])","expect":"[1, 2]"},{"kind":"eval","label":"empty inner","expr":"flatten([[], [1], [[]]])","expect":"[1]","hidden":true},{"kind":"eval","label":"strings stay","expr":"flatten([\"a\", [\"b\"]])","expect":"['a', 'b']","hidden":true}],"hints":["If an item is a list, flatten it too: that is recursion.","isinstance(item, list) tells you which case you are in.","def flatten(items):\n    out = []\n    for item in items:\n        if isinstance(item, list):\n            out.extend(flatten(item))\n        else:\n            out.append(item)\n    return out\n"],"socratic":["What do you do with a list inside the list?","What stops the recursion?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Flatten”?","xp":45,"skills":["interview","recursion"],"requires":["ip-rotate"],"solution":"def flatten(items):\n    out = []\n    for item in items:\n        if isinstance(item, list):\n            out.extend(flatten(item))\n        else:\n            out.append(item)\n    return out\n","alt":"def flatten(items):\n    stack = list(items)[::-1]\n    out = []\n    while stack:\n        item = stack.pop()\n        if isinstance(item, list):\n            stack.extend(item[::-1])\n        else:\n            out.append(item)\n    return out\n"},{"id":"ip-intervals","region":"interview-prep","order":9,"title":"Merge Intervals","story":"Meeting rooms: merge overlapping time ranges.","goal":"Write merge_intervals(pairs): pairs is a list of [start, end]. Return the merged list sorted by start. Touching ranges (end equals next start) merge too.","type":"write-code","starter":"def merge_intervals(pairs):\n    # sort by start first\n    pass\n","tests":[{"kind":"eval","label":"basic","expr":"merge_intervals([[1, 3], [2, 6], [8, 10]])","expect":"[[1, 6], [8, 10]]"},{"kind":"eval","label":"touching","expr":"merge_intervals([[1, 2], [2, 3]])","expect":"[[1, 3]]"},{"kind":"eval","label":"unsorted","expr":"merge_intervals([[8, 10], [1, 3], [2, 4]])","expect":"[[1, 4], [8, 10]]","hidden":true},{"kind":"eval","label":"inside","expr":"merge_intervals([[1, 10], [2, 3]])","expect":"[[1, 10]]","hidden":true},{"kind":"eval","label":"empty","expr":"merge_intervals([])","expect":"[]","hidden":true}],"hints":["Sort by start. Then compare each range with the last merged one.","If start <= last end, extend the last end with max(last end, end).","def merge_intervals(pairs):\n    out = []\n    for start, end in sorted(pairs):\n        if out and start <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], end)\n        else:\n            out.append([start, end])\n    return out\n"],"socratic":["Why sort first?","When do two ranges overlap?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Merge Intervals”?","xp":50,"skills":["interview","lists"],"requires":["ip-flatten"],"solution":"def merge_intervals(pairs):\n    out = []\n    for start, end in sorted(pairs):\n        if out and start <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], end)\n        else:\n            out.append([start, end])\n    return out\n","alt":"def merge_intervals(pairs):\n    pairs = sorted(pairs)\n    out = []\n    for p in pairs:\n        if not out or p[0] > out[-1][1]:\n            out.append([p[0], p[1]])\n        elif p[1] > out[-1][1]:\n            out[-1][1] = p[1]\n    return out\n"},{"id":"ip-palindrome","region":"interview-prep","order":6,"title":"Real Palindrome","story":"Ignore spaces, punctuation and case: is the phrase the same backwards?","goal":"Write is_palindrome(s): True when the letters and digits of s read the same both ways, ignoring case and everything else.","type":"write-code","starter":"def is_palindrome(s):\n    # keep only letters and digits\n    pass\n","tests":[{"kind":"eval","label":"phrase","expr":"is_palindrome(\"A man, a plan, a canal: Panama\")","expect":"True"},{"kind":"eval","label":"no","expr":"is_palindrome(\"hello\")","expect":"False"},{"kind":"eval","label":"digits","expr":"is_palindrome(\"12321\")","expect":"True","hidden":true},{"kind":"eval","label":"only symbols","expr":"is_palindrome(\"!?\")","expect":"True","hidden":true}],"hints":["Build a cleaned string first: only characters where ch.isalnum().","Lowercase it, then compare with its reverse.","def is_palindrome(s):\n    clean = [ch.lower() for ch in s if ch.isalnum()]\n    return clean == clean[::-1]\n"],"socratic":["What should be thrown away first?","How do you compare with the reverse?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Real Palindrome”?","xp":30,"skills":["interview","strings"],"requires":["ip-reverse-words"],"solution":"def is_palindrome(s):\n    clean = [ch.lower() for ch in s if ch.isalnum()]\n    return clean == clean[::-1]\n","alt":"def is_palindrome(s):\n    clean = \"\".join(ch for ch in s.lower() if ch.isalnum())\n    i, j = 0, len(clean) - 1\n    while i < j:\n        if clean[i] != clean[j]:\n            return False\n        i += 1\n        j -= 1\n    return True\n"},{"id":"ip-reverse-words","region":"interview-prep","order":5,"title":"Reverse the Words","story":"Reverse the order of the words, not the letters.","goal":"Write reverse_words(s): return the words of s in reverse order, joined by single spaces. Extra spaces are dropped.","type":"write-code","starter":"def reverse_words(s):\n    # split, reverse, join\n    pass\n","tests":[{"kind":"eval","label":"simple","expr":"reverse_words(\"the sky is blue\")","expect":"'blue is sky the'"},{"kind":"eval","label":"extra spaces","expr":"reverse_words(\"  hello   world \")","expect":"'world hello'"},{"kind":"eval","label":"one","expr":"reverse_words(\"hi\")","expect":"'hi'","hidden":true},{"kind":"eval","label":"empty","expr":"reverse_words(\"\")","expect":"''","hidden":true}],"hints":["split() with no argument splits on any run of spaces.","words[::-1] reverses a list.","def reverse_words(s):\n    return \" \".join(s.split()[::-1])\n"],"socratic":["What does split() do with extra spaces?","How do you reverse a list?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Reverse the Words”?","xp":30,"skills":["interview","strings"],"requires":["ip-first-unique"],"solution":"def reverse_words(s):\n    return \" \".join(s.split()[::-1])\n","alt":"def reverse_words(s):\n    words = s.split()\n    out = []\n    for w in words:\n        out.insert(0, w)\n    return \" \".join(out)\n"},{"id":"ip-rotate","region":"interview-prep","order":7,"title":"Rotate the List","story":"Move the last k items to the front.","goal":"Write rotate(items, k): return a new list rotated right by k places. k may be larger than the length.","type":"write-code","starter":"def rotate(items, k):\n    # use slicing and %\n    pass\n","tests":[{"kind":"eval","label":"basic","expr":"rotate([1, 2, 3, 4, 5], 2)","expect":"[4, 5, 1, 2, 3]"},{"kind":"eval","label":"big k","expr":"rotate([1, 2, 3], 4)","expect":"[3, 1, 2]"},{"kind":"eval","label":"zero","expr":"rotate([1, 2], 0)","expect":"[1, 2]","hidden":true},{"kind":"eval","label":"empty","expr":"rotate([], 3)","expect":"[]","hidden":true}],"hints":["k % len(items) removes full turns. Careful with an empty list.","items[-k:] + items[:-k] works when k is between 1 and len - 1.","def rotate(items, k):\n    if not items:\n        return []\n    k = k % len(items)\n    return items[len(items) - k:] + items[:len(items) - k]\n"],"socratic":["What does rotating by the full length do?","What if the list is empty?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Rotate the List”?","xp":40,"skills":["interview","lists"],"requires":["ip-palindrome"],"solution":"def rotate(items, k):\n    if not items:\n        return []\n    k = k % len(items)\n    return items[len(items) - k:] + items[:len(items) - k]\n","alt":"def rotate(items, k):\n    items = list(items)\n    if not items:\n        return items\n    for _ in range(k % len(items)):\n        items.insert(0, items.pop())\n    return items\n"},{"id":"ip-running-sum","region":"interview-prep","order":10,"title":"Running Total","story":"Show the total so far after every item.","goal":"Write running_sum(nums): return a list where item i is the sum of nums[0..i].","type":"write-code","starter":"def running_sum(nums):\n    # keep a total\n    pass\n","tests":[{"kind":"eval","label":"basic","expr":"running_sum([1, 2, 3, 4])","expect":"[1, 3, 6, 10]"},{"kind":"eval","label":"negative","expr":"running_sum([5, -2, 1])","expect":"[5, 3, 4]"},{"kind":"eval","label":"empty","expr":"running_sum([])","expect":"[]","hidden":true}],"hints":["Keep a total variable that grows as you go.","Append the total after each addition.","def running_sum(nums):\n    total = 0\n    out = []\n    for n in nums:\n        total += n\n        out.append(total)\n    return out\n"],"socratic":["What carries over from one item to the next?","What if the list is empty?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Running Total”?","xp":30,"skills":["interview","lists"],"requires":["ip-intervals"],"solution":"def running_sum(nums):\n    total = 0\n    out = []\n    for n in nums:\n        total += n\n        out.append(total)\n    return out\n","alt":"from itertools import accumulate\n\ndef running_sum(nums):\n    return list(accumulate(nums))\n"},{"id":"ip-two-sum","region":"interview-prep","order":1,"title":"Two Sum","story":"The classic opener. Given numbers and a target, find the two positions that add up to it.","goal":"Write two_sum(nums, target): return the two indexes [i, j] with i < j whose numbers add up to target. Exactly one pair exists.","type":"write-code","starter":"def two_sum(nums, target):\n    # remember what you have seen\n    pass\n","tests":[{"kind":"eval","label":"basic","expr":"two_sum([2, 7, 11, 15], 9)","expect":"[0, 1]"},{"kind":"eval","label":"middle","expr":"two_sum([3, 2, 4], 6)","expect":"[1, 2]"},{"kind":"eval","label":"duplicates","expr":"two_sum([3, 3], 6)","expect":"[0, 1]","hidden":true},{"kind":"eval","label":"negatives","expr":"two_sum([-1, 5, 1, 8], 0)","expect":"[0, 2]","hidden":true}],"hints":["The slow way checks every pair. A dict from value to index can find the partner in one step.","For each number, the partner is target - number. Was it seen before?","def two_sum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return [seen[target - n], i]\n        seen[n] = i\n"],"socratic":["What number would complete this one?","How can you remember what you have already seen?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Two Sum”?","xp":40,"skills":["interview","dicts"],"requires":["ps-boss"],"solution":"def two_sum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return [seen[target - n], i]\n        seen[n] = i\n","alt":"def two_sum(nums, target):\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            if nums[i] + nums[j] == target:\n                return [i, j]\n"},{"id":"f-while","region":"loops","order":5,"title":"Fill the Countdown","story":"Mission control needs a launch countdown that stops before zero.","goal":"Print 3, 2, 1 and then Liftoff.","type":"fill","starter":"n = 3\nwhile n ___ 0:\n    print(n)\n    n -= 1\nprint(\"Liftoff\")\n","tests":[{"kind":"stdout","label":"Counts down","expect":"3\n2\n1\nLiftoff"}],"hints":["The loop should continue while n is still bigger than zero.","Use the > comparison.","n = 3\nwhile n > 0:\n    print(n)\n    n -= 1\nprint(\"Liftoff\")\n"],"socratic":["When should the loop stop?","What happens if n never changes?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Countdown”?","xp":20,"skills":["while"],"requires":["p-offbyone"],"solution":"n = 3\nwhile n > 0:\n    print(n)\n    n -= 1\nprint(\"Liftoff\")\n"},{"id":"o-while-sum","region":"loops","order":9,"title":"Order the Adder","story":"Add up 1 to 5 with a while loop. The lines are shuffled.","goal":"Put the lines in order so the program prints 15.","type":"order","starter":"    count += 1\n    total += count\ntotal = 0\ncount = 0\nwhile count < 5:\nprint(total)\n","lines":["    count += 1","    total += count","total = 0","count = 0","while count < 5:","print(total)"],"tests":[{"kind":"stdout","label":"Prints 15","expect":"15"}],"hints":["Both counters must exist before the loop starts. The print belongs after the loop.","Inside the loop, increase count first, then add it to total.","total = 0\ncount = 0\nwhile count < 5:\n    count += 1\n    total += count\nprint(total)\n"],"socratic":["What must exist before the loop?","Which lines are inside the loop (indented)?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["while","accumulate","order"],"requires":["p-continue"],"solution":"total = 0\ncount = 0\nwhile count < 5:\n    count += 1\n    total += count\nprint(total)\n"},{"id":"p-break","region":"loops","order":7,"title":"Break vs Continue","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"for n in [4, 8, 15, 16]:\n    if n % 5 == 0:\n        break\n    print(n)\nprint(\"done\")","options":["4\n8\n15\ndone","4\n8\n16\ndone","4\n8\ndone","done"],"answer":2,"why":"break leaves the whole loop at 15. 16 is never reached. The last print runs once, after the loop.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which number triggers break, and what happens to the numbers after it?","The output is:\n4\n8\ndone"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["break"],"requires":["w-times-table"],"solution":"4\n8\ndone"},{"id":"p-continue","region":"loops","order":8,"title":"Skip with Continue","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"for n in range(5):\n    if n % 2 == 0:\n        continue\n    print(n)","options":["1\n3","0\n2\n4","1\n2\n3","1"],"answer":0,"why":"continue jumps straight to the next round, skipping the print. Only odd numbers get printed.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","When n is even, does the print line run?","The output is:\n1\n3"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["for","continue"],"requires":["p-break"],"solution":"1\n3"},{"id":"p-offbyone","region":"loops","order":4,"title":"Off by One","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"total = 0\nfor n in range(1, 5):\n    total += n\nprint(total)","options":["15","10","6","4"],"answer":1,"why":"range(1, 5) is 1, 2, 3, 4. The sum is 10, because 5 is never included.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","List the values n takes. Does it ever equal 5?","The output is:\n10"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["range","accumulate"],"requires":["py-09-accumulate"],"solution":"10"},{"id":"p-range","region":"loops","order":2,"title":"Where Does Range Stop?","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"for i in range(3):\n    print(i)","options":["1\n2\n3","0\n1\n2","0\n1\n2\n3","1\n2"],"answer":1,"why":"range(3) starts at 0 and stops before 3, so you get 0, 1, 2. Computers count from zero.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Does range include its end number?","The output is:\n0\n1\n2"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["for","range"],"requires":["py-08-for-range"],"solution":"0\n1\n2"},{"id":"proj-guess","region":"loops","order":11,"title":"Project: Guess the Number","story":"Chilaka hides a number. You keep guessing until you find it, and the game counts your tries.","goal":"Read the secret number, then keep reading guesses. Print Too low or Too high after each wrong guess. When right, print: Got it in N tries","type":"write-code","starter":"secret = int(input())\n# keep reading guesses until one is right\n","tests":[{"kind":"stdout","label":"Three tries","expect":"Too low\nToo high\nGot it in 3 tries","stdin":["7","3","9","7"]},{"kind":"stdout","label":"First try","expect":"Got it in 1 tries","stdin":["5","5"]},{"kind":"stdout","label":"Many tries","expect":"Too high\nToo high\nToo low\nGot it in 4 tries","stdin":["4","9","8","1","4"],"hidden":true}],"hints":["You do not know how many guesses are coming, so use while True and stop with break.","Count tries with a variable that goes up by 1 on every guess.","secret = int(input())\ntries = 0\nwhile True:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\n    else:\n        print(\"Got it in \" + str(tries) + \" tries\")\n        break\n"],"socratic":["How does the loop know when to stop?","Where should the tries counter go up?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Guess the Number”?","xp":50,"skills":["while","break","if"],"requires":["w-star-pyramid"],"solution":"secret = int(input())\ntries = 0\nwhile True:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\n    else:\n        print(\"Got it in \" + str(tries) + \" tries\")\n        break\n","alt":"secret = int(input())\ntries = 0\nguess = None\nwhile guess != secret:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\nprint(f\"Got it in {tries} tries\")\n","project":true},{"id":"py-08-for-range","region":"loops","order":1,"title":"Count the Seeds","story":"Chilaka counts seeds out loud, one at a time, from 1 up to however many there are.","goal":"Read n and print the numbers 1 to n, one per line.","type":"write-code","starter":"n = int(input())\n# print 1, 2, 3 ... n, each on its own line\n","tests":[{"kind":"stdout","label":"n = 5","expect":"1\n2\n3\n4\n5","stdin":["5"]},{"kind":"stdout","label":"n = 1","expect":"1","stdin":["1"]},{"kind":"stdout","label":"n = 3","expect":"1\n2\n3","stdin":["3"]},{"kind":"source","label":"Uses a loop","pattern":"\\b(for|while)\\b"}],"hints":["A for loop repeats a block: for i in range(...): (indented lines).","range(1, n) stops before n. How can you make it include n?","for i in range(1, n + 1):\n    print(i)"],"socratic":["Which numbers does range(1, 4) give you?","How do you make the loop include n itself?","What variable holds the current number inside the loop?"],"explain":"In one sentence: why did we write n + 1?","xp":30,"skills":["for","range"],"requires":["py-07-bugfix-2"],"solution":"n = int(input())\nfor i in range(1, n + 1):\n    print(i)\n","alt":"n = int(input())\ni = 1\nwhile i <= n:\n    print(i)\n    i += 1\n","fade":{"example":{"title":"Worked example: count to 3","code":"for i in range(1, 4):\n    print(i)\n","note":"range(1, 4) gives 1, 2, 3. The end is not included."},"partial":"n = int(input())\nfor i in range(1, n + 1):\n    ____\n","blanks":["print(i)"]}},{"id":"py-09-accumulate","region":"loops","order":3,"title":"Fruit Basket Total","story":"Fruits arrive one by one with their weights in grams. Chilaka needs the running total.","goal":"The first input is how many weights follow. Read them all and print their sum.","type":"write-code","starter":"count = int(input())\n# read that many numbers and print their total\n","tests":[{"kind":"stdout","label":"three weights","expect":"60","stdin":["3","10","20","30"]},{"kind":"stdout","label":"one weight","expect":"7","stdin":["1","7"]},{"kind":"stdout","label":"four weights","expect":"10","stdin":["4","1","2","3","4"]},{"kind":"stdout","label":"no weights","expect":"0","stdin":["0"]}],"hints":["Keep a running total in a variable that starts at 0, and add to it inside the loop.","Inside the loop, call input() each time, convert with int(), and add it to total.","total = 0\nfor _ in range(count):\n    total += int(input())\nprint(total)"],"socratic":["What value should the total start with?","How many times should input() be called?","Where does the print belong: inside or after the loop?"],"explain":"In one sentence: why does total start at 0?","xp":35,"skills":["for","accumulator","input"],"requires":["p-range"],"solution":"count = int(input())\ntotal = 0\nfor _ in range(count):\n    total += int(input())\nprint(total)\n","alt":"count = int(input())\nprint(sum(int(input()) for _ in range(count)))\n","fade":{"example":{"title":"Worked example: product","code":"result = 1\nfor n in [2, 3, 4]:\n    result = result * n\nprint(result)\n","note":"Start an accumulator, update it every pass, use it after the loop."},"partial":"count = int(input())\ntotal = 0\nfor _ in range(count):\n    ____\nprint(total)\n","blanks":["total += int(input())"]}},{"id":"py-10-bugfix-3","region":"loops","order":12,"title":"The Endless Climb","story":"Chilaka climbs a tree, calling out each step. The program never stops and floods the screen.","goal":"Fix the loop so it prints Step 1 up to Step n, then stops.","type":"fix-the-bug","starter":"steps = int(input())\ncount = 1\nwhile count <= steps:\n    print(\"Step\", count)\n","tests":[{"kind":"stdout","label":"3 steps","expect":"Step 1\nStep 2\nStep 3","stdin":["3"]},{"kind":"stdout","label":"1 step","expect":"Step 1","stdin":["1"]},{"kind":"stdout","label":"5 steps","expect":"Step 1\nStep 2\nStep 3\nStep 4\nStep 5","stdin":["5"],"hidden":true}],"hints":["A while loop runs as long as its condition is true. What changes count inside the loop?","Nothing changes count, so the condition stays true forever. Add a line that moves count forward.","steps = int(input())\ncount = 1\nwhile count <= steps:\n    print(\"Step\", count)\n    count += 1"],"socratic":["After each step, what is the value of count?","What would make the condition count <= steps become false?","Which line moves count to the next number?"],"explain":"In one sentence: why was the loop infinite?","xp":50,"skills":["debugging","while","infinite-loop"],"requires":["proj-guess"],"solution":"steps = int(input())\ncount = 1\nwhile count <= steps:\n    print(\"Step\", count)\n    count += 1\n","alt":"steps = int(input())\nfor count in range(1, steps + 1):\n    print(\"Step\", count)\n","boss":true},{"id":"w-star-pyramid","region":"loops","order":10,"title":"Star Pyramid","story":"The festival stage lights form a pyramid. Print it for any height.","goal":"Read n. Print n rows: row 1 has 1 star, row 2 has 2 stars, up to n.","type":"write-code","starter":"n = int(input())\n# print a pyramid of stars\n","tests":[{"kind":"stdout","label":"Height 3","expect":"*\n**\n***","stdin":["3"]},{"kind":"stdout","label":"Height 1","expect":"*","stdin":["1"]},{"kind":"stdout","label":"Height 5","expect":"*\n**\n***\n****\n*****","stdin":["5"],"hidden":true}],"hints":["One loop runs once per row. How many stars does row i need?","You can multiply text: \"*\" * 3 gives \"***\".","n = int(input())\nfor i in range(1, n + 1):\n    print(\"*\" * i)\n"],"socratic":["How many stars belong in row 4?","Is there a shortcut to repeat a string?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Star Pyramid”?","xp":30,"skills":["for","nested loops"],"requires":["o-while-sum"],"solution":"n = int(input())\nfor i in range(1, n + 1):\n    print(\"*\" * i)\n","alt":"n = int(input())\nfor i in range(1, n + 1):\n    row = \"\"\n    for j in range(i):\n        row += \"*\"\n    print(row)\n","clean":{"label":"Use one loop only (skip the inner loop)","tests":[{"kind":"source","label":"No nested loop","pattern":"for[^\\n]*:\\s*\\n\\s+for","absent":true}]}},{"id":"w-times-table","region":"loops","order":6,"title":"Times Table Painter","story":"The school wall needs times tables painted. Print one for any number.","goal":"Read n. Print n x 1 = ... through n x 10 = ..., one per line, like: 3 x 1 = 3","type":"write-code","starter":"n = int(input())\n# print the table for n, 1 to 10\n","tests":[{"kind":"stdout","label":"Table of 3","expect":"3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30","stdin":["3"]},{"kind":"stdout","label":"Table of 12","expect":"12 x 1 = 12\n12 x 2 = 24\n12 x 3 = 36\n12 x 4 = 48\n12 x 5 = 60\n12 x 6 = 72\n12 x 7 = 84\n12 x 8 = 96\n12 x 9 = 108\n12 x 10 = 120","stdin":["12"]},{"kind":"stdout","label":"Table of 0","expect":"0 x 1 = 0\n0 x 2 = 0\n0 x 3 = 0\n0 x 4 = 0\n0 x 5 = 0\n0 x 6 = 0\n0 x 7 = 0\n0 x 8 = 0\n0 x 9 = 0\n0 x 10 = 0","stdin":["0"],"hidden":true}],"hints":["Use for i in range(...) and decide which numbers you need: 1 to 10 inclusive.","range(1, 11) gives 1..10. Print an f-string inside the loop.","n = int(input())\nfor i in range(1, 11):\n    print(f\"{n} x {i} = {n * i}\")\n"],"socratic":["Which numbers should i take?","What stays the same each round, and what changes?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Times Table Painter”?","xp":30,"skills":["for","range","f-strings"],"requires":["f-while"],"solution":"n = int(input())\nfor i in range(1, 11):\n    print(f\"{n} x {i} = {n * i}\")\n","alt":"n = int(input())\ni = 1\nwhile i <= 10:\n    print(str(n) + \" x \" + str(i) + \" = \" + str(n * i))\n    i += 1\n","fade":{"example":{"title":"Worked example: squares","code":"for i in range(1, 4):\n    print(i, \"squared is\", i * i)\n","note":"Use the loop variable inside the print to make each line different."},"partial":"n = int(input())\nfor i in range(1, 11):\n    ____\n","blanks":["print(f\"{n} x {i} = {n * i}\")"]}},{"id":"f-debug-print","region":"modules-debug","order":6,"title":"Fill the Print Detective","story":"Print debugging means printing variables to watch them change. Complete the detective's trace.","goal":"Show n and total on every round.","type":"fill","starter":"total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(\"n =\", ___, \"total =\", ___)\n","tests":[{"kind":"stdout","label":"Trace output","expect":"n = 1 total = 1\nn = 2 total = 3\nn = 3 total = 6"}],"hints":["Print the two variables themselves, not their names in quotes.","The first blank is n, the second is total.","total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(\"n =\", n, \"total =\", total)\n"],"socratic":["Which two variables change each round?","Why print inside the loop?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Print Detective”?","xp":20,"skills":["debugging"],"requires":["p-traceback"],"solution":"total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(\"n =\", n, \"total =\", total)\n"},{"id":"fx-average","region":"modules-debug","order":7,"title":"Case: The Wrong Average","story":"The toolshed's average function gives answers that are always too low. Be the detective.","goal":"Fix average(nums) so average([2, 4, 6]) is 4.0 and average([10]) is 10.0.","type":"fix-the-bug","starter":"def average(nums):\n    total = 0\n    for i in range(1, len(nums)):\n        total += nums[i]\n    return total / len(nums)\n","tests":[{"kind":"eval","label":"Three numbers","expr":"average([2, 4, 6])","expect":"4.0"},{"kind":"eval","label":"One number","expr":"average([10])","expect":"10.0"},{"kind":"eval","label":"Floats","expr":"average([1.5, 2.5])","expect":"2.0","hidden":true}],"hints":["Add a print inside the loop to see which numbers are being added.","range(1, ...) starts at position 1. Which item is skipped?","def average(nums):\n    total = 0\n    for i in range(len(nums)):\n        total += nums[i]\n    return total / len(nums)\n"],"socratic":["Which position does range(1, n) start at?","Which number never gets added?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":40,"skills":["debugging","range"],"requires":["f-debug-print"],"solution":"def average(nums):\n    total = 0\n    for i in range(len(nums)):\n        total += nums[i]\n    return total / len(nums)\n","alt":"def average(nums):\n    return sum(nums) / len(nums)\n"},{"id":"md-boss","region":"modules-debug","order":11,"title":"Boss: The Calendar Crash","story":"The village birthday board shows wrong ages on exactly the days around a birthday. Find the logic bug.","goal":"Fix age_in_years(born, today): the age goes up only on or after the birthday.","type":"fix-the-bug","starter":"from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    years = t.year - b.year\n    if (t.month, t.day) > (b.month, b.day):\n        years -= 1\n    return years\n","tests":[{"kind":"eval","label":"Day before birthday","expr":"age_in_years(\"2000-06-15\", \"2024-06-14\")","expect":"23"},{"kind":"eval","label":"On the birthday","expr":"age_in_years(\"2000-06-15\", \"2024-06-15\")","expect":"24"},{"kind":"eval","label":"After the birthday","expr":"age_in_years(\"2000-06-15\", \"2024-12-01\")","expect":"24"},{"kind":"eval","label":"Early in the year","expr":"age_in_years(\"2000-06-15\", \"2024-01-02\")","expect":"23","hidden":true}],"hints":["Test three dates by hand: before, on and after the birthday. When should years be reduced by one?","You subtract one only if the birthday has NOT happened yet this year.","from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    years = t.year - b.year\n    if (t.month, t.day) < (b.month, b.day):\n        years -= 1\n    return years\n"],"socratic":["What should the age be on the birthday itself?","Which comparison sign is the wrong way round?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":65,"skills":["debugging","datetime"],"requires":["proj-diceduel"],"solution":"from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    years = t.year - b.year\n    if (t.month, t.day) < (b.month, b.day):\n        years -= 1\n    return years\n","alt":"from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    had_birthday = (t.month, t.day) >= (b.month, b.day)\n    return t.year - b.year - (0 if had_birthday else 1)\n","boss":true},{"id":"p-import","region":"modules-debug","order":1,"title":"Borrow a Tool","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"import math\nprint(math.sqrt(16), math.floor(2.7), math.ceil(2.1))","options":["4 2 3","4.0 3 2","4.0 2 2","4.0 2 3"],"answer":3,"why":"sqrt always returns a float (4.0). floor rounds down (2) and ceil rounds up (3).","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which direction does each rounding function go?","The output is:\n4.0 2 3"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["import","math"],"requires":["fe-boss"],"solution":"4.0 2 3"},{"id":"p-shadow","region":"modules-debug","order":8,"title":"Oops, I Renamed max","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"max = 5\nprint(max([1, 9, 3]))","options":["9","5","Error: NameError","Error: TypeError"],"answer":3,"why":"Assigning to max hides Python's built-in function. Now max is the number 5, and numbers cannot be called, so you get a TypeError.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","After line 1, what is max?","The output is:\nError: TypeError"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["debugging","names"],"requires":["fx-average"],"solution":"Error: TypeError"},{"id":"p-traceback","region":"modules-debug","order":5,"title":"Read the Traceback","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def a():\n    return b()\ndef b():\n    return int(\"x\")\nprint(\"start\")\na()","options":["start\nError: ValueError","Error: ValueError","start","start\nError: TypeError"],"answer":0,"why":"start prints first. Then a() calls b(), which calls int(\"x\"): a ValueError. Tracebacks read bottom to top: the last line names the error, the lines above show who called whom.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What happens before the crash, and which error does int(\"x\") raise?","The output is:\nstart\nError: ValueError"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["debugging","tracebacks"],"requires":["w-counter"],"solution":"start\nError: ValueError"},{"id":"proj-diceduel","region":"modules-debug","order":10,"title":"Project: Dice Duel","story":"Two players each roll a handful of dice. Highest total wins.","goal":"Write roll_many(n, sides=6) returning a list of n random rolls, and play(rolls_a, rolls_b) returning A, B or draw by comparing totals.","type":"write-code","starter":"import random\n# define roll_many and play\n","tests":[{"kind":"eval","label":"A wins","expr":"play([6, 6], [1, 2])","expect":"'A'"},{"kind":"eval","label":"B wins","expr":"play([1], [2])","expect":"'B'"},{"kind":"eval","label":"Draw","expr":"play([3, 3], [2, 4])","expect":"'draw'"},{"kind":"eval","label":"Right number of rolls","expr":"len(roll_many(5))","expect":"5"},{"kind":"eval","label":"Rolls stay in range","expr":"all(1 <= x <= 6 for x in roll_many(100))","expect":"True"},{"kind":"eval","label":"Custom die","expr":"all(1 <= x <= 3 for x in roll_many(60, 3))","expect":"True","hidden":true}],"hints":["Split the job: one function creates rolls, the other compares totals.","A list comprehension can create the rolls: [random.randint(1, sides) for _ in range(n)].","import random\n\n\ndef roll_many(n, sides=6):\n    return [random.randint(1, sides) for _ in range(n)]\n\n\ndef play(rolls_a, rolls_b):\n    a, b = sum(rolls_a), sum(rolls_b)\n    if a > b:\n        return \"A\"\n    if b > a:\n        return \"B\"\n    return \"draw\"\n"],"socratic":["Which function handles randomness?","How do you compare two totals?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Dice Duel”?","xp":60,"skills":["random","functions"],"requires":["w-groups"],"solution":"import random\n\n\ndef roll_many(n, sides=6):\n    return [random.randint(1, sides) for _ in range(n)]\n\n\ndef play(rolls_a, rolls_b):\n    a, b = sum(rolls_a), sum(rolls_b)\n    if a > b:\n        return \"A\"\n    if b > a:\n        return \"B\"\n    return \"draw\"\n","alt":"import random\n\n\ndef roll_many(n, sides=6):\n    rolls = []\n    for _ in range(n):\n        rolls.append(random.randint(1, sides))\n    return rolls\n\n\ndef play(rolls_a, rolls_b):\n    diff = sum(rolls_a) - sum(rolls_b)\n    return \"A\" if diff > 0 else \"B\" if diff < 0 else \"draw\"\n","project":true},{"id":"w-counter","region":"modules-debug","order":4,"title":"Popular Word","story":"Which word does the toolshed hear most often?","goal":"Write most_common(words) returning the word that appears most often in a list.","type":"write-code","starter":"from collections import Counter\n# define most_common\n","tests":[{"kind":"eval","label":"Simple","expr":"most_common([\"a\", \"b\", \"a\"])","expect":"'a'"},{"kind":"eval","label":"Clear winner","expr":"most_common([\"x\", \"y\", \"y\", \"z\", \"z\", \"z\"])","expect":"'z'"},{"kind":"eval","label":"Single","expr":"most_common([\"only\"])","expect":"'only'","hidden":true}],"hints":["Counter counts items for you. Counter(words) is like a dictionary of counts.","Counter has a .most_common(1) method returning a list of (item, count) pairs.","from collections import Counter\n\n\ndef most_common(words):\n    return Counter(words).most_common(1)[0][0]\n"],"socratic":["What does Counter store?","How do you pick just the top item?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Popular Word”?","xp":30,"skills":["collections"],"requires":["w-dates"],"solution":"from collections import Counter\n\n\ndef most_common(words):\n    return Counter(words).most_common(1)[0][0]\n","alt":"def most_common(words):\n    best = None\n    best_count = 0\n    for w in set(words):\n        if words.count(w) > best_count:\n            best, best_count = w, words.count(w)\n    return best\n"},{"id":"w-dates","region":"modules-debug","order":3,"title":"Days Until","story":"The toolshed's calendar counts the days between two dates.","goal":"Write days_until(start, end) for ISO date strings like 2024-03-01. It returns the number of days from start to end (negative if end is earlier).","type":"write-code","starter":"from datetime import date\n# define days_until\n","tests":[{"kind":"eval","label":"A month","expr":"days_until(\"2024-03-01\", \"2024-03-31\")","expect":"30"},{"kind":"eval","label":"Across a leap day","expr":"days_until(\"2024-02-27\", \"2024-03-01\")","expect":"3"},{"kind":"eval","label":"Backwards","expr":"days_until(\"2024-03-31\", \"2024-03-01\")","expect":"-30","hidden":true}],"hints":["date.fromisoformat turns a string into a date you can do maths with.","Subtracting two dates gives a timedelta. Its .days is the number you want.","from datetime import date\n\n\ndef days_until(start, end):\n    return (date.fromisoformat(end) - date.fromisoformat(start)).days\n"],"socratic":["How do you turn text into a date?","What type do you get when subtracting dates?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Days Until”?","xp":30,"skills":["datetime"],"requires":["w-dice"],"solution":"from datetime import date\n\n\ndef days_until(start, end):\n    return (date.fromisoformat(end) - date.fromisoformat(start)).days\n","alt":"from datetime import datetime\n\n\ndef days_until(start, end):\n    a = datetime.strptime(start, \"%Y-%m-%d\")\n    b = datetime.strptime(end, \"%Y-%m-%d\")\n    return (b - a).days\n"},{"id":"w-dice","region":"modules-debug","order":2,"title":"Roll the Dice","story":"The toolshed hosts a dice game. Use the random module for fair rolls.","goal":"Write roll(sides=6) that returns a random whole number from 1 to sides.","type":"write-code","starter":"import random\n# define roll\n","tests":[{"kind":"eval","label":"Always within 1 to 6","expr":"all(1 <= roll() <= 6 for _ in range(200))","expect":"True"},{"kind":"eval","label":"Two-sided die gives both faces","expr":"set(roll(2) for _ in range(200)) == {1, 2}","expect":"True"},{"kind":"eval","label":"One-sided die","expr":"roll(1)","expect":"1","hidden":true}],"hints":["random.randint(a, b) includes both ends.","Use sides as the upper limit, with a default of 6.","import random\n\n\ndef roll(sides=6):\n    return random.randint(1, sides)\n"],"socratic":["Does randint include its last number?","Where does the 6 come from?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Roll the Dice”?","xp":30,"skills":["random","defaults"],"requires":["p-import"],"solution":"import random\n\n\ndef roll(sides=6):\n    return random.randint(1, sides)\n","alt":"import random\n\n\ndef roll(sides=6):\n    return random.choice(range(1, sides + 1))\n"},{"id":"w-groups","region":"modules-debug","order":9,"title":"Group by Length","story":"The toolshed sorts nails by length.","goal":"Write group_by_length(words) returning a dict from length to the list of words of that length, in input order.","type":"write-code","starter":"from collections import defaultdict\n# define group_by_length\n","tests":[{"kind":"eval","label":"Two groups","expr":"group_by_length([\"a\", \"bb\", \"c\"])","expect":"{1: ['a', 'c'], 2: ['bb']}"},{"kind":"eval","label":"Empty","expr":"group_by_length([])","expect":"{}"},{"kind":"eval","label":"Order is kept","expr":"group_by_length([\"xx\", \"yy\", \"z\"])","expect":"{2: ['xx', 'yy'], 1: ['z']}","hidden":true}],"hints":["defaultdict(list) creates an empty list the first time a key is used.","Append each word to groups[len(word)].","from collections import defaultdict\n\n\ndef group_by_length(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[len(w)].append(w)\n    return dict(groups)\n"],"socratic":["What should the key be?","What happens the first time a length appears?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Group by Length”?","xp":30,"skills":["collections","dicts"],"requires":["p-shadow"],"solution":"from collections import defaultdict\n\n\ndef group_by_length(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[len(w)].append(w)\n    return dict(groups)\n","alt":"def group_by_length(words):\n    groups = {}\n    for w in words:\n        if len(w) not in groups:\n            groups[len(w)] = []\n        groups[len(w)].append(w)\n    return groups\n"},{"id":"mystery-01-midnight-deploy","region":"mystery-cases","order":1,"title":"Case 1: The Midnight Deploy","story":"At 00:14 production broke. Three people were online. Only one of them deployed.","goal":"Read the files in /case and name the user who deployed at 00:14.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/case/auth.log":"00:02 login asha\n00:09 login ravi\n00:11 login meena\n00:20 logout ravi\n","/case/deploy.log":"00:14 deploy v2.3 by uid=1002\n","/case/users.txt":"1001 asha\n1002 meena\n1003 ravi\n"},"dirs":["/case"]},"tests":[{"kind":"answer","expect":"meena","label":"Named the culprit"}],"hints":["Find who the deploy log blames: it only has a number.","Match that number in users.txt.","Run:\ncat /case/deploy.log\ncat /case/users.txt\nThen answer: meena"],"socratic":["Which file is the oldest witness?","Do two files tell different stories?","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":40,"skills":["linux","investigation"],"requires":["linux-04-runaway"],"solution":{"commands":["cat /case/deploy.log","cat /case/users.txt"],"answer":"meena"},"tool":"linux","mystery":true},{"id":"mystery-02-vanishing-file","region":"mystery-cases","order":2,"title":"Case 2: The Vanishing File","story":"The finance report disappeared from the shared folder. The delete left a trace in the shell histories.","goal":"Find which user ran rm on report-q3.xlsx.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/case/hist_asha.txt":"ls\ncd reports\nvim notes.txt\n","/case/hist_ravi.txt":"ls\nrm report-q3.xlsx\nls\n","/case/hist_kiran.txt":"git status\ncd reports\n"},"dirs":["/case"]},"tests":[{"kind":"answer","expect":"ravi","label":"Named the culprit"}],"hints":["grep can search many files at once.","grep rm /case/hist_*.txt shows the file name too.","Run:\ngrep -l report-q3 /case/hist_*.txt\nThen answer: ravi"],"socratic":["Which file is the oldest witness?","Do two files tell different stories?","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":40,"skills":["linux","investigation"],"requires":["mystery-01-midnight-deploy"],"solution":{"commands":["grep -l report-q3 /case/hist_*.txt"],"answer":"ravi"},"tool":"linux","mystery":true},{"id":"mystery-03-leaky-key","region":"mystery-cases","order":3,"title":"Case 3: The Leaky Key","story":"A secret API key was committed by mistake. Which file contains a string starting with AKIA?","goal":"Find the file that leaks ystery-03-leaky-key"],"solution":{"commands":["grep ' 500' /case/lb.log | cut -d' ' -f2 | sort | uniq -c | sort -rn"],"answer":"backend-b"},"tool":"linux","mystery":true},{"id":"mystery-05-odd-one-out","region":"mystery-cases","order":5,"title":"Case 5: The Odd One Out","story":"Two config files should be identical on every server. One server has a different setting and caused the outage.","goal":"Compare /case/a.conf and /case/b.conf. Which setting key differs? Answer with the key name.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/case/a.conf":"timeout=30\nretries=3\nlog=info\n","/case/b.conf":"timeout=30\nretries=9\nlog=info\n"},"dirs":["/case"]},"tests":[{"kind":"answer","expect":"retries","label":"Named the culprit"}],"hints":["diff shows lines that differ.","diff /case/a.conf /case/b.conf","Run:\ndiff /case/a.conf /case/b.conf\nThen answer: retries"],"socratic":["Which file is the oldest witness?","Do two files tell different stories?","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":40,"skills":["linux","investigation"],"requires":["mystery-04-timeline"],"solution":{"commands":["diff /case/a.conf /case/b.conf"],"answer":"retries"},"tool":"linux","mystery":true},{"id":"mystery-06-grand-case","region":"mystery-cases","order":6,"title":"Boss Case: The Insider","story":"Someone changed the firewall rule at 01:30 and the logs disagree. Combine three witnesses.","goal":"Find who changed the firewall: the change time is in fw.log, who was logged in is in sessions.log, and uid mapping is in passwd.txt. Answer with the username.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/case/fw.log":"01:30 rule changed by uid=1007 via ssh\n","/case/sessions.log":"01:25 uid=1004 login\n01:28 uid=1007 login\n01:40 uid=1007 logout\n","/case/passwd.txt":"1004 dinesh\n1007 sandhya\n1009 tarun\n"},"dirs":["/case"]},"tests":[{"kind":"answer","expect":"sandhya","label":"Named the culprit"},{"kind":"command-used","anyOf":["cat","grep"],"label":"Read the evidence"}],"hints":["fw.log gives a uid, not a name.","Look the uid up in passwd.txt, then check that sessions.log agrees.","Run:\ncat /case/fw.log\ncat /case/sessions.log\ncat /case/passwd.txt\nThen answer: sandhya"],"socratic":["Which file is the oldest witness?","Do two files tell different stories?","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":40,"skills":["linux","investigation"],"requires":["mystery-05-odd-one-out"],"solution":{"commands":["cat /case/fw.log","cat /case/sessions.log","cat /case/passwd.txt"],"answer":"sandhya"},"tool":"linux","mystery":true},{"id":"f-self","region":"objects","order":3,"title":"Fill the Counter","story":"A turnstile counts visitors. Every method needs the special first parameter.","goal":"Print 2 after two visitors.","type":"fill","starter":"class Counter:\n    def __init__(___):\n        self.count = 0\n    def hit(self):\n        self.count ___ 1\n\nc = Counter()\nc.hit()\nc.hit()\nprint(c.count)\n","tests":[{"kind":"stdout","label":"Prints 2","expect":"2"}],"hints":["The first parameter of every method is the object itself, conventionally called self.","The second blank adds to the existing count: +=.","class Counter:\n    def __init__(self):\n        self.count = 0\n    def hit(self):\n        self.count += 1\n\nc = Counter()\nc.hit()\nc.hit()\nprint(c.count)\n"],"socratic":["What is the first parameter of a method?","How do you add to an attribute?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Counter”?","xp":20,"skills":["classes","self"],"requires":["w-class-basic"],"solution":"class Counter:\n    def __init__(self):\n        self.count = 0\n    def hit(self):\n        self.count += 1\n\nc = Counter()\nc.hit()\nc.hit()\nprint(c.count)\n"},{"id":"o-class-order","region":"objects","order":9,"title":"Order the Lamp","story":"A lamp class and its test run are shuffled. Put them in a working order.","goal":"Put the lines in order so the program prints True.","type":"order","starter":"class Light:\n    def __init__(self):\n        self.on = not self.on\nlamp.toggle()\nlamp = Light()\nprint(lamp.on)\n        self.on = False\n    def toggle(self):\n","lines":["class Light:","    def __init__(self):","        self.on = not self.on","lamp.toggle()","lamp = Light()","print(lamp.on)","        self.on = False","    def toggle(self):"],"tests":[{"kind":"stdout","label":"Prints True","expect":"True"}],"hints":["The class must be defined before you create a lamp from it.","Inside the class, __init__ comes before toggle. Use indentation to see which lines are inside.","class Light:\n    def __init__(self):\n        self.on = False\n    def toggle(self):\n        self.on = not self.on\nlamp = Light()\nlamp.toggle()\nprint(lamp.on)\n"],"socratic":["What must exist before Light() runs?","Which lines belong inside each method?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["classes","order"],"requires":["w-dunder"],"solution":"class Light:\n    def __init__(self):\n        self.on = False\n    def toggle(self):\n        self.on = not self.on\nlamp = Light()\nlamp.toggle()\nprint(lamp.on)\n"},{"id":"ob-boss","region":"objects","order":11,"title":"Boss: The Leaky Wallet","story":"A wallet class forgets its cash and refuses to spend every last rupee. Two bugs hide inside.","goal":"Fix Wallet so cash is stored, and spending exactly all the cash works.","type":"fix-the-bug","starter":"class Wallet:\n    def __init__(self, cash):\n        cash = cash\n\n    def spend(self, amount):\n        if amount >= self.cash:\n            return False\n        self.cash -= amount\n        return True\n","tests":[{"kind":"eval","label":"Stores cash","expr":"Wallet(10).cash","expect":"10"},{"kind":"eval","label":"Spend some","expr":"(lambda w: (w.spend(4), w.cash))(Wallet(10))","expect":"(True, 6)"},{"kind":"eval","label":"Refuse overspending","expr":"(lambda w: (w.spend(50), w.cash))(Wallet(10))","expect":"(False, 10)"},{"kind":"eval","label":"Spend everything","expr":"(lambda w: (w.spend(10), w.cash))(Wallet(10))","expect":"(True, 0)","hidden":true}],"hints":["The first bug is in __init__: assigning to plain cash creates a local variable that vanishes.","The second bug is a comparison: is spending exactly all the cash allowed? Check >= against >.","class Wallet:\n    def __init__(self, cash):\n        self.cash = cash\n\n    def spend(self, amount):\n        if amount > self.cash:\n            return False\n        self.cash -= amount\n        return True\n"],"socratic":["What is the difference between cash and self.cash?","Should spending exactly all your cash be allowed?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":60,"skills":["debugging","classes"],"requires":["proj-inventory"],"solution":"class Wallet:\n    def __init__(self, cash):\n        self.cash = cash\n\n    def spend(self, amount):\n        if amount > self.cash:\n            return False\n        self.cash -= amount\n        return True\n","alt":"class Wallet:\n    def __init__(self, cash):\n        self.cash = cash\n\n    def spend(self, amount):\n        if self.cash - amount < 0:\n            return False\n        self.cash = self.cash - amount\n        return True\n","boss":true},{"id":"p-class","region":"objects","order":1,"title":"Meet the Dog","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"class Dog:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return self.name + \" says woof\"\nd = Dog(\"Tuffy\")\nprint(d.speak())","options":["name says woof","Error: TypeError","Dog says woof","Tuffy says woof"],"answer":3,"why":"Dog(\"Tuffy\") runs __init__, which stores the name on that object. speak() reads it back through self.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does self refer to inside speak?","The output is:\nTuffy says woof"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["classes"],"requires":["md-boss"],"solution":"Tuffy says woof"},{"id":"p-shared","region":"objects","order":4,"title":"The Shared Box","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"class Box:\n    items = []\n    def add(self, x):\n        self.items.append(x)\na = Box()\nb = Box()\na.add(1)\nprint(b.items)","options":["[]","[1]","[1, 1]","Error: AttributeError"],"answer":1,"why":"items is a class attribute: every Box shares the same list. Put self.items = [] inside __init__ to give each Box its own.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Where was the list created: per object or once for the class?","The output is:\n[1]"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["classes","mutability"],"requires":["f-self"],"solution":"[1]"},{"id":"p-super","region":"objects","order":6,"title":"Calling the Parent","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"class A:\n    def hi(self):\n        return \"A\"\nclass B(A):\n    def hi(self):\n        return super().hi() + \"B\"\nprint(B().hi())","options":["B","A","AB","BA"],"answer":2,"why":"super().hi() runs the parent's version first, giving \"A\", and then \"B\" is added to the end.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does super() refer to?","The output is:\nAB"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["inheritance"],"requires":["w-account"],"solution":"AB"},{"id":"proj-inventory","region":"objects","order":10,"title":"Project: Shop Inventory","story":"The guild shop needs a stock tracker you can trust.","goal":"Write class Inventory with add(item, qty=1), remove(item, qty=1) and report(). remove raises ValueError if there is not enough stock (or the item is unknown). report returns a sorted list of \"item: qty\" strings and skips items with zero stock.","type":"write-code","starter":"# define class Inventory\n","tests":[{"kind":"eval","label":"Report","expr":"(lambda i: (i.add(\"pen\", 5), i.add(\"ink\", 2), i.remove(\"pen\", 3), i.report())[3])(Inventory())","expect":"['ink: 2', 'pen: 2']"},{"kind":"raises","label":"Unknown item","expr":"Inventory().remove(\"pen\")","exc":"ValueError"},{"kind":"raises","label":"Not enough stock","expr":"(lambda i: (i.add(\"a\", 2), i.remove(\"a\", 3)))(Inventory())","exc":"ValueError"},{"kind":"eval","label":"Zero stock is hidden","expr":"(lambda i: (i.add(\"a\"), i.remove(\"a\"), i.report())[2])(Inventory())","expect":"[]","hidden":true}],"hints":["Keep a dictionary on self: item name to quantity.","In remove, check self.stock.get(item, 0) < qty first and raise. In report, loop over sorted items and skip zeros.","class Inventory:\n    def __init__(self):\n        self.stock = {}\n\n    def add(self, item, qty=1):\n        self.stock[item] = self.stock.get(item, 0) + qty\n\n    def remove(self, item, qty=1):\n        if self.stock.get(item, 0) < qty:\n            raise ValueError(\"not enough \" + item)\n        self.stock[item] -= qty\n\n    def report(self):\n        return [f\"{k}: {v}\" for k, v in sorted(self.stock.items()) if v > 0]\n"],"socratic":["What data structure holds the stock?","When must remove refuse?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Shop Inventory”?","xp":70,"skills":["classes","dicts","raise"],"requires":["o-class-order"],"solution":"class Inventory:\n    def __init__(self):\n        self.stock = {}\n\n    def add(self, item, qty=1):\n        self.stock[item] = self.stock.get(item, 0) + qty\n\n    def remove(self, item, qty=1):\n        if self.stock.get(item, 0) < qty:\n            raise ValueError(\"not enough \" + item)\n        self.stock[item] -= qty\n\n    def report(self):\n        return [f\"{k}: {v}\" for k, v in sorted(self.stock.items()) if v > 0]\n","alt":"class Inventory:\n    def __init__(self):\n        self.stock = {}\n\n    def add(self, item, qty=1):\n        if item in self.stock:\n            self.stock[item] += qty\n        else:\n            self.stock[item] = qty\n\n    def remove(self, item, qty=1):\n        have = self.stock.get(item, 0)\n        if qty > have:\n            raise ValueError(f\"only {have} of {item}\")\n        self.stock[item] = have - qty\n\n    def report(self):\n        lines = []\n        for name in sorted(self.stock):\n            if self.stock[name] > 0:\n                lines.append(name + \": \" + str(self.stock[name]))\n        return lines\n","project":true},{"id":"w-account","region":"objects","order":5,"title":"Piggy Bank","story":"The guild hall's piggy bank must never go below zero and never accept silly deposits.","goal":"Write class Account(balance=0) with deposit(amount) and withdraw(amount). Deposits must be positive. Withdrawals cannot exceed the balance. Both raise ValueError when refused.","type":"write-code","starter":"# define class Account\n","tests":[{"kind":"eval","label":"Starting balance","expr":"Account(100).balance","expect":"100"},{"kind":"eval","label":"Deposit and withdraw","expr":"(lambda a: (a.deposit(50), a.withdraw(20), a.balance))(Account())[2]","expect":"30"},{"kind":"raises","label":"Negative deposit refused","expr":"Account().deposit(-5)","exc":"ValueError"},{"kind":"raises","label":"Overdraft refused","expr":"Account(10).withdraw(50)","exc":"ValueError"},{"kind":"eval","label":"Can empty the account","expr":"(lambda a: (a.withdraw(5), a.balance))(Account(5))[1]","expect":"0","hidden":true}],"hints":["Store the balance on self. Each method checks the rule first, then changes self.balance.","Use raise ValueError(...) when the rule is broken.","class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"deposit must be positive\")\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n"],"socratic":["Which rule belongs to deposit, and which to withdraw?","What should happen when a rule is broken?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Piggy Bank”?","xp":30,"skills":["classes","raise"],"requires":["p-shared"],"solution":"class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"deposit must be positive\")\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n","alt":"class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        if not amount > 0:\n            raise ValueError(f\"bad amount {amount}\")\n        self.balance = self.balance + amount\n\n    def withdraw(self, amount):\n        if self.balance - amount < 0:\n            raise ValueError(\"cannot go below zero\")\n        self.balance = self.balance - amount\n"},{"id":"w-class-basic","region":"objects","order":2,"title":"Parrot Class","story":"Chilaka wants to be an object: a parrot with a name that can learn words.","goal":"Write class Parrot with __init__(self, name), teach(word) to remember a word and speak() returning the words joined by comma and space.","type":"write-code","starter":"# define class Parrot\n","tests":[{"kind":"eval","label":"Learns words","expr":"(lambda p: (p.teach(\"hi\"), p.teach(\"aata\"), p.speak())[2])(Parrot(\"Chilaka\"))","expect":"'hi, aata'"},{"kind":"eval","label":"Silent at first","expr":"Parrot(\"Mynah\").speak()","expect":"''"},{"kind":"eval","label":"Keeps its name","expr":"Parrot(\"x\").name","expect":"'x'"},{"kind":"eval","label":"Parrots do not share words","expr":"(lambda a, b: (a.teach(\"x\"), b.speak())[1])(Parrot(\"a\"), Parrot(\"b\"))","expect":"''","hidden":true}],"hints":["In __init__ create self.name and an empty list self.words.","teach appends to self.words. speak joins them with \", \".join(...).","class Parrot:\n    def __init__(self, name):\n        self.name = name\n        self.words = []\n\n    def teach(self, word):\n        self.words.append(word)\n\n    def speak(self):\n        return \", \".join(self.words)\n"],"socratic":["Which data does each parrot need of its own?","Why must the words list be created inside __init__?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Parrot Class”?","xp":30,"skills":["classes"],"requires":["p-class"],"solution":"class Parrot:\n    def __init__(self, name):\n        self.name = name\n        self.words = []\n\n    def teach(self, word):\n        self.words.append(word)\n\n    def speak(self):\n        return \", \".join(self.words)\n","alt":"class Parrot:\n    def __init__(self, name, words=None):\n        self.name = name\n        self.words = words or []\n\n    def teach(self, word):\n        self.words = self.words + [word]\n\n    def speak(self):\n        return \", \".join(self.words)\n"},{"id":"w-dunder","region":"objects","order":8,"title":"Pretty Points","story":"The guild hall plots points on a map. Make them print nicely, compare, and add.","goal":"Write class Point(x, y) with __repr__ (like Point(1, 2)), __eq__ and __add__ (adds coordinates, returns a new Point).","type":"write-code","starter":"# define class Point\n","tests":[{"kind":"eval","label":"Readable repr","expr":"repr(Point(1, 2))","expect":"'Point(1, 2)'"},{"kind":"eval","label":"Equal points","expr":"Point(1, 2) == Point(1, 2)","expect":"True"},{"kind":"eval","label":"Different points","expr":"Point(1, 2) == Point(2, 1)","expect":"False"},{"kind":"eval","label":"Adding","expr":"Point(1, 2) + Point(3, 4) == Point(4, 6)","expect":"True","hidden":true}],"hints":["Special methods have double underscores on both sides. Python calls them for you.","__repr__ returns a string. __eq__(self, other) compares fields. __add__ returns a new Point.","class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n"],"socratic":["When does Python call __repr__?","What should __add__ return?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Pretty Points”?","xp":45,"skills":["dunder methods","classes"],"requires":["w-inherit"],"solution":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n","alt":"class Point:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n\n    def __repr__(self):\n        return \"Point(\" + str(self.x) + \", \" + str(self.y) + \")\"\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and (self.x, self.y) == (other.x, other.y)\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n"},{"id":"w-inherit","region":"objects","order":7,"title":"Pet Family","story":"The guild hall keeps pets. They share a base, but each speaks differently.","goal":"Add class Dog and class Cat that inherit from Animal. Dog.speak() returns Woof and Cat.speak() returns Meow. Animal.speak() stays ...","type":"write-code","starter":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n# add Dog and Cat\n","tests":[{"kind":"eval","label":"Dog speaks","expr":"Dog(\"rex\").speak()","expect":"'Woof'"},{"kind":"eval","label":"Cat speaks","expr":"Cat(\"tom\").speak()","expect":"'Meow'"},{"kind":"eval","label":"Animal stays quiet","expr":"Animal(\"x\").speak()","expect":"'...'"},{"kind":"eval","label":"Dog is an Animal","expr":"isinstance(Dog(\"a\"), Animal)","expect":"True"},{"kind":"eval","label":"Name is inherited","expr":"Dog(\"rex\").name","expect":"'rex'","hidden":true}],"hints":["class Dog(Animal): makes Dog a child of Animal. Override the method you want to change.","Do not rewrite __init__: the child inherits it.","class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"\n"],"socratic":["What goes in the brackets after the class name?","Which parts do the children not need to rewrite?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Pet Family”?","xp":30,"skills":["inheritance"],"requires":["p-super"],"solution":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"\n","alt":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    sound = \"Woof\"\n\n    def speak(self):\n        return self.sound\n\n\nclass Cat(Animal):\n    sound = \"Meow\"\n\n    def speak(self):\n        return self.sound\n"},{"id":"pair-01-range","region":"pair-parrot","order":1,"title":"The Short Sum","story":"Chilaka wrote a function to add 1 up to n, and proudly says it works. It does not.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def total(n):\n    s = 0\n    for i in range(1, n):\n        s += i\n    return s\n","tests":[{"kind":"eval","label":"3","expr":"total(3)","expect":"6"},{"kind":"eval","label":"1","expr":"total(1)","expect":"1"},{"kind":"eval","label":"10","expr":"total(10)","expect":"55","hidden":true},{"kind":"eval","label":"0","expr":"total(0)","expect":"0","hidden":true}],"hints":["Try total(3) by hand. Which numbers does range(1, 3) give?","The end of range is excluded.","def total(n):\n    s = 0\n    for i in range(1, n + 1):\n        s += i\n    return s\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was
