Guard Clauses","story":"Early returns keep code flat and readable. Put this function back together.","goal":"Put the lines in order so the program prints B.","type":"order","starter":"        return \"A\"\n    if score >= 90:\nprint(grade(80))\n    return \"C\"\n    if score >= 75:\n        return \"B\"\ndef grade(score):\n","lines":["        return \"A\"","    if score >= 90:","print(grade(80))","    return \"C\"","    if score >= 75:","        return \"B\"","def grade(score):"],"tests":[{"kind":"stdout","label":"Prints B","expect":"B"}],"hints":["The highest check comes first so a 95 never reaches the B rule.","The plain return \"C\" is the last line inside the function.","def grade(score):\n    if score >= 90:\n        return \"A\"\n    if score >= 75:\n        return \"B\"\n    return \"C\"\nprint(grade(80))\n"],"socratic":["Why must the 90 check come before the 75 check?","What runs if neither if is true?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["guard clauses","order"],"requires":["w-dry"],"solution":"def grade(score):\n    if score >= 90:\n        return \"A\"\n    if score >= 75:\n        return \"B\"\n    return \"C\"\nprint(grade(80))\n"},{"id":"p-early-return","region":"clean-code","order":2,"title":"Falling Off the End","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def sign(n):\n    if n > 0:\n        return \"plus\"\n    if n < 0:\n        return \"minus\"\nprint(sign(0))","options":["plus","minus","0","None"],"answer":3,"why":"For 0 neither if is true, so the function ends without a return and hands back None. Clean code covers every case.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does a function return when no return line runs?","The output is:\nNone"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["return","edge cases"],"requires":["w-naming"],"solution":"None"},{"id":"p-mutable-arg","region":"clean-code","order":6,"title":"Surprise Side Effect","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def add_one(xs):\n    xs.append(1)\n    return xs\ndata = [0]\nadd_one(data)\nprint(data)","options":["[0, 1]","[0]","[1]","Error: TypeError"],"answer":0,"why":"Lists are passed by reference, so append changed the caller's list. A clean function either documents this or works on a copy.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Is xs a copy of data, or the same list?","The output is:\n[0, 1]"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["mutability","side effects"],"requires":["f-typehint"],"solution":"[0, 1]"},{"id":"proj-refactor","region":"clean-code","order":9,"title":"Project: Refactor the Mess","story":"This shipping function works, but nobody dares touch it. Rewrite it cleanly without changing what it does.","goal":"Make shipping(weight, express=False) do the same job in 8 lines or fewer: 40 for the first kg, +10 for each extra kg started (round up), doubled for express.","type":"write-code","starter":"def shipping(weight, express=False):\n    cost = 40\n    if weight > 1:\n        extra = weight - 1\n        import math\n        extra = math.ceil(extra)\n        i = 0\n        while i < extra:\n            cost = cost + 10\n            i = i + 1\n    if express == True:\n        cost = cost * 2\n    else:\n        cost = cost\n    return cost\n","tests":[{"kind":"eval","label":"1 kg","expr":"shipping(1)","expect":"40"},{"kind":"eval","label":"2.5 kg","expr":"shipping(2.5)","expect":"60"},{"kind":"eval","label":"2.5 kg express","expr":"shipping(2.5, True)","expect":"120"},{"kind":"eval","label":"Light parcel","expr":"shipping(0.5)","expect":"40"},{"kind":"eval","label":"3 kg","expr":"shipping(3)","expect":"60","hidden":true},{"kind":"maxlines","max":8,"label":"8 lines of code or fewer"}],"hints":["Find the loop that adds 10 each time. Can arithmetic replace it?","math.ceil(weight) - 1 is the number of extra kilos (never below zero). A conditional expression handles express.","import math\n\n\ndef shipping(weight, express=False):\n    cost = 40 + 10 * max(0, math.ceil(weight) - 1)\n    return cost * 2 if express else cost\n"],"socratic":["Which lines only repeat simple arithmetic?","What does if express == True: ... else: cost = cost really say?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Refactor the Mess”?","xp":65,"skills":["refactoring","functions"],"requires":["o-clean-order"],"solution":"import math\n\n\ndef shipping(weight, express=False):\n    cost = 40 + 10 * max(0, math.ceil(weight) - 1)\n    return cost * 2 if express else cost\n","alt":"from math import ceil\n\n\ndef shipping(weight, express=False):\n    cost = 40 + 10 * (ceil(weight) - 1) if weight > 1 else 40\n    return 2 * cost if express else cost\n","project":true},{"id":"w-assert","region":"clean-code","order":4,"title":"Assert Yourself","story":"The tower trusts code only when it tests itself. Write a function and two checks.","goal":"Write clamp(n, low, high) that limits n to the range, and add at least two assert lines that test it.","type":"write-code","starter":"# define clamp, then test it with assert\n","tests":[{"kind":"eval","label":"Too high","expr":"clamp(5, 0, 3)","expect":"3"},{"kind":"eval","label":"Too low","expr":"clamp(-1, 0, 3)","expect":"0"},{"kind":"eval","label":"Inside range","expr":"clamp(2, 0, 3)","expect":"2"},{"kind":"source","label":"Has two assert checks of clamp","pattern":"assert\\s+clamp[\\s\\S]*assert\\s+clamp"}],"hints":["assert expression does nothing if the expression is true, and stops the program if it is false.","Write asserts such as assert clamp(5, 0, 3) == 3 after the function.","def clamp(n, low, high):\n    return max(low, min(n, high))\n\n\nassert clamp(5, 0, 3) == 3\nassert clamp(-1, 0, 3) == 0\n"],"socratic":["What does assert do when the check is false?","Which inputs would you test?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Assert Yourself”?","xp":30,"skills":["testing","assert"],"requires":["w-docstring"],"solution":"def clamp(n, low, high):\n    return max(low, min(n, high))\n\n\nassert clamp(5, 0, 3) == 3\nassert clamp(-1, 0, 3) == 0\n","alt":"def clamp(n, low, high):\n    if n < low:\n        return low\n    if n > high:\n        return high\n    return n\n\n\nassert clamp(2, 0, 3) == 2\nassert clamp(9, 0, 3) == 3\nassert clamp(-4, 0, 3) == 0\n"},{"id":"w-docstring","region":"clean-code","order":3,"title":"Document It","story":"The tower's mean function works, but nobody wrote down what it does. Add a docstring.","goal":"Write mean(nums) returning the average as a float, with a docstring of at least 10 characters.","type":"write-code","starter":"def mean(nums):\n    pass\n","tests":[{"kind":"eval","label":"Averages","expr":"mean([1, 2, 3])","expect":"2.0"},{"kind":"eval","label":"Has a docstring","expr":"bool(mean.__doc__) and len(mean.__doc__.strip()) >= 10","expect":"True"}],"hints":["A docstring is a string on the first line inside the function.","Describe what the function takes and returns, in plain words, between triple quotes.","def mean(nums):\n    \"\"\"Return the average of a list of numbers.\"\"\"\n    return sum(nums) / len(nums)\n"],"socratic":["Where does a docstring go?","What should it tell the next reader?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Document It”?","xp":30,"skills":["docstrings"],"requires":["p-early-return"],"solution":"def mean(nums):\n    \"\"\"Return the average of a list of numbers.\"\"\"\n    return sum(nums) / len(nums)\n","alt":"def mean(nums):\n    \"\"\"Average of nums as a float (the list must not be empty).\"\"\"\n    total = 0\n    for n in nums:\n        total += n\n    return total / len(nums)\n"},{"id":"w-dry","region":"clean-code","order":7,"title":"Stop Repeating Yourself","story":"The same print line is copy-pasted three times. When the format changes, someone will forget one copy.","goal":"Keep the output the same, but define a function and call it for each item.","type":"write-code","starter":"print(\"Samosa: \" + str(10))\nprint(\"Tea: \" + str(15))\nprint(\"Laddu: \" + str(25))\n","tests":[{"kind":"stdout","label":"Same output","expect":"Samosa: 10\nTea: 15\nLaddu: 25"},{"kind":"source","label":"Defines a function","pattern":"def\\s+\\w+\\s*\\("}],"hints":["Whatever repeats becomes a function. What changes between the lines?","The name and the price change. Make them parameters.","def show(name, price):\n    print(name + \": \" + str(price))\n\n\nshow(\"Samosa\", 10)\nshow(\"Tea\", 15)\nshow(\"Laddu\", 25)\n"],"socratic":["Which parts of the three lines differ?","How many times would you edit the format after this?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Stop Repeating Yourself”?","xp":30,"skills":["DRY","functions"],"requires":["p-mutable-arg"],"solution":"def show(name, price):\n    print(name + \": \" + str(price))\n\n\nshow(\"Samosa\", 10)\nshow(\"Tea\", 15)\nshow(\"Laddu\", 25)\n","alt":"def show(name, price):\n    print(f\"{name}: {price}\")\n\n\nfor name, price in [(\"Samosa\", 10), (\"Tea\", 15), (\"Laddu\", 25)]:\n    show(name, price)\n","clean":{"label":"Fit it in 5 lines of code or fewer","tests":[{"kind":"maxlines","max":5,"label":"5 lines or fewer"}]}},{"id":"w-naming","region":"clean-code","order":1,"title":"Name It Well","story":"The tower's old helper is called f and takes a and b. Nobody knows what it does. Rename it so it explains itself.","goal":"Write percent_of(percent, amount) returning that percent of the amount (percent_of(20, 150) is 30.0).","type":"write-code","starter":"def f(a, b):\n    return a / 100 * b\n","tests":[{"kind":"eval","label":"20 percent of 150","expr":"percent_of(20, 150)","expect":"30.0"},{"kind":"eval","label":"50 percent of 80","expr":"percent_of(50, 80)","expect":"40.0"},{"kind":"source","label":"Function is named percent_of","pattern":"def\\s+percent_of\\s*\\("},{"kind":"source","label":"Parameters are named percent and amount","pattern":"def\\s+percent_of\\s*\\(\\s*percent\\s*,\\s*amount\\s*\\)"}],"hints":["Names should say what a thing is. The function name and both parameter names are specified in the goal.","Rename f to percent_of, a to percent and b to amount.","def percent_of(percent, amount):\n    return amount * percent / 100\n"],"socratic":["Could a new reader guess what f does?","What would you call the two inputs?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Name It Well”?","xp":30,"skills":["naming"],"requires":["ob-boss"],"solution":"def percent_of(percent, amount):\n    return amount * percent / 100\n","alt":"def percent_of(percent, amount):\n    fraction = percent / 100\n    return amount * fraction\n"},{"id":"f-dict","region":"collections","order":6,"title":"Fill the Menu","story":"The tea stall keeps prices in a dictionary.","goal":"Add samosa at 30, then print samosa plus the tea price: 40","type":"fill","starter":"prices = {\"tea\": 10, \"coffee\": 20}\nprices[___] = 30\nprint(prices[\"samosa\"] + prices.___(\"tea\"))\n","tests":[{"kind":"stdout","label":"Prints 40","expect":"40"}],"hints":["The first blank is the new key (it needs quotes, it is text).","The second is the dictionary method that looks up a key safely: get.","prices = {\"tea\": 10, \"coffee\": 20}\nprices[\"samosa\"] = 30\nprint(prices[\"samosa\"] + prices.get(\"tea\"))\n"],"socratic":["What goes inside the square brackets when adding a new item?","Which method reads a value without crashing if missing?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Menu”?","xp":20,"skills":["dicts"],"requires":["py-12-dict"],"solution":"prices = {\"tea\": 10, \"coffee\": 20}\nprices[\"samosa\"] = 30\nprint(prices[\"samosa\"] + prices.get(\"tea\"))\n"},{"id":"o-dict-loop","region":"collections","order":11,"title":"Order the Score Total","story":"Add up the scores in a dictionary. The lines are shuffled.","goal":"Put the lines in order so the program prints 145.","type":"order","starter":"scores = {\"Asha\": 80, \"Ravi\": 65}\nfor name in scores:\ntotal = 0\n    total += scores[name]\nprint(total)\n","lines":["scores = {\"Asha\": 80, \"Ravi\": 65}","for name in scores:","total = 0","    total += scores[name]","print(total)"],"tests":[{"kind":"stdout","label":"Prints 145","expect":"145"}],"hints":["Both scores and total must exist before the loop.","The line that adds belongs inside the loop (indented). The print goes after.","scores = {\"Asha\": 80, \"Ravi\": 65}\ntotal = 0\nfor name in scores:\n    total += scores[name]\nprint(total)\n"],"socratic":["What must exist before the loop?","Which line belongs inside the loop?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["dicts","order"],"requires":["p-dict-iter"],"solution":"scores = {\"Asha\": 80, \"Ravi\": 65}\ntotal = 0\nfor name in scores:\n    total += scores[name]\nprint(total)\n"},{"id":"p-alias","region":"collections","order":4,"title":"Two Names, One List","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"a = [1, 2]\nb = a\nb.append(3)\nprint(a)","options":["[1, 2, 3]","[1, 2]","[3]","Error: NameError"],"answer":0,"why":"b = a does not copy the list. Both names point at the same list, so changing it through b changes it for a too.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Did b = a make a new list?","The output is:\n[1, 2, 3]"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["lists","mutability"],"requires":["w-list-ops"],"solution":"[1, 2, 3]"},{"id":"p-dict-iter","region":"collections","order":10,"title":"Loop Over a Dict","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"d = {\"a\": 1, \"b\": 2}\nfor k, v in d.items():\n    d[k] = v * 10\nprint(d)","options":["{'a': 1, 'b': 2}","{'a': 10, 'b': 2}","{'a': 10, 'b': 20}","Error: RuntimeError"],"answer":2,"why":"Changing the values while looping is fine. Only adding or removing keys during a loop causes a RuntimeError.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Is the size of the dictionary changing during the loop?","The output is:\n{'a': 10, 'b': 20}"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["dicts"],"requires":["w-unique"],"solution":"{'a': 10, 'b': 20}"},{"id":"p-list-slice","region":"collections","order":2,"title":"Slice a List","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"nums = [10, 20, 30, 40]\nprint(nums[1:3], nums[-1], len(nums))","options":["[10, 20] 40 4","[20, 30] 40 4","[20, 30, 40] 40 4","[20, 30] 40 3"],"answer":1,"why":"Slices work on lists just like strings. nums[1:3] is items at positions 1 and 2. -1 is the last item, and len counts all four.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Positions start at zero.","The output is:\n[20, 30] 40 4"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["lists","slicing"],"requires":["py-11-lists"],"solution":"[20, 30] 40 4"},{"id":"p-set","region":"collections","order":7,"title":"Sets Forget Repeats","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"s = {1, 2, 2, 3}\nprint(len(s), 2 in s)","options":["4 True","3 False","4 False","3 True"],"answer":3,"why":"A set keeps only one copy of each value, so {1, 2, 2, 3} has three items. 2 in s asks whether 2 is a member.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does a set do with repeated values?","The output is:\n3 True"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["sets"],"requires":["f-dict"],"solution":"3 True"},{"id":"proj-contacts","region":"collections","order":13,"title":"Project: Contact Book","story":"The library desk needs a tiny contact book you can drive with commands.","goal":"Read commands until quit. add NAME PHONE saves a contact. find NAME prints the phone, or not found. Adding the same name again replaces the phone.","type":"write-code","starter":"book = {}\n# read commands until you see quit\n","tests":[{"kind":"stdout","label":"Add and find","expect":"999\nnot found","stdin":["add Asha 999","find Asha","find Ravi","quit"]},{"kind":"stdout","label":"Replace","expect":"222","stdin":["add Meera 111","add Meera 222","find Meera","quit"]},{"kind":"stdout","label":"Nothing but quit","expect":"","stdin":["quit"],"hidden":true}],"hints":["Use a while True loop, break on quit, and split each command into parts.","parts[0] is the command. book.get(name, \"not found\") is a safe lookup.","book = {}\nwhile True:\n    line = input()\n    if line == \"quit\":\n        break\n    parts = line.split()\n    if parts[0] == \"add\":\n        book[parts[1]] = parts[2]\n    elif parts[0] == \"find\":\n        print(book.get(parts[1], \"not found\"))\n"],"socratic":["How does the loop know when to stop?","What should happen when the same name is added twice?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Contact Book”?","xp":55,"skills":["dicts","while","split"],"requires":["w-comprehension"],"solution":"book = {}\nwhile True:\n    line = input()\n    if line == \"quit\":\n        break\n    parts = line.split()\n    if parts[0] == \"add\":\n        book[parts[1]] = parts[2]\n    elif parts[0] == \"find\":\n        print(book.get(parts[1], \"not found\"))\n","alt":"book = {}\nline = input()\nwhile line != \"quit\":\n    cmd, name, *rest = line.split() + [\"\"]\n    if cmd == \"add\":\n        book[name] = rest[0]\n    elif cmd == \"find\":\n        print(book[name] if name in book else \"not found\")\n    line = input()\n","project":true},{"id":"py-11-lists","region":"collections","order":1,"title":"Pack the Bag","story":"An explorer's bag holds a map and a rope. A torch is missing.","goal":"Add \"torch\" to the end of bag, then print how many items it holds and the first item.","type":"write-code","starter":"bag = [\"map\", \"rope\"]\n# add \"torch\" to the end of the bag\n# then print the number of items, then the first item\n","tests":[{"kind":"stdout","label":"Prints count then first item","expect":"3\nmap"},{"kind":"eval","label":"bag is now map, rope, torch","expr":"bag","expect":"['map', 'rope', 'torch']"}],"hints":["Lists have an append method: bag.append(...) adds one item at the end.","len(bag) counts items. The first item is bag[0] because counting starts at zero.","bag.append(\"torch\")\nprint(len(bag))\nprint(bag[0])"],"socratic":["Which list method adds an item to the end?","Which function tells you how many items a list has?","What index is the first item?"],"explain":"In one sentence: why is the first item at index 0?","xp":30,"skills":["lists","indexing"],"requires":["str-boss"],"solution":"bag = [\"map\", \"rope\"]\nbag.append(\"torch\")\nprint(len(bag))\nprint(bag[0])\n","alt":"bag = [\"map\", \"rope\"]\nbag = bag + [\"torch\"]\nprint(len(bag))\nprint(bag[0])\n","fade":{"example":{"title":"Worked example: a fruit list","code":"fruits = [\"mango\", \"banana\"]\nfruits.append(\"guava\")\nprint(fruits[0], len(fruits))\n","note":"Lists are ordered, start at index 0, and grow with append."},"partial":"bag = [\"map\", \"rope\"]\nbag.append(\"torch\")\n____\nprint(bag[0])\n","blanks":["print(len(bag))"]}},{"id":"py-12-dict","region":"collections","order":5,"title":"Score Board","story":"The scoreboard remembers each player's points. New players are added the first time they score.","goal":"Read a name and points, add the points to that player's score (new players start at 0), then print their new score.","type":"write-code","starter":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\npoints = int(input())\n# update the scoreboard, then print the new score for name\n","tests":[{"kind":"stdout","label":"existing player Asha","expect":"50","stdin":["Asha","10"]},{"kind":"stdout","label":"existing player Ravi","expect":"60","stdin":["Ravi","5"]},{"kind":"stdout","label":"new player Meera","expect":"7","stdin":["Meera","7"]}],"hints":["A dictionary maps keys to values: scores[\"Asha\"] gives Asha's score.","scores.get(name, 0) gives the current score, or 0 if the name is new.","scores[name] = scores.get(name, 0) + points\nprint(scores[name])"],"socratic":["What happens if you read scores[name] for a name that is not there?","Which method gives a default value for a missing key?","How do you store the new total back under the same key?"],"explain":"In one sentence: why use .get() instead of scores[name]?","xp":35,"skills":["dictionaries","get"],"requires":["p-alias"],"solution":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\npoints = int(input())\nscores[name] = scores.get(name, 0) + points\nprint(scores[name])\n","alt":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\npoints = int(input())\nif name in scores:\n    scores[name] += points\nelse:\n    scores[name] = points\nprint(scores[name])\n","fade":{"example":{"title":"Worked example: a phone book","code":"book = {\"asha\": 111}\nbook[\"ravi\"] = 222\nprint(book.get(\"asha\"), book.get(\"zed\", \"none\"))\n","note":"A dict maps keys to values; .get gives a default instead of an error."},"partial":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\n____\nscores[name] = scores.get(name, 0) + points\nprint(scores[name])\n","blanks":["points = int(input())"]}},{"id":"py-13-bugfix-4","region":"collections","order":14,"title":"The Missing Treasure","story":"The treasure list is printed with numbers, but the program crashes at the end and the total is wrong.","goal":"Fix it to print 1 gem, 2 coin, 3 key, then Total: 3.","type":"fix-the-bug","starter":"items = [\"gem\", \"coin\", \"key\"]\nfor i in range(len(items) + 1):\n    print(i + 1, items[i])\nprint(\"Total:\", len(items) - 1)\n","tests":[{"kind":"stdout","label":"Prints the list and total","expect":"1 gem\n2 coin\n3 key\nTotal: 3"},{"kind":"source","label":"Still uses the items list","pattern":"items\\s*=\\s*\\["}],"hints":["Run it and read the error. A list of 3 items has valid positions 0, 1 and 2.","range(len(items) + 1) goes one step too far. Also check how the total is calculated.","items = [\"gem\", \"coin\", \"key\"]\nfor i in range(len(items)):\n    print(i + 1, items[i])\nprint(\"Total:\", len(items))"],"socratic":["What is the largest valid index in a list of 3 items?","How many times should the loop run?","Is the total one less than the number of items?"],"explain":"In one sentence: what is an off-by-one bug?","xp":50,"skills":["debugging","lists","off-by-one"],"requires":["proj-contacts"],"solution":"items = [\"gem\", \"coin\", \"key\"]\nfor i in range(len(items)):\n    print(i + 1, items[i])\nprint(\"Total:\", len(items))\n","alt":"items = [\"gem\", \"coin\", \"key\"]\nfor number, item in enumerate(items, 1):\n    print(number, item)\nprint(\"Total:\", len(items))\n","boss":true},{"id":"w-comprehension","region":"collections","order":12,"title":"Square Machine","story":"The workshop stamps out squares of the even numbers from 1 to 10.","goal":"Create a list called squares with the squares of the even numbers from 1 to 10 (4, 16, 36, 64, 100).","type":"write-code","starter":"# make a list called squares\n","tests":[{"kind":"eval","label":"squares is correct","expr":"squares","expect":"[4, 16, 36, 64, 100]"}],"hints":["A loop with an if could build it. Python also has a one-line shortcut.","A list comprehension looks like [expression for item in items if condition].","squares = []\nfor n in range(1, 11):\n    if n % 2 == 0:\n        squares.append(n * n)\n"],"socratic":["Which numbers pass the filter?","What is done to each number that passes?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Square Machine”?","xp":30,"skills":["comprehensions"],"requires":["o-dict-loop"],"solution":"squares = []\nfor n in range(1, 11):\n    if n % 2 == 0:\n        squares.append(n * n)\n","alt":"squares = [n * n for n in range(1, 11) if n % 2 == 0]\n","clean":{"label":"Use a list comprehension (one line)","tests":[{"kind":"source","label":"Uses a comprehension","pattern":"\\[[^\\]]+\\bfor\\b[^\\]]+\\]"}]}},{"id":"w-list-ops","region":"collections","order":3,"title":"Shopping Basket","story":"Chilaka's basket needs three changes before heading home.","goal":"Starting from basket = [\"rice\", \"dal\"], add \"oil\", remove \"rice\", then sort the list.","type":"write-code","starter":"basket = [\"rice\", \"dal\"]\n# add \"oil\", remove \"rice\", then sort the list\n","tests":[{"kind":"eval","label":"basket is [dal, oil]","expr":"basket","expect":"['dal', 'oil']"},{"kind":"source","label":"Uses append","pattern":"\\.append\\("},{"kind":"source","label":"Uses remove","pattern":"\\.remove\\("}],"hints":["Lists have methods: append adds to the end, remove deletes a value, sort puts items in order.","Do them in order: append(\"oil\"), remove(\"rice\"), sort().","basket = [\"rice\", \"dal\"]\nbasket.append(\"oil\")\nbasket.remove(\"rice\")\nbasket.sort()\n"],"socratic":["Which method adds to the end?","What does sort() do to the list?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Shopping Basket”?","xp":30,"skills":["lists","methods"],"requires":["p-list-slice"],"solution":"basket = [\"rice\", \"dal\"]\nbasket.append(\"oil\")\nbasket.remove(\"rice\")\nbasket.sort()\n","alt":"basket = [\"rice\", \"dal\"]\nbasket.append(\"oil\")\nbasket.remove(\"rice\")\nbasket = sorted(basket)\n"},{"id":"w-unique","region":"collections","order":9,"title":"Remove Duplicates","story":"The registration desk typed some ticket numbers twice.","goal":"Read numbers separated by commas. Print the sorted list of unique numbers, like [1, 2, 3].","type":"write-code","starter":"line = input()\n# unique, sorted, as a list of ints\n","tests":[{"kind":"stdout","label":"3,1,3,2,1","expect":"[1, 2, 3]","stdin":["3,1,3,2,1"]},{"kind":"stdout","label":"5","expect":"[5]","stdin":["5"]},{"kind":"stdout","label":"10,2,10","expect":"[2, 10]","stdin":["10,2,10"],"hidden":true}],"hints":["Split on commas, turn each piece into an int, then use set() to drop duplicates.","sorted(set(numbers)) gives a sorted list of the unique values.","line = input()\nnumbers = [int(x) for x in line.split(\",\")]\nprint(sorted(set(numbers)))\n"],"socratic":["Why convert to int before sorting?","Which collection removes duplicates automatically?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Remove Duplicates”?","xp":30,"skills":["sets","lists"],"requires":["w-word-count"],"solution":"line = input()\nnumbers = [int(x) for x in line.split(\",\")]\nprint(sorted(set(numbers)))\n","alt":"line = input()\nseen = []\nfor x in line.split(\",\"):\n    n = int(x)\n    if n not in seen:\n        seen.append(n)\nseen.sort()\nprint(seen)\n"},{"id":"w-word-count","region":"collections","order":8,"title":"Word Counter","story":"The library counts how often each word appears in a sentence.","goal":"Read a sentence. For each distinct word, in alphabetical order, print word: count.","type":"write-code","starter":"sentence = input()\n# count each word\n","tests":[{"kind":"stdout","label":"a b a","expect":"a: 2\nb: 1","stdin":["a b a"]},{"kind":"stdout","label":"one","expect":"one: 1","stdin":["one"]},{"kind":"stdout","label":"c b a c","expect":"a: 1\nb: 1\nc: 2","stdin":["c b a c"],"hidden":true}],"hints":["A dictionary can map each word to its count. Update the count as you walk through the words.","counts[w] = counts.get(w, 0) + 1 handles the first time a word appears. Loop over sorted(counts) to print.","sentence = input()\ncounts = {}\nfor w in sentence.split():\n    counts[w] = counts.get(w, 0) + 1\nfor w in sorted(counts):\n    print(f\"{w}: {counts[w]}\")\n"],"socratic":["What should the dictionary store for each word?","What happens the first time a word is seen?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Word Counter”?","xp":30,"skills":["dicts","loops"],"requires":["p-set"],"solution":"sentence = input()\ncounts = {}\nfor w in sentence.split():\n    counts[w] = counts.get(w, 0) + 1\nfor w in sorted(counts):\n    print(f\"{w}: {counts[w]}\")\n","alt":"from collections import Counter\nc = Counter(input().split())\nfor w in sorted(c):\n    print(w + \": \" + str(c[w]))\n","fade":{"example":{"title":"Worked example: count letters","code":"counts = {}\nfor ch in \"aab\":\n    counts[ch] = counts.get(ch, 0) + 1\nprint(counts)\n","note":"counts.get(key, 0) + 1 is the standard counting pattern."},"partial":"sentence = input()\ncounts = {}\nfor w in sentence.split():\n    ____\nfor w in sorted(counts):\n    print(f\"{w}: {counts[w]}\")\n","blanks":["counts[w] = counts.get(w, 0) + 1"]}},{"id":"linux-01-first-steps","region":"debug-the-outage","title":"The Silent Server","story":"It's 2 a.m. The web service has stopped responding and the on-call phone is ringing. Before you fix anything, you need to see what is going on.","goal":"Find which process is using port 8080 and report its name.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/app.log":"ERROR: cannot bind to port 8080: address already in use\n"},"processes":[{"pid":412,"name":"old-worker","port":8080}]},"tests":[{"kind":"answer","expect":"old-worker","note":"Learner submits the process name","label":"Reported the process name"},{"kind":"command-used","anyOf":["ss","netstat","lsof"],"label":"Used a port-inspection command"}],"hints":["The log tells you the port is already in use. Which command lists listening ports?","Try `ss -ltnp` or `lsof -i :8080` to see the process behind a port.","Run `ss -ltnp | grep 8080`. The process name is old-worker (pid 412)."],"explain":"In one sentence: why did the service fail to start?","xp":20,"skills":["linux","networking","troubleshooting"],"requires":[],"order":1,"socratic":["What does the log line say about port 8080?","Which commands can list what is listening on a port?","Once you see the process, where is its name in the output?"],"solution":{"commands":["cat /var/log/app.log","ss -ltnp | grep 8080"],"answer":"old-worker"},"alt":{"commands":["lsof -i :8080"],"answer":"old-worker"}},{"id":"linux-02-disk-full","region":"debug-the-outage","order":2,"title":"No Space Left","story":"Writes are failing with 'No space left on device'. Something under /var/log has grown out of control.","goal":"Find which directory under /var/log uses the most space and report its path.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/app/app.log":"debug: flushing cache\ndebug: flushing cache\ndebug: flushing cache\n","/var/log/nginx/access.log":"GET / 200\n","/var/log/syslog":"kernel: disk almost full\n"},"disks":[{"fs":"/dev/sda1","size":"20G","used":"20G","avail":"0","pct":"100%","mount":"/"},{"fs":"tmpfs","size":"2.0G","used":"12M","avail":"2.0G","pct":"1%","mount":"/run"}],"sizes":{"/var/log/app":"18G","/var/log/nginx":"140M","/var/log/syslog":"22M"}},"tests":[{"kind":"command-used","anyOf":["df"],"note":"Check which filesystem is full","label":"Check which filesystem is full"},{"kind":"command-used","anyOf":["du"],"note":"Measure the directories","label":"Measure the directories"},{"kind":"answer","expect":"/var/log/app","note":"Learner submits the directory path","label":"Learner submits the directory path"}],"hints":["First confirm the disk really is full. Which command shows filesystem usage in human-readable form?","Use du to measure folders: du -sh /var/log/* shows the size of each entry.","Run df -h, then du -sh /var/log/*. The biggest is /var/log/app at 18G."],"socratic":["Which command tells you how full each filesystem is?","Which command measures how much space a folder uses?","How do you compare several folders at once?"],"explain":"In one sentence: why check df before du?","xp":40,"skills":["linux","disk","troubleshooting"],"requires":["linux-01-first-steps"],"solution":{"commands":["df -h","du -sh /var/log/*"],"answer":"/var/log/app"}},{"id":"linux-03-bad-config","region":"debug-the-outage","order":3,"title":"The Crash Loop","story":"The billing service restarts every few seconds. Customers cannot pay. The log hints at a configuration problem.","goal":"Fix /etc/billing/config.yaml so the service reads port: 8080.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/billing.log":"ERROR config: unknown key 'prot' in /etc/billing/config.yaml (line 3)\nERROR service exited with code 2\n","/etc/billing/config.yaml":"name: billing\nworkers: 4\nprot: 8080\nlog_level: info\n"}},"tests":[{"kind":"file-contains","path":"/etc/billing/config.yaml","text":"port: 8080","note":"The key is spelled correctly","label":"The key is spelled correctly"},{"kind":"file-not-contains","path":"/etc/billing/config.yaml","text":"prot","note":"The typo is gone","label":"The typo is gone"},{"kind":"file-contains","path":"/etc/billing/config.yaml","text":"workers: 4","note":"Nothing else was lost","label":"Nothing else was lost"}],"hints":["Read the log. It names a file, a line and a key. What does the file say on that line?","The key is misspelled. sed can fix text in a file: sed -i 's/old/new/' file","sed -i 's/prot:/port:/' /etc/billing/config.yaml"],"socratic":["Which file does the log point to?","Which line looks wrong when you read it?","Which command edits text inside a file without opening an editor?"],"explain":"In one sentence: how did the log tell you what was wrong?","xp":40,"skills":["linux","logs","configuration"],"requires":["linux-02-disk-full"],"solution":{"commands":["cat /var/log/billing.log","cat /etc/billing/config.yaml","sed -i 's/prot:/port:/' /etc/billing/config.yaml","cat /etc/billing/config.yaml"]},"alt":{"commands":["echo \"name: billing\" > /etc/billing/config.yaml","echo \"workers: 4\" >> /etc/billing/config.yaml","echo \"port: 8080\" >> /etc/billing/config.yaml","echo \"log_level: info\" >> /etc/billing/config.yaml"]}},{"id":"linux-04-runaway","region":"debug-the-outage","order":4,"title":"The Runaway Process","story":"The server is crawling. Pages time out and SSH feels like wading through mud. One process is hogging the CPU.","goal":"Find the process using the most CPU and stop it without touching the others.","type":"terminal","starter":{"cwd":"/home/oncall","files":{},"processes":[{"pid":1,"name":"init","user":"root","cpu":0.0,"mem":0.1},{"pid":233,"name":"nginx","user":"www","cpu":1.2,"mem":2.3,"port":80},{"pid":512,"name":"billing","user":"deploy","cpu":3.4,"mem":8.8},{"pid":777,"name":"data-crunch","user":"deploy","cpu":98.7,"mem":41.0}]},"tests":[{"kind":"command-used","anyOf":["ps","top"],"note":"Inspect the running processes","label":"Inspect the running processes"},{"kind":"process-gone","pid":777,"note":"The runaway process is stopped","label":"The runaway process is stopped"},{"kind":"process-alive","pid":233,"note":"nginx is still running","label":"nginx is still running"},{"kind":"process-alive","pid":512,"note":"billing is still running","label":"billing is still running"}],"hints":["Which command lists running processes along with their CPU use?","ps aux shows a %CPU column. Spot the outlier, note its PID, then use kill PID.","ps aux, then kill 777."],"socratic":["Which command shows what is running right now?","Which column tells you who is hogging the CPU?","How do you stop one specific process by its number?"],"explain":"In one sentence: why look before you kill?","xp":40,"skills":["linux","processes","troubleshooting"],"requires":["linux-03-bad-config"],"solution":{"commands":["ps aux","kill 777","ps aux"]},"alt":{"commands":["top","kill -9 777"]}},{"id":"linux-05-permission-denied","region":"debug-the-outage","order":5,"title":"Permission Denied","story":"The nightly backup script suddenly refuses to run. Nobody changed the code, but someone touched the file.","goal":"Make /opt/backup/run.sh executable (mode 755) and report which command shows its permissions.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/opt/backup/run.sh":"#!/bin/sh\necho backing up\n","/var/log/backup.log":"run.sh: Permission denied\n"},"modes":{"/opt/backup/run.sh":"644"},"dirs":["/opt/backup"]},"tests":[{"kind":"file-mode","path":"/opt/backup/run.sh","mode":"755","label":"run.sh has mode 755"},{"kind":"command-used","anyOf":["ls"],"label":"Inspected permissions with ls -l"}],"hints":["The log says Permission denied. Which command shows who may read, write and run a file?","ls -l shows the mode. chmod changes it; 755 means owner rwx, others r-x.","Run:\ncat /var/log/backup.log\nls -l /opt/backup/run.sh\nchmod 755 /opt/backup/run.sh"],"socratic":["What does the log complain about?","Which three letters in ls -l matter for running a script?","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","permissions"],"requires":["linux-04-runaway"],"solution":{"commands":["cat /var/log/backup.log","ls -l /opt/backup/run.sh","chmod 755 /opt/backup/run.sh"]},"tool":"linux"},{"id":"linux-06-wont-start","region":"debug-the-outage","order":6,"title":"The Service That Won't Start","story":"The payments API keeps failing to start after a deploy. systemctl just says it failed.","goal":"Find why payments-api fails and fix it so the service is active.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/etc/payments/api.conf":"port=8443\nlog_dir=/var/log/payments\n"},"dirs":["/var/log/payments"],"services":{"payments-api":{"state":"failed","desc":"Payments API","port":8443,"needs":[{"file":"/etc/payments/api.env","exists":true,"msg":"missing environment file /etc/payments/api.env"}]}},"journal":{"payments-api":["Nov 24 02:01:11 host payments-api[3001]: missing environment file /etc/payments/api.env"]}},"tests":[{"kind":"service-state","name":"payments-api","state":"active","label":"payments-api is active"},{"kind":"command-used","anyOf":["journalctl","systemctl"],"label":"Read the logs or status"}],"hints":["systemctl status shows the last log lines. What does the log say is missing?","Create the missing file (touch), then start the service again.","Run:\nsystemctl status payments-api\njournalctl -u payments-api\ntouch /etc/payments/api.env\nsystemctl restart payments-api"],"socratic":["What does journalctl say?","What must exist before the service can start?","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":30,"skills":["linux","systemd"],"requires":["linux-05-permission-denied"],"solution":{"commands":["systemctl status payments-api","journalctl -u payments-api","touch /etc/payments/api.env","systemctl restart payments-api"]},"tool":"linux"},{"id":"linux-07-big-file","region":"debug-the-outage","order":7,"title":"Who Ate the Disk?","story":"Disk alerts again. This time the culprit is a single huge file hiding somewhere under /var.","goal":"Find the largest file under /var/data and report its full path.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/data/a/cache.db":"x","/var/data/b/dump.sql":"x","/var/data/b/old/backup.tar":"x","/var/data/c/notes.txt":"x"},"sizes":{"/var/data/a/cache.db":"120M","/var/data/b/dump.sql":"2.1G","/var/data/b/old/backup.tar":"14G","/var/data/c/notes.txt":"4K"}},"tests":[{"kind":"answer","expect":"/var/data/b/old/backup.tar","label":"Reported the answer"},{"kind":"command-used","anyOf":["du","find","ls"],"label":"Measured sizes"}],"hints":["du -a lists every file with its size.","Sort the sizes with sort -h or -n, and look at the biggest.","Run:\ndu -a /var/data\ndu -a /var/data | sort -n\nThen answer: /var/data/b/old/backup.tar"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","disk"],"requires":["linux-06-wont-start"],"solution":{"commands":["du -a /var/data","du -a /var/data | sort -n"],"answer":"/var/data/b/old/backup.tar"},"tool":"linux"},{"id":"linux-08-log-detective","region":"debug-the-outage","order":8,"title":"Log Detective","story":"Thousands of requests hit the server tonight. Who sent the most?","goal":"Find the IP address with the most requests in /var/log/access.log.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/access.log":"10.0.0.5 GET /\n10.0.0.5 GET /\n10.0.0.5 GET /\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n203.0.113.9 GET /login\n10.0.0.7 GET /about\n10.0.0.7 GET /about\n198.51.100.4 GET /\n198.51.100.4 GET /\n198.51.100.4 GET /\n198.51.100.4 GET /\n"}},"tests":[{"kind":"answer","expect":"203.0.113.9","label":"Reported the answer"},{"kind":"command-used","anyOf":["sort","uniq","awk","grep"],"label":"Used a counting pipeline"}],"hints":["Print the first column, then count repeats.","cut -d' ' -f1 file | sort | uniq -c | sort -rn | head","Run:\ncut -d' ' -f1 /var/log/access.log | sort | uniq -c | sort -rn | head -3\nThen answer: 203.0.113.9"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":30,"skills":["linux","pipes"],"requires":["linux-07-big-file"],"solution":{"commands":["cut -d' ' -f1 /var/log/access.log | sort | uniq -c | sort -rn | head -3"],"answer":"203.0.113.9"},"tool":"linux"},{"id":"linux-09-cron-silent","region":"debug-the-outage","order":9,"title":"The Silent Cron","story":"The cleanup job should run every night, yet logs keep piling up. Cron has been quiet.","goal":"Find the problem in the crontab file and fix the schedule so it runs at 02:30 every day.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/spool/cron/crontabs/oncall":"# m h dom mon dow command\n30 2 31 2 * /opt/cleanup.sh\n","/opt/cleanup.sh":"#!/bin/sh\nrm -f /tmp/*.old\n"},"dirs":["/var/spool/cron/crontabs"]},"tests":[{"kind":"file-contains","path":"/var/spool/cron/crontabs/oncall","text":"30 2 * * *","label":"Runs daily at 02:30"},{"kind":"file-not-contains","path":"/var/spool/cron/crontabs/oncall","text":"31 2","label":"No impossible date left"}],"hints":["Read the five fields: minute hour day-of-month month day-of-week. Is 31 February a real date?","Replace '31 2' with '* *' using sed -i on the crontab file.","Run:\ncrontab -l\nsed -i 's/30 2 31 2 \\*/30 2 * * */' /var/spool/cron/crontabs/oncall\ncrontab -l"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","cron"],"requires":["linux-08-log-detective"],"solution":{"commands":["crontab -l","sed -i 's/30 2 31 2 \\*/30 2 * * */' /var/spool/cron/crontabs/oncall","crontab -l"]},"tool":"linux"},{"id":"linux-10-oom","region":"debug-the-outage","order":10,"title":"The OOM Killer","story":"The reporting job dies every night at 03:00 with no error of its own. Something is killing it.","goal":"Find which process the kernel killed and report its name.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/syslog":"Nov 24 02:59:50 host kernel: Memory cgroup out of memory: Killed process 8814 (report-gen) total-vm:9120044kB\nNov 24 03:00:02 host cron[221]: (oncall) CMD (/opt/nightly.sh)\nNov 24 03:10:00 host kernel: eth0: link up\n"},"mem":{"total":"4G","used":"3.8G","free":"90M"}},"tests":[{"kind":"answer","expect":"report-gen","label":"Reported the answer"},{"kind":"command-used","anyOf":["grep","journalctl","cat"],"label":"Searched the logs"}],"hints":["The kernel logs a message when it kills a process for lack of memory. What word does it use?","grep -i killed /var/log/syslog","Run:\nfree -h\ngrep -i killed /var/log/syslog\nThen answer: report-gen"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":30,"skills":["linux","memory"],"requires":["linux-09-cron-silent"],"solution":{"commands":["free -h","grep -i killed /var/log/syslog"],"answer":"report-gen"},"tool":"linux"},{"id":"linux-11-dns","region":"debug-the-outage","order":11,"title":"Name Not Found","story":"The app cannot reach the database host db.internal. Pinging by IP works, by name does not.","goal":"Fix /etc/resolv.conf so it points at the nameserver 10.0.0.2 instead of 10.0.0.99.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/etc/resolv.conf":"nameserver 10.0.0.99\nsearch internal\n","/var/log/app.log":"cannot resolve db.internal: no response from 10.0.0.99\n"}},"tests":[{"kind":"file-contains","path":"/etc/resolv.conf","text":"nameserver 10.0.0.2","label":"Uses nameserver 10.0.0.2"},{"kind":"file-not-contains","path":"/etc/resolv.conf","text":"10.0.0.99","label":"Old nameserver removed"}],"hints":["Which file lists the DNS server a Linux machine asks?","sed -i 's/10.0.0.99/10.0.0.2/' /etc/resolv.conf","Run:\ncat /var/log/app.log\ncat /etc/resolv.conf\nsed -i 's/10.0.0.99/10.0.0.2/' /etc/resolv.conf"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","dns"],"requires":["linux-10-oom"],"solution":{"commands":["cat /var/log/app.log","cat /etc/resolv.conf","sed -i 's/10.0.0.99/10.0.0.2/' /etc/resolv.conf"]},"tool":"linux"},{"id":"linux-12-hosts","region":"debug-the-outage","order":12,"title":"The Stale Hosts Entry","story":"Staging keeps talking to the old API server. Someone pinned its name in a file years ago.","goal":"Remove the old pin for api.example.com (10.1.1.1) from /etc/hosts.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/etc/hosts":"127.0.0.1 localhost\n10.1.1.1 api.example.com\n10.2.2.2 cache.example.com\n"}},"tests":[{"kind":"file-not-contains","path":"/etc/hosts","text":"api.example.com","label":"api.example.com entry removed"},{"kind":"file-contains","path":"/etc/hosts","text":"cache.example.com","label":"Other entries kept"}],"hints":["Which file overrides DNS for a single machine?","Use sed -i 's/^10.1.1.1.*//' or rewrite the file without that line.","Run:\ncat /etc/hosts\ngrep -v api.example.com /etc/hosts > /tmp/hosts.new\ncp /tmp/hosts.new /etc/hosts"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","dns"],"requires":["linux-11-dns"],"solution":{"commands":["cat /etc/hosts","grep -v api.example.com /etc/hosts > /tmp/hosts.new","cp /tmp/hosts.new /etc/hosts"]},"tool":"linux"},{"id":"linux-13-pidfile","region":"debug-the-outage","order":13,"title":"The Stale Pid File","story":"The worker refuses to start: it says it is already running. But nothing is running.","goal":"Prove the process is gone, remove the stale pid file and start the worker.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/run/worker.pid":"5150\n","/var/log/worker.log":"worker already running (pid 5150), refusing to start\n"},"services":{"worker":{"state":"failed","desc":"Queue worker","proc":"worker","needs":[{"file":"/var/run/worker.pid","exists":false,"msg":"worker already running (pid 5150), refusing to start"}]}}},"tests":[{"kind":"service-state","name":"worker","state":"active","label":"worker is active"},{"kind":"cond","cond":{"file":"/var/run/worker.pid","exists":false},"label":"Stale pid file removed"},{"kind":"command-used","anyOf":["ps"],"label":"Checked that pid 5150 is not running"}],"hint -the-outage","order":15,"title":"502 Bad Gateway","story":"Users see 502 errors. Nginx is up, but the app behind it is not.","goal":"Get http://shop.local/ back to 200 by starting the right service.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/nginx/error.log":"connect() failed (111: Connection refused) while connecting to upstream 127.0.0.1:5000\n"},"services":{"nginx":{"state":"active","desc":"Web proxy","port":80},"shop-app":{"state":"inactive","desc":"Shop application","port":5000}},"http":{"shop.local":{"cases":[{"if":[{"service":"shop-app","state":"active"}],"status":200,"body":"Welcome to the shop"}],"default":{"status":502,"body":"Bad Gateway"}}}},"tests":[{"kind":"curl-ok","url":"http://shop.local/","status":200,"label":"The shop answers 200"},{"kind":"service-state","name":"shop-app","state":"active","label":"shop-app is active"}],"hints":["Read the nginx error log: which address was refused?","Port 5000 belongs to shop-app. Start it with systemctl.","Run:\ncurl -I http://shop.local/\ncat /var/log/nginx/error.log\nsystemctl start shop-app\ncurl http://shop.local/"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":30,"skills":["linux","http"],"requires":["linux-14-truncate"],"solution":{"commands":["curl -I http://shop.local/","cat /var/log/nginx/error.log","systemctl start shop-app","curl http://shop.local/"]},"tool":"linux"},{"id":"linux-16-cert","region":"debug-the-outage","order":16,"title":"Certificate Countdown","story":"A cert expiry warning appeared in the monitoring channel. Which site is closest to expiring?","goal":"Look at the expiry dates in /etc/ssl/certs.txt and report the domain that expires first.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/etc/ssl/certs.txt":"shop.example.com 2026-12-30\nauth.example.com 2026-12-02\napi.example.com 2027-03-15\ncdn.example.com 2026-12-19\n"}},"tests":[{"kind":"answer","expect":"auth.example.com","label":"Reported the answer"},{"kind":"command-used","anyOf":["sort","cat","grep"],"label":"Compared the dates"}],"hints":["Dates written year-month-day sort correctly as plain text.","sort -k2 /etc/ssl/certs.txt | head -1","Run:\nsort -k2 /etc/ssl/certs.txt | head -1\nThen answer: auth.example.com"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","ssl"],"requires":["linux-15-502"],"solution":{"commands":["sort -k2 /etc/ssl/certs.txt | head -1"],"answer":"auth.example.com"},"tool":"linux"},{"id":"linux-17-env","region":"debug-the-outage","order":17,"title":"Missing Variable","story":"The deploy script exits at once with a cryptic message. It needs a setting that is not in its environment.","goal":"Find which variable is missing from /opt/deploy/deploy.sh and add `export APP_ENV=production` to /home/oncall/.profile.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/opt/deploy/deploy.sh":"#!/bin/sh\n: \"${APP_ENV:?APP_ENV is not set}\"\necho deploying to $APP_ENV\n","/home/oncall/.profile":"# user profile\n"}},"tests":[{"kind":"file-contains","path":"/home/oncall/.profile","text":"APP_ENV=production","label":"Profile exports APP_ENV=production"},{"kind":"command-used","anyOf":["cat","grep"],"label":"Read the script"}],"hints":["Read the script: which variable does it require?","echo 'export APP_ENV=production' >> ~/.profile  (use the full path /home/oncall/.profile)","Run:\ncat /opt/deploy/deploy.sh\necho 'export APP_ENV=production' >> /home/oncall/.profile"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","env"],"requires":["linux-16-cert"],"solution":{"commands":["cat /opt/deploy/deploy.sh","echo 'export APP_ENV=production' >> /home/oncall/.profile"]},"tool":"linux"},{"id":"linux-18-ownership","region":"debug-the-outage","order":18,"title":"Wrong Owner","story":"The web app cannot write uploads. The folder was created by root during a hotfix.","goal":"Give /srv/uploads to the user www-data (use chown) and report the folder's old owner.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/srv/uploads/readme.txt":"uploads go here\n"},"owners":{"/srv/uploads":"root","/srv/uploads/readme.txt":"root"},"dirs":["/srv/uploads"]},"tests":[{"kind":"file-owner","path":"/srv/uploads","user":"www-data","label":"uploads is owned by www-data"},{"kind":"answer","expect":"root","label":"Reported the old owner"}],"hints":["ls -l shows the owner in the third column.","chown www-data /srv/uploads (sudo may be needed).","Run:\nls -ld /srv/uploads\nsudo chown www-data /srv/uploads\nThen answer: root"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","permissions"],"requires":["linux-17-env"],"solution":{"commands":["ls -ld /srv/uploads","sudo chown www-data /srv/uploads"],"answer":"root"},"tool":"linux","alt":{"commands":["ls -l /srv","chown www-data /srv/uploads"],"answer":"root"}},{"id":"linux-19-slow","region":"debug-the-outage","order":19,"title":"The Slow Server","story":"Everything crawls. Load average is high and someone's script is hogging a CPU.","goal":"Find the process using the most CPU, then stop it with kill.","type":"terminal","starter":{"cwd":"/home/oncall","files":{},"processes":[{"pid":301,"name":"nginx","cpu":1.2,"mem":2.0,"user":"www-data"},{"pid":777,"name":"log-shipper","cpu":3.5,"mem":1.0,"user":"root"},{"pid":912,"name":"bitcoin-miner","cpu":97.4,"mem":4.1,"user":"oncall"}],"load":"14.20, 11.80, 9.10"},"tests":[{"kind":"process-gone","pid":912,"label":"The hog is stopped"},{"kind":"process-alive","pid":301,"label":"nginx is still running"}],"hints":["top or ps lists processes with their CPU use.","kill 912","Run:\nuptime\ntop\nkill 912"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":25,"skills":["linux","processes"],"requires":["linux-18-ownership"],"solution":{"commands":["uptime","top","kill 912"]},"tool":"linux","alt":{"commands":["ps","kill -9 912"]}},{"id":"linux-20-capstone","region":"debug-the-outage","order":20,"title":"Boss: The Perfect Storm","story":"Black Friday, 02:00. The checkout page is down and three things are wrong at once. Fix them all.","goal":"Restore http://checkout.local/ to 200: the config is unreadable, the log disk setting is wrong and the service is stopped. Follow the logs.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/etc/checkout/app.conf":"port=9000\nstorage=/data/orders\n","/var/log/checkout.log":"FATAL cannot read /etc/checkout/app.conf: permission denied\n"},"modes":{"/etc/checkout/app.conf":"000"},"dirs":["/data/orders"],"services":{"checkout":{"state":"failed","desc":"Checkout","port":9000,"needs":[{"mode":{"path":"/etc/checkout/app.conf","value":"644"},"msg":"cannot read /etc/checkout/app.conf: permission denied"}]}},"http":{"checkout.local":{"cases":[{"if":[{"service":"checkout","state":"active"}],"status":200,"body":"Checkout OK"}],"default":{"status":503,"body":"Service Unavailable"}}}},"tests":[{"kind":"file-mode","path":"/etc/checkout/app.conf","mode":"644","label":"app.conf has mode 644"},{"kind":"service-state","name":"checkout","state":"active","label":"checkout is active"},{"kind":"curl-ok","url":"http://checkout.local/","status":200,"label":"Checkout answers 200"}],"hints":["Start with the log. Which file cannot be read?","chmod 644 the config, then restart the service and curl the page.","Run:\ncat /var/log/checkout.log\nls -l /etc/checkout/app.conf\nchmod 644 /etc/checkout/app.conf\nsystemctl restart checkout\ncurl http://checkout.local/"],"socratic":["","","Which command shows you the evidence you need?"],"explain":"In one sentence: what was the cause, and how did you fix it?","xp":60,"skills":["linux","troubleshooting"],"requires":["linux-19-slow"],"solution":{"commands":["cat /var/log/checkout.log","ls -l /etc/checkout/app.conf","chmod 644 /etc/checkout/app.conf","systemctl restart checkout","curl http://checkout.local/"]},"tool":"linux","boss":true},{"id":"f-bool","region":"decisions","order":5,"title":"Fill the Logic","story":"The cinema lets you in only if you are old enough and hold a ticket.","goal":"Fill the blank so a person needs both conditions.","type":"fill","starter":"age = int(input())\nhas_ticket = input() == \"yes\"\nif age >= 5 ___ has_ticket:\n    print(\"Enter\")\nelse:\n    print(\"Stay out\")\n","tests":[{"kind":"stdout","label":"10 with ticket","expect":"Enter","stdin":["10","yes"]},{"kind":"stdout","label":"3 with ticket","expect":"Stay out","stdin":["3","yes"]},{"kind":"stdout","label":"10 without ticket","expect":"Stay out","stdin":["10","no"]}],"hints":["You need BOTH things to be true. Which word joins two conditions that must both hold?","The word is and.","age = int(input())\nhas_ticket = input() == \"yes\"\nif age >= 5 and has_ticket:\n    print(\"Enter\")\nelse:\n    print(\"Stay out\")\n"],"socratic":["Does the person need one condition or both?","Which keyword means both must be true?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Logic”?","xp":20,"skills":["and/or"],"requires":["py-06-elif"],"solution":"age = int(input())\nhas_ticket = input() == \"yes\"\nif age >= 5 and has_ticket:\n    print(\"Enter\")\nelse:\n    print(\"Stay out\")\n"},{"id":"o-grade","region":"decisions","order":8,"title":"Order the Grader","story":"The report-card program fell apart. Rebuild it so that 95 gives A, 80 gives B and 10 gives C.","goal":"Put the lines in order so the program grades correctly.","type":"order","starter":"    print(\"B\")\n    print(\"C\")\nelse:\nmark = int(input())\nif mark >= 90:\n    print(\"A\")\nelif mark >= 75:\n","lines":["    print(\"B\")","    print(\"C\")","else:","mark = int(input())","if mark >= 90:","    print(\"A\")","elif mark >= 75:"],"tests":[{"kind":"stdout","label":"95","expect":"A","stdin":["95"]},{"kind":"stdout","label":"80","expect":"B","stdin":["80"]},{"kind":"stdout","label":"10","expect":"C","stdin":["10"]},{"kind":"stdout","label":"75","expect":"B","stdin":["75"],"hidden":true}],"hints":["if comes first, then elif, then else. Indentation shows which line belongs to which branch.","The highest score check must come before the lower one.","mark = int(input())\nif mark >= 90:\n    print(\"A\")\nelif mark >= 75:\n    print(\"B\")\nelse:\n    print(\"C\")\n"],"socratic":["What must come before elif and else?","Why must the 90 check come before the 75 check?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["elif","order"],"requires":["p-elif-chain"],"solution":"mark = int(input())\nif mark >= 90:\n    print(\"A\")\nelif mark >= 75:\n    print(\"B\")\nelse:\n    print(\"C\")\n"},{"id":"p-elif-chain","region":"decisions","order":7,"title":"If vs Elif","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"n = 15\nif n % 3 == 0:\n    print(\"Fizz\")\nif n % 5 == 0:\n    print(\"Buzz\")\nelif n % 2 == 0:\n    print(\"Even\")","options":["Fizz","Buzz","Fizz\nBuzz\nEven","Fizz\nBuzz"],"answer":3,"why":"The first if stands alone, so it runs. The second if/elif is a separate group: 15 % 5 == 0 is true, so Buzz prints and the elif is skipped.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Where does one decision end and the next begin?","The output is:\nFizz\nBuzz"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["if","elif"],"requires":["p-truthy"],"solution":"Fizz\nBuzz"},{"id":"p-eq","region":"decisions","order":3,"title":"Two Equals","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"print(5 == 5.0)\nprint(\"5\" == 5)\nprint(3 > 2 > 1)","options":["True\nTrue\nTrue","False\nFalse\nTrue","True\nFalse\nFalse","True\nFalse\nTrue"],"answer":3,"why":"5 equals 5.0 as numbers, but text \"5\" is never equal to the number 5. Python lets you chain comparisons: 3 > 2 > 1 means both are true.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Is \"5\" the same kind of thing as 5?","The output is:\nTrue\nFalse\nTrue"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["comparisons"],"requires":["w-even-odd"],"solution":"True\nFalse\nTrue"},{"id":"p-truthy","region":"decisions","order":6,"title":"Truthy and Falsy","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"items = []\nif items:\n    print(\"full\")\nelse:\n    print(\"empty\")\nif \"0\":\n    print(\"zero is truthy\")","options":["empty\nzero is truthy","full\nzero is truthy","empty","full"],"answer":0,"why":"Empty collections are falsy, so the else branch runs. A non-empty string, even \"0\", is truthy.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which values count as False when used in an if?","The output is:\nempty\nzero is truthy"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["truthiness"],"requires":["f-bool"],"solution":"empty\nzero is truthy"},{"id":"proj-ticket","region":"decisions","order":10,"title":"Project: Cinema Ticket Desk","story":"The cinema prices tickets by age and day. Build the desk program.","goal":"Read age, then day (mon..sun). Under 5 is free. Ages 5-12 and 60+ pay 80, everyone else 150. On sat or sun add 20, but never to a free ticket. Print the price.","type":"write-code","starter":"age = int(input())\nday = input()\n# work out the price, then print it\n","tests":[{"kind":"stdout","label":"4 on a Monday","expect":"0","stdin":["4","mon"]},{"kind":"stdout","label":"4 on a Saturday stays free","expect":"0","stdin":["4","sat"]},{"kind":"stdout","label":"10 on a Monday","expect":"80","stdin":["10","mon"]},{"kind":"stdout","label":"30 on a Saturday","expect":"170","stdin":["30","sat"]},{"kind":"stdout","label":"65 on a Sunday","expect":"100","stdin":["65","sun"]},{"kind":"stdout","label":"13 on a Tuesday","expect":"150","stdin":["13","tue"],"hidden":true}],"hints":["First decide the base price with if/elif/else. Then handle the weekend as a separate step.","The weekend surcharge only applies when the price is above 0.","age = int(input())\nday = input()\nif age < 5:\n    price = 0\nelif age <= 12 or age >= 60:\n    price = 80\nelse:\n    price = 150\nif day in (\"sat\", \"sun\") and price > 0:\n    price += 20\nprint(price)\n"],"socratic":["Which rule decides the base price, and which rule adjusts it?","Why must the free ticket skip the weekend charge?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Cinema Ticket Desk”?","xp":45,"skills":["if","elif","and/or"],"requires":["w-leap"],"solution":"age = int(input())\nday = input()\nif age < 5:\n    price = 0\nelif age <= 12 or age >= 60:\n    price = 80\nelse:\n    price = 150\nif day in (\"sat\", \"sun\") and price > 0:\n    price += 20\nprint(price)\n","alt":"age = int(input())\nday = input()\nif age < 5:\n    price = 0\nelse:\n    price = 80 if (age <= 12 or age >= 60) else 150\n    if day == \"sat\" or day == \"sun\":\n        price = price + 20\nprint(price)\n","project":true},{"id":"py-05-if-else","region":"decisions","order":1,"title":"Gate Guard","story":"The temple gate only opens for scores of 50 or more. Everyone else is asked to try again.","goal":"Read a score. Print Pass if it is 50 or more, otherwise print Try again.","type":"write-code","starter":"score = int(input())\n# print Pass if the score is 50 or more, otherwise Try again\n","tests":[{"kind":"stdout","label":"50 passes","expect":"Pass","stdin":["50"]},{"kind":"stdout","label":"49 tries again","expect":"Try again","stdin":["49"]},{"kind":"stdout","label":"100 passes","expect":"Pass","stdin":["100"]},{"kind":"stdout","label":"0 tries again","expect":"Try again","stdin":["0"]},{"kind":"source","label":"Uses if","pattern":"\\bif\\b"}],"hints":["A decision has the shape: if condition: (indented action) else: (indented action).","The condition for passing is score >= 50. Remember the colons and the indentation.","if score >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Try again\")"],"socratic":["Which comparison means 'at least 50'?","What two symbols must end the if line and the else line?","What happens to the lines under if when the condition is false?"],"explain":"In one sentence: when does the else part run?","xp":25,"skills":["if","comparison"],"requires":["py-04-bugfix-1"],"solution":"score = int(input())\nif score >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Try again\")\n","alt":"score = int(input())\nprint(\"Pass\" if score >= 50 else \"Try again\")\n","fade":{"example":{"title":"Worked example: pass or fail","code":"mark = 62\nif mark >= 40:\n    print(\"pass\")\nelse:\n    print(\"fail\")\n","note":"if checks a condition; else covers everything else. The body is indented."},"partial":"score = int(input())\nif score >= 50:\n    ____\nelse:\n    print(\"Try again\")\n","blanks":["print(\"Pass\")"]}},{"id":"py-06-elif","region":"decisions","order":4,"title":"Report Card","story":"Marks are turned into grades: 90 or more is A, 75 or more is B, 50 or more is C, anything lower is D.","goal":"Read marks and print the grade letter.","type":"write-code","starter":"marks = int(input())\n# print A, B, C or D\n","tests":[{"kind":"stdout","label":"95 is A","expect":"A","stdin":["95"]},{"kind":"stdout","label":"90 is A","expect":"A","stdin":["90"]},{"kind":"stdout","label":"80 is B","expect":"B","stdin":["80"]},{"kind":"stdout","label":"75 is B","expect":"B","stdin":["75"]},{"kind":"stdout","label":"60 is C","expect":"C","stdin":["60"]},{"kind":"stdout","label":"50 is C","expect":"C","stdin":["50"]},{"kind":"stdout","label":"49 is D","expect":"D","stdin":["49"]}],"hints":["When there are more than two outcomes, chain them: if ... elif ... else.","Check the highest band first: if marks >= 90, then elif marks >= 75, then elif marks >= 50, then else.","if marks >= 90:\n    print(\"A\")\nelif marks >= 75:\n    print(\"B\")\nelif marks >= 50:\n    print(\"C\")\nelse:\n    print(\"D\")"],"socratic":["If marks is 95, which conditions are true? Which one should win?","Why does the order of the checks matter?","What does elif do that a second if does not?"],"explain":"In one sentence: why do we check the highest band first?","xp":30,"skills":["if","elif","logic"],"requires":["p-eq"],"solution":"marks = int(input())\nif marks >= 90:\n    print(\"A\")\nelif marks >= 75:\n    print(\"B\")\nelif marks >= 50:\n    print(\"C\")\nelse:\n    print(\"D\")\n","alt":"marks = int(input())\ngrade = \"D\"\nif marks >= 50:\n    grade = \"C\"\nif marks >= 75:\n    grade = \"B\"\nif marks >= 90:\n    grade = \"A\"\nprint(grade)\n","fade":{"example":{"title":"Worked example: ticket price","code":"age = 9\nif age < 5:\n    print(\"free\")\nelif age < 12:\n    print(\"child\")\nelse:\n    print(\"adult\")\n","note":"Conditions are checked top to bottom; the first true one wins."},"partial":"marks = int(input())\nif marks >= 90:\n    print(\"A\")\nelif marks >= 75:\n    ____\nelif marks >= 50:\n    print(\"C\")\nelse:\n    print(\"D\")\n","blanks":["print(\"B\")"]}},{"id":"py-07-bugfix-2","region":"decisions","order":11,"title":"The Wrong Door","story":"The ticket machine should say Exact change for exactly 10 coins, Overpaid for more, Not enough for fewer. It is broken in two ways.","goal":"Fix the program so all three cases work.","type":"fix-the-bug","starter":"coins = int(input())\nif coins >= 10:\n    print(\"Exact change\")\nelif coins > 10\n    print(\"Overpaid\")\nelse:\n    print(\"Not enough\")\n","tests":[{"kind":"stdout","label":"10 is exact","expect":"Exact change","stdin":["10"]},{"kind":"stdout","label":"11 is overpaid","expect":"Overpaid","stdin":["11"]},{"kind":"stdout","label":"25 is overpaid","expect":"Overpaid","stdin":["25"]},{"kind":"stdout","label":"9 is not enough","expect":"Not enough","stdin":["9"]},{"kind":"stdout","label":"0 is not enough","expect":"Not enough","stdin":["0"],"hidden":true}],"hints":["Run it first. Python complains about one line. What is missing at the end of an elif line?","Once it runs, try 11 coins. Which branch answers? Is >= the same as \"exactly\"?","coins = int(input())\nif coins == 10:\n    print(\"Exact change\")\nelif coins > 10:\n    print(\"Overpaid\")\nelse:\n    print(\"Not enough\")"],"socratic":["What must every if/elif/else line end with?","For 11 coins, which condition is true first?","Which operator checks 'exactly equal'?"],"explain":"In one sentence: what is the difference between >= and ==?","xp":50,"skills":["debugging","comparison"],"requires":["proj-ticket"],"solution":"coins = int(input())\nif coins == 10:\n    print(\"Exact change\")\nelif coins > 10:\n    print(\"Overpaid\")\nelse:\n    print(\"Not enough\")\n","alt":"coins = int(input())\nif coins < 10:\n    print(\"Not enough\")\nelif coins == 10:\n    print(\"Exact change\")\nelse:\n    print(\"Overpaid\")\n","boss":true},{"id":"w-even-odd","region":"decisions","order":2,"title":"Even or Odd","story":"The ticket machine gives even-numbered tokens to the left queue and odd ones to the right.","goal":"Read a whole number. Print even or odd.","type":"write-code","starter":"n = int(input())\n# print even or odd\n","tests":[{"kind":"stdout","label":"4","expect":"even","stdin":["4"]},{"kind":"stdout","label":"7","expect":"odd","stdin":["7"]},{"kind":"stdout","label":"0","expect":"even","stdin":["0"]},{"kind":"stdout","label":"-3","expect":"odd","stdin":["-3"],"hidden":true}],"hints":["The remainder operator % gives what is left after division. What is the remainder of an even number divided by 2?","Check n % 2 == 0 inside an if.","n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n"],"socratic":["What is 6 % 2? What is 7 % 2?","Which comparison tells you the remainder was zero?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Even or Odd”?","xp":30,"skills":["if","modulo"],"requires":["py-05-if-else"],"solution":"n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n","alt":"n = int(input())\nprint(\"even\" if n % 2 == 0 else \"odd\")\n","fade":{"example":{"title":"Worked example: multiple of 5?","code":"n = 35\nif n % 5 == 0:\n    print(\"multiple of 5\")\nelse:\n    print(\"not a multiple\")\n","note":"% gives the remainder. A remainder of 0 means it divides exactly."},"partial":"n = int(input())\nif n % 2 == 0:\n    ____\nelse:\n    print(\"odd\")\n","blanks":["print(\"even\")"]}},{"id":"w-leap","region":"decisions","order":9,"title":"Leap Year","story":"The village calendar needs to know whether a year has 366 days.","goal":"Read a year. Print leap if it is divisible by 4, except century years, unless divisible by 400. Otherwise print not leap.","type":"write-code","starter":"year = int(input())\n# 1900 is not a leap year, 2000 is, 2024 is\n","tests":[{"kind":"stdout","label":"2024","expect":"leap","stdin":["2024"]},{"kind":"stdout","label":"1900","expect":"not leap","stdin":["1900"]},{"kind":"stdout","label":"2000","expect":"leap","stdin":["2000"]},{"kind":"stdout","label":"2023","expect":"not leap","stdin":["2023"],"hidden":true}],"hints":["Write the rule in three parts: divisible by 4, not by 100, or by 400.","Combine them: divisible by 4 and (not by 100 or by 400).","year = int(input())\nleap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)\nprint(\"leap\" if leap else \"not leap\")\n"],"socratic":["Is 1900 divisible by 4? Should it be a leap year?","Which year is the exception to the exception?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Leap Year”?","xp":30,"skills":["and/or","modulo"],"requires":["o-grade"],"solution":"year = int(input())\nleap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)\nprint(\"leap\" if leap else \"not leap\")\n","alt":"year = int(input())\nif year % 400 == 0:\n    print(\"leap\")\nelif year % 100 == 0:\n    print(\"not leap\")\nelif year % 4 == 0:\n    print(\"leap\")\nelse:\n    print(\"not leap\")\n","clean":{"label":"Fit it in 4 lines or fewer (combine conditions with and/or)","tests":[{"kind":"maxlines","max":4,"label":"4 lines or fewer"}]}},{"id":"f-except","region":"files-errors","order":3,"title":"Fill the Safety Net","story":"Dividing by zero would crash the whole sorting office.","goal":"Print None instead of crashing.","type":"fill","starter":"def divide(a, b):\n    try:\n        return a / b\n    except ___:\n        return None\n\nprint(divide(6, 0))\n","tests":[{"kind":"stdout","label":"Prints None","expect":"None"}],"hints":["Which error does dividing by zero raise?","The name is ZeroDivisionError.","def divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(divide(6, 0))\n"],"socratic":["What error does 6 / 0 raise?","Why catch a specific error instead of everything?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Safety Net”?","xp":20,"skills":["try/except"],"requires":["w-safe-int"],"solution":"def divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(divide(6, 0))\n"},{"id":"fe-boss","region":"files-errors","order":11,"title":"Boss: The Crashing Counter","story":"A number-adding script crashes on blank lines and on missing files, and leaves the file open. Find all the bugs.","goal":"Fix read_numbers(path): sum the whole numbers in the file, ignore blank lines, and return 0 if the file does not exist.","type":"fix-the-bug","starter":"def read_numbers(path):\n    f = open(path)\n    nums = []\n    for line in f:\n        nums.append(int(line))\n    return sum(nums)\n","tests":[{"kind":"eval","label":"Skips blank lines","expr":"(open(\"n.txt\", \"w\").write(\"1\\n\\n2\\n\"), read_numbers(\"n.txt\"))[1]","expect":"3"},{"kind":"eval","label":"Missing file gives 0","expr":"read_numbers(\"missing.txt\")","expect":"0"},{"kind":"eval","label":"Plain file","expr":"(open(\"n3.txt\", \"w\").write(\"5\\n6\"), read_numbers(\"n3.txt\"))[1]","expect":"11","hidden":true}],"hints":["Which line crashes on an empty line? What does int(\"\\n\") do?","A missing file raises FileNotFoundError. Also prefer with open(...) so the file closes itself.","def read_numbers(path):\n    try:\n        with open(path) as f:\n            return sum(int(line) for line in f if line.strip())\n    except FileNotFoundError:\n        return 0\n"],"socratic":["What does int of a blank line do?","What does open do when the file is missing?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":65,"skills":["debugging","files","try/except"],"requires":["proj-expenses"],"solution":"def read_numbers(path):\n    try:\n        with open(path) as f:\n            return sum(int(line) for line in f if line.strip())\n    except FileNotFoundError:\n        return 0\n","alt":"def read_numbers(path):\n    nums = []\n    try:\n        with open(path) as f:\n            for line in f:\n                if line.strip() == \"\":\n                    continue\n                nums.append(int(line))\n    except FileNotFoundError:\n        return 0\n    return sum(nums)\n","boss":true},{"id":"p-finally","region":"files-errors","order":5,"title":"Always Cleanup","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def f():\n    try:\n        return \"try\"\n    finally:\n        print(\"cleanup\")\nprint(f())","options":["cleanup\ntry","try\ncleanup","try","cleanup"],"answer":0,"why":"finally always runs, even when the function is returning. The print inside finally happens first, then the returned text prints.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","When does the outer print receive the value?","The output is:\ncleanup\ntry"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["try/except","finally"],"requires":["w-write-read"],"solution":"cleanup\ntry"},{"id":"p-try","region":"files-errors","order":1,"title":"Catch the Crash","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"try:\n    pr
