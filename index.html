tock?","When must remove refuse?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Shop Inventory”?","xp":70,"skills":["classes","dicts","raise"],"requires":["o-class-order"],"solution":"class Inventory:\n    def __init__(self):\n        self.stock = {}\n\n    def add(self, item, qty=1):\n        self.stock[item] = self.stock.get(item, 0) + qty\n\n    def remove(self, item, qty=1):\n        if self.stock.get(item, 0) < qty:\n            raise ValueError(\"not enough \" + item)\n        self.stock[item] -= qty\n\n    def report(self):\n        return [f\"{k}: {v}\" for k, v in sorted(self.stock.items()) if v > 0]\n","alt":"class Inventory:\n    def __init__(self):\n        self.stock = {}\n\n    def add(self, item, qty=1):\n        if item in self.stock:\n            self.stock[item] += qty\n        else:\n            self.stock[item] = qty\n\n    def remove(self, item, qty=1):\n        have = self.stock.get(item, 0)\n        if qty > have:\n            raise ValueError(f\"only {have} of {item}\")\n        self.stock[item] = have - qty\n\n    def report(self):\n        lines = []\n        for name in sorted(self.stock):\n            if self.stock[name] > 0:\n                lines.append(name + \": \" + str(self.stock[name]))\n        return lines\n","project":true},{"id":"w-account","region":"objects","order":5,"title":"Piggy Bank","story":"The guild hall's piggy bank must never go below zero and never accept silly deposits.","goal":"Write class Account(balance=0) with deposit(amount) and withdraw(amount). Deposits must be positive. Withdrawals cannot exceed the balance. Both raise ValueError when refused.","type":"write-code","starter":"# define class Account\n","tests":[{"kind":"eval","label":"Starting balance","expr":"Account(100).balance","expect":"100"},{"kind":"eval","label":"Deposit and withdraw","expr":"(lambda a: (a.deposit(50), a.withdraw(20), a.balance))(Account())[2]","expect":"30"},{"kind":"raises","label":"Negative deposit refused","expr":"Account().deposit(-5)","exc":"ValueError"},{"kind":"raises","label":"Overdraft refused","expr":"Account(10).withdraw(50)","exc":"ValueError"},{"kind":"eval","label":"Can empty the account","expr":"(lambda a: (a.withdraw(5), a.balance))(Account(5))[1]","expect":"0","hidden":true}],"hints":["Store the balance on self. Each method checks the rule first, then changes self.balance.","Use raise ValueError(...) when the rule is broken.","class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"deposit must be positive\")\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n"],"socratic":["Which rule belongs to deposit, and which to withdraw?","What should happen when a rule is broken?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Piggy Bank”?","xp":30,"skills":["classes","raise"],"requires":["p-shared"],"solution":"class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"deposit must be positive\")\n        self.balance += amount\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n","alt":"class Account:\n    def __init__(self, balance=0):\n        self.balance = balance\n\n    def deposit(self, amount):\n        if not amount > 0:\n            raise ValueError(f\"bad amount {amount}\")\n        self.balance = self.balance + amount\n\n    def withdraw(self, amount):\n        if self.balance - amount < 0:\n            raise ValueError(\"cannot go below zero\")\n        self.balance = self.balance - amount\n"},{"id":"w-class-basic","region":"objects","order":2,"title":"Parrot Class","story":"Chilaka wants to be an object: a parrot with a name that can learn words.","goal":"Write class Parrot with __init__(self, name), teach(word) to remember a word and speak() returning the words joined by comma and space.","type":"write-code","starter":"# define class Parrot\n","tests":[{"kind":"eval","label":"Learns words","expr":"(lambda p: (p.teach(\"hi\"), p.teach(\"aata\"), p.speak())[2])(Parrot(\"Chilaka\"))","expect":"'hi, aata'"},{"kind":"eval","label":"Silent at first","expr":"Parrot(\"Mynah\").speak()","expect":"''"},{"kind":"eval","label":"Keeps its name","expr":"Parrot(\"x\").name","expect":"'x'"},{"kind":"eval","label":"Parrots do not share words","expr":"(lambda a, b: (a.teach(\"x\"), b.speak())[1])(Parrot(\"a\"), Parrot(\"b\"))","expect":"''","hidden":true}],"hints":["In __init__ create self.name and an empty list self.words.","teach appends to self.words. speak joins them with \", \".join(...).","class Parrot:\n    def __init__(self, name):\n        self.name = name\n        self.words = []\n\n    def teach(self, word):\n        self.words.append(word)\n\n    def speak(self):\n        return \", \".join(self.words)\n"],"socratic":["Which data does each parrot need of its own?","Why must the words list be created inside __init__?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Parrot Class”?","xp":30,"skills":["classes"],"requires":["p-class"],"solution":"class Parrot:\n    def __init__(self, name):\n        self.name = name\n        self.words = []\n\n    def teach(self, word):\n        self.words.append(word)\n\n    def speak(self):\n        return \", \".join(self.words)\n","alt":"class Parrot:\n    def __init__(self, name, words=None):\n        self.name = name\n        self.words = words or []\n\n    def teach(self, word):\n        self.words = self.words + [word]\n\n    def speak(self):\n        return \", \".join(self.words)\n"},{"id":"w-dunder","region":"objects","order":8,"title":"Pretty Points","story":"The guild hall plots points on a map. Make them print nicely, compare, and add.","goal":"Write class Point(x, y) with __repr__ (like Point(1, 2)), __eq__ and __add__ (adds coordinates, returns a new Point).","type":"write-code","starter":"# define class Point\n","tests":[{"kind":"eval","label":"Readable repr","expr":"repr(Point(1, 2))","expect":"'Point(1, 2)'"},{"kind":"eval","label":"Equal points","expr":"Point(1, 2) == Point(1, 2)","expect":"True"},{"kind":"eval","label":"Different points","expr":"Point(1, 2) == Point(2, 1)","expect":"False"},{"kind":"eval","label":"Adding","expr":"Point(1, 2) + Point(3, 4) == Point(4, 6)","expect":"True","hidden":true}],"hints":["Special methods have double underscores on both sides. Python calls them for you.","__repr__ returns a string. __eq__(self, other) compares fields. __add__ returns a new Point.","class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n"],"socratic":["When does Python call __repr__?","What should __add__ return?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Pretty Points”?","xp":45,"skills":["dunder methods","classes"],"requires":["w-inherit"],"solution":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n","alt":"class Point:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n\n    def __repr__(self):\n        return \"Point(\" + str(self.x) + \", \" + str(self.y) + \")\"\n\n    def __eq__(self, other):\n        return isinstance(other, Point) and (self.x, self.y) == (other.x, other.y)\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n"},{"id":"w-inherit","region":"objects","order":7,"title":"Pet Family","story":"The guild hall keeps pets. They share a base, but each speaks differently.","goal":"Add class Dog and class Cat that inherit from Animal. Dog.speak() returns Woof and Cat.speak() returns Meow. Animal.speak() stays ...","type":"write-code","starter":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n# add Dog and Cat\n","tests":[{"kind":"eval","label":"Dog speaks","expr":"Dog(\"rex\").speak()","expect":"'Woof'"},{"kind":"eval","label":"Cat speaks","expr":"Cat(\"tom\").speak()","expect":"'Meow'"},{"kind":"eval","label":"Animal stays quiet","expr":"Animal(\"x\").speak()","expect":"'...'"},{"kind":"eval","label":"Dog is an Animal","expr":"isinstance(Dog(\"a\"), Animal)","expect":"True"},{"kind":"eval","label":"Name is inherited","expr":"Dog(\"rex\").name","expect":"'rex'","hidden":true}],"hints":["class Dog(Animal): makes Dog a child of Animal. Override the method you want to change.","Do not rewrite __init__: the child inherits it.","class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"\n"],"socratic":["What goes in the brackets after the class name?","Which parts do the children not need to rewrite?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Pet Family”?","xp":30,"skills":["inheritance"],"requires":["p-super"],"solution":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"\n","alt":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n\nclass Dog(Animal):\n    sound = \"Woof\"\n\n    def speak(self):\n        return self.sound\n\n\nclass Cat(Animal):\n    sound = \"Meow\"\n\n    def speak(self):\n        return self.sound\n"},{"id":"f-sort","region":"problem-solving","order":4,"title":"Fill the Bubble Sort","story":"Bubble sort swaps neighbours that are in the wrong order until everything is sorted.","goal":"Print the list sorted from smallest to largest.","type":"fill","starter":"nums = [5, 2, 9, 1]\nfor i in range(len(nums)):\n    for j in range(len(nums) - 1 - i):\n        if nums[j] ___ nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint(nums)\n","tests":[{"kind":"stdout","label":"Sorted","expect":"[1, 2, 5, 9]"}],"hints":["Swap when the left neighbour is bigger than the right one.","Use the > comparison.","nums = [5, 2, 9, 1]\nfor i in range(len(nums)):\n    for j in range(len(nums) - 1 - i):\n        if nums[j] > nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint(nums)\n"],"socratic":["When are two neighbours in the wrong order?","What happens if you use < instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Bubble Sort”?","xp":20,"skills":["sorting"],"requires":["w-binary"],"solution":"nums = [5, 2, 9, 1]\nfor i in range(len(nums)):\n    for j in range(len(nums) - 1 - i):\n        if nums[j] > nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint(nums)\n"},{"id":"o-two-pointer","region":"problem-solving","order":8,"title":"Order the Two Pointers","story":"Check a palindrome with two markers moving toward the middle. The lines are shuffled.","goal":"Put the lines in order so the program prints True.","type":"order","starter":"ok = True\n    if word[left] != word[right]:\n    left += 1\n    right -= 1\n        ok = False\nwhile left < right:\nprint(ok)\nword = \"level\"\nleft, right = 0, len(word) - 1\n","lines":["ok = True","    if word[left] != word[right]:","    left += 1","    right -= 1","        ok = False","while left < right:","print(ok)","word = \"level\"","left, right = 0, len(word) - 1"],"tests":[{"kind":"stdout","label":"Prints True","expect":"True"}],"hints":["Set up the variables first, loop in the middle, print at the end.","Both markers move inside the loop, after the comparison.","word = \"level\"\nleft, right = 0, len(word) - 1\nok = True\nwhile left < right:\n    if word[left] != word[right]:\n        ok = False\n    left += 1\n    right -= 1\nprint(ok)\n"],"socratic":["What must exist before the loop starts?","Which lines are inside the loop?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["two pointers","order"],"requires":["w-anagram"],"solution":"word = \"level\"\nleft, right = 0, len(word) - 1\nok = True\nwhile left < right:\n    if word[left] != word[right]:\n        ok = False\n    left += 1\n    right -= 1\nprint(ok)\n"},{"id":"p-big-o","region":"problem-solving","order":1,"title":"Count the Steps","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"steps = 0\nfor i in range(4):\n    for j in range(3):\n        steps += 1\nprint(steps)","options":["7","3","12","4"],"answer":2,"why":"The inner loop runs 3 times for each of the 4 outer rounds: 4 x 3 = 12. Nested loops multiply work, which is why they get slow.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","How many times does the inner loop run in total?","The output is:\n12"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["complexity"],"requires":["cc-boss"],"solution":"12"},{"id":"p-recursion-trace","region":"problem-solving","order":5,"title":"Trace the Recursion","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def f(n):\n    if n == 0:\n        return 0\n    return n + f(n - 1)\nprint(f(4))","options":["4","24","10","0"],"answer":2,"why":"f(4) = 4 + f(3) = 4 + 3 + f(2) = ... = 4 + 3 + 2 + 1 + 0 = 10. Each call waits for the smaller one to finish.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Write out f(4), f(3), f(2), f(1), f(0) in a column.","The output is:\n10"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["recursion"],"requires":["f-sort"],"solution":"10"},{"id":"proj-maze","region":"problem-solving","order":9,"title":"Project: Maze Walker","story":"The maze garden is a grid. S is where you start, E is the exit, # is a hedge. Is there a way out?","goal":"Write solvable(grid) for a list of strings. Move up, down, left or right through any cell that is not #. Return True if E can be reached from S.","type":"write-code","starter":"# define solvable (a queue or a stack both work)\n","tests":[{"kind":"eval","label":"Straight corridor","expr":"solvable([\"S.E\"])","expect":"True"},{"kind":"eval","label":"Blocked","expr":"solvable([\"S#E\"])","expect":"False"},{"kind":"eval","label":"Winding path","expr":"solvable([\"S.#\", \"..#\", \"#.E\"])","expect":"True"},{"kind":"eval","label":"No way out","expr":"solvable([\"S.#\", \"##.\", \".#E\"])","expect":"False"},{"kind":"eval","label":"Big open garden","expr":"solvable([\"S\" + \".\" * 29] + [\".\" * 30] * 28 + [\".\" * 29 + \"E\"])","expect":"True","hidden":true}],"hints":["Explore from S, remembering which cells you have visited so you never go in circles.","Keep a queue of cells to explore. Take one, add its unvisited open neighbours, repeat. If you reach E, return True; if the queue empties, return False.","from collections import deque\n\n\ndef solvable(grid):\n    rows, cols = len(grid), len(grid[0])\n    start = None\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"S\":\n                start = (r, c)\n    queue = deque([start])\n    seen = {start}\n    while queue:\n        r, c = queue.popleft()\n        if grid[r][c] == \"E\":\n            return True\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                queue.append((nr, nc))\n    return False\n"],"socratic":["How do you avoid walking in circles?","When can you be sure there is no way out?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Maze Walker”?","xp":80,"skills":["BFS","grids"],"requires":["o-two-pointer"],"solution":"from collections import deque\n\n\ndef solvable(grid):\n    rows, cols = len(grid), len(grid[0])\n    start = None\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"S\":\n                start = (r, c)\n    queue = deque([start])\n    seen = {start}\n    while queue:\n        r, c = queue.popleft()\n        if grid[r][c] == \"E\":\n            return True\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                queue.append((nr, nc))\n    return False\n","alt":"def solvable(grid):\n    rows, cols = len(grid), len(grid[0])\n    stack = [(r, c) for r in range(rows) for c in range(cols) if grid[r][c] == \"S\"]\n    seen = set(stack)\n    while stack:\n        r, c = stack.pop()\n        if grid[r][c] == \"E\":\n            return True\n        for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                stack.append((nr, nc))\n    return False\n","project":true},{"id":"ps-boss","region":"problem-solving","order":10,"title":"Boss: The Endless Search","story":"This binary search sometimes loops forever and sometimes misses an item that is really there.","goal":"Fix binary_search so it finds every item and always stops.","type":"fix-the-bug","starter":"def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low < high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            low = mid\n        else:\n            high = mid - 1\n    return -1\n","tests":[{"kind":"eval","label":"Found at the end","expr":"binary_search([1, 3, 5, 7], 7)","expect":"3"},{"kind":"eval","label":"Single item","expr":"binary_search([1], 1)","expect":"0"},{"kind":"eval","label":"Missing","expr":"binary_search([1, 3], 4)","expect":"-1"},{"kind":"eval","label":"Found at the start","expr":"binary_search([1, 3, 5], 1)","expect":"0","hidden":true}],"hints":["Two bugs. One makes the loop stop too early when low and high meet. The other fails to shrink the range, so it can repeat forever.","Use while low <= high, and move low to mid + 1 (not mid).","def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n"],"socratic":["What happens when low and high are the same position?","Does low = mid shrink the range when mid equals low?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":70,"skills":["debugging","search"],"requires":["proj-maze"],"solution":"def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n","alt":"def binary_search(items, target):\n    low, high = 0, len(items)\n    while low < high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid\n    return -1\n","boss":true},{"id":"w-anagram","region":"problem-solving","order":7,"title":"Anagram Check","story":"Two words are anagrams if they use the same letters. The garden gate checks for them.","goal":"Write is_anagram(a, b) ignoring case and spaces.","type":"write-code","starter":"# define is_anagram\n","tests":[{"kind":"eval","label":"Classic","expr":"is_anagram(\"Listen\", \"Silent\")","expect":"True"},{"kind":"eval","label":"Not anagrams","expr":"is_anagram(\"hello\", \"world\")","expect":"False"},{"kind":"eval","label":"Spaces ignored","expr":"is_anagram(\"Dormitory\", \"dirty room\")","expect":"True","hidden":true}],"hints":["Two words are anagrams if their letters, when sorted, are identical.","Clean both words (lowercase, no spaces), then compare sorted(...) of each.","def is_anagram(a, b):\n    return sorted(a.replace(\" \", \"\").lower()) == sorted(b.replace(\" \", \"\").lower())\n"],"socratic":["What is the same about the letters of two anagrams?","What must you ignore?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Anagram Check”?","xp":30,"skills":["sorting","strings"],"requires":["w-two-sum"],"solution":"def is_anagram(a, b):\n    return sorted(a.replace(\" \", \"\").lower()) == sorted(b.replace(\" \", \"\").lower())\n","alt":"from collections import Counter\n\n\ndef is_anagram(a, b):\n    ca = Counter(a.replace(\" \", \"\").lower())\n    cb = Counter(b.replace(\" \", \"\").lower())\n    return ca == cb\n","clean":{"label":"Solve it in 3 lines or fewer","tests":[{"kind":"maxlines","max":3,"label":"3 lines or fewer"}]}},{"id":"w-binary","region":"problem-solving","order":3,"title":"Binary Search","story":"The gate numbers are sorted. Halve the search each time and find a gate among a million in about twenty steps.","goal":"Write binary_search(items, target) for a sorted list: return the index or -1. It must be fast: a hidden check searches half a million items.","type":"write-code","starter":"# define binary_search\n","tests":[{"kind":"eval","label":"Found","expr":"binary_search([1, 3, 5, 7], 5)","expect":"2"},{"kind":"eval","label":"Not found","expr":"binary_search([1, 3, 5, 7], 4)","expect":"-1"},{"kind":"eval","label":"Empty list","expr":"binary_search([], 1)","expect":"-1"},{"kind":"eval","label":"Huge list, fast","expr":"binary_search(list(range(0, 1000000, 2)), 999998)","expect":"499999","hidden":true},{"kind":"source","label":"No .index()","pattern":"\\.index\\(","absent":true}],"hints":["Look at the middle item. If it is too small, throw away the left half. If too big, throw away the right half.","Keep low and high markers. Loop while low <= high and move one marker past mid each time.","def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n"],"socratic":["What do you learn by checking the middle item?","Why must you move a marker past mid, not onto it?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Binary Search”?","xp":55,"skills":["search","complexity"],"requires":["w-linear"],"solution":"def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n","alt":"def binary_search(items, target):\n    lo, hi = 0, len(items)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if items[mid] < target:\n            lo = mid + 1\n        elif items[mid] > target:\n            hi = mid\n        else:\n            return mid\n    return -1\n"},{"id":"w-linear","region":"problem-solving","order":2,"title":"Find It","story":"The maze garden hides a gate number in a long list. Search it yourself, without shortcuts.","goal":"Write find_index(items, target) returning the position of the first match, or -1. Do not use .index().","type":"write-code","starter":"# define find_index\n","tests":[{"kind":"eval","label":"Found","expr":"find_index([5, 7, 9], 9)","expect":"2"},{"kind":"eval","label":"Not found","expr":"find_index([5, 7, 9], 4)","expect":"-1"},{"kind":"eval","label":"First match wins","expr":"find_index([1, 2, 2], 2)","expect":"1","hidden":true},{"kind":"source","label":"No .index()","pattern":"\\.index\\(","absent":true}],"hints":["Walk the list from the start and compare each item.","enumerate(items) gives (position, value) pairs.","def find_index(items, target):\n    for i, item in enumerate(items):\n        if item == target:\n            return i\n    return -1\n"],"socratic":["What should you return when you reach the end?","Which loop gives you the position and the value?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Find It”?","xp":30,"skills":["search"],"requires":["p-big-o"],"solution":"def find_index(items, target):\n    for i, item in enumerate(items):\n        if item == target:\n            return i\n    return -1\n","alt":"def find_index(items, target):\n    i = 0\n    while i < len(items):\n        if items[i] == target:\n            return i\n        i += 1\n    return -1\n"},{"id":"w-two-sum","region":"problem-solving","order":6,"title":"Two Sum","story":"Two garden stones add up to the magic number. Which two?","goal":"Write two_sum(nums, target) returning a tuple (i, j) with i < j and nums[i] + nums[j] == target, or None if none exist.","type":"write-code","starter":"# define two_sum\n","tests":[{"kind":"eval","label":"Classic","expr":"two_sum([2, 7, 11, 15], 9)","expect":"(0, 1)"},{"kind":"eval","label":"Not the first item","expr":"two_sum([3, 2, 4], 6)","expect":"(1, 2)"},{"kind":"eval","label":"Same value twice","expr":"two_sum([3, 3], 6)","expect":"(0, 1)"},{"kind":"eval","label":"No answer","expr":"two_sum([1, 2], 10) is None","expect":"True","hidden":true}],"hints":["A slow way checks every pair. Can you remember earlier numbers in a dictionary instead?","For each number, ask: have I already seen target - number? Store number -> position as you go.","def two_sum(nums, target):\n    seen = {}\n    for j, n in enumerate(nums):\n        if target - n in seen:\n            return (seen[target - n], j)\n        seen[n] = j\n    return None\n"],"socratic":["What partner would the current number need?","How can a dictionary answer 'have I seen it?' quickly?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Two Sum”?","xp":50,"skills":["dicts","search"],"requires":["p-recursion-trace"],"solution":"def two_sum(nums, target):\n    seen = {}\n    for j, n in enumerate(nums):\n        if target - n in seen:\n            return (seen[target - n], j)\n        seen[n] = j\n    return None\n","alt":"def two_sum(nums, target):\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            if nums[i] + nums[j] == target:\n                return (i, j)\n    return None\n","clean":{"label":"One pass: use a single loop (no nested loop)","tests":[{"kind":"source","label":"Only one for loop","pattern":"\\bfor\\b[\\s\\S]*\\bfor\\b","absent":true}]}},{"id":"f-argparse","region":"real-world","order":4,"title":"Fill the Command Line","story":"Real tools take options from the command line. Pretend the user typed --name Asha.","goal":"Print Hello, Asha","type":"fill","starter":"import argparse\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", default=\"world\")\nargs = parser.parse_args(___)\nprint(\"Hello, \" + args.name)\n","tests":[{"kind":"stdout","label":"Prints the greeting","expect":"Hello, Asha"}],"hints":["parse_args takes a list of the words the user typed.","The list is [\"--name\", \"Asha\"].","import argparse\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", default=\"world\")\nargs = parser.parse_args([\"--name\", \"Asha\"])\nprint(\"Hello, \" + args.name)\n"],"socratic":["What does parse_args normally read?","How would the user's typing look as a list?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Command Line”?","xp":20,"skills":["argparse"],"requires":["w-regex"],"solution":"import argparse\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", default=\"world\")\nargs = parser.parse_args([\"--name\", \"Asha\"])\nprint(\"Hello, \" + args.name)\n"},{"id":"o-pipeline","region":"real-world","order":8,"title":"Order the Log Pipeline","story":"A tiny pipeline counts the error lines in a log. Put it in order.","goal":"Put the lines in order so the program prints 2.","type":"order","starter":"lines = log.split(\"\\n\")\nlog = \"ok\\nerror a\\nok\\nerror b\"\nerrors = [l for l in lines if l.startswith(\"error\")]\nprint(len(errors))\n","lines":["lines = log.split(\"\\n\")","log = \"ok\\nerror a\\nok\\nerror b\"","errors = [l for l in lines if l.startswith(\"error\")]","print(len(errors))"],"tests":[{"kind":"stdout","label":"Prints 2","expect":"2"}],"hints":["Each line uses the variable made by the line before it.","log first, then lines, then errors, then print.","log = \"ok\\nerror a\\nok\\nerror b\"\nlines = log.split(\"\\n\")\nerrors = [l for l in lines if l.startswith(\"error\")]\nprint(len(errors))\n"],"socratic":["Which variable does lines depend on?","Which line can only run last?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["pipelines","order"],"requires":["w-cli"],"solution":"log = \"ok\\nerror a\\nok\\nerror b\"\nlines = log.split(\"\\n\")\nerrors = [l for l in lines if l.startswith(\"error\")]\nprint(len(errors))\n"},{"id":"p-html","region":"real-world","order":5,"title":"Peek Inside HTML","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"html = \"<ul><li>tea<\/li><li>coffee<\/li><\/ul>\"\nprint(html.count(\"<li>\"), html.split(\"<li>\")[1].split(\"<\/li>\")[0])","options":["2 coffee","1 tea","2 tea","3 tea"],"answer":2,"why":"There are two <li> tags. Splitting on <li> gives pieces; piece number 1 starts with tea<\/li>..., and splitting that on <\/li> leaves tea.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What are the pieces after split(\"<li>\")?","The output is:\n2 tea"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["parsing"],"requires":["f-argparse"],"solution":"2 tea"},{"id":"p-json","region":"real-world","order":1,"title":"Read the Payload","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"import json\ndata = json.loads('{\"name\": \"Asha\", \"tags\": [\"a\", \"b\"]}')\nprint(data[\"name\"], len(data[\"tags\"]))","options":["Asha 1","name 2","Asha 2","Error: KeyError"],"answer":2,"why":"json.loads turns JSON text into Python dicts and lists. data[\"name\"] is Asha, and tags is a list of two items.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What type does json.loads give back?","The output is:\nAsha 2"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["json"],"requires":["ps-boss"],"solution":"Asha 2"},{"id":"proj-log-analyser","region":"real-world","order":9,"title":"Project: Log Analyser","story":"The control room gets logs like the ones you searched in the Debug the Outage missions. Build an analyser the night shift can trust.","goal":"Write analyse(log): a dict with total (non-empty lines), errors (lines starting with ERROR) and top_error (the most common error message, or None if there are no errors). Lines look like LEVEL message.","type":"write-code","starter":"# define analyse\n","tests":[{"kind":"eval","label":"Mixed log","expr":"analyse(\"INFO started\\nERROR disk full\\nWARN slow\\nERROR disk full\\nERROR db down\\n\")","expect":"{'total': 5, 'errors': 3, 'top_error': 'disk full'}"},{"kind":"eval","label":"Empty","expr":"analyse(\"\")","expect":"{'total': 0, 'errors': 0, 'top_error': None}"},{"kind":"eval","label":"No errors","expr":"analyse(\"INFO a\\nINFO b\")","expect":"{'total': 2, 'errors': 0, 'top_error': None}","hidden":true}],"hints":["First keep only the non-empty lines. Then collect the messages of the ERROR lines.","line.split(\" \", 1)[1] is the message after the level. Counter(messages).most_common(1) finds the top one.","from collections import Counter\n\n\ndef analyse(log):\n    lines = [l for l in log.splitlines() if l.strip()]\n    errors = [l.split(\" \", 1)[1] for l in lines if l.startswith(\"ERROR \")]\n    top = Counter(errors).most_common(1)[0][0] if errors else None\n    return {\"total\": len(lines), \"errors\": len(errors), \"top_error\": top}\n"],"socratic":["Which lines count towards total?","How do you find the most common message?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Log Analyser”?","xp":85,"skills":["logs","dicts","Counter"],"requires":["o-pipeline"],"solution":"from collections import Counter\n\n\ndef analyse(log):\n    lines = [l for l in log.splitlines() if l.strip()]\n    errors = [l.split(\" \", 1)[1] for l in lines if l.startswith(\"ERROR \")]\n    top = Counter(errors).most_common(1)[0][0] if errors else None\n    return {\"total\": len(lines), \"errors\": len(errors), \"top_error\": top}\n","alt":"def analyse(log):\n    total = 0\n    counts = {}\n    n_errors = 0\n    for line in log.splitlines():\n        if not line.strip():\n            continue\n        total += 1\n        if line.startswith(\"ERROR \"):\n            n_errors += 1\n            msg = line[6:]\n            counts[msg] = counts.get(msg, 0) + 1\n    top = max(counts, key=counts.get) if counts else None\n    return {\"total\": total, \"errors\": n_errors, \"top_error\": top}\n","project":true},{"id":"rw-boss","region":"real-world","order":10,"title":"Boss: The Wrong Alarm","story":"The health checker raises alarms for redirects (301) and lists the broken services in a random order.","goal":"Fix unhealthy(statuses): a service is healthy for status codes 200 to 399. Return the names of the unhealthy services, sorted alphabetically.","type":"fix-the-bug","starter":"def unhealthy(statuses):\n    bad = []\n    for name, code in statuses.items():\n        if code != 200:\n            bad.append(name)\n    return bad\n","tests":[{"kind":"eval","label":"Redirects are fine, result sorted","expr":"unhealthy({\"web\": 200, \"db\": 500, \"api\": 301, \"cache\": 404})","expect":"['cache', 'db']"},{"kind":"eval","label":"All healthy","expr":"unhealthy({\"web\": 204})","expect":"[]"},{"kind":"eval","label":"Empty","expr":"unhealthy({})","expect":"[]","hidden":true}],"hints":["Which status codes count as healthy? Is 301 one of them?","Healthy is 200 <= code < 400. Also sort the result before returning it.","def unhealthy(statuses):\n    bad = []\n    for name, code in statuses.items():\n        if not 200 <= code < 400:\n            bad.append(name)\n    return sorted(bad)\n"],"socratic":["Which codes are healthy?","Does dictionary order match alphabetical order?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":70,"skills":["debugging","logs"],"requires":["proj-log-analyser"],"solution":"def unhealthy(statuses):\n    bad = []\n    for name, code in statuses.items():\n        if not 200 <= code < 400:\n            bad.append(name)\n    return sorted(bad)\n","alt":"def unhealthy(statuses):\n    return sorted(name for name, code in statuses.items() if code < 200 or code >= 400)\n","boss":true},{"id":"w-api","region":"real-world","order":2,"title":"Read the Weather API","story":"The control room receives weather reports from an API as JSON text. Turn each into a friendly line.","goal":"Write parse_weather(text) for JSON like {\"city\": \"Pune\", \"temp_c\": 31.5, \"rain\": false}. Return Pune: 31.5C, dry (or wet if rain is true; a missing rain key counts as dry).","type":"write-code","starter":"import json\n# define parse_weather\n","tests":[{"kind":"eval","label":"Dry day","expr":"parse_weather('{\"city\": \"Pune\", \"temp_c\": 31.5, \"rain\": false}')","expect":"'Pune: 31.5C, dry'"},{"kind":"eval","label":"Wet day","expr":"parse_weather('{\"city\": \"Goa\", \"temp_c\": 29, \"rain\": true}')","expect":"'Goa: 29C, wet'"},{"kind":"eval","label":"Missing rain key","expr":"parse_weather('{\"city\": \"Leh\", \"temp_c\": 1}')","expect":"'Leh: 1C, dry'","hidden":true}],"hints":["Parse the text with json.loads first. Then pick out the fields from the dict.","data.get(\"rain\", False) returns False when the key is missing.","import json\n\n\ndef parse_weather(text):\n    data = json.loads(text)\n    sky = \"wet\" if data.get(\"rain\", False) else \"dry\"\n    return f\"{data['city']}: {data['temp_c']}C, {sky}\"\n"],"socratic":["What type is the result of json.loads?","How do you read a key that may not exist?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Read the Weather API”?","xp":30,"skills":["json","dicts"],"requires":["p-json"],"solution":"import json\n\n\ndef parse_weather(text):\n    data = json.loads(text)\n    sky = \"wet\" if data.get(\"rain\", False) else \"dry\"\n    return f\"{data['city']}: {data['temp_c']}C, {sky}\"\n","alt":"import json\n\n\ndef parse_weather(text):\n    d = json.loads(text)\n    if d.get(\"rain\"):\n        sky = \"wet\"\n    else:\n        sky = \"dry\"\n    return d[\"city\"] + \": \" + str(d[\"temp_c\"]) + \"C, \" + sky\n"},{"id":"w-cli","region":"real-world","order":7,"title":"Tiny CLI","story":"Build a command-line tool that sums numbers, with an option to double the result.","goal":"Write build_parser() (positional numbers, one or more ints, and a --double flag) and run(argv) returning the sum, doubled if the flag is given.","type":"write-code","starter":"import argparse\n# define build_parser and run\n","tests":[{"kind":"eval","label":"Sum","expr":"run([\"1\", \"2\", \"3\"])","expect":"6"},{"kind":"eval","label":"Doubled","expr":"run([\"--double\", \"1\", \"2\"])","expect":"6"},{"kind":"eval","label":"Single number","expr":"run([\"5\"])","expect":"5","hidden":true}],"hints":["add_argument(\"numbers\", nargs=\"+\", type=int) collects one or more numbers.","add_argument(\"--double\", action=\"store_true\") makes a flag that is True when present.","import argparse\n\n\ndef build_parser():\n    parser = argparse.ArgumentParser(description=\"Add numbers\")\n    parser.add_argument(\"numbers\", nargs=\"+\", type=int)\n    parser.add_argument(\"--double\", action=\"store_true\")\n    return parser\n\n\ndef run(argv):\n    args = build_parser().parse_args(argv)\n    total = sum(args.numbers)\n    return total * 2 if args.double else total\n"],"socratic":["What does nargs=\"+\" mean?","What does store_true give when the flag is absent?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Tiny CLI”?","xp":55,"skills":["argparse"],"requires":["w-scrape"],"solution":"import argparse\n\n\ndef build_parser():\n    parser = argparse.ArgumentParser(description=\"Add numbers\")\n    parser.add_argument(\"numbers\", nargs=\"+\", type=int)\n    parser.add_argument(\"--double\", action=\"store_true\")\n    return parser\n\n\ndef run(argv):\n    args = build_parser().parse_args(argv)\n    total = sum(args.numbers)\n    return total * 2 if args.double else total\n","alt":"import argparse\n\n\ndef build_parser():\n    p = argparse.ArgumentParser()\n    p.add_argument(\"numbers\", type=int, nargs=\"*\")\n    p.add_argument(\"--double\", action=\"store_true\")\n    return p\n\n\ndef run(argv):\n    a = build_parser().parse_args(argv)\n    t = 0\n    for n in a.numbers:\n        t += n\n    if a.double:\n        t = t * 2\n    return t\n"},{"id":"w-regex","region":"real-world","order":3,"title":"Log Hunter","story":"The control room keeps logs as lines like 2024-05-01 10:00:02 ERROR disk full. Count how many lines each level has.","goal":"Write count_levels(log) returning a dict from level (the third word on each line) to how many lines have it. Ignore blank lines.","type":"write-code","starter":"# define count_levels\n","tests":[{"kind":"eval","label":"Counts","expr":"count_levels(\"2024-05-01 10:00:01 INFO ok\\n2024-05-01 10:00:02 ERROR disk full\\n2024-05-01 10:00:03 ERROR db down\\n\")","expect":"{'INFO': 1, 'ERROR': 2}"},{"kind":"eval","label":"Empty log","expr":"count_levels(\"\")","expect":"{}"},{"kind":"eval","label":"Blank lines ignored","expr":"count_levels(\"\\n2024-05-01 10:00:01 WARN slow\\n\\n\")","expect":"{'WARN': 1}","hidden":true}],"hints":["Split the log into lines, then each line into words. The level is the third word.","log.splitlines() gives lines. counts.get(level, 0) + 1 keeps the tally.","def count_levels(log):\n    counts = {}\n    for line in log.splitlines():\n        parts = line.split()\n        if len(parts) >= 3:\n            counts[parts[2]] = counts.get(parts[2], 0) + 1\n    return counts\n"],"socratic":["Which word on each line is the level?","What should happen to a blank line?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Log Hunter”?","xp":30,"skills":["split","dicts","logs"],"requires":["w-api"],"solution":"def count_levels(log):\n    counts = {}\n    for line in log.splitlines():\n        parts = line.split()\n        if len(parts) >= 3:\n            counts[parts[2]] = counts.get(parts[2], 0) + 1\n    return counts\n","alt":"import re\nfrom collections import Counter\n\n\ndef count_levels(log):\n    return dict(Counter(re.findall(r\"^\\S+ \\S+ (\\w+)\", log, re.M)))\n"},{"id":"w-scrape","region":"real-world","order":6,"title":"Price Scraper","story":"A shop page lists prices in HTML. Pull them out as numbers.","goal":"Write prices(html) returning a list of ints found in tags like <span class=\"price\">Rs 120<\/span>, in order.","type":"write-code","starter":"import re\n# define prices\n","tests":[{"kind":"eval","label":"Two prices","expr":"prices('<p>x<\/p><span class=\"price\">Rs 120<\/span><span class=\"price\">Rs 45<\/span>')","expect":"[120, 45]"},{"kind":"eval","label":"No prices","expr":"prices('<p>nothing<\/p>')","expect":"[]"},{"kind":"eval","label":"Ignores other numbers","expr":"prices('<b>Rs 9<\/b><span class=\"price\">Rs 7<\/span>')","expect":"[7]","hidden":true}],"hints":["A regular expression can describe the pattern around the number.","re.findall(r'class=\"price\">Rs (\\d+)<', html) returns the captured digits as strings.","import re\n\n\ndef prices(html):\n    found = re.findall(r'class=\"price\">Rs (\\d+)<', html)\n    return [int(p) for p in found]\n"],"socratic":["What text surrounds each price?","What turns the matched text into a number?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Price Scraper”?","xp":30,"skills":["regex","parsing"],"requires":["p-html"],"solution":"import re\n\n\ndef prices(html):\n    found = re.findall(r'class=\"price\">Rs (\\d+)<', html)\n    return [int(p) for p in found]\n","alt":"import re\n\n\ndef prices(html):\n    result = []\n    for m in re.finditer(r'<span class=\"price\">Rs\\s*(\\d+)<\/span>', html):\n        result.append(int(m.group(1)))\n    return result\n"},{"id":"f-methods","region":"strings","order":5,"title":"Fill the Cleaner","story":"Text copied from a form has stray spaces and mixed capitals.","goal":"Print the cleaned text: hello world","type":"fill","starter":"raw = \"  Hello World  \"\nclean = raw.___().lower()\nprint(clean)\n","tests":[{"kind":"stdout","label":"Cleans the text","expect":"hello world"}],"hints":["Which string method removes spaces from both ends?","The method is strip.","raw = \"  Hello World  \"\nclean = raw.strip().lower()\nprint(clean)\n"],"socratic":["Which characters need removing?","Can you chain two methods on one string?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Cleaner”?","xp":20,"skills":["methods"],"requires":["p-immutable"],"solution":"raw = \"  Hello World  \"\nclean = raw.strip().lower()\nprint(clean)\n"},{"id":"o-initials","region":"strings","order":9,"title":"Order the Initials","story":"Print a person's initials in capitals. The lines are shuffled.","goal":"Put the lines in order: read first and last name, build the initials, print them in capitals.","type":"order","starter":"initials = first[0] + last[0]\nprint(initials.upper())\nlast = input()\nfirst = input()\n","lines":["initials = first[0] + last[0]","print(initials.upper())","last = input()","first = input()"],"tests":[{"kind":"stdout","label":"asha rao","expect":"AR","stdin":["asha","rao"]},{"kind":"stdout","label":"ravi kumar","expect":"RK","stdin":["ravi","kumar"],"hidden":true}],"hints":["initials needs first and last to exist already.","Read both names first, then build, then print.","first = input()\nlast = input()\ninitials = first[0] + last[0]\nprint(initials.upper())\n"],"socratic":["Which lines create variables?","Which line uses them?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["strings","order"],"requires":["w-palindrome"],"solution":"first = input()\nlast = input()\ninitials = first[0] + last[0]\nprint(initials.upper())\n"},{"id":"p-format","region":"strings","order":7,"title":"Format Magic","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"print(f\"{3.14159:.2f}|{7:03d}|{'hi':>4}\")","options":["3.14|7|  hi","3.14|007|  hi","3.1|007|hi","3|007|  hi"],"answer":1,"why":".2f keeps two decimals, 03d pads with zeros to width 3, and >4 right-aligns in a field of width 4.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","After the colon, each code tells Python how to format the value.","The output is:\n3.14|007|  hi"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["f-strings","formatting"],"requires":["w-vowels"],"solution":"3.14|007|  hi"},{"id":"p-immutable","region":"strings","order":4,"title":"Can You Edit a String?","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"word = \"cat\"\nword[0] = \"b\"\nprint(word)","options":["bat","cat","Error: TypeError","bcat"],"answer":2,"why":"Strings are immutable: you cannot change a letter in place. To get \"bat\" you must build a new string.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Can you assign to a single character of a string?","The output is:\nError: TypeError"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["strings","immutability"],"requires":["w-reverse"],"solution":"Error: TypeError"},{"id":"p-index","region":"strings","order":2,"title":"Pick the Letter","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"s = \"python\"\nprint(s[0], s[-1], s[1:3])","options":["p n yth","p n yt","y n yt","p o yt"],"answer":1,"why":"Index 0 is the first letter, -1 is the last. A slice s[1:3] starts at 1 and stops before 3, giving yt.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Count positions from zero. What does -1 mean?","The output is:\np n yt"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["indexing","slicing"],"requires":["w-shout"],"solution":"p n yt"},{"id":"proj-password","region":"strings","order":11,"title":"Project: Password Meter","story":"The post office wants a quick strength meter for new passwords.","goal":"Read a password. Score 1 point each for: 8+ characters, a digit, an uppercase letter, a lowercase letter. 4 points: strong, 2 or 3: medium, otherwise weak.","type":"write-code","starter":"pw = input()\n# score the password and print weak, medium or strong\n","tests":[{"kind":"stdout","label":"abc is weak","expect":"weak","stdin":["abc"]},{"kind":"stdout","label":"abcdefgh1 is medium","expect":"medium","stdin":["abcdefgh1"]},{"kind":"stdout","label":"Abcdefg1 is strong","expect":"strong","stdin":["Abcdefg1"]},{"kind":"stdout","label":"ABC is weak","expect":"weak","stdin":["ABC"]},{"kind":"stdout","label":"12345678 is medium","expect":"medium","stdin":["12345678"],"hidden":true}],"hints":["Keep a score variable and add 1 for each rule that holds. any(...) can check characters.","any(ch.isdigit() for ch in pw) is True when there is a digit. isupper and islower work the same way.","pw = input()\nscore = 0\nif len(pw) >= 8:\n    score += 1\nif any(ch.isdigit() for ch in pw):\n    score += 1\nif any(ch.isupper() for ch in pw):\n    score += 1\nif any(ch.islower() for ch in pw):\n    score += 1\nif score == 4:\n    print(\"strong\")\nelif score >= 2:\n    print(\"medium\")\nelse:\n    print(\"weak\")\n"],"socratic":["Which four rules add points?","How do you check whether any character is a digit?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Password Meter”?","xp":50,"skills":["strings","if","any"],"requires":["w-title-maker"],"solution":"pw = input()\nscore = 0\nif len(pw) >= 8:\n    score += 1\nif any(ch.isdigit() for ch in pw):\n    score += 1\nif any(ch.isupper() for ch in pw):\n    score += 1\nif any(ch.islower() for ch in pw):\n    score += 1\nif score == 4:\n    print(\"strong\")\nelif score >= 2:\n    print(\"medium\")\nelse:\n    print(\"weak\")\n","alt":"pw = input()\nrules = [len(pw) >= 8, any(c.isdigit() for c in pw), any(c.isupper() for c in pw), any(c.islower() for c in pw)]\nscore = sum(rules)\nprint(\"strong\" if score == 4 else \"medium\" if score >= 2 else \"weak\")\n","project":true},{"id":"str-boss","region":"strings","order":12,"title":"Boss: The Jumbled Label","story":"A name label printer is broken. It should print names as Last, First with proper capitals. Find both bugs.","goal":"Fix the program: for input asha rao it must print Rao, Asha.","type":"fix-the-bug","starter":"name = input()\nparts = name.split()\nfirst = parts[0].capitalize()\nlast = parts[1].capitalize\nprint(first + \" \" + last)\n","tests":[{"kind":"stdout","label":"asha rao","expect":"Rao, Asha","stdin":["asha rao"]},{"kind":"stdout","label":"RAVI KUMAR","expect":"Kumar, Ravi","stdin":["RAVI KUMAR"]},{"kind":"stdout","label":"mEEra rEDDY","expect":"Reddy, Meera","stdin":["mEEra rEDDY"],"hidden":true}],"hints":["One method call is missing something that makes it actually run. Compare it with the line above.","After fixing that, check the order and the separator between the two names.","name = input()\nparts = name.split()\nfirst = parts[0].capitalize()\nlast = parts[1].capitalize()\nprint(last + \", \" + first)\n"],"socratic":["What is the difference between last.capitalize and last.capitalize()?","Which part of the output order is wrong?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":55,"skills":["debugging","methods"],"requires":["proj-password"],"solution":"name = input()\nparts = name.split()\nfirst = parts[0].capitalize()\nlast = parts[1].capitalize()\nprint(last + \", \" + first)\n","alt":"first, last = input().split()\nprint(f\"{last.capitalize()}, {first.capitalize()}\")\n","boss":true},{"id":"w-palindrome","region":"strings","order":8,"title":"Palindrome Gate","story":"The temple gate opens only to words that read the same both ways. Spaces and capitals do not count.","goal":"Read a phrase. Print yes if it is a palindrome (ignoring spaces and case), otherwise no.","type":"write-code","starter":"text = input()\n# yes or no\n","tests":[{"kind":"stdout","label":"level","expect":"yes","stdin":["level"]},{"kind":"stdout","label":"Nurses Run","expect":"yes","stdin":["Nurses Run"]},{"kind":"stdout","label":"python","expect":"no","stdin":["python"]},{"kind":"stdout","label":"A man a plan a canal Panama","expect":"yes","stdin":["A man a plan a canal Panama"],"hidden":true}],"hints":["First clean the text: remove spaces and lowercase it. Then compare it with its reverse.","text.replace(\" \", \"\").lower() cleans it; [::-1] reverses.","text = input()\nclean = text.replace(\" \", \"\").lower()\nprint(\"yes\" if clean == clean[::-1] else \"no\")\n"],"socratic":["What should you remove before comparing?","How do you get the reverse of a string?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Palindrome Gate”?","xp":30,"skills":["slicing","methods"],"requires":["p-format"],"solution":"text = input()\nclean = text.replace(\" \", \"\").lower()\nprint(\"yes\" if clean == clean[::-1] else \"no\")\n","alt":"text = input().replace(\" \", \"\").lower()\nif text == text[::-1]:\n    print(\"yes\")\nelse:\n    print(\"no\")\n"},{"id":"w-reverse","region":"strings","order":3,"title":"Reverse Echo","story":"Chilaka's echo repeats your word backwards.","goal":"Read a word and print it reversed.","type":"write-code","starter":"word = input()\n# print it backwards\n","tests":[{"kind":"stdout","label":"parrot","expect":"torrap","stdin":["parrot"]},{"kind":"stdout","label":"a","expect":"a","stdin":["a"]},{"kind":"stdout","label":"Aata","expect":"ataA","stdin":["Aata"],"hidden":true}],"hints":["A slice can have a step: text[start:stop:step]. What step walks backwards?","word[::-1] reads the whole word with a step of -1.","word = input()\nprint(word[::-1])\n"],"socratic":["What does a negative step do in a slice?","Which letter should appear first in the output?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Reverse Echo”?","xp":30,"skills":["slicing"],"requires":["p-index"],"solution":"word = input()\nprint(word[::-1])\n","alt":"word = input()\nrev = \"\"\nfor ch in word:\n    rev = ch + rev\nprint(rev)\n","clean":{"label":"Do it in 2 lines (use slicing, no loop)","tests":[{"kind":"maxlines","max":2,"label":"2 lines or fewer"}]}},{"id":"w-shout","region":"strings","order":1,"title":"Shout It","story":"The market crier announces each word in capitals, along with how long it is.","goal":"Read a word. Print it in capitals, a space, then its length (like ALICE 5).","type":"write-code","starter":"word = input()\n# print the word in capitals and its length\n","tests":[{"kind":"stdout","label":"alice","expect":"ALICE 5","stdin":["alice"]},{"kind":"stdout","label":"Python","expect":"PYTHON 6","stdin":["Python"]},{"kind":"stdout","label":"empty-ish","expect":"A 1","stdin":["a"],"hidden":true}],"hints":["Strings have built-in tools called methods. word.upper() gives the capital version.","len(word) counts the characters. print() can show two things separated by a space.","word = input()\nprint(word.upper(), len(word))\n"],"socratic":["Which method makes capital letters?","Which function counts characters?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Shout It”?","xp":30,"skills":["strings","methods"],"requires":["py-10-bugfix-3"],"solution":"word = input()\nprint(word.upper(), len(word))\n","alt":"word = input()\nprint(word.upper() + \" \" + str(len(word)))\n"},{"id":"w-title-maker","region":"strings","order":10,"title":"Title Maker","story":"The market sign painter capitalises every word on a sign.","goal":"Read a sentence and print it with each word capitalised.","type":"write-code","starter":"sentence = input()\n# capitalise every word\n","tests":[{"kind":"stdout","label":"Three words","expect":"Hello Wide World","stdin":["hello wide world"]},{"kind":"stdout","label":"One word","expect":"Aata","stdin":["aata"]},{"kind":"stdout","label":"Mixed case","expect":"Python Is Fun","stdin":["pYTHON iS fUN"],"hidden":true}],"hints":["Split the sentence into words, fix each word, then join them back with spaces.","words = sentence.split() gives a list. \" \".join(list) glues it back.","sentence = input()\nwords = sentence.split()\nfixed = []\nfor w in words:\n    fixed.append(w.capitalize())\nprint(\" \".join(fixed))\n"],"socratic":["How do you break a sentence into words?","Which method fixes the capitals of one word?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Title Maker”?","xp":30,"skills":["split","join"],"requires":["o-initials"],"solution":"sentence = input()\nwords = sentence.split()\nfixed = []\nfor w in words:\n    fixed.append(w.capitalize())\nprint(\" \".join(fixed))\n","alt":"print(input().title())\n"},{"id":"w-vowels","region":"strings","order":6,"title":"Vowel Counter","story":"A poet wants to know how musical a word is.","goal":"Read a word. Print how many vowels (a, e, i, o, u, any case) it has.","type":"write-code","starter":"word = input()\n# count the vowels\n","tests":[{"kind":"stdout","label":"banana","expect":"3","stdin":["banana"]},{"kind":"stdout","label":"rhythm","expect":"0","stdin":["rhythm"]},{"kind":"stdout","label":"AEIOU","expect":"5","stdin":["AEIOU"],"hidden":true},{"kind":"stdout","label":"Sky","expect":"0","stdin":["Sky"]}],"hints":["Go through each letter with a for loop and keep a counter.","Make the word lowercase first, then check if a letter is in \"aeiou\".","word = input().lower()\ncount = 0\nfor ch in word:\n    if ch in \"aeiou\":\n        count += 1\nprint(count)\n"],"socratic":["How can you look at one letter at a time?","Why lowercase the word first?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Vowel Counter”?","xp":30,"skills":["for","strings","in"],"requires":["f-methods"],"solution":"word = input().lower()\ncount = 0\nfor ch in word:\n    if ch in \"aeiou\":\n        count += 1\nprint(count)\n","alt":"word = input().lower()\nprint(sum(1 for ch in word if ch in \"aeiou\"))\n"}]};</script>
<script>AK.py.setRunnerSource("\"\"\"AataKode Python runner. Runs inside Pyodide in the learner's browser.\n\nLearner code is compiled with the filename \"<mission>\" so the tracer can\n(1) stop infinite loops, (2) record step-through snapshots, and\n(3) ignore everything that is not the learner's own code.\n\"\"\"\nimport sys, io, json, re, builtins\n\n_FN = \"<mission>\"\n\n\nclass _Limit(Exception):\n    pass\n\n\ndef _short(v, n=60):\n    try:\n        r = repr(v)\n    except Exception:\n        r = \"<unprintable>\"\n    return r if len(r) <= n else r[: n - 1] + \"\u2026\"\n\n\ndef _visible(d):\n    res = {}\n    for k, v in list(d.items()):\n        if k.startswith(\"__\") or callable(v) or type(v).__name__ == \"module\":\n            continue\n        res[k] = _short(v)\n    return res\n\n\ndef _norm(s):\n    lines = [l.rstrip() for l in str(s).replace(\"\\r\", \"\").split(\"\\n\")]\n    while lines and lines[-1] == \"\":\n        lines.pop()\n    return \"\\n\".join(lines)\n\n\ndef _exec(code, stdin=None, echo=False, trace=False, limit=150000, max_steps=300):\n    buf = io.StringIO()\n    ns = {\"__name__\": \"__main__\"}\n    queue = list(stdin or [])\n    steps = []\n    count = [0]\n\n    def fake_input(prompt=\"\"):\n        if echo:\n            buf.write(str(prompt))\n        if not queue:\n            raise EOFError(\"input() was called but there is no input left\")\n        v = str(queue.pop(0))\n        if echo:\n            buf.write(v + \"\\n\")\n        return v\n\n    def tracer(frame, event, arg):\n        if frame.f_code.co_filename != _FN:\n            return None\n        if event == \"line\":\n            count[0] += 1\n            if count[0] > limit:\n                raise _Limit()\n            if trace and len(steps) < max_steps:\n                stack = []\n                f = frame\n                while f is not None:\n                    if f.f_code.co_filename == _FN:\n                        name = f.f_code.co_name\n                        stack.append(\"main\" if name == \"<module>\" else name)\n                    f = f.f_back\n                stack.reverse()\n                steps.append({\n                    \"line\": frame.f_lineno,\n                    \"vars\": _visible(frame.f_locals),\n                    \"stack\": stack,\n                    \"out\": len(buf.getvalue()),\n                })\n        return tracer\n\n    err = None\n    old_out, old_in = sys.stdout, builtins.input\n    sys.stdout = buf\n    builtins.input = fake_input\n    try:\n        try:\n            co = compile(code, _FN, \"exec\")\n        except SyntaxError as e:\n            err = {\"type\": type(e).__name__, \"msg\": e.msg, \"line\": e.lineno}\n            co = None\n        if co is not None:\n            sys.settrace(tracer)\n            try:\n                exec(co, ns)\n            finally:\n                sys.settrace(None)\n    except _Limit:\n        err = {\"type\": \"Timeout\", \"msg\": \"ran for too long\", \"line\": None}\n    except BaseException as e:\n        line = None\n        tb = e.__traceback__\n        while tb is not None:\n            if tb.tb_frame.f_code.co_filename == _FN:\n                line = tb.tb_lineno\n            tb = tb.tb_next\n        err = {\"type\": type(e).__name__, \"msg\": str(e), \"line\": line}\n    finally:\n        sys.stdout = old_out\n        builtins.input = old_in\n    return {\"out\": buf.getvalue(), \"err\": err, \"steps\": steps, \"ns\": ns}\n\n\ndef _guarded(fn, limit=150000):\n    count = [0]\n\n    def tr(frame, event, arg):\n        if frame.f_code.co_filename != _FN:\n            return None\n        if event == \"line\":\n            count[0] += 1\n            if count[0] > limit:\n                raise _Limit()\n        return tr\n\n    buf = io.StringIO()\n    old = sys.stdout\n    sys.stdout = buf\n    sys.settrace(tr)\n    try:\n        return fn()\n    finally:\n        sys.settrace(None)\n        sys.stdout = old\n\n\ndef _run(code, stdin_json, trace):\n    r = _exec(code, json.loads(stdin_json), echo=True, trace=bool(trace))\n    return json.dumps({\"out\": r[\"out\"], \"err\": r[\"err\"], \"steps\": r[\"steps\"]})\n\n\ndef _res(t, ok, **extra):\n    d = {\"label\": t.get(\"label\") or t.get(\"kind\"), \"ok\": bool(ok), \"hidden\": bool(t.get(\"hidden\")), \"star\": bool(t.get(\"star\"))}\n    if not t.get(\"hidden\"):\n        d.update({k: v for k, v in extra.items() if v is not None})\n    return d\n\n\ndef _grade(code, tests_json):\n    tests = json.loads(tests_json)\n    results = []\n    base = None\n    for t in tests:\n        k = t[\"kind\"]\n        if k == \"source\":\n            found = re.search(t[\"pattern\"], code) is not None\n            results.append(_res(t, (not found) if t.get(\"absent\") else found))\n        elif k == \"raises\":\n            if base is None:\n                base = _exec(code, [])\n            if base[\"err\"]:\n                results.append(_res(t, False, err=base[\"err\"], expect=t[\"exc\"]))\n                continue\n            try:\n                _guarded(lambda: eval(t[\"expr\"], base[\"ns\"]))\n                results.append(_res(t, False, got=\"no error\", expect=t[\"exc\"], expr=t[\"expr\"]))\n            except _Limit:\n                results.append(_res(t, False, err={\"type\": \"Timeout\", \"msg\": \"ran for too long\", \"line\": None}, expr=t[\"expr\"]))\n            except BaseException as e:\n                results.append(_res(t, type(e).__name__ == t[\"exc\"], got=type(e).__name__, expect=t[\"exc\"], expr=t[\"expr\"]))\n        elif k == \"maxlines\":\n            n = len([l for l in code.split(\"\\n\") if l.strip() and not l.strip().startswith(\"#\")])\n            results.append(_res(t, n <= t[\"max\"], got=str(n), expect=\"at most \" + str(t[\"max\"])))\n        elif k == \"stdout\":\n            r = _exec(code, t.get(\"stdin\") or [])\n            exp = _norm(t[\"expect\"])\n            if r[\"err\"]:\n                results.append(_res(t, False, err=r[\"err\"], got=_norm(r[\"out\"]), expect=exp, stdin=t.get(\"stdin\")))\n            else:\n                got = _norm(r[\"out\"])\n                results.append(_res(t, got == exp, got=got, expect=exp, stdin=t.get(\"stdin\")))\n        elif k == \"eval\":\n            if base is None:\n                base = _exec(code, [])\n            if base[\"err\"]:\n                results.append(_res(t, False, err=base[\"err\"], expect=t[\"expect\"]))\n                continue\n            try:\n                expected = eval(t[\"expect\"], {})\n                value = _guarded(lambda: eval(t[\"expr\"], base[\"ns\"]))\n                results.append(_res(t, value == expected, got=_short(value, 80), expect=_short(expected, 80), expr=t[\"expr\"]))\n            except _Limit:\n                results.append(_res(t, False, err={\"type\": \"Timeout\", \"msg\": \"ran for too long\", \"line\": None}, expr=t[\"expr\"]))\n            except BaseException as e:\n                results.append(_res(t, False, err={\"type\": type(e).__name__, \"msg\": str(e), \"line\": None}, expr=t[\"expr\"]))\n        else:\n            results.append(_res(t, False, got=\"unknown test kind\"))\n    return json.dumps(results)\n");</script>
<script>/* AataKode app: single-page, offline-first. Depends on engine.js (window.AK) and window.AK_DATA. */

  }
  const rankName = (xp) => lt(AK.rankFor(xp).current, "en") && (S.settings.lang === "te" ? AK.rankFor(xp).current.te : AK.rankFor(xp).current.en);
  const weekly = () => AK.featuredOutage(DATA.missions, new Date());

  function nextMissionFor(m) {

  /* ---- home */

  /* ---- mission (shared pieces) */

  function renderTests(m, results) {

  function missionFrame(m, extraRight) {

  VIEWS.mission = function (v, id) {

      const need = (m.requires || []).map((r) => byId[r]).find((x) => x && !S.solved[x.id]);
      v.innerHTML = '<div class="card"><h2>🔒 Locked<\/h2><p>Finish <b>' + esc(need ? need.title : "the previous mission") + '<\/b> first, or use “Test out” on the map to attempt the boss.<\/p><a class="btn primary" href="' + (need ? "#/mission/" + need.id : "#/map") + '">Go there<\/a><\/div>';
      return;
    }

  /* ---- predict-the-output card (used by missions and the Daily Quest) */
  function predictCard(m, opts) {
    const el = document.createElement("div"); el.className = "card predict"; let wrong = 0, finished = false;
    const uid = "p" + Math.random().toString(36).slice(2, 8);
    el.innerHTML = '<b>' + esc(m.title) + '<\/b><pre class="codeview">' + esc(m.code) + '<\/pre><fieldset class="opts"><legend>What does it print?<\/legend>' +
      m.options.map((o, i) => '<label class="opt" data-i="' + i + '"><input type="radio" name="' + uid + '" value="' + i + '"><pre>' + esc(o) + "<\/pre><\/label>").join("") +
      '<\/fieldset><div class="row"><button class="btn good" data-act="check">✔ Check<\/button><\/div><div class="pmsg" aria-live="polite"><\/div>';
    const msg = $(".pmsg", el), labels = $$(".opt", el);
    function reveal() {
      finished = true; labels.forEach((l) => { l.classList.add("lock"); $("input", l).disabled = true; });
      const c = labels[m.answer]; c.classList.add("good"); $("input", c).checked = true; $('[data-act="check"]', el).disabled = true;
      msg.innerHTML = "<b>Why:<\/b> " + esc(m.why);

      else { wrong++; const l = labels[i]; l.classList.add("bad", "lock"); sel.checked = false; sel.disabled = true; msg.textContent = "Not quite. Trace it line by line, or use a hint. That option is crossed out."; if (opts.onWrong) opts.onWrong(); }
    };
    return el;
  }

  function missionPredict(v, m, w) {

    const refresh = () => { const n = count(); $("#dprog").textContent = n + " of 3 done today"; $("#dbar").style.width = Math.round((n / 3) * 100) + "%"; $("#dend").innerHTML = n === 3 ? '<div class="reward stretch" style="margin-top:1rem"><b class="mono">🎉 Daily Quest complete!<\/b><p>Come back tomorrow for a fresh set. Daily quests finished: ' + S.dailyDone + '.<\/p><a class="btn primary" href="#/map">🗺 Back to the map<\/a><\/div>' : ""; };
    set.forEach((m) => {

        },

  /* ---- python-style missions: write-code, fix-the-bug, fill, order */
  const draftArr = (id, n, fallback) => { try { const a = JSON.parse(S.drafts[id]); if (Array.isArray(a) && a.length === n) return a; } catch (e) { /* none */ } return fallback; };
  function buildCodeEditor(m, mid, changed) {
    mid.innerHTML = '<div class="editor"><div class="gutter" id="gutter" aria-hidden="true">1<\/div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code editor. Press Escape then Tab to leave the editor."><\/textarea><\/div>';
    const ta = $("#code"), gut = $("#gutter"); ta.value = S.drafts[m.id] != null ? S.drafts[m.id] : m.starter;
    const sync = () => { const n = ta.value.split("\n").length; gut.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n"); gut.scrollTop = ta.scrollTop; };
    let timer = null;
    ta.addEventListener("input", () => { sync(); changed(); clearTimeout(timer); timer = setTimeout(() => { S.drafts[m.id] = ta.value; save(); }, 400); });
    ta.addEventListener("scroll", () => (gut.scrollTop = ta.scrollTop));
    let escaped = false; ta.addEventListener("focus", () => (escaped = false));
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { escaped = true; return; }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("#runBtn").click(); return; }
      if (e.key === "Tab" && !escaped) { e.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); sync(); changed(); return; }
      if (e.key === "Enter") { e.preventDefault(); const s = ta.selectionStart, line = ta.value.slice(0, s).split("\n").pop(); const indent = line.match(/^ */)[0] + (/:\s*$/.test(line) ? "    " : ""); ta.setRangeText("\n" + indent, s, ta.selectionEnd, "end"); sync(); changed(); }
    });
    sync();
    return { getCode: () => ta.value, reset: () => { ta.value = m.starter; S.drafts[m.id] = m.starter; save(); sync(); changed(); } };
  }
  function buildFill(m, mid, changed) {
    const parts = m.starter.split("___"), n = parts.length - 1; let vals = draftArr(m.id, n, new Array(n).fill(""));
    mid.innerHTML = '<p class="muted">Fill every blank <span class="mono">___<\/span> so the program does what the goal says.<\/p><div class="fill" id="fillbox">' +
      parts.map((p, i) => esc(p) + (i < n ? '<input class="blank" data-i="' + i + '" size="' + Math.max(5, (vals[i] || "").length + 1) + '" value="' + esc(vals[i] || "") + '" aria-label="Blank ' + (i + 1) + ' of ' + n + '" autocomplete="off" autocapitalize="off" spellcheck="false">' : "")).join("") + "<\/div>";
    $$(".blank", mid).forEach((inp) => inp.addEventListener("input", () => { vals[Number(inp.dataset.i)] = inp.value; inp.size = Math.max(5, inp.value.length + 1); S.drafts[m.id] = JSON.stringify(vals); save(); changed(); }));
    return { getCode: () => parts.map((p, i) => p + (i < n ? vals[i] || "" : "")).join(""), reset: () => { vals = new Array(n).fill(""); $$(".blank", mid).forEach((x) => { x.value = ""; x.size = 5; }); S.drafts[m.id] = JSON.stringify(vals); save(); changed(); } };
  }
  function buildOrder(m, mid, changed) {
    let lines = draftArr(m.id, m.lines.length, m.lines.slice()), dragFrom = -1;
    const box = document.createElement("div");
    mid.innerHTML = '<p class="muted">Arrange the lines (drag them, or use the arrow buttons). Indentation shows which lines belong together.<\/p>'; mid.appendChild(box);
    const persist = () => { S.drafts[m.id] = JSON.stringify(lines); save(); changed(); };
    const move = (i, j) => { if (j < 0 || j >= lines.length) return; const x = lines.splice(i, 1)[0]; lines.splice(j, 0, x); persist(); draw(j); };
    function draw(focusIdx, focusDir) {
      box.innerHTML = '<ol class="order">' + lines.map((l, i) => '<li draggable="true" data-i="' + i + '"><span class="grip" aria-hidden="true">⠿<\/span><code>' + esc(l) + '<\/code><span class="mv"><button class="btn small" data-up="' + i + '" aria-label="Move line ' + (i + 1) + ' up">▲<\/button><button class="btn small" data-dn="' + i + '" aria-label="Move line ' + (i + 1) + ' down">▼<\/button><\/span><\/li>').join("") + "<\/ol>";
      $$("[data-up]", box).forEach((b) => (b.onclick = () => move(Number(b.dataset.up), Number(b.dataset.up) - 1)));
      $$("[data-dn]", box).forEach((b) => (b.onclick = () => move(Number(b.dataset.dn), Number(b.dataset.dn) + 1)));
      $$("li", box).forEach((li) => {
        li.addEventListener("dragstart", (e) => { dragFrom = Number(li.dataset.i); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(dragFrom)); } catch (er) { /* old browsers */ } li.classList.add("drag"); });

      });
      if (focusIdx != null) { const b = $((focusDir === "up" ? "[data-up=\"" : "[data-dn=\"") + focusIdx + '"]', box) || $('[data-dn="' + focusIdx + '"]', box); if (b) b.focus(); }
    }
    draw();
    return { getCode: () => lines.join("\n") + "\n", reset: () => { lines = m.lines.slice(); persist(); draw(); } };
  }

  function missionPython(v, m, w) {

  function renderStepper(r, code) {
    const box = $("#stepper"), lines = code.split("\n"), steps = r.steps;
    if (!steps.length) { box.innerHTML = (r.err ? '<div class="err">' + esc(AK.friendlyError(r.err).hint) + "<\/div>" : '<p class="muted">Nothing ran. Write some code first.<\/p>'); return; }
    let i = 0, timer = null;
    box.innerHTML = '<div class="row"><button class="btn small" id="sPrev">◀<\/button><button class="btn small" id="sPlay">▶ Play<\/button><button class="btn small" id="sNext">▶|<\/button><input type="range" id="sRange" min="0" max="' + (steps.length - 1) + '" value="0" aria-label="Step" style="flex:1"><span class="muted mono" id="sLbl"><\/span><\/div><div class="stepcode" id="sCode" style="margin:.5rem 0"><\/div><div class="grid g2" style="gap:.5rem"><div><b>Variables<\/b><table class="vars" id="sVars"><\/table><\/div><div><b>Call stack<\/b><div class="mono" id="sStack"><\/div><b>Output so far<\/b><div class="out" id="sOut" style="min-height:50px"><\/div><\/div><\/div>' +
      (steps.length >= 300 ? '<p class="muted">Showing the first 300 steps.<\/p>' : "") + (r.err ? '<div class="err"><b>' + esc(r.err.type) + "<\/b> at the end: " + esc(AK.friendlyError(r.err).hint) + "<\/div>" : "");
    const draw = () => {
      const s = steps[i]; $("#sLbl").textContent = "step " + (i + 1) + "/" + steps.length; $("#sRange").value = i;
      $("#sCode").innerHTML = lines.map((l, k) => '<div class="' + (k + 1 === s.line ? "cur" : "") + '">' + String(k + 1).padStart(2, " ") + "  " + esc(l || " ") + "<\/div>").join("");
      const cur = $("#sCode .cur"); if (cur) cur.scrollIntoView({ block: "nearest" });
      const names = Object.keys(s.vars); $("#sVars").innerHTML = names.length ? names.map((n) => "<tr><td>" + esc(n) + "<\/td><td>" + esc(s.vars[n]) + "<\/td><\/tr>").join("") : '<tr><td class="muted">no variables yet<\/td><\/tr>';
      $("#sStack").textContent = s.stack.join(" → "); $("#sOut").textContent = (r.out || "").slice(0, s.out);
    };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; $("#sPlay").textContent = "▶ Play"; } };
    $("#sPrev").onclick = () => { stop(); i = Math.max(0, i - 1); draw(); };
    $("#sNext").onclick = () => { stop(); i = Math.min(steps.length - 1, i + 1); draw(); };

    onLeave(stop); draw();
  }
