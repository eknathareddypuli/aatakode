<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AataKode: play your way to code (free, offline-first)</title>
<meta name="description" content="Free, offline-first gamified coding academy. Learn Python and fix broken servers by playing. No sign-up.">
<meta name="theme-color" content="#15123a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{
  --bg:#15123a;--panel:#1f1b52;--panel2:#2a2569;--ink:#f3f0ff;--muted:#b9b3e6;--line:#3d3784;
  --gold:#f2b531;--coral:#ff7a6b;--mint:#4ade9f;--sky:#74c7ff;--on-gold:#1a1744;--code:#100e2e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu","Nirmala UI",sans-serif;
  --shadow:4px 4px 0 rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#fbf6e9;--panel:#ffffff;--panel2:#f3ead0;--ink:#1d1a45;--muted:#58548a;--line:#d6c9a0;
  --gold:#e0a010;--coral:#c9372a;--mint:#0b7d4f;--sky:#1560a8;--on-gold:#1a1744;--code:#fffdf5;
  --shadow:4px 4px 0 rgba(29,26,69,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:var(--mono);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,3.1rem)}h2{font-size:1.5rem}h3{font-size:1.15rem}
a{color:var(--sky)}
code,pre,.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
main{flex:1;padding:1.25rem 0 3rem}
.muted{color:var(--muted)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}

/* header */
.hdr{background:var(--panel);border-bottom:3px solid var(--line);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.5rem;font:800 1.25rem var(--mono);color:var(--ink);text-decoration:none}
.logo b{color:var(--gold)}
.nav{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:.5rem}
.nav a{color:var(--muted);text-decoration:none;padding:.35rem .7rem;border:2px solid transparent;border-radius:6px;font-weight:600}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--panel2)}
.hdr .right{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border:2px solid var(--line);border-radius:999px;background:var(--panel2);font:600 .85rem var(--mono);white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.iconbtn{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:.25rem .55rem;cursor:pointer;font-weight:700}
.iconbtn:hover{border-color:var(--gold)}

/* buttons / cards */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border:2px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .08s}
.btn:hover{transform:translate(-1px,-1px);border-color:var(--gold)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.good{background:var(--mint);color:#06281a;border-color:var(--mint)}
.btn.small{padding:.3rem .65rem;font-size:.9rem;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bar{height:12px;border:2px solid var(--line);border-radius:6px;background:var(--code);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral))}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font:600 .75rem var(--mono)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center;padding:1.5rem 0 2rem}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34rem}
.hero .art{display:grid;place-items:center}
.codepeek{background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.9rem 1rem;font:.9rem/1.5 var(--mono);box-shadow:var(--shadow);overflow:auto}
.kw{color:var(--coral)}.st{color:var(--mint)}.cm{color:var(--muted)}.fn{color:var(--sky)}
@media(max-width:820px){.hero{grid-template-columns:1fr}}

/* map */
.track{margin:1.6rem 0 .6rem}
.region{display:grid;grid-template-columns:230px 1fr;gap:1rem;align-items:center;margin-bottom:.9rem}
.region.locked{opacity:.78}
.nodes{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.node{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--panel2);display:grid;place-items:center;font:800 1.05rem var(--mono);cursor:pointer;position:relative;color:var(--ink)}
.node.open{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,181,49,.25)}
.node.done{background:var(--mint);border-color:var(--mint);color:#06281a}
.node.boss{border-radius:10px;width:62px;height:62px}
.node.locked{cursor:not-allowed;color:var(--muted);border-style:dashed}
.node .star{position:absolute;top:-8px;right:-8px;font-size:1rem}
.link{width:22px;height:4px;background:var(--line)}
.link.done{background:var(--mint)}
@media(max-width:700px){.region{grid-template-columns:1fr}}

/* mission */
.mhead{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.mhead h2{margin:0}
.mgrid{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(320px,1.35fr) minmax(280px,1fr);gap:.9rem;align-items:start}
@media(max-width:1000px){.mgrid{grid-template-columns:1fr}}
.story{border-left:4px solid var(--gold);padding-left:.8rem;margin:.4rem 0 .8rem;color:var(--muted)}
.goal{background:var(--panel2);border:2px dashed var(--gold);border-radius:6px;padding:.5rem .7rem;margin:.5rem 0}
.tests{list-style:none;padding:0;margin:.5rem 0}
.tests li{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.tests .ok{color:var(--mint)}.tests .no{color:var(--coral)}.tests .idle{color:var(--muted)}
.detail{margin:.2rem 0 0 1.5rem;font:.8rem/1.4 var(--mono);color:var(--muted);white-space:pre-wrap}
.hintbox{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:.5rem .7rem;margin:.4rem 0}
.hintbox pre{margin:.3rem 0 0;white-space:pre-wrap}
.editor{display:flex;background:var(--code);border:2px solid var(--line);border-radius:8px;overflow:hidden;min-height:280px}
.gutter{padding:.7rem .5rem;text-align:right;color:var(--muted);font:.92rem/1.55 var(--mono);user-select:none;background:rgba(0,0,0,.18);overflow:hidden;min-width:2.6rem}
.editor textarea{flex:1;border:0;background:transparent;resize:vertical;padding:.7rem;font:.92rem/1.55 var(--mono);min-height:280px;tab-size:4;white-space:pre;overflow:auto;outline:none}
.editor:focus-within{border-color:var(--gold)}
.tabs{display:flex;gap:.25rem;border-bottom:3px solid var(--line);margin-bottom:.6rem;flex-wrap:wrap}
.tabs button{background:none;border:2px solid transparent;border-bottom:0;padding:.35rem .75rem;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.out{background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.6rem .7rem;font:.9rem/1.5 var(--mono);white-space:pre-wrap;min-height:90px;max-height:320px;overflow:auto}
.err{border:2px solid var(--coral);border-radius:6px;padding:.5rem .7rem;margin:.5rem 0;background:rgba(255,122,107,.1)}
.err b{color:var(--coral)}
.input{width:100%;background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.4rem .6rem;font:.9rem var(--mono)}
textarea.input{resize:vertical}
.reward{border:3px solid var(--gold);background:linear-gradient(135deg,var(--panel2),var(--panel));border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
.reward ul{margin:.3rem 0 0;padding-left:1.1rem}
.stepcode{background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.4rem 0;font:.88rem/1.5 var(--mono);overflow:auto;max-height:220px}
.stepcode div{padding:0 .6rem;white-space:pre}
.stepcode .cur{background:rgba(242,181,49,.28);box-shadow:inset 4px 0 var(--gold)}
table.vars{width:100%;border-collapse:collapse;font:.85rem var(--mono)}
table.vars td,table.vars th{border-bottom:1px dashed var(--line);padding:.2rem .4rem;text-align:left}
.blocks .blk{margin:3px 0;padding:.25rem .6rem;border-radius:6px;font:.88rem var(--mono);border-left:6px solid var(--line);background:var(--panel2)}
.blk.say{border-color:var(--sky)}.blk.set{border-color:var(--gold)}.blk.loop{border-color:var(--coral)}.blk.choose{border-color:var(--mint)}.blk.func{border-color:#c79bff}.blk.note{opacity:.7;font-style:italic}
.cmp pre{background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.5rem .7rem;overflow:auto;margin:.3rem 0}
.term{background:#0a0820;color:#d8ffe9;border:2px solid var(--line);border-radius:8px;font:.9rem/1.45 var(--mono);display:flex;flex-direction:column;min-height:340px;max-height:460px}
.term .log{flex:1;overflow:auto;padding:.6rem .7rem;white-space:pre-wrap;word-break:break-word}
.term .log .cmd{color:var(--gold)}
.term form{display:flex;gap:.4rem;border-top:2px solid var(--line);padding:.4rem .6rem;align-items:center}
.term input{flex:1;background:transparent;border:0;color:inherit;font:inherit;outline:none}
.pill{font:600 .78rem var(--mono);padding:.1rem .5rem;border-radius:999px;border:2px solid var(--line)}
.pill.ready{border-color:var(--mint);color:var(--mint)}.pill.load{border-color:var(--gold);color:var(--gold)}.pill.fail{border-color:var(--coral);color:var(--coral)}

/* profile */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.badge{border:2px solid var(--line);border-radius:8px;padding:.6rem;text-align:center;background:var(--panel2)}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge .ico{font-size:1.8rem}
.skillrow{display:grid;grid-template-columns:130px 1fr 28px;gap:.5rem;align-items:center;margin:.25rem 0;font:.85rem var(--mono)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
table.tbl th,table.tbl td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.scroll{overflow:auto}

/* toast + confetti */
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50}
.toast{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:.6rem .9rem;box-shadow:var(--shadow);max-width:320px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.stretch{animation:pop .35s}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){:root[data-motion="auto"] *{animation:none!important;transition:none!important}}
footer{border-top:3px solid var(--line);padding:1rem 0;color:var(--muted);font-size:.9rem}
.gutter{white-space:pre}.sr:focus{position:fixed;left:8px;top:8px;width:auto;height:auto;clip:auto;background:var(--gold,#f2b531);color:#000;padding:.4rem .7rem;z-index:99}

/* v2: new mission types, stars, daily quest, wardrobe */
html{--codeink:var(--ink)}
.editor textarea,.fill,.order code,.codeview,.out,.opt pre{color:var(--codeink)}
[data-editor=contrast]{--code:#000;--codeink:#fff}
[data-editor=turmeric]{--code:#2a1d06;--codeink:#ffd98a}
[data-editor=mint]{--code:#04170f;--codeink:#a7f3d0}
[data-editor=paper]{--code:#fffdf5;--codeink:#222}
.nodes{row-gap:1.4rem}
.node .nstars{position:absolute;bottom:-15px;left:-8px;right:-8px;text-align:center;font:.62rem var(--mono);color:var(--gold);letter-spacing:1px;font-style:normal;pointer-events:none}
.node{font-size:1.25rem}
.village .strip{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.village .place{font-size:1.5rem;filter:grayscale(1) opacity(.4);transition:filter .3s}
.village .place.on{filter:none}
.starrow .idle{color:var(--gold)}
.bigstars{font-size:1.8rem;color:var(--gold);letter-spacing:.2rem}
.codeview{background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.7rem;font:.92rem/1.55 var(--mono);overflow:auto;margin:.6rem 0}
.opts{border:0;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.opts legend{font-weight:700;margin-bottom:.3rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:.45rem .7rem;cursor:pointer;background:var(--panel2)}
.opt pre{margin:0;font:.9rem/1.45 var(--mono);white-space:pre-wrap;background:transparent;border:0;padding:0}
.opt:hover:not(.lock){border-color:var(--gold)}
.opt.good{border-color:var(--mint);background:rgba(74,222,159,.15)}
.opt.bad{border-color:var(--coral);opacity:.6;text-decoration:line-through}
.pmsg{margin-top:.5rem;min-height:1.4em}
.fill{white-space:pre-wrap;font:.95rem/2.1 var(--mono);background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.7rem;overflow:auto}
.blank{font:inherit;color:var(--gold);background:rgba(242,181,49,.12);border:0;border-bottom:2px dashed var(--gold);border-radius:4px;padding:0 .25rem;text-align:center;outline:none;min-width:3.5ch}
.blank:focus{background:rgba(242,181,49,.28)}
.order{list-style:none;margin:.4rem 0;padding:0;display:grid;gap:.35rem}
.order li{display:flex;align-items:center;gap:.5rem;background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.3rem .5rem;cursor:grab}
.order li.drag{opacity:.4}
.order code{flex:1;white-space:pre;font:.9rem var(--mono)}
.order .grip{color:var(--muted)}
.order .mv{display:flex;gap:.25rem}
.wardrobe{display:flex;gap:.6rem;flex-wrap:wrap}
.outfit{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:.5rem;width:110px;text-align:center;cursor:pointer;color:var(--ink);font:.78rem var(--mono)}
.outfit.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,181,49,.3)}
.outfit:disabled{opacity:.45;cursor:not-allowed}
#midpane,#leftpane,#rightpane{min-width:0}
.order li{min-width:0}
.order code{min-width:0;overflow-x:auto}
.fill,.codeview{max-width:100%}
</style>
</head>
<body>
<a href="#view" class="sr" id="skip">Skip to content</a>
<header class="hdr"><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="ftr"><div class="wrap" id="ftr"></div></footer>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem">AataKode needs JavaScript to run missions in your browser.</p></noscript>
<script>/* AataKode engine: shared by the browser app and the lesson verifier (Node).
 * No DOM access in this file. Contents:
 *   1. ranks, badges, dates          4. terminal simulator + grader
 *   2. progress / XP / streak logic  5. Python bridge (Pyodide)
 *   3. friendly errors, blocks view  6. teacher cards
 */
(function (root) {
  "use strict";
  const AK = {};

  /* ---------------------------------------------------------------- 1. ranks, dates */
  AK.RANKS = [
    { xp: 0, en: "Seedling", te: "విత్తు" },
    { xp: 100, en: "Sprout", te: "మొలక" },
    { xp: 300, en: "Sapling", te: "మొక్క" },
    { xp: 700, en: "Branch", te: "కొమ్మ" },
    { xp: 1300, en: "Tree", te: "చెట్టు" },
    { xp: 2200, en: "Forest", te: "వనం" },
    { xp: 3400, en: "Grove", te: "తోపు" },
    { xp: 5000, en: "Banyan", te: "మర్రి" },
  ];

  AK.rankFor = function (xp) {
    let i = 0;
    for (let k = 0; k < AK.RANKS.length; k++) if (xp >= AK.RANKS[k].xp) i = k;
    const cur = AK.RANKS[i], next = AK.RANKS[i + 1] || null;
    const pct = next ? Math.round(((xp - cur.xp) / (next.xp - cur.xp)) * 100) : 100;
    return { index: i, current: cur, next: next, pct: pct };
  };

  AK.dateKey = function (d) {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  };
  function dayNumber(key) {
    const [y, m, d] = key.split("-").map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  }
  AK.daysBetween = function (a, b) { return dayNumber(a) - dayNumber(b); };

  /* Week index counts weeks since 2024-01-01 (a Monday), in the learner's local time. */
  AK.weekIndex = function (d) {
    return Math.floor((dayNumber(AK.dateKey(d)) - dayNumber("2024-01-01")) / 7);
  };
  AK.daysUntilNextWeek = function (d) {
    const since = dayNumber(AK.dateKey(d)) - dayNumber("2024-01-01");
    return 7 - (((since % 7) + 7) % 7);
  };
  AK.featuredOutage = function (missions, d) {
    const ops = missions.filter((m) => m.type === "terminal").sort((a, b) => a.order - b.order);
    if (!ops.length) return null;
    return ops[((AK.weekIndex(d) % ops.length) + ops.length) % ops.length];
  };

  /* ---------------------------------------------------------------- 2. progress */
  AK.newState = function () {
    return {
      v: 1, name: "", classCode: "", xp: 0, solved: {}, drafts: {}, hintLvl: {},
      testOut: {}, explains: {}, votes: {},
      streak: { count: 0, best: 0, last: "", freezes: 0 },
      badges: {}, weekly: {}, askLvl: {},
      dailyXp: 0, dailyDone: 0, daily: { date: "", done: {}, pts: 0, bonus: false },
      settings: { lang: "en", theme: "dark", motion: "auto", socratic: false, outfit: "none", editor: "classic" },
      created: new Date().toISOString(),
    };
  };

  AK.recomputeXp = function (S) {
    let xp = 0;
    for (const id in S.solved) xp += S.solved[id].xp || 0;
    for (const id in S.explains) if (S.explains[id].bonus) xp += 5;
    xp += S.dailyXp || 0;
    S.xp = xp;
    return xp;
  };

  AK.regionMissions = function (data, regionId) {
    return data.missions.filter((m) => m.region === regionId).sort((a, b) => a.order - b.order);
  };

  AK.regionComplete = function (S, data, regionId) {
    const ms = AK.regionMissions(data, regionId);
    if (!ms.length) return false;
    const boss = ms.find((m) => m.boss);
    if (boss) return !!S.solved[boss.id];
    return ms.every((m) => S.solved[m.id]);
  };

  AK.isUnlocked = function (S, data, m, featuredId) {
    if (S.solved[m.id]) return true;
    if ((m.requires || []).every((r) => S.solved[r])) return true;
    if (m.boss && S.testOut[m.region]) return true;
    if (featuredId && m.id === featuredId) return true;
    if (AK.regionComplete(S, data, m.region)) return true;
    return false;
  };

  AK.streakStatus = function (S, now) {
    const st = S.streak, today = AK.dateKey(now);
    if (!st.last) return { count: 0, atRisk: false };
    const gap = AK.daysBetween(today, st.last);
    if (gap <= 0) return { count: st.count, atRisk: false };
    if (gap === 1) return { count: st.count, atRisk: true };
    if (gap === 2 && st.freezes > 0) return { count: st.count, atRisk: true };
    return { count: 0, atRisk: false };
  };

  function touchStreak(S, now) {
    const st = S.streak, today = AK.dateKey(now);
    if (st.last === today) return;
    if (!st.last) st.count = 1;
    else {
      const gap = AK.daysBetween(today, st.last);
      if (gap === 1) st.count += 1;
      else if (gap === 2 && st.freezes > 0) { st.freezes -= 1; st.count += 1; }
      else st.count = 1;
    }
    st.last = today;
    st.best = Math.max(st.best, st.count);

  AK.toBlocks = function (code) {

      else if ((m = t.match(/^for\s+(\w+)\s+in\s+range\((.*)\):$/))) { kind = "loop"; label = "repeat for " + m[1] + " in range(" + m[2] + ")"; }
      else if ((m = t.match(/^for\s+(.+)\s+in\s+(.+):$/))) { kind = "loop"; label = "repeat for each " + m[1] + " in " + m[2]; }
      else if ((m = t.match(/^while\s+(.+):$/))) { kind = "loop"; label = "repeat while " + m[1]; }
      else if ((m = t.match(/^if\s+(.+):$/))) { kind = "choose"; label = "if " + m[1]; }
      else if ((m = t.match(/^elif\s+(.+):$/))) { kind = "choose"; label = "else if " + m[1]; }

      else if ((m = t.match(/^def\s+(\w+)\((.*)\):$/))) { kind = "func"; label = "define " + m[1] + "(" + m[2] + ")"; }

    function ht(a, inp, head) {

      for (let i = 0; i < a.length; i++) { if (a[i] === "-n") { n = Number(a[++i]) || 10; } else rest.push(a[i]); }
      const text = rest.length ? (T.files[abs(rest[0])] || "") : inp || "";
      const ls = lines(text); return (head ? ls.slice(0, n) : ls.slice(-n)).join("\n");
    }
    function procTable(ps) {
      return "USER       PID  %CPU  %MEM  COMMAND\n" + ps.map((p) => pad(p.user || "root", 10) + " " + pad(p.pid, 4) + " " + pad((p.cpu || 0).toFixed(1), 5) + " " + pad((p.mem || 0).toFixed(1), 5) + " " + p.name).join("\n");
    }

    T.exec = function (line) {
      line = String(line).trim();
      if (!line) return { out: "" };
      T.history.push(line);
      if (line === "clear") { T.cmds.push("clear"); return { out: "", clear: true }; }
      const toks = tokenize(line), stages = [[]];
      toks.forEach((t) => { if (t.t === "op" && t.v === "|") stages.push([]); else stages[stages.length - 1].push(t); });
      let data = "";
      for (let i = 0; i < stages.length; i++) {
        const st = stages[i]; let redirect = null; const words = [];
        for (let j = 0; j < st.length; j++) {
          if (st[j].t === "op") { redirect = { mode: st[j].v, file: (st[j + 1] || {}).v }; break; }
          words.push(st[j].v);
        }
        if (!words.length) continue;
        const name = words[0]; T.cmds.push(name);
        const fn = cmds[name];
        data = fn ? fn(words.slice(1), data) : name + ": command not found";
        if (redirect) {
          if (!redirect.file) return { out: "syntax error: missing file after " + redirect.mode };
          const p = abs(redirect.file), add = data + "\n";
          T.files[p] = redirect.mode === ">>" ? (T.files[p] || "") + add : add;
          data = "";
        }
      }
      return { out: data };
    };
    return T;
  };

  const normAns = (s) => String(s == null ? "" : s).trim().toLowerCase().replace(/\/+$/, "");

  AK.gradeTerminal = function (mission, T, answer) {
    return mission.tests.map(function (t) {
      let ok = false;
      switch (t.kind) {
        case "answer": { const exp = [].concat(t.expect).map(normAns); ok = exp.includes(normAns(answer)); break; }
        case "command-used": ok = t.anyOf.some((c) => T.cmds.includes(c)); break;
        case "file-contains": ok = (T.files[t.path] || "").includes(t.text); break;
        case "file-not-contains": ok = t.path in T.files && !(T.files[t.path] || "").includes(t.text); break;
        case "process-gone": ok = !T.procs.some((p) => p.pid === t.pid); break;
        case "process-alive": ok = T.procs.some((p) => p.pid === t.pid); break;
      }
      return { label: t.label || t.note || t.kind, ok: ok, hidden: !!t.hidden };
    });
  };

  AK.runTerminalSolution = function (mission, sol) {
    const T = AK.createTerminal(mission.starter);
    (sol.commands || []).forEach((c) => T.exec(c));
    return { results: AK.gradeTerminal(mission, T, sol.answer || ""), terminal: T };
  };

  /* ---------------------------------------------------------------- 5. Python bridge */
  const PY = { runner: "", fns: null };
  AK.py = {
    setRunnerSource: function (src) { PY.runner = src; },
    init: function (pyodide) {
      pyodide.runPython(PY.runner);
      PY.fns = { run: pyodide.globals.get("_run"), grade: pyodide.globals.get("_grade") };
    },
    run: function (code, stdin, trace) { return JSON.parse(PY.fns.run(code, JSON.stringify(stdin || []), !!trace)); },
    grade: function (code, tests) { return JSON.parse(PY.fns.grade(code, JSON.stringify(tests))); },
  };

  /* ---------------------------------------------------------------- 6. teacher cards */
  const b64 = {
    enc: (s) => (typeof Buffer !== "undefined" ? Buffer.from(s, "utf8").toString("base64") : btoa(unescape(encodeURIComponent(s)))),
    dec: (s) => (typeof Buffer !== "undefined" ? Buffer.from(s, "base64").toString("utf8") : decodeURIComponent(escape(atob(s)))),
  };
  AK.encodeCard = function (S) {
    const card = { v: 1, n: S.name || "", c: S.classCode || "", x: S.xp, s: Object.keys(S.solved), b: Object.keys(S.badges), k: S.streak.count, t: new Date().toISOString() };
    return "AK1:" + b64.enc(JSON.stringify(card));
  };
  AK.decodeCard = function (str) {
    try {
      str = String(str).trim();
      if (!str.startsWith("AK1:")) return null;
      const c = JSON.parse(b64.dec(str.slice(4)));
      if (c.v !== 1 || !Array.isArray(c.s)) return null;
      return c;
    } catch (e) { return null; }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = AK;
  root.AK = AK;
})(typeof self !== "undefined" ? self : globalThis);

Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Stop Repeating Yourself”?","xp":30,"skills":["DRY","functions"],"requires":["p-mutable-arg"],"solution":"def show(name, price):\n    print(name + \": \" + str(price))\n\n\nshow(\"Samosa\", 10)\nshow(\"Tea\", 15)\nshow(\"Laddu\", 25)\n","alt":"def show(name, price):\n    print(f\"{name}: {price}\")\n\n\nfor name, price in [(\"Samosa\", 10), (\"Tea\", 15), (\"Laddu\", 25)]:\n    show(name, price)\n","clean":{"label":"Fit it in 5 lines of code or fewer","tests":[{"kind":"maxlines","max":5,"label":"5 lines or fewer"}]}},{"id":"w-naming","region":"clean-code","order":1,"title":"Name It Well","story":"The tower's old helper is called f and takes a and b. Nobody knows what it does. Rename it so it explains itself.","goal":"Write percent_of(percent, amount) returning that percent of the amount (percent_of(20, 150) is 30.0).","type":"write-code","starter":"def f(a, b):\n    return a / 100 * b\n","tests":[{"kind":"eval","label":"20 percent of 150","expr":"percent_of(20, 150)","expect":"30.0"},{"kind":"eval","label":"50 percent of 80","expr":"percent_of(50, 80)","expect":"40.0"},{"kind":"source","label":"Function is named percent_of","pattern":"def\\s+percent_of\\s*\\("},{"kind":"source","label":"Parameters are named percent and amount","pattern":"def\\s+percent_of\\s*\\(\\s*percent\\s*,\\s*amount\\s*\\)"}],"hints":["Names should say what a thing is. The function name and both parameter names are specified in the goal.","Rename f to percent_of, a to percent and b to amount.","def percent_of(percent, amount):\n    return amount * percent / 100\n"],"socratic":["Could a new reader guess what f does?","What would you call the two inputs?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Name It Well”?","xp":30,"skills":["naming"],"requires":["ob-boss"],"solution":"def percent_of(percent, amount):\n    return amount * percent / 100\n","alt":"def percent_of(percent, amount):\n    fraction = percent / 100\n    return amount * fraction\n"},{"id":"f-dict","region":"collections","order":6,"title":"Fill the Menu","story":"The tea stall keeps prices in a dictionary.","goal":"Add samosa at 30, then print samosa plus the tea price: 40","type":"fill","starter":"prices = {\"tea\": 10, \"coffee\": 20}\nprices[___] = 30\nprint(prices[\"samosa\"] + prices.___(\"tea\"))\n","tests":[{"kind":"stdout","label":"Prints 40","expect":"40"}],"hints":["The first blank is the new key (it needs quotes, it is text).","The second is the dictionary method that looks up a key safely: get.","prices = {\"tea\": 10, \"coffee\": 20}\nprices[\"samosa\"] = 30\nprint(prices[\"samosa\"] + prices.get(\"tea\"))\n"],"socratic":["What goes inside the square brackets when adding a new item?","Which method reads a value without crashing if missing?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Menu”?","xp":20,"skills":["dicts"],"requires":["py-12-dict"],"solution":"prices = {\"tea\": 10, \"coffee\": 20}\nprices[\"samosa\"] = 30\nprint(prices[\"samosa\"] + prices.get(\"tea\"))\n"},{"id":"o-dict-loop","region":"collections","order":11,"title":"Order the Score Total","story":"Add up the scores in a dictionary. The lines are shuffled.","goal":"Put the lines in order so the program prints 145.","type":"order","starter":"scores = {\"Asha\": 80, \"Ravi\": 65}\nfor name in scores:\ntotal = 0\n    total += scores[name]\nprint(total)\n","lines":["scores = {\"Asha\": 80, \"Ravi\": 65}","for name in scores:","total = 0","    total += scores[name]","print(total)"],"tests":[{"kind":"stdout","label":"Prints 145","expect":"145"}],"hints":["Both scores and total must exist before the loop.","The line that adds belongs inside the loop (indented). The print goes after.","scores = {\"Asha\": 80, \"Ravi\": 65}\ntotal = 0\nfor name in scores:\n    total += scores[name]\nprint(total)\n"],"socratic":["What must exist before the loop?","Which line belongs inside the loop?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["dicts","order"],"requires":["p-dict-iter"],"solution":"scores = {\"Asha\": 80, \"Ravi\": 65}\ntotal = 0\nfor name in scores:\n    total += scores[name]\nprint(total)\n"},{"id":"p-alias","region":"collections","order":4,"title":"Two Names, One List","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"a = [1, 2]\nb = a\nb.append(3)\nprint(a)","options":["[1, 2, 3]","[1, 2]","[3]","Error: NameError"],"answer":0,"why":"b = a does not copy the list. Both names point at the same list, so changing it through b changes it for a too.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Did b = a make a new list?","The output is:\n[1, 2, 3]"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["lists","mutability"],"requires":["w-list-ops"],"solution":"[1, 2, 3]"},{"id":"p-dict-iter","region":"collections","order":10,"title":"Loop Over a Dict","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"d = {\"a\": 1, \"b\": 2}\nfor k, v in d.items():\n    d[k] = v * 10\nprint(d)","options":["{'a': 1, 'b': 2}","{'a': 10, 'b': 2}","{'a': 10, 'b': 20}","Error: RuntimeError"],"answer":2,"why":"Changing the values while looping is fine. Only adding or removing keys during a loop causes a RuntimeError.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Is the size of the dictionary changing during the loop?","The output is:\n{'a': 10, 'b': 20}"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["dicts"],"requires":["w-unique"],"solution":"{'a': 10, 'b': 20}"},{"id":"p-list-slice","region":"collections","order":2,"title":"Slice a List","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"nums = [10, 20, 30, 40]\nprint(nums[1:3], nums[-1], len(nums))","options":["[10, 20] 40 4","[20, 30] 40 4","[20, 30, 40] 40 4","[20, 30] 40 3"],"answer":1,"why":"Slices work on lists just like strings. nums[1:3] is items at positions 1 and 2. -1 is the last item, and len counts all four.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Positions start at zero.","The output is:\n[20, 30] 40 4"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["lists","slicing"],"requires":["py-11-lists"],"solution":"[20, 30] 40 4"},{"id":"p-set","region":"collections","order":7,"title":"Sets Forget Repeats","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"s = {1, 2, 2, 3}\nprint(len(s), 2 in s)","options":["4 True","3 False","4 False","3 True"],"answer":3,"why":"A set keeps only one copy of each value, so {1, 2, 2, 3} has three items. 2 in s asks whether 2 is a member.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does a set do with repeated values?","The output is:\n3 True"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["sets"],"requires":["f-dict"],"solution":"3 True"},{"id":"proj-contacts","region":"collections","order":13,"title":"Project: Contact Book","story":"The library desk needs a tiny contact book you can drive with commands.","goal":"Read commands until quit. add NAME PHONE saves a contact. find NAME prints the phone, or not found. Adding the same name again replaces the phone.","type":"write-code","starter":"book = {}\n# read commands until you see quit\n","tests":[{"kind":"stdout","label":"Add and find","expect":"999\nnot found","stdin":["add Asha 999","find Asha","find Ravi","quit"]},{"kind":"stdout","label":"Replace","expect":"222","stdin":["add Meera 111","add Meera 222","find Meera","quit"]},{"kind":"stdout","label":"Nothing but quit","expect":"","stdin":["quit"],"hidden":true}],"hints":["Use a while True loop, break on quit, and split each command into parts.","parts[0] is the command. book.get(name, \"not found\") is a safe lookup.","book = {}\nwhile True:\n    line = input()\n    if line == \"quit\":\n        break\n    parts = line.split()\n    if parts[0] == \"add\":\n        book[parts[1]] = parts[2]\n    elif parts[0] == \"find\":\n        print(book.get(parts[1], \"not found\"))\n"],"socratic":["How does the loop know when to stop?","What should happen when the same name is added twice?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Contact Book”?","xp":55,"skills":["dicts","while","split"],"requires":["w-comprehension"],"solution":"book = {}\nwhile True:\n    line = input()\n    if line == \"quit\":\n        break\n    parts = line.split()\n    if parts[0] == \"add\":\n        book[parts[1]] = parts[2]\n    elif parts[0] == \"find\":\n        print(book.get(parts[1], \"not found\"))\n","alt":"book = {}\nline = input()\nwhile line != \"quit\":\n    cmd, name, *rest = line.split() + [\"\"]\n    if cmd == \"add\":\n        book[name] = rest[0]\n    elif cmd == \"find\":\n        print(book[name] if name in book else \"not found\")\n    line = input()\n","project":true},{"id":"py-11-lists","region":"collections","order":1,"title":"Pack the Bag","story":"An explorer's bag holds a map and a rope. A torch is missing.","goal":"Add \"torch\" to the end of bag, then print how many items it holds and the first item.","type":"write-code","starter":"bag = [\"map\", \"rope\"]\n# add \"torch\" to the end of the bag\n# then print the number of items, then the first item\n","tests":[{"kind":"stdout","label":"Prints count then first item","expect":"3\nmap"},{"kind":"eval","label":"bag is now map, rope, torch","expr":"bag","expect":"['map', 'rope', 'torch']"}],"hints":["Lists have an append method: bag.append(...) adds one item at the end.","len(bag) counts items. The first item is bag[0] because counting starts at zero.","bag.append(\"torch\")\nprint(len(bag))\nprint(bag[0])"],"socratic":["Which list method adds an item to the end?","Which function tells you how many items a list has?","What index is the first item?"],"explain":"In one sentence: why is the first item at index 0?","xp":30,"skills":["lists","indexing"],"requires":["str-boss"],"solution":"bag = [\"map\", \"rope\"]\nbag.append(\"torch\")\nprint(len(bag))\nprint(bag[0])\n","alt":"bag = [\"map\", \"rope\"]\nbag = bag + [\"torch\"]\nprint(len(bag))\nprint(bag[0])\n"},{"id":"py-12-dict","region":"collections","order":5,"title":"Score Board","story":"The scoreboard remembers each player's points. New players are added the first time they score.","goal":"Read a name and points, add the points to that player's score (new players start at 0), then print their new score.","type":"write-code","starter":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\npoints = int(input())\n# update the scoreboard, then print the new score for name\n","tests":[{"kind":"stdout","label":"existing player Asha","expect":"50","stdin":["Asha","10"]},{"kind":"stdout","label":"existing player Ravi","expect":"60","stdin":["Ravi","5"]},{"kind":"stdout","label":"new player Meera","expect":"7","stdin":["Meera","7"]}],"hints":["A dictionary maps keys to values: scores[\"Asha\"] gives Asha's score.","scores.get(name, 0) gives the current score, or 0 if the name is new.","scores[name] = scores.get(name, 0) + points\nprint(scores[name])"],"socratic":["What happens if you read scores[name] for a name that is not there?","Which method gives a default value for a missing key?","How do you store the new total back under the same key?"],"explain":"In one sentence: why use .get() instead of scores[name]?","xp":35,"skills":["dictionaries","get"],"requires":["p-alias"],"solution":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\npoints = int(input())\nscores[name] = scores.get(name, 0) + points\nprint(scores[name])\n","alt":"scores = {\"Asha\": 40, \"Ravi\": 55}\nname = input()\npoints = int(input())\nif name in scores:\n    scores[name] += points\nelse:\n    scores[name] = points\nprint(scores[name])\n"},{"id":"py-13-bugfix-4","region":"collections","order":14,"title":"The Missing Treasure","story":"The treasure list is printed with numbers, but the program crashes at the end and the total is wrong.","goal":"Fix it to print 1 gem, 2 coin, 3 key, then Total: 3.","type":"fix-the-bug","starter":"items = [\"gem\", \"coin\", \"key\"]\nfor i in range(len(items) + 1):\n    print(i + 1, items[i])\nprint(\"Total:\", len(items) - 1)\n","tests":[{"kind":"stdout","label":"Prints the list and total","expect":"1 gem\n2 coin\n3 key\nTotal: 3"},{"kind":"source","label":"Still uses the items list","pattern":"items\\s*=\\s*\\["}],"hints":["Run it and read the error. A list of 3 items has valid positions 0, 1 and 2.","range(len(items) + 1) goes one step too far. Also check how the total is calculated.","items = [\"gem\", \"coin\", \"key\"]\nfor i in range(len(items)):\n    print(i + 1, items[i])\nprint(\"Total:\", len(items))"],"socratic":["What is the largest valid index in a list of 3 items?","How many times should the loop run?","Is the total one less than the number of items?"],"explain":"In one sentence: what is an off-by-one bug?","xp":50,"skills":["debugging","lists","off-by-one"],"requires":["proj-contacts"],"solution":"items = [\"gem\", \"coin\", \"key\"]\nfor i in range(len(items)):\n    print(i + 1, items[i])\nprint(\"Total:\", len(items))\n","alt":"items = [\"gem\", \"coin\", \"key\"]\nfor number, item in enumerate(items, 1):\n    print(number, item)\nprint(\"Total:\", len(items))\n","boss":true},{"id":"w-comprehension","region":"collections","order":12,"title":"Square Machine","story":"The workshop stamps out squares of the even numbers from 1 to 10.","goal":"Create a list called squares with the squares of the even numbers from 1 to 10 (4, 16, 36, 64, 100).","type":"write-code","starter":"# make a list called squares\n","tests":[{"kind":"eval","label":"squares is correct","expr":"squares","expect":"[4, 16, 36, 64, 100]"}],"hints":["A loop with an if could build it. Python also has a one-line shortcut.","A list comprehension looks like [expression for item in items if condition].","squares = []\nfor n in range(1, 11):\n    if n % 2 == 0:\n        squares.append(n * n)\n"],"socratic":["Which numbers pass the filter?","What is done to each number that passes?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Square Machine”?","xp":30,"skills":["comprehensions"],"requires":["o-dict-loop"],"solution":"squares = []\nfor n in range(1, 11):\n    if n % 2 == 0:\n        squares.append(n * n)\n","alt":"squares = [n * n for n in range(1, 11) if n % 2 == 0]\n","clean":{"label":"Use a list comprehension (one line)","tests":[{"kind":"source","label":"Uses a comprehension","pattern":"\\[[^\\]]+\\bfor\\b[^\\]]+\\]"}]}},{"id":"w-list-ops","region":"collections","order":3,"title":"Shopping Basket","story":"Chilaka's basket needs three changes before heading home.","goal":"Starting from basket = [\"rice\", \"dal\"], add \"oil\", remove \"rice\", then sort the list.","type":"write-code","starter":"basket = [\"rice\", \"dal\"]\n# add \"oil\", remove \"rice\", then sort the list\n","tests":[{"kind":"eval","label":"basket is [dal, oil]","expr":"basket","expect":"['dal', 'oil']"},{"kind":"source","label":"Uses append","pattern":"\\.append\\("},{"kind":"source","label":"Uses remove","pattern":"\\.remove\\("}],"hints":["Lists have methods: append adds to the end, remove deletes a value, sort puts items in order.","Do them in order: append(\"oil\"), remove(\"rice\"), sort().","basket = [\"rice\", \"dal\"]\nbasket.append(\"oil\")\nbasket.remove(\"rice\")\nbasket.sort()\n"],"socratic":["Which method adds to the end?","What does sort() do to the list?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Shopping Basket”?","xp":30,"skills":["lists","methods"],"requires":["p-list-slice"],"solution":"basket = [\"rice\", \"dal\"]\nbasket.append(\"oil\")\nbasket.remove(\"rice\")\nbasket.sort()\n","alt":"basket = [\"rice\", \"dal\"]\nbasket.append(\"oil\")\nbasket.remove(\"rice\")\nbasket = sorted(basket)\n"},{"id":"w-unique","region":"collections","order":9,"title":"Remove Duplicates","story":"The registration desk typed some ticket numbers twice.","goal":"Read numbers separated by commas. Print the sorted list of unique numbers, like [1, 2, 3].","type":"write-code","starter":"line = input()\n# unique, sorted, as a list of ints\n","tests":[{"kind":"stdout","label":"3,1,3,2,1","expect":"[1, 2, 3]","stdin":["3,1,3,2,1"]},{"kind":"stdout","label":"5","expect":"[5]","stdin":["5"]},{"kind":"stdout","label":"10,2,10","expect":"[2, 10]","stdin":["10,2,10"],"hidden":true}],"hints":["Split on commas, turn each piece into an int, then use set() to drop duplicates.","sorted(set(numbers)) gives a sorted list of the unique values.","line = input()\nnumbers = [int(x) for x in line.split(\",\")]\nprint(sorted(set(numbers)))\n"],"socratic":["Why convert to int before sorting?","Which collection removes duplicates automatically?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Remove Duplicates”?","xp":30,"skills":["sets","lists"],"requires":["w-word-count"],"solution":"line = input()\nnumbers = [int(x) for x in line.split(\",\")]\nprint(sorted(set(numbers)))\n","alt":"line = input()\nseen = []\nfor x in line.split(\",\"):\n    n = int(x)\n    if n not in seen:\n        seen.append(n)\nseen.sort()\nprint(seen)\n"},{"id":"w-word-count","region":"collections","order":8,"title":"Word Counter","story":"The library counts how often each word appears in a sentence.","goal":"Read a sentence. For each distinct word, in alphabetical order, print word: count.","type":"write-code","starter":"sentence = input()\n# count each word\n","tests":[{"kind":"stdout","label":"a b a","expect":"a: 2\nb: 1","stdin":["a b a"]},{"kind":"stdout","label":"one","expect":"one: 1","stdin":["one"]},{"kind":"stdout","label":"c b a c","expect":"a: 1\nb: 1\nc: 2","stdin":["c b a c"],"hidden":true}],"hints":["A dictionary can map each word to its count. Update the count as you walk through the words.","counts[w] = counts.get(w, 0) + 1 handles the first time a word appears. Loop over sorted(counts) to print.","sentence = input()\ncounts = {}\nfor w in sentence.split():\n    counts[w] = counts.get(w, 0) + 1\nfor w in sorted(counts):\n    print(f\"{w}: {counts[w]}\")\n"],"socratic":["What should the dictionary store for each word?","What happens the first time a word is seen?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Word Counter”?","xp":30,"skills":["dicts","loops"],"requires":["p-set"],"solution":"sentence = input()\ncounts = {}\nfor w in sentence.split():\n    counts[w] = counts.get(w, 0) + 1\nfor w in sorted(counts):\n    print(f\"{w}: {counts[w]}\")\n","alt":"from collections import Counter\nc = Counter(input().split())\nfor w in sorted(c):\n    print(w + \": \" + str(c[w]))\n"},{"id":"linux-01-first-steps","region":"debug-the-outage","title":"The Silent Server","story":"It's 2 a.m. The web service has stopped responding and the on-call phone is ringing. Before you fix anything, you need to see what is going on.","goal":"Find which process is using port 8080 and report its name.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/app.log":"ERROR: cannot bind to port 8080: address already in use\n"},"processes":[{"pid":412,"name":"old-worker","port":8080}]},"tests":[{"kind":"answer","expect":"old-worker","note":"Learner submits the process name","label":"Reported the process name"},{"kind":"command-used","anyOf":["ss","netstat","lsof"],"label":"Used a port-inspection command"}],"hints":["The log tells you the port is already in use. Which command lists listening ports?","Try `ss -ltnp` or `lsof -i :8080` to see the process behind a port.","Run `ss -ltnp | grep 8080`. The process name is old-worker (pid 412)."],"explain":"In one sentence: why did the service fail to start?","xp":20,"skills":["linux","networking","troubleshooting"],"requires":[],"order":1,"socratic":["What does the log line say about port 8080?","Which commands can list what is listening on a port?","Once you see the process, where is its name in the output?"],"solution":{"commands":["cat /var/log/app.log","ss -ltnp | grep 8080"],"answer":"old-worker"},"alt":{"commands":["lsof -i :8080"],"answer":"old-worker"}},{"id":"linux-02-disk-full","region":"debug-the-outage","order":2,"title":"No Space Left","story":"Writes are failing with 'No space left on device'. Something under /var/log has grown out of control.","goal":"Find which directory under /var/log uses the most space and report its path.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/app/app.log":"debug: flushing cache\ndebug: flushing cache\ndebug: flushing cache\n","/var/log/nginx/access.log":"GET / 200\n","/var/log/syslog":"kernel: disk almost full\n"},"disks":[{"fs":"/dev/sda1","size":"20G","used":"20G","avail":"0","pct":"100%","mount":"/"},{"fs":"tmpfs","size":"2.0G","used":"12M","avail":"2.0G","pct":"1%","mount":"/run"}],"sizes":{"/var/log/app":"18G","/var/log/nginx":"140M","/var/log/syslog":"22M"}},"tests":[{"kind":"command-used","anyOf":["df"],"note":"Check which filesystem is full","label":"Check which filesystem is full"},{"kind":"command-used","anyOf":["du"],"note":"Measure the directories","label":"Measure the directories"},{"kind":"answer","expect":"/var/log/app","note":"Learner submits the directory path","label":"Learner submits the directory path"}],"hints":["First confirm the disk really is full. Which command shows filesystem usage in human-readable form?","Use du to measure folders: du -sh /var/log/* shows the size of each entry.","Run df -h, then du -sh /var/log/*. The biggest is /var/log/app at 18G."],"socratic":["Which command tells you how full each filesystem is?","Which command measures how much space a folder uses?","How do you compare several folders at once?"],"explain":"In one sentence: why check df before du?","xp":40,"skills":["linux","disk","troubleshooting"],"requires":[],"solution":{"commands":["df -h","du -sh /var/log/*"],"answer":"/var/log/app"}},{"id":"linux-03-bad-config","region":"debug-the-outage","order":3,"title":"The Crash Loop","story":"The billing service restarts every few seconds. Customers cannot pay. The log hints at a configuration problem.","goal":"Fix /etc/billing/config.yaml so the service reads port: 8080.","type":"terminal","starter":{"cwd":"/home/oncall","files":{"/var/log/billing.log":"ERROR config: unknown key 'prot' in /etc/billing/config.yaml (line 3)\nERROR service exited with code 2\n","/etc/billing/config.yaml":"name: billing\nworkers: 4\nprot: 8080\nlog_level: info\n"}},"tests":[{"kind":"file-contains","path":"/etc/billing/config.yaml","text":"port: 8080","note":"The key is spelled correctly","label":"The key is spelled correctly"},{"kind":"file-not-contains","path":"/etc/billing/config.yaml","text":"prot","note":"The typo is gone","label":"The typo is gone"},{"kind":"file-contains","path":"/etc/billing/config.yaml","text":"workers: 4","note":"Nothing else was lost","label":"Nothing else was lost"}],"hints":["Read the log. It names a file, a line and a key. What does the file say on that line?","The key is misspelled. sed can fix text in a file: sed -i 's/old/new/' file","sed -i 's/prot:/port:/' /etc/billing/config.yaml"],"socratic":["Which file does the log point to?","Which line looks wrong when you read it?","Which command edits text inside a file without opening an editor?"],"explain":"In one sentence: how did the log tell you what was wrong?","xp":40,"skills":["linux","logs","configuration"],"requires":[],"solution":{"commands":["cat /var/log/billing.log","cat /etc/billing/config.yaml","sed -i 's/prot:/port:/' /etc/billing/config.yaml","cat /etc/billing/config.yaml"]},"alt":{"commands":["echo \"name: billing\" > /etc/billing/config.yaml","echo \"workers: 4\" >> /etc/billing/config.yaml","echo \"port: 8080\" >> /etc/billing/config.yaml","echo \"log_level: info\" >> /etc/billing/config.yaml"]}},{"id":"linux-04-runaway","region":"debug-the-outage","order":4,"title":"The Runaway Process","story":"The server is crawling. Pages time out and SSH feels like wading through mud. One process is hogging the CPU.","goal":"Find the process using the most CPU and stop it without touching the others.","type":"terminal","starter":{"cwd":"/home/oncall","files":{},"processes":[{"pid":1,"name":"init","user":"root","cpu":0.0,"mem":0.1},{"pid":233,"name":"nginx","user":"www","cpu":1.2,"mem":2.3,"port":80},{"pid":512,"name":"billing","user":"deploy","cpu":3.4,"mem":8.8},{"pid":777,"name":"data-crunch","user":"deploy","cpu":98.7,"mem":41.0}]},"tests":[{"kind":"command-used","anyOf":["ps","top"],"note":"Inspect the running processes","label":"Inspect the running processes"},{"kind":"process-gone","pid":777,"note":"The runaway process is stopped","label":"The runaway process is stopped"},{"kind":"process-alive","pid":233,"note":"nginx is still running","label":"nginx is still running"},{"kind":"process-alive","pid":512,"note":"billing is still running","label":"billing is still running"}],"hints":["Which command lists running processes along with their CPU use?","ps aux shows a %CPU column. Spot the outlier, note its PID, then use kill PID.","ps aux, then kill 777."],"socratic":["Which command shows what is running right now?","Which column tells you who is hogging the CPU?","How do you stop one specific process by its number?"],"explain":"In one sentence: why look before you kill?","xp":40,"skills":["linux","processes","troubleshooting"],"requires":[],"solution":{"commands":["ps aux","kill 777","ps aux"]},"alt":{"commands":["top","kill -9 777"]}},{"id":"f-bool","region":"decisions","order":5,"title":"Fill the Logic","story":"The cinema lets you in only if you are old enough and hold a ticket.","goal":"Fill the blank so a person needs both conditions.","type":"fill","starter":"age = int(input())\nhas_ticket = input() == \"yes\"\nif age >= 5 ___ has_ticket:\n    print(\"Enter\")\nelse:\n    print(\"Stay out\")\n","tests":[{"kind":"stdout","label":"10 with ticket","expect":"Enter","stdin":["10","yes"]},{"kind":"stdout","label":"3 with ticket","expect":"Stay out","stdin":["3","yes"]},{"kind":"stdout","label":"10 without ticket","expect":"Stay out","stdin":["10","no"]}],"hints":["You need BOTH things to be true. Which word joins two conditions that must both hold?","The word is and.","age = int(input())\nhas_ticket = input() == \"yes\"\nif age >= 5 and has_ticket:\n    print(\"Enter\")\nelse:\n    print(\"Stay out\")\n"],"socratic":["Does the person need one condition or both?","Which keyword means both must be true?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Logic”?","xp":20,"skills":["and/or"],"requires":["py-06-elif"],"solution":"age = int(input())\nhas_ticket = input() == \"yes\"\nif age >= 5 and has_ticket:\n    print(\"Enter\")\nelse:\n    print(\"Stay out\")\n"},{"id":"o-grade","region":"decisions","order":8,"title":"Order the Grader","story":"The report-card program fell apart. Rebuild it so that 95 gives A, 80 gives B and 10 gives C.","goal":"Put the lines in order so the program grades correctly.","type":"order","starter":"    print(\"B\")\n    print(\"C\")\nelse:\nmark = int(input())\nif mark >= 90:\n    print(\"A\")\nelif mark >= 75:\n","lines":["    print(\"B\")","    print(\"C\")","else:","mark = int(input())","if mark >= 90:","    print(\"A\")","elif mark >= 75:"],"tests":[{"kind":"stdout","label":"95","expect":"A","stdin":["95"]},{"kind":"stdout","label":"80","expect":"B","stdin":["80"]},{"kind":"stdout","label":"10","expect":"C","stdin":["10"]},{"kind":"stdout","label":"75","expect":"B","stdin":["75"],"hidden":true}],"hints":["if comes first, then elif, then else. Indentation shows which line belongs to which branch.","The highest score check must come before the lower one.","mark = int(input())\nif mark >= 90:\n    print(\"A\")\nelif mark >= 75:\n    print(\"B\")\nelse:\n    print(\"C\")\n"],"socratic":["What must come before elif and else?","Why must the 90 check come before the 75 check?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["elif","order"],"requires":["p-elif-chain"],"solution":"mark = int(input())\nif mark >= 90:\n    print(\"A\")\nelif mark >= 75:\n    print(\"B\")\nelse:\n    print(\"C\")\n"},{"id":"p-elif-chain","region":"decisions","order":7,"title":"If vs Elif","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"n = 15\nif n % 3 == 0:\n    print(\"Fizz\")\nif n % 5 == 0:\n    print(\"Buzz\")\nelif n % 2 == 0:\n    print(\"Even\")","options":["Fizz","Buzz","Fizz\nBuzz\nEven","Fizz\nBuzz"],"answer":3,"why":"The first if stands alone, so it runs. The second if/elif is a separate group: 15 % 5 == 0 is true, so Buzz prints and the elif is skipped.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Where does one decision end and the next begin?","The output is:\nFizz\nBuzz"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["if","elif"],"requires":["p-truthy"],"solution":"Fizz\nBuzz"},{"id":"p-eq","region":"decisions","order":3,"title":"Two Equals","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"print(5 == 5.0)\nprint(\"5\" == 5)\nprint(3 > 2 > 1)","options":["True\nTrue\nTrue","False\nFalse\nTrue","True\nFalse\nFalse","True\nFalse\nTrue"],"answer":3,"why":"5 equals 5.0 as numbers, but text \"5\" is never equal to the number 5. Python lets you chain comparisons: 3 > 2 > 1 means both are true.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Is \"5\" the same kind of thing as 5?","The output is:\nTrue\nFalse\nTrue"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["comparisons"],"requires":["w-even-odd"],"solution":"True\nFalse\nTrue"},{"id":"p-truthy","region":"decisions","order":6,"title":"Truthy and Falsy","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"items = []\nif items:\n    print(\"full\")\nelse:\n    print(\"empty\")\nif \"0\":\n    print(\"zero is truthy\")","options":["empty\nzero is truthy","full\nzero is truthy","empty","full"],"answer":0,"why":"Empty collections are falsy, so the else branch runs. A non-empty string, even \"0\", is truthy.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which values count as False when used in an if?","The output is:\nempty\nzero is truthy"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["truthiness"],"requires":["f-bool"],"solution":"empty\nzero is truthy"},{"id":"proj-ticket","region":"decisions","order":10,"title":"Project: Cinema Ticket Desk","story":"The cinema prices tickets by age and day. Build the desk program.","goal":"Read age, then day (mon..sun). Under 5 is free. Ages 5-12 and 60+ pay 80, everyone else 150. On sat or sun add 20, but never to a free ticket. Print the price.","type":"write-code","starter":"age = int(input())\nday = input()\n# work out the price, then print it\n","tests":[{"kind":"stdout","label":"4 on a Monday","expect":"0","stdin":["4","mon"]},{"kind":"stdout","label":"4 on a Saturday stays free","expect":"0","stdin":["4","sat"]},{"kind":"stdout","label":"10 on a Monday","expect":"80","stdin":["10","mon"]},{"kind":"stdout","label":"30 on a Saturday","expect":"170","stdin":["30","sat"]},{"kind":"stdout","label":"65 on a Sunday","expect":"100","stdin":["65","sun"]},{"kind":"stdout","label":"13 on a Tuesday","expect":"150","stdin":["13","tue"],"hidden":true}],"hints":["First decide the base price with if/elif/else. Then handle the weekend as a separate step.","The weekend surcharge only applies when the price is above 0.","age = int(input())\nday = input()\nif age < 5:\n    price = 0\nelif age <= 12 or age >= 60:\n    price = 80\nelse:\n    price = 150\nif day in (\"sat\", \"sun\") and price > 0:\n    price += 20\nprint(price)\n"],"socratic":["Which rule decides the base price, and which rule adjusts it?","Why must the free ticket skip the weekend charge?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Cinema Ticket Desk”?","xp":45,"skills":["if","elif","and/or"],"requires":["w-leap"],"solution":"age = int(input())\nday = input()\nif age < 5:\n    price = 0\nelif age <= 12 or age >= 60:\n    price = 80\nelse:\n    price = 150\nif day in (\"sat\", \"sun\") and price > 0:\n    price += 20\nprint(price)\n","alt":"age = int(input())\nday = input()\nif age < 5:\n    price = 0\nelse:\n    price = 80 if (age <= 12 or age >= 60) else 150\n    if day == \"sat\" or day == \"sun\":\n        price = price + 20\nprint(price)\n","project":true},{"id":"py-05-if-else","region":"decisions","order":1,"title":"Gate Guard","story":"The temple gate only opens for scores of 50 or more. Everyone else is asked to try again.","goal":"Read a score. Print Pass if it is 50 or more, otherwise print Try again.","type":"write-code","starter":"score = int(input())\n# print Pass if the score is 50 or more, otherwise Try again\n","tests":[{"kind":"stdout","label":"50 passes","expect":"Pass","stdin":["50"]},{"kind":"stdout","label":"49 tries again","expect":"Try again","stdin":["49"]},{"kind":"stdout","label":"100 passes","expect":"Pass","stdin":["100"]},{"kind":"stdout","label":"0 tries again","expect":"Try again","stdin":["0"]},{"kind":"source","label":"Uses if","pattern":"\\bif\\b"}],"hints":["A decision has the shape: if condition: (indented action) else: (indented action).","The condition for passing is score >= 50. Remember the colons and the indentation.","if score >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Try again\")"],"socratic":["Which comparison means 'at least 50'?","What two symbols must end the if line and the else line?","What happens to the lines under if when the condition is false?"],"explain":"In one sentence: when does the else part run?","xp":25,"skills":["if","comparison"],"requires":["py-04-bugfix-1"],"solution":"score = int(input())\nif score >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Try again\")\n","alt":"score = int(input())\nprint(\"Pass\" if score >= 50 else \"Try again\")\n"},{"id":"py-06-elif","region":"decisions","order":4,"title":"Report Card","story":"Marks are turned into grades: 90 or more is A, 75 or more is B, 50 or more is C, anything lower is D.","goal":"Read marks and print the grade letter.","type":"write-code","starter":"marks = int(input())\n# print A, B, C or D\n","tests":[{"kind":"stdout","label":"95 is A","expect":"A","stdin":["95"]},{"kind":"stdout","label":"90 is A","expect":"A","stdin":["90"]},{"kind":"stdout","label":"80 is B","expect":"B","stdin":["80"]},{"kind":"stdout","label":"75 is B","expect":"B","stdin":["75"]},{"kind":"stdout","label":"60 is C","expect":"C","stdin":["60"]},{"kind":"stdout","label":"50 is C","expect":"C","stdin":["50"]},{"kind":"stdout","label":"49 is D","expect":"D","stdin":["49"]}],"hints":["When there are more than two outcomes, chain them: if ... elif ... else.","Check the highest band first: if marks >= 90, then elif marks >= 75, then elif marks >= 50, then else.","if marks >= 90:\n    print(\"A\")\nelif marks >= 75:\n    print(\"B\")\nelif marks >= 50:\n    print(\"C\")\nelse:\n    print(\"D\")"],"socratic":["If marks is 95, which conditions are true? Which one should win?","Why does the order of the checks matter?","What does elif do that a second if does not?"],"explain":"In one sentence: why do we check the highest band first?","xp":30,"skills":["if","elif","logic"],"requires":["p-eq"],"solution":"marks = int(input())\nif marks >= 90:\n    print(\"A\")\nelif marks >= 75:\n    print(\"B\")\nelif marks >= 50:\n    print(\"C\")\nelse:\n    print(\"D\")\n","alt":"marks = int(input())\ngrade = \"D\"\nif marks >= 50:\n    grade = \"C\"\nif marks >= 75:\n    grade = \"B\"\nif marks >= 90:\n    grade = \"A\"\nprint(grade)\n"},{"id":"py-07-bugfix-2","region":"decisions","order":11,"title":"The Wrong Door","story":"The ticket machine should say Exact change for exactly 10 coins, Overpaid for more, Not enough for fewer. It is broken in two ways.","goal":"Fix the program so all three cases work.","type":"fix-the-bug","starter":"coins = int(input())\nif coins >= 10:\n    print(\"Exact change\")\nelif coins > 10\n    print(\"Overpaid\")\nelse:\n    print(\"Not enough\")\n","tests":[{"kind":"stdout","label":"10 is exact","expect":"Exact change","stdin":["10"]},{"kind":"stdout","label":"11 is overpaid","expect":"Overpaid","stdin":["11"]},{"kind":"stdout","label":"25 is overpaid","expect":"Overpaid","stdin":["25"]},{"kind":"stdout","label":"9 is not enough","expect":"Not enough","stdin":["9"]},{"kind":"stdout","label":"0 is not enough","expect":"Not enough","stdin":["0"],"hidden":true}],"hints":["Run it first. Python complains about one line. What is missing at the end of an elif line?","Once it runs, try 11 coins. Which branch answers? Is >= the same as \"exactly\"?","coins = int(input())\nif coins == 10:\n    print(\"Exact change\")\nelif coins > 10:\n    print(\"Overpaid\")\nelse:\n    print(\"Not enough\")"],"socratic":["What must every if/elif/else line end with?","For 11 coins, which condition is true first?","Which operator checks 'exactly equal'?"],"explain":"In one sentence: what is the difference between >= and ==?","xp":50,"skills":["debugging","comparison"],"requires":["proj-ticket"],"solution":"coins = int(input())\nif coins == 10:\n    print(\"Exact change\")\nelif coins > 10:\n    print(\"Overpaid\")\nelse:\n    print(\"Not enough\")\n","alt":"coins = int(input())\nif coins < 10:\n    print(\"Not enough\")\nelif coins == 10:\n    print(\"Exact change\")\nelse:\n    print(\"Overpaid\")\n","boss":true},{"id":"w-even-odd","region":"decisions","order":2,"title":"Even or Odd","story":"The ticket machine gives even-numbered tokens to the left queue and odd ones to the right.","goal":"Read a whole number. Print even or odd.","type":"write-code","starter":"n = int(input())\n# print even or odd\n","tests":[{"kind":"stdout","label":"4","expect":"even","stdin":["4"]},{"kind":"stdout","label":"7","expect":"odd","stdin":["7"]},{"kind":"stdout","label":"0","expect":"even","stdin":["0"]},{"kind":"stdout","label":"-3","expect":"odd","stdin":["-3"],"hidden":true}],"hints":["The remainder operator % gives what is left after division. What is the remainder of an even number divided by 2?","Check n % 2 == 0 inside an if.","n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n"],"socratic":["What is 6 % 2? What is 7 % 2?","Which comparison tells you the remainder was zero?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Even or Odd”?","xp":30,"skills":["if","modulo"],"requires":["py-05-if-else"],"solution":"n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n","alt":"n = int(input())\nprint(\"even\" if n % 2 == 0 else \"odd\")\n"},{"id":"w-leap","region":"decisions","order":9,"title":"Leap Year","story":"The village calendar needs to know whether a year has 366 days.","goal":"Read a year. Print leap if it is divisible by 4, except century years, unless divisible by 400. Otherwise print not leap.","type":"write-code","starter":"year = int(input())\n# 1900 is not a leap year, 2000 is, 2024 is\n","tests":[{"kind":"stdout","label":"2024","expect":"leap","stdin":["2024"]},{"kind":"stdout","label":"1900","expect":"not leap","stdin":["1900"]},{"kind":"stdout","label":"2000","expect":"leap","stdin":["2000"]},{"kind":"stdout","label":"2023","expect":"not leap","stdin":["2023"],"hidden":true}],"hints":["Write the rule in three parts: divisible by 4, not by 100, or by 400.","Combine them: divisible by 4 and (not by 100 or by 400).","year = int(input())\nleap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)\nprint(\"leap\" if leap else \"not leap\")\n"],"socratic":["Is 1900 divisible by 4? Should it be a leap year?","Which year is the exception to the exception?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Leap Year”?","xp":30,"skills":["and/or","modulo"],"requires":["o-grade"],"solution":"year = int(input())\nleap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)\nprint(\"leap\" if leap else \"not leap\")\n","alt":"year = int(input())\nif year % 400 == 0:\n    print(\"leap\")\nelif year % 100 == 0:\n    print(\"not leap\")\nelif year % 4 == 0:\n    print(\"leap\")\nelse:\n    print(\"not leap\")\n","clean":{"label":"Fit it in 4 lines or fewer (combine conditions with and/or)","tests":[{"kind":"maxlines","max":4,"label":"4 lines or fewer"}]}},{"id":"f-except","region":"files-errors","order":3,"title":"Fill the Safety Net","story":"Dividing by zero would crash the whole sorting office.","goal":"Print None instead of crashing.","type":"fill","starter":"def divide(a, b):\n    try:\n        return a / b\n    except ___:\n        return None\n\nprint(divide(6, 0))\n","tests":[{"kind":"stdout","label":"Prints None","expect":"None"}],"hints":["Which error does dividing by zero raise?","The name is ZeroDivisionError.","def divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(divide(6, 0))\n"],"socratic":["What error does 6 / 0 raise?","Why catch a specific error instead of everything?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Safety Net”?","xp":20,"skills":["try/except"],"requires":["w-safe-int"],"solution":"def divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(divide(6, 0))\n"},{"id":"fe-boss","region":"files-errors","order":11,"title":"Boss: The Crashing Counter","story":"A number-adding script crashes on blank lines and on missing files, and leaves the file open. Find all the bugs.","goal":"Fix read_numbers(path): sum the whole numbers in the file, ignore blank lines, and return 0 if the file does not exist.","type":"fix-the-bug","starter":"def read_numbers(path):\n    f = open(path)\n    nums = []\n    for line in f:\n        nums.append(int(line))\n    return sum(nums)\n","tests":[{"kind":"eval","label":"Skips blank lines","expr":"(open(\"n.txt\", \"w\").write(\"1\\n\\n2\\n\"), read_numbers(\"n.txt\"))[1]","expect":"3"},{"kind":"eval","label":"Missing file gives 0","expr":"read_numbers(\"missing.txt\")","expect":"0"},{"kind":"eval","label":"Plain file","expr":"(open(\"n3.txt\", \"w\").write(\"5\\n6\"), read_numbers(\"n3.txt\"))[1]","expect":"11","hidden":true}],"hints":["Which line crashes on an empty line? What does int(\"\\n\") do?","A missing file raises FileNotFoundError. Also prefer with open(...) so the file closes itself.","def read_numbers(path):\n    try:\n        with open(path) as f:\n            return sum(int(line) for line in f if line.strip())\n    except FileNotFoundError:\n        return 0\n"],"socratic":["What does int of a blank line do?","What does open do when the file is missing?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":65,"skills":["debugging","files","try/except"],"requires":["proj-expenses"],"solution":"def read_numbers(path):\n    try:\n        with open(path) as f:\n            return sum(int(line) for line in f if line.strip())\n    except FileNotFoundError:\n        return 0\n","alt":"def read_numbers(path):\n    nums = []\n    try:\n        with open(path) as f:\n            for line in f:\n                if line.strip() == \"\":\n                    continue\n                nums.append(int(line))\n    except FileNotFoundError:\n        return 0\n    return sum(nums)\n","boss":true},{"id":"p-finally","region":"files-errors","order":5,"title":"Always Cleanup","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def f():\n    try:\n        return \"try\"\n    finally:\n        print(\"cleanup\")\nprint(f())","options":["cleanup\ntry","try\ncleanup","try","cleanup"],"answer":0,"why":"finally always runs, even when the function is returning. The print inside finally happens first, then the returned text prints.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","When does the outer print receive the value?","The output is:\ncleanup\ntry"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["try/except","finally"],"requires":["w-write-read"],"solution":"cleanup\ntry"},{"id":"p-try","region":"files-errors","order":1,"title":"Catch the Crash","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"try:\n    print(int(\"12\"))\n    print(int(\"abc\"))\n    print(\"after\")\nexcept ValueError:\n    print(\"bad number\")","options":["12\nafter","12\nbad number","12\nbad number\nafter","bad number"],"answer":1,"why":"int(\"12\") works and prints 12. int(\"abc\") raises ValueError, Python jumps to except and skips the rest of the try block, so after never prints.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Once an error happens inside try, which lines still run?","The output is:\n12\nbad number"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["try/except"],"requires":["py-16-bugfix-5"],"solution":"12\nbad number"},{"id":"proj-expenses","region":"files-errors","order":10,"title":"Project: Expense Tracker","story":"The post office logs expenses as lines like food,120. Some lines are broken, and the tracker must survive them.","goal":"Write total_by_category(lines) returning a dict of category totals. Skip lines that are not exactly name,amount or whose amount is not a whole number.","type":"write-code","starter":"# define total_by_category\n","tests":[{"kind":"eval","label":"Totals","expr":"total_by_category([\"food,120\", \"travel,300\", \"food,80\"])","expect":"{'food': 200, 'travel': 300}"},{"kind":"eval","label":"Skips broken lines","expr":"total_by_category([\"food,120\", \"oops\", \"tea,abc\", \"a,b,c\"])","expect":"{'food': 120}"},{"kind":"eval","label":"Empty","expr":"total_by_category([])","expect":"{}","hidden":true}],"hints":["Loop over the lines. Put the risky parts inside try and catch ValueError.","name, amount = line.split(\",\") fails with ValueError if there are not exactly two parts, and int() fails for bad numbers. One except covers both.","def total_by_category(lines):\n    totals = {}\n    for line in lines:\n        try:\n            name, amount = line.split(\",\")\n            totals[name] = totals.get(name, 0) + int(amount)\n        except ValueError:\n            continue\n    return totals\n"],"socratic":["Which kinds of broken line can you expect?","What should happen to a broken line?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Expense Tracker”?","xp":60,"skills":["dicts","try/except"],"requires":["w-raise"],"solution":"def total_by_category(lines):\n    totals = {}\n    for line in lines:\n        try:\n            name, amount = line.split(\",\")\n            totals[name] = totals.get(name, 0) + int(amount)\n        except ValueError:\n            continue\n    return totals\n","alt":"def total_by_category(lines):\n    totals = {}\n    for line in lines:\n        parts = line.split(\",\")\n        if len(parts) != 2 or not parts[1].strip().lstrip(\"-\").isdigit():\n            continue\n        totals[parts[0]] = totals.get(parts[0], 0) + int(parts[1])\n    return totals\n","project":true},{"id":"w-count-lines","region":"files-errors","order":6,"title":"Line Counter","story":"How many real lines are in a letter? Blank lines do not count.","goal":"Write count_lines(path) returning the number of non-empty lines in the file.","type":"write-code","starter":"# define count_lines\n","tests":[{"kind":"eval","label":"Skips blanks","expr":"(open(\"t.txt\", \"w\").write(\"a\\n\\nb\\n\"), count_lines(\"t.txt\"))[1]","expect":"2"},{"kind":"eval","label":"Only blanks","expr":"(open(\"t2.txt\", \"w\").write(\"\\n\\n\"), count_lines(\"t2.txt\"))[1]","expect":"0","hidden":true}],"hints":["You can loop over an open file line by line.","line.strip() is empty for a blank line.","def count_lines(path):\n    count = 0\n    with open(path) as f:\n        for line in f:\n            if line.strip():\n                count += 1\n    return count\n"],"socratic":["How do you read a file one line at a time?","How can you tell a line is blank?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Line Counter”?","xp":30,"skills":["files","loops"],"requires":["p-finally"],"solution":"def count_lines(path):\n    count = 0\n    with open(path) as f:\n        for line in f:\n            if line.strip():\n                count += 1\n    return count\n","alt":"def count_lines(path):\n    with open(path) as f:\n        return len([l for l in f if l.strip()])\n"},{"id":"w-csv","region":"files-errors","order":7,"title":"Score Sheet","story":"The school sends scores as CSV text. Average them.","goal":"Write average_from_csv(text) for text like \"name,score\\nAsha,80\\nRavi,60\". Skip the header; return the average as a float (0.0 if no rows).","type":"write-code","starter":"# define average_from_csv\n","tests":[{"kind":"eval","label":"Two rows","expr":"average_from_csv(\"name,score\\nAsha,80\\nRavi,60\")","expect":"70.0"},{"kind":"eval","label":"Header only","expr":"average_from_csv(\"name,score\")","expect":"0.0"},{"kind":"eval","label":"One row","expr":"average_from_csv(\"name,score\\nMeera,95\\n\")","expect":"95.0","hidden":true}],"hints":["Split the text into lines, ignore the first, then split each line on a comma.","Collect the scores into a list, then divide the sum by the count, but only if the list is not empty.","def average_from_csv(text):\n    lines = text.strip().split(\"\\n\")[1:]\n    scores = [int(line.split(\",\")[1]) for line in lines]\n    return sum(scores) / len(scores) if scores else 0.0\n"],"socratic":["How do you skip the header line?","What must you avoid dividing by?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Score Sheet”?","xp":30,"skills":["csv","split"],"requires":["w-count-lines"],"solution":"def average_from_csv(text):\n    lines = text.strip().split(\"\\n\")[1:]\n    scores = [int(line.split(\",\")[1]) for line in lines]\n    return sum(scores) / len(scores) if scores else 0.0\n","alt":"def average_from_csv(text):\n    total = 0\n    count = 0\n    for line in text.strip().split(\"\\n\")[1:]:\n        total += int(line.split(\",\")[1])\n        count += 1\n    if co
