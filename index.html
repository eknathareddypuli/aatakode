<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AataKode: play your way to code (free, offline-first)</title>
<meta name="description" content="Free, offline-first gamified coding academy. Learn Python and fix broken servers by playing. No sign-up.">
<meta name="theme-color" content="#15123a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{
  --bg:#15123a;--panel:#1f1b52;--panel2:#2a2569;--ink:#f3f0ff;--muted:#b9b3e6;--line:#3d3784;
  --gold:#f2b531;--coral:#ff7a6b;--mint:#4ade9f;--sky:#74c7ff;--on-gold:#1a1744;--code:#100e2e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu","Nirmala UI",sans-serif;
  --shadow:4px 4px 0 rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#fbf6e9;--panel:#ffffff;--panel2:#f3ead0;--ink:#1d1a45;--muted:#58548a;--line:#d6c9a0;
  --gold:#e0a010;--coral:#c9372a;--mint:#0b7d4f;--sky:#1560a8;--on-gold:#1a1744;--code:#fffdf5;
  --shadow:4px 4px 0 rgba(29,26,69,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:var(--mono);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,3.1rem)}h2{font-size:1.5rem}h3{font-size:1.15rem}
a{color:var(--sky)}
code,pre,.mono{font-family:var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
main{flex:1;padding:1.25rem 0 3rem}
.muted{color:var(--muted)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}

/* header */
.hdr{background:var(--panel);border-bottom:3px solid var(--line);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.5rem;font:800 1.25rem var(--mono);color:var(--ink);text-decoration:none}
.logo b{color:var(--gold)}
.nav{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:.5rem}
.nav a{color:var(--muted);text-decoration:none;padding:.35rem .7rem;border:2px solid transparent;border-radius:6px;font-weight:600}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--panel2)}
.hdr .right{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border:2px solid var(--line);border-radius:999px;background:var(--panel2);font:600 .85rem var(--mono);white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.iconbtn{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:.25rem .55rem;cursor:pointer;font-weight:700}
.iconbtn:hover{border-color:var(--gold)}

/* buttons / cards */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border:2px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .08s}
.btn:hover{transform:translate(-1px,-1px);border-color:var(--gold)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.good{background:var(--mint);color:#06281a;border-color:var(--mint)}
.btn.small{padding:.3rem .65rem;font-size:.9rem;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bar{height:12px;border:2px solid var(--line);border-radius:6px;background:var(--code);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral))}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font:600 .75rem var(--mono)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center;padding:1.5rem 0 2rem}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34rem}
.hero .art{display:grid;place-items:center}
.codepeek{background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.9rem 1rem;font:.9rem/1.5 var(--mono);box-shadow:var(--shadow);overflow:auto}
.kw{color:var(--coral)}.st{color:var(--mint)}.cm{color:var(--muted)}.fn{color:var(--sky)}
@media(max-width:820px){.hero{grid-template-columns:1fr}}

/* map */
.track{margin:1.6rem 0 .6rem}
.region{display:grid;grid-template-columns:230px 1fr;gap:1rem;align-items:center;margin-bottom:.9rem}
.region.locked{opacity:.78}
.nodes{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.node{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--panel2);display:grid;place-items:center;font:800 1.05rem var(--mono);cursor:pointer;position:relative;color:var(--ink)}
.node.open{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,181,49,.25)}
.node.done{background:var(--mint);border-color:var(--mint);color:#06281a}
.node.boss{border-radius:10px;width:62px;height:62px}
.node.locked{cursor:not-allowed;color:var(--muted);border-style:dashed}
.node .star{position:absolute;top:-8px;right:-8px;font-size:1rem}
.link{width:22px;height:4px;background:var(--line)}
.link.done{background:var(--mint)}
@media(max-width:700px){.region{grid-template-columns:1fr}}

/* mission */
.mhead{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.mhead h2{margin:0}
.mgrid{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(320px,1.35fr) minmax(280px,1fr);gap:.9rem;align-items:start}
@media(max-width:1000px){.mgrid{grid-template-columns:1fr}}
.story{border-left:4px solid var(--gold);padding-left:.8rem;margin:.4rem 0 .8rem;color:var(--muted)}
.goal{background:var(--panel2);border:2px dashed var(--gold);border-radius:6px;padding:.5rem .7rem;margin:.5rem 0}
.tests{list-style:none;padding:0;margin:.5rem 0}
.tests li{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.tests .ok{color:var(--mint)}.tests .no{color:var(--coral)}.tests .idle{color:var(--muted)}
.detail{margin:.2rem 0 0 1.5rem;font:.8rem/1.4 var(--mono);color:var(--muted);white-space:pre-wrap}
.hintbox{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:.5rem .7rem;margin:.4rem 0}
.hintbox pre{margin:.3rem 0 0;white-space:pre-wrap}
.editor{display:flex;background:var(--code);border:2px solid var(--line);border-radius:8px;overflow:hidden;min-height:280px}
.gutter{padding:.7rem .5rem;text-align:right;color:var(--muted);font:.92rem/1.55 var(--mono);user-select:none;background:rgba(0,0,0,.18);overflow:hidden;min-width:2.6rem}
.editor textarea{flex:1;border:0;background:transparent;resize:vertical;padding:.7rem;font:.92rem/1.55 var(--mono);min-height:280px;tab-size:4;white-space:pre;overflow:auto;outline:none}
.editor:focus-within{border-color:var(--gold)}
.tabs{display:flex;gap:.25rem;border-bottom:3px solid var(--line);margin-bottom:.6rem;flex-wrap:wrap}
.tabs button{background:none;border:2px solid transparent;border-bottom:0;padding:.35rem .75rem;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--panel2);border-color:var(--line);color:var(--ink)}
.out{background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.6rem .7rem;font:.9rem/1.5 var(--mono);white-space:pre-wrap;min-height:90px;max-height:320px;overflow:auto}
.err{border:2px solid var(--coral);border-radius:6px;padding:.5rem .7rem;margin:.5rem 0;background:rgba(255,122,107,.1)}
.err b{color:var(--coral)}
.input{width:100%;background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.4rem .6rem;font:.9rem var(--mono)}
textarea.input{resize:vertical}
.reward{border:3px solid var(--gold);background:linear-gradient(135deg,var(--panel2),var(--panel));border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
.reward ul{margin:.3rem 0 0;padding-left:1.1rem}
.stepcode{background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.4rem 0;font:.88rem/1.5 var(--mono);overflow:auto;max-height:220px}
.stepcode div{padding:0 .6rem;white-space:pre}
.stepcode .cur{background:rgba(242,181,49,.28);box-shadow:inset 4px 0 var(--gold)}
table.vars{width:100%;border-collapse:collapse;font:.85rem var(--mono)}
table.vars td,table.vars th{border-bottom:1px dashed var(--line);padding:.2rem .4rem;text-align:left}
.blocks .blk{margin:3px 0;padding:.25rem .6rem;border-radius:6px;font:.88rem var(--mono);border-left:6px solid var(--line);background:var(--panel2)}
.blk.say{border-color:var(--sky)}.blk.set{border-color:var(--gold)}.blk.loop{border-color:var(--coral)}.blk.choose{border-color:var(--mint)}.blk.func{border-color:#c79bff}.blk.note{opacity:.7;font-style:italic}
.cmp pre{background:var(--code);border:2px solid var(--line);border-radius:6px;padding:.5rem .7rem;overflow:auto;margin:.3rem 0}
.term{background:#0a0820;color:#d8ffe9;border:2px solid var(--line);border-radius:8px;font:.9rem/1.45 var(--mono);display:flex;flex-direction:column;min-height:340px;max-height:460px}
.term .log{flex:1;overflow:auto;padding:.6rem .7rem;white-space:pre-wrap;word-break:break-word}
.term .log .cmd{color:var(--gold)}
.term form{display:flex;gap:.4rem;border-top:2px solid var(--line);padding:.4rem .6rem;align-items:center}
.term input{flex:1;background:transparent;border:0;color:inherit;font:inherit;outline:none}
.pill{font:600 .78rem var(--mono);padding:.1rem .5rem;border-radius:999px;border:2px solid var(--line)}
.pill.ready{border-color:var(--mint);color:var(--mint)}.pill.load{border-color:var(--gold);color:var(--gold)}.pill.fail{border-color:var(--coral);color:var(--coral)}

/* profile */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.badge{border:2px solid var(--line);border-radius:8px;padding:.6rem;text-align:center;background:var(--panel2)}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge .ico{font-size:1.8rem}
.skillrow{display:grid;grid-template-columns:130px 1fr 28px;gap:.5rem;align-items:center;margin:.25rem 0;font:.85rem var(--mono)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
table.tbl th,table.tbl td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.scroll{overflow:auto}

/* toast + confetti */
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:50}
.toast{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:.6rem .9rem;box-shadow:var(--shadow);max-width:320px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.stretch{animation:pop .35s}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){:root[data-motion="auto"] *{animation:none!important;transition:none!important}}
footer{border-top:3px solid var(--line);padding:1rem 0;color:var(--muted);font-size:.9rem}
.gutter{white-space:pre}.sr:focus{position:fixed;left:8px;top:8px;width:auto;height:auto;clip:auto;background:var(--gold,#f2b531);color:#000;padding:.4rem .7rem;z-index:99}

/* v2: new mission types, stars, daily quest, wardrobe */
html{--codeink:var(--ink)}
.editor textarea,.fill,.order code,.codeview,.out,.opt pre{color:var(--codeink)}
[data-editor=contrast]{--code:#000;--codeink:#fff}
[data-editor=turmeric]{--code:#2a1d06;--codeink:#ffd98a}
[data-editor=mint]{--code:#04170f;--codeink:#a7f3d0}
[data-editor=paper]{--code:#fffdf5;--codeink:#222}
.nodes{row-gap:1.4rem}
.node .nstars{position:absolute;bottom:-15px;left:-8px;right:-8px;text-align:center;font:.62rem var(--mono);color:var(--gold);letter-spacing:1px;font-style:normal;pointer-events:none}
.node{font-size:1.25rem}
.village .strip{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.village .place{font-size:1.5rem;filter:grayscale(1) opacity(.4);transition:filter .3s}
.village .place.on{filter:none}
.starrow .idle{color:var(--gold)}
.bigstars{font-size:1.8rem;color:var(--gold);letter-spacing:.2rem}
.codeview{background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.7rem;font:.92rem/1.55 var(--mono);overflow:auto;margin:.6rem 0}
.opts{border:0;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.opts legend{font-weight:700;margin-bottom:.3rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:.45rem .7rem;cursor:pointer;background:var(--panel2)}
.opt pre{margin:0;font:.9rem/1.45 var(--mono);white-space:pre-wrap;background:transparent;border:0;padding:0}
.opt:hover:not(.lock){border-color:var(--gold)}
.opt.good{border-color:var(--mint);background:rgba(74,222,159,.15)}
.opt.bad{border-color:var(--coral);opacity:.6;text-decoration:line-through}
.pmsg{margin-top:.5rem;min-height:1.4em}
.fill{white-space:pre-wrap;font:.95rem/2.1 var(--mono);background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.7rem;overflow:auto}
.blank{font:inherit;color:var(--gold);background:rgba(242,181,49,.12);border:0;border-bottom:2px dashed var(--gold);border-radius:4px;padding:0 .25rem;text-align:center;outline:none;min-width:3.5ch}
.blank:focus{background:rgba(242,181,49,.28)}
.order{list-style:none;margin:.4rem 0;padding:0;display:grid;gap:.35rem}
.order li{display:flex;align-items:center;gap:.5rem;background:var(--code);border:2px solid var(--line);border-radius:8px;padding:.3rem .5rem;cursor:grab}
.order li.drag{opacity:.4}
.order code{flex:1;white-space:pre;font:.9rem var(--mono)}
.order .grip{color:var(--muted)}
.order .mv{display:flex;gap:.25rem}
.wardrobe{display:flex;gap:.6rem;flex-wrap:wrap}
.outfit{border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:.5rem;width:110px;text-align:center;cursor:pointer;color:var(--ink);font:.78rem var(--mono)}
.outfit.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,181,49,.3)}
.outfit:disabled{opacity:.45;cursor:not-allowed}
#midpane,#leftpane,#rightpane{min-width:0}
.order li{min-width:0}
.order code{min-width:0;overflow-x:auto}
.fill,.codeview{max-width:100%}

/* ===== v2: feel layer, village, modes ===== */
.opt.right{border-color:var(--mint);background:rgba(74,222,159,.18)}
.opt.wrong{border-color:var(--coral);opacity:.65}
.opt:disabled{cursor:default}
.tile{display:flex;flex-direction:column;gap:.2rem;text-decoration:none;color:inherit;transition:transform .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile .tico{font-size:1.8rem}
.tablewrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:6px}
.sqlt{border-collapse:collapse;width:100%;font:.85rem var(--mono)}
.sqlt th,.sqlt td{padding:.25rem .55rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sqlt th{background:var(--panel2);position:sticky;top:0}
.pairsay{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.5rem .8rem;margin-top:.4rem}
.golfbar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.5rem}
.fade-card{margin-bottom:.6rem}
.shopitem{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.shico{font-size:1.6rem;width:2rem;text-align:center}
.grow{flex:1}
/* test-by-test lighting */
.tests li.lit{animation:litpop .28s ease-out}
.tests li.litok{background:rgba(74,222,159,.12)}
.tests li.litno{background:rgba(255,122,107,.12)}
@keyframes litpop{0%{transform:translateX(-6px) scale(.98);opacity:.4}100%{transform:none;opacity:1}}
/* typing feel */
.editor.typing,.term.typing{box-shadow:0 0 0 2px rgba(242,181,49,.35),0 0 14px rgba(242,181,49,.25)}
.editor{position:relative;transition:box-shadow .12s}
#kwflash{position:absolute;right:10px;top:8px;font:700 .85rem var(--mono);color:var(--on-gold);background:var(--gold);padding:.1rem .5rem;border-radius:999px;opacity:0;pointer-events:none}
#kwflash.go{animation:kw .8s ease-out}
@keyframes kw{0%{opacity:0;transform:translateY(6px) scale(.9)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
#runBtn.charged,#sqlRun.charged{box-shadow:0 0 0 3px rgba(242,181,49,.45);animation:charge 1.4s ease-in-out infinite}
@keyframes charge{50%{box-shadow:0 0 0 6px rgba(242,181,49,.15)}}
/* parrot buddy */
.buddy{position:fixed;left:12px;bottom:12px;z-index:30;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.buddy .bpar{position:relative;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3));transition:transform .25s}
.buddy.mood-happy .bpar{animation:hop .6s ease-out 2}
.buddy.mood-sad .bpar{transform:rotate(-8deg) translateY(3px);filter:saturate(.6) drop-shadow(2px 3px 0 rgba(0,0,0,.3))}
.buddy.mood-think .bpar{animation:bob 1.6s ease-in-out infinite}
.buddy .bub{background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:.35rem .7rem;max-width:230px;font-size:.88rem;box-shadow:var(--shadow);animation:bubin .25s ease-out}
.buddy .bub.gone{opacity:0;transition:opacity .5s}
.bcomp{position:absolute;right:-18px;bottom:-4px;font-size:1.1rem}
.bcomp.s2{font-size:1.4rem}.bcomp.s3{font-size:1.7rem}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes bubin{from{opacity:0;transform:translateY(6px)}}
@media(max-width:700px){.buddy .bub{max-width:150px;font-size:.8rem}}
/* village rebuild overlay */
.rebuild-ov{position:fixed;inset:0;background:rgba(10,8,30,.7);display:grid;place-items:center;z-index:60;animation:bubin .3s}
.rebuild-ov.out{opacity:0;transition:opacity .4s}
.rb-card{background:var(--panel);border:3px solid var(--gold);border-radius:14px;padding:1.4rem 2rem;text-align:center;display:grid;gap:.4rem}
.rb-icon{font-size:4.5rem;display:inline-block}
.rb-icon.go{animation:rbuild 1.4s cubic-bezier(.3,1.6,.5,1)}
@keyframes rbuild{0%{transform:scale(.1) translateY(40px);filter:grayscale(1)}60%{transform:scale(1.25);filter:none}100%{transform:scale(1)}}
/* village scene */
.vscene{width:100%;height:auto;display:block;border-radius:8px}
.vscene .land.down .lico{filter:grayscale(1)}
.vscene .land.down .dim{opacity:.4}
.vscene .land.up .lico{filter:drop-shadow(0 0 6px rgba(255,211,106,.6))}
.vscene .land.rebuild .lico{transform-box:fill-box;transform-origin:center bottom;animation:rbuild 1.6s cubic-bezier(.3,1.6,.5,1) both}
.vscene .plot{cursor:pointer;outline:none}
.vscene .plot:hover rect,.vscene .plot:focus rect{stroke:var(--gold);stroke-width:2}
.vscene .bld{transform-box:fill-box;transform-origin:center bottom;animation:sway 4s ease-in-out infinite}
.vscene .star{fill:#fff;animation:twinkle 3s ease-in-out infinite}
.vscene .ff{fill:#fff6a8;animation:firefly 5s ease-in-out infinite}
.vscene .glow{animation:twinkle 3.4s ease-in-out infinite}
.vscene .comp{animation:stroll 22s linear infinite}
.vscene .comp.s2{font-size:42px}.vscene .comp.s3{font-size:52px}
@keyframes sway{50%{transform:rotate(1.5deg)}}
@keyframes twinkle{50%{opacity:.25}}
@keyframes firefly{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:1}60%{opacity:.8;transform:translate(26px,-18px)}}
@keyframes stroll{0%{transform:translateX(30px)}50%{transform:translateX(820px)}100%{transform:translateX(30px)}}

<noscript><p style="padding:2rem">AataKode needs JavaScript to run missions in your browser.</p></noscript>
<script>/* AataKode engine: shared by the browser app and the lesson verifier (Node).
 * No DOM access in this file. Contents:
 *   1. ranks, badges, dates          4. terminal simulator + grader
 *   2. progress / XP / streak logic  5. Python bridge (Pyodide)
 *   3. friendly errors, blocks view  6. teacher cards
 */
(function (root) {
  "use strict";
  const AK = {};

  /* ---------------------------------------------------------------- 1. ranks, dates */
  AK.RANKS = [
    { xp: 0, en: "Seedling", te: "విత్తు" },
    { xp: 100, en: "Sprout", te: "మొలక" },
    { xp: 300, en: "Sapling", te: "మొక్క" },
    { xp: 700, en: "Branch", te: "కొమ్మ" },
    { xp: 1300, en: "Tree", te: "చెట్టు" },
    { xp: 2200, en: "Forest", te: "వనం" },
    { xp: 3400, en: "Grove", te: "తోపు" },
    { xp: 5000, en: "Banyan", te: "మర్రి" },
  ];

  AK.rankFor = function (xp) {
    let i = 0;
    for (let k = 0; k < AK.RANKS.length; k++) if (xp >= AK.RANKS[k].xp) i = k;
    const cur = AK.RANKS[i], next = AK.RANKS[i + 1] || null;
    const pct = next ? Math.round(((xp - cur.xp) / (next.xp - cur.xp)) * 100) : 100;
    return { index: i, current: cur, next: next, pct: pct };
  };

  AK.dateKey = function (d) {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  };
  function dayNumber(key) {
    const [y, m, d] = key.split("-").map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  }
  AK.daysBetween = function (a, b) { return dayNumber(a) - dayNumber(b); };

  /* Week index counts weeks since 2024-01-01 (a Monday), in the learner's local time. */
  AK.weekIndex = function (d) {
    return Math.floor((dayNumber(AK.dateKey(d)) - dayNumber("2024-01-01")) / 7);
  };
  AK.daysUntilNextWeek = function (d) {
    const since = dayNumber(AK.dateKey(d)) - dayNumber("2024-01-01");
    return 7 - (((since % 7) + 7) % 7);
  };
  AK.featuredOutage = function (missions, d) {
    const ops = missions.filter((m) => m.type === "terminal" && m.region === "debug-the-outage").sort((a, b) => a.order - b.order);
    if (!ops.length) return null;
    return ops[((AK.weekIndex(d) % ops.length) + ops.length) % ops.length];
  };
  /* Outage of the Day: a different incident every date, never the same as the weekly one. */
  AK.outageOfDay = function (missions, d) {
    const ops = missions.filter((m) => m.type === "terminal" && m.region === "debug-the-outage").sort((a, b) => a.order - b.order);
    if (!ops.length) return null;
    const wk = AK.featuredOutage(missions, d);
    let k = hash("outage-day-" + AK.dateKey(d)) % ops.length;
    if (ops.length > 1 && wk && ops[k].id === wk.id) k = (k + 1) % ops.length;
    return ops[k];
  };

  /* ---------------------------------------------------------------- 2. progress */
  AK.newState = function () {
    return {
      v: 1, name: "", classCode: "", xp: 0, solved: {}, drafts: {}, hintLvl: {},
      testOut: {}, explains: {}, votes: {},
      streak: { count: 0, best: 0, last: "", freezes: 0 },
      badges: {}, weekly: {}, askLvl: {},
      dailyXp: 0, dailyDone: 0, daily: { date: "", done: {}, pts: 0, bonus: false },
      seeds: { earned: 0, spent: 0 }, shop: {}, village: { plots: [], seen: {} }, companion: "",
      placed: null, speed: {}, blitz: { best: 0, runs: 0 }, golf: {}, dungeon: { best: 0, runs: 0 }, outageDays: {}, fade: {}, pairDiag: {},
      settings: { lang: "en", theme: "dark", motion: "auto", socratic: false, outfit: "none", editor: "classic", sound: "on", haptics: "on", buddy: "on" },
      created: new Date().toISOString(),
    };
  };

  AK.recomputeXp = function (S) {
    let xp = 0;
    for (const id in S.solved) xp += S.solved[id].xp || 0;
    for (const id in S.explains) if (S.explains[id].bonus) xp += 5;
    xp += S.dailyXp || 0;
    S.xp = xp;
    return xp;
  };

  AK.regionMissions = function (data, regionId) {
    return data.missions.filter((m) => m.region === regionId).sort((a, b) => a.order - b.order);
  };

  AK.regionComplete = function (S, data, regionId) {
    const ms = AK.regionMissions(data, regionId);
    if (!ms.length) return false;
    const boss = ms.find((m) => m.boss);
    if (boss) return !!S.solved[boss.id];
    return ms.every((m) => S.solved[m.id]);
  };

  AK.isUnlocked = function (S, data, m, featuredId) {
    if (S.solved[m.id]) return true;
    if ((m.requires || []).every((r) => S.solved[r])) return true;
    if (m.boss && S.testOut[m.region]) return true;
    if (featuredId && [].concat(featuredId).indexOf(m.id) >= 0) return true;
    if (AK.regionComplete(S, data, m.region)) return true;
    if (S.placed && AK.placedUnlock && AK.placedUnlock(S, data, m)) return true;
    return false;
  };

  AK.streakStatus = function (S, now) {
    const st = S.streak, today = AK.dateKey(now);
    if (!st.last) return { count: 0, atRisk: false };
    const gap = AK.daysBetween(today, st.last);
    if (gap <= 0) return { count: st.count, atRisk: false };
    if (gap === 1) return { count: st.count, atRisk: true };
    if (gap === 2 && st.freezes > 0) return { count: st.count, atRisk: true };
    return { count: 0, atRisk: false };
  };

  function touchStreak(S, now) {
    const st = S.streak, today = AK.dateKey(now);
    if (st.last === today) return;
    if (!st.last) st.count = 1;
    else {
      const gap = AK.daysBetween(today, st.last);
      if (gap === 1) st.count += 1;
      else if (gap === 2 && st.freezes > 0) { st.freezes -= 1; st.count += 1; }
      else st.count = 1;
    }
    st.last = today;
    st.best = Math.max(st.best, st.count);
    if (st.count > 0 && st.count % 7 === 0) { st.freezes = Math.min(2, st.freezes + 1); S.seeds = S.seeds || { earned: 0, spent: 0 }; S.seeds.earned += 10; }
  }

  AK.touchStreak = touchStreak;
  AK.starsOf = function (S, id) { const r = S.solved[id]; return r ? (r.stars != null ? r.stars : r.hints === 0 ? 2 : 1) : 0; };
  AK.totalStars = function (S) { let n = 0; for (const id in S.solved) n += AK.starsOf(S, id); return n; };
  AK.BADGES = [
    { id: "first-spark", icon: "✨", en: "First Spark", te: "మొదటి మెరుపు", desc: "Solve your first mission." },
    { id: "no-hints", icon: "🧠", en: "Own Brain", te: "స్వంత బుద్ధి", desc: "Solve a mission without any hints." },
    { id: "bug-squasher", icon: "🐛", en: "Bug Squasher", te: "బగ్ వేటగాడు", desc: "Fix a broken program in a bug-fix mission." },
    { id: "explainer", icon: "💬", en: "Explainer", te: "వివరణకారుడు", desc: "Explain your fix in your own words 3 times." },
    { id: "comparer", icon: "⚖️", en: "Code Critic", te: "కోడ్ విమర్శకుడు", desc: "Vote on a solution in the comparison view." },
    { id: "streak-3", icon: "🔥", en: "3-Day Streak", te: "3 రోజుల వరుస", desc: "Learn on 3 days in a row." },
    { id: "streak-7", icon: "🌋", en: "7-Day Streak", te: "7 రోజుల వరుస", desc: "Learn on 7 days in a row." },
    { id: "outage-survivor", icon: "🚨", en: "Outage Survivor", te: "అంతరాయ విజేత", desc: "Fix a server outage in the simulated terminal." },
    { id: "weekly-hero", icon: "🏅", en: "Weekly Hero", te: "వారపు వీరుడు", desc: "Solve the Outage of the Week during its week." },
    { id: "three-stars", icon: "⭐", en: "Triple Star", te: "మూడు నక్షత్రాలు", desc: "Earn 3 stars on a mission: no hints and a clean solution." },
    { id: "star-collector", icon: "🌟", en: "Star Collector", te: "నక్షత్ర సేకర్త", desc: "Collect 40 stars across missions." },
    { id: "predictor", icon: "🔮", en: "Mind Compiler", te: "మనసు కంపైలర్", desc: "Predict the output correctly in 10 missions." },
    { id: "pest-control", icon: "🪲", en: "Pest Control", te: "పురుగుల వేట", desc: "Finish a Daily Quest." },
    { id: "daily-7", icon: "📅", en: "Daily Habit", te: "రోజువారీ అలవాటు", desc: "Finish 7 Daily Quests." },
    { id: "python-graduate", icon: "🎓", en: "Python Graduate", te: "పైథాన్ పట్టభద్రుడు", desc: "Complete every Python Quest region." },
    { id: "sql-sage", icon: "🗃️", en: "SQL Sage", te: "SQL పండితుడు", desc: "Clear every SQL region." },
    { id: "git-guardian", icon: "🌿", en: "Git Guardian", te: "గిట్ రక్షకుడు", desc: "Clear every Git region." },
    { id: "career-ready", icon: "💼", en: "Career Ready", te: "ఉద్యోగ సిద్ధం", desc: "Clear Python for DevOps and Interview Prep." },
    { id: "case-closed", icon: "🕵️", en: "Case Closed", te: "కేసు ముగిసింది", desc: "Solve a Mystery Case." },
    { id: "detective", icon: "🔎", en: "Chief Detective", te: "ప్రధాన డిటెక్టివ్", desc: "Solve every Mystery Case." },
    { id: "speedster", icon: "⏱️", en: "Speedster", te: "వేగవీరుడు", desc: "Set a Speed Run record on 3 missions." },
    { id: "blitzer", icon: "⚡", en: "Blitz Brain", te: "మెరుపు మెదడు", desc: "Finish a Prediction Blitz with 5 of 5 right." },
    { id: "birdie", icon: "⛳", en: "Birdie", te: "బర్డీ", desc: "Beat par on a Code Golf hole." },
    { id: "golf-pro", icon: "🏌️", en: "Golf Pro", te: "గోల్ఫ్ ప్రో", desc: "Beat par on 5 Code Golf holes." },
    { id: "pair-pro", icon: "🦜", en: "Pair Programmer", te: "జంట ప్రోగ్రామర్", desc: "Help Chilaka fix 5 bugs in Pair Parrot." },
    { id: "dungeon-5", icon: "🕳️", en: "Dungeon Delver", te: "గుహ అన్వేషి", desc: "Reach floor 5 of the Endless Dungeon." },
    { id: "dungeon-15", icon: "🐉", en: "Dungeon Master", te: "గుహ నాయకుడు", desc: "Reach floor 15 of the Endless Dungeon." },
    { id: "placed", icon: "🧭", en: "Pathfinder", te: "మార్గదర్శి", desc: "Take the placement quiz." },
    { id: "builder", icon: "🏗️", en: "Village Builder", te: "గ్రామ నిర్మాత", desc: "Place 6 buildings in Aata-gram." },
    { id: "pal", icon: "🐿️", en: "Chilaka's Pal", te: "చిలుక స్నేహితుడు", desc: "Adopt a companion for Chilaka." },
    { id: "day-outage", icon: "🌅", en: "On Call Today", te: "ఈ రోజు ఆన్-కాల్", desc: "Solve an Outage of the Day." },
  ];
  AK.regionBadge = function (region) {
    return { id: "region-" + region.id, icon: region.icon || "🏁", en: region.title + " cleared", te: (region.title_te || region.title) + " పూర్తి", desc: "Beat the boss of " + region.title + "." };
  };
  AK.allBadges = function (data) {
    return AK.BADGES.concat(data.regions.map(AK.regionBadge));
  };

  AK.checkBadges = function (S, data, now) {
    const earned = [];
    const give = (id) => { if (!S.badges[id]) { S.badges[id] = AK.dateKey(now); earned.push(id); } };
    const solvedMs = data.missions.filter((m) => S.solved[m.id]);
    if (solvedMs.length >= 1) give("first-spark");
    if (solvedMs.some((m) => S.solved[m.id].hints === 0)) give("no-hints");
    if (solvedMs.some((m) => m.boss || m.type === "fix-the-bug")) give("bug-squasher");
    if (Object.values(S.explains).filter((e) => e.bonus).length >= 3) give("explainer");
    if (Object.keys(S.votes).some((k) => Object.keys(S.votes[k]).length)) give("comparer");
    if (S.streak.count >= 3) give("streak-3");
    if (S.streak.count >= 7) give("streak-7");
    if (solvedMs.some((m) => m.type === "terminal")) give("outage-survivor");
    if (Object.keys(S.weekly).length) give("weekly-hero");
    if (solvedMs.some((m) => AK.starsOf(S, m.id) >= 3)) give("three-stars");
    if (AK.totalStars(S) >= 40) give("star-collector");
    if (solvedMs.filter((m) => m.type === "predict").length >= 10) give("predictor");
    if (S.dailyDone >= 1) give("pest-control");
    if (S.dailyDone >= 7) give("daily-7");
    const pyRegions = data.regions.filter((r) => r.track === "python");
    for (const r of data.regions) if (AK.regionComplete(S, data, r.id)) give("region-" + r.id);
    if (pyRegions.length && pyRegions.every((r) => AK.regionComplete(S, data, r.id))) give("python-graduate");
    const trackDone = (id) => { const rs = data.regions.filter((r) => r.track === id); return rs.length > 0 && rs.every((r) => AK.regionComplete(S, data, r.id)); };
    if (trackDone("sql")) give("sql-sage");
    if (trackDone("git")) give("git-guardian");
    if (trackDone("career")) give("career-ready");
    const mys = data.missions.filter((m) => m.region === "mystery-cases");
    if (mys.some((m) => S.solved[m.id])) give("case-closed");
    if (mys.length && mys.every((m) => S.solved[m.id])) give("detective");
    if (Object.keys(S.speed || {}).length >= 3) give("speedster");
    if ((S.blitz || {}).perfect) give("blitzer");
    const golfUnder = data.missions.filter((m) => m.golf && S.golf && S.golf[m.id] && S.golf[m.id].best < m.golf.par);
    if (golfUnder.length >= 1) give("birdie");
    if (golfUnder.length >= 5) give("golf-pro");
    if (data.missions.filter((m) => m.type === "pair" && S.solved[m.id]).length >= 5) give("pair-pro");
    if (((S.dungeon || {}).best || 0) >= 5) give("dungeon-5");
    if (((S.dungeon || {}).best || 0) >= 15) give("dungeon-15");
    if (S.placed) give("placed");
    if (((S.village || {}).plots || []).filter(Boolean).length >= 6) give("builder");
    if (S.companion) give("pal");
    if (Object.keys(S.outageDays || {}).length) give("day-outage");
    return earned;
  };

  /* Awards XP for a first solve. Hints cost 5 XP each (never below half the base). */
  AK.applySolve = function (S, data, m, opts) {
    const now = opts.now || new Date();
    if (S.solved[m.id]) return { repeat: true, gained: 0, breakdown: [], newBadges: [], rankUp: false };
    const hints = opts.hintsUsed || 0;
    const before = AK.rankFor(S.xp).index;
    const base = m.xp || 20;
    const main = Math.max(Math.round(base / 2), base - hints * 5);
    const breakdown = [{ label: "Mission", xp: main }];
    if (hints > 0) breakdown.push({ label: "Hints used: " + hints, xp: 0 });
    let total = main;
    if (hints === 0) { breakdown.push({ label: "No-hints bonus", xp: 10 }); total += 10; }
    const stars = starsFor(m, hints, opts);
    if (stars === 3) { breakdown.push({ label: "Mastery star bonus", xp: 5 }); total += 5; }
    let seeds = 2 + stars + (m.boss ? 3 : 0);
    if (m.type === "pair" && opts.diagFirst) { breakdown.push({ label: "Spotted the misconception first try", xp: 5 }); total += 5; }
    if (opts.weeklyId && opts.weeklyId === m.id) {
      breakdown.push({ label: "Outage of the Week", xp: 30 }); total += 30; seeds += 5;
      S.weekly[String(AK.weekIndex(now))] = m.id;
    }
    if (opts.dayId && opts.dayId === m.id) {
      breakdown.push({ label: "Outage of the Day", xp: 15 }); total += 15; seeds += 5;
      S.outageDays = S.outageDays || {}; S.outageDays[AK.dateKey(now)] = m.id;
    }
    S.solved[m.id] = { xp: total, hints: hints, at: AK.dateKey(now), code: opts.code || "", stars: stars };
    touchStreak(S, now);
    S.seeds = S.seeds || { earned: 0, spent: 0 }; S.seeds.earned += seeds;
    AK.recomputeXp(S);
    const newBadges = AK.checkBadges(S, data, now);
    return { repeat: false, gained: total, seeds: seeds, stars: stars, breakdown: breakdown, newBadges: newBadges, rankUp: AK.rankFor(S.xp).index > before };
  };

  /* 1 star = solved; 2 = no hints; 3 = no hints and (clean-up challenge passed, or solved on the first check). */
  function starsFor(m, hints, opts) {
    if (hints > 0) return 1;
    const third = m.clean ? opts.cleanPass === true : opts.firstTry !== false;
    return third ? 3 : 2;
  }
  /* Re-checking a solved mission can upgrade its stars (e.g. after finishing the clean-up challenge). */
  AK.restar = function (S, data, m, opts) {
    const r = S.solved[m.id]; if (!r) return { upgraded: false, newBadges: [] };
    const now = opts.now || new Date(), cur = AK.starsOf(S, m.id), want = starsFor(m, r.hints || 0, opts);
    if (want <= cur) return { upgraded: false, stars: cur, newBadges: [] };
    r.stars = want;
    if (want === 3) r.xp = (r.xp || 0) + 5;
    AK.recomputeXp(S);
    return { upgraded: true, stars: want, bonus: want === 3 ? 5 : 0, newBadges: AK.checkBadges(S, data, now) };
  };

  /* Daily Quest: three quick predict-the-output cards, picked per day. */
  function hash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return h; }
  AK.dailySet = function (S, data, now) {
    const key = AK.dateKey(now);
    const preds = data.missions.filter((m) => m.type === "predict");
    const openRegions = new Set(data.regions.filter((r) => { const f = AK.regionMissions(data, r.id)[0]; return f && AK.isUnlocked(S, data, f, null); }).map((r) => r.id));
    let pool = preds.filter((m) => openRegions.has(m.region));
    if (pool.length < 3) pool = preds;
    return pool.slice().sort((a, b) => hash(key + a.id) - hash(key + b.id)).slice(0, 3);
  };
  AK.dailyAnswer = function (S, data, id, firstTry, now) {
    now = now || new Date();
    const key = AK.dateKey(now), set = AK.dailySet(S, data, now).map((m) => m.id);
    if (S.daily.date !== key) S.daily = { date: key, done: {}, pts: 0, bonus: false };
    if (!set.includes(id) || S.daily.done[id]) return { gained: 0, complete: false, newBadges: [] };
    const pts = firstTry ? 5 : 2;
    S.daily.done[id] = true; S.daily.pts += pts; S.dailyXp += pts;
    let gained = pts, complete = false;
    S.seeds = S.seeds || { earned: 0, spent: 0 }; S.seeds.earned += 1;
    if (set.every((x) => S.daily.done[x]) && !S.daily.bonus) { complete = true; S.daily.bonus = true; S.dailyXp += 10; gained += 10; S.dailyDone += 1; S.seeds.earned += 3; }
    touchStreak(S, now);
    AK.recomputeXp(S);
    return { gained: gained, complete: complete, newBadges: AK.checkBadges(S, data, now) };
  };

  AK.addExplanation = function (S, data, id, text, now) {
    text = (text || "").trim();
    const first = !S.explains[id];
    const bonus = text.length >= 12 && (first || !S.explains[id].bonus);
    S.explains[id] = { text: text, bonus: !!(S.explains[id] && S.explains[id].bonus) || bonus };
    AK.recomputeXp(S);
    return { bonus: bonus, newBadges: AK.checkBadges(S, data, now || new Date()) };
  };

  AK.mergeState = function (cur, inc) {
    const out = JSON.parse(JSON.stringify(cur));
    for (const id in inc.solved || {}) {
      if (!out.solved[id] || (inc.solved[id].xp || 0) > (out.solved[id].xp || 0)) out.solved[id] = inc.solved[id];
    }
    for (const id in inc.explains || {}) if (!out.explains[id] || inc.explains[id].bonus) out.explains[id] = inc.explains[id];
    for (const id in inc.badges || {}) if (!out.badges[id]) out.badges[id] = inc.badges[id];
    for (const id in inc.drafts || {}) if (!(id in out.drafts)) out.drafts[id] = inc.drafts[id];
    for (const id in inc.testOut || {}) if (inc.testOut[id]) out.testOut[id] = true;
    for (const id in inc.votes || {}) out.votes[id] = Object.assign({}, inc.votes[id], out.votes[id] || {});
    for (const id in inc.weekly || {}) out.weekly[id] = inc.weekly[id];
    out.dailyXp = Math.max(out.dailyXp || 0, inc.dailyXp || 0); out.dailyDone = Math.max(out.dailyDone || 0, inc.dailyDone || 0);
    if (inc.daily && inc.daily.date > (out.daily.date || "")) out.daily = inc.daily;

  AK.DUNGEON_TEMPLATES = DUNGEON.map((t) => t.id);

  AK.dungeonFloor = function (seed, floor) {
    let prev = null, pick = null;
    for (let f = 1; f <= floor; f++) {
      const r = rng((seed * 7919 + f * 104729) >>> 0), pool = DUNGEON.filter((t) => t.min <= Math.min(f, 12) && t.id !== prev);

  };

    const show = (c) => { const r = run(c); return r.err ? "Error: " + r.err.type : String(r.out || "").replace(/\s+$/, ""); };
    const right = show(def.code); if (right === "" || right.indexOf("Error") === 0) return null;
    const opts = [right]; def.variants.forEach((v) => { const o = show(v); if (o !== "" && opts.indexOf(o) < 0) opts.push(o); });
    if (opts.length < 3) return null;
    const four = opts.slice(0, 4), k = (parseInt(def.floor, 10) * 7 + def.code.length) % four.length, others = four.slice(1);
    const list = others.slice(0, k).concat([right], others.slice(k));
    return { floor: def.floor, title: def.title, code: def.code, options: list, answer: k, template: def.template };

  AK.dungeonEnd = function (S, data, floors, now) {
    S.dungeon = S.dungeon || { best: 0, runs: 0 }; S.dungeon.runs++; const pb = floors > S.dungeon.best; if (pb) S.dungeon.best = floors;
    return { pb: pb, best: S.dungeon.best, newBadges: AK.checkBadges(S, data, now || new Date()) };
