the bug, and how did you fix it?","xp":35,"skills":["loops","range"],"requires":["py-16-bugfix-5"],"solution":"def total(n):\n    s = 0\n    for i in range(1, n + 1):\n        s += i\n    return s\n","alt":"def total(n):\n    return sum(range(1, n + 1))\n","parrot":{"says":"Squawk! I add every number from 1 to n. Easy! (n = 3 gives me 3... is that right?)"},"diagnose":{"question":"What is wrong?","options":["The loop stops one number early, so n is never added","The variable total is spelled wrong","range cannot be used with sum","The function needs a print"],"answer":0,"why":"range(1, n) stops BEFORE n. Use range(1, n + 1) so n is included."}},{"id":"pair-02-adult","region":"pair-parrot","order":2,"title":"Just Turned Eighteen","story":"The ticket booth turns away exactly-eighteen-year-olds. Chilaka insists the rule is right.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def is_adult(age):\n    if age > 18:\n        return True\n    return False\n","tests":[{"kind":"eval","label":"20","expr":"is_adult(20)","expect":"True"},{"kind":"eval","label":"18","expr":"is_adult(18)","expect":"True"},{"kind":"eval","label":"10","expr":"is_adult(10)","expect":"False","hidden":true},{"kind":"eval","label":"17","expr":"is_adult(17)","expect":"False","hidden":true}],"hints":["Test the boundary: what does is_adult(18) give?","Is 18 over eighteen, or eighteen and over?","def is_adult(age):\n    if age >= 18:\n        return True\n    return False\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["comparison","if"],"requires":["pair-01-range"],"solution":"def is_adult(age):\n    if age >= 18:\n        return True\n    return False\n","alt":"def is_adult(age):\n    return age >= 18\n","parrot":{"says":"Squawk! Adults are people OVER eighteen. Rules are rules!"},"diagnose":{"question":"Which statement explains the bug?","options":["> is false for exactly 18, but 18-year-olds are adults","The function should use input()","return cannot be inside if","age must be a string"],"answer":0,"why":"The rule is 18 or older, so the comparison must be >= 18."}},{"id":"pair-03-print","region":"pair-parrot","order":3,"title":"Prints, Never Returns","story":"doubled() shows the right numbers on screen, but other code that uses its answer gets None.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def doubled(nums):\n    out = []\n    for n in nums:\n        out.append(n * 2)\n    print(out)\n","tests":[{"kind":"eval","label":"basic","expr":"doubled([1, 2, 3])","expect":"[2, 4, 6]"},{"kind":"eval","label":"empty","expr":"doubled([])","expect":"[]","hidden":true},{"kind":"eval","label":"one","expr":"doubled([5])","expect":"[10]","hidden":true}],"hints":["What does the caller receive from this function?","Replace print(out) with something that gives the list back.","def doubled(nums):\n    out = []\n    for n in nums:\n        out.append(n * 2)\n    return out\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["functions","return"],"requires":["pair-02-adult"],"solution":"def doubled(nums):\n    out = []\n    for n in nums:\n        out.append(n * 2)\n    return out\n","alt":"def doubled(nums):\n    return [n * 2 for n in nums]\n","parrot":{"says":"Squawk! Look, it prints the right numbers! My work here is done."},"diagnose":{"question":"Why does other code get None?","options":["It prints the list instead of returning it","The list is empty","for loops cannot build lists","The name nums is reserved"],"answer":0,"why":"print only shows a value. A function hands a value to its caller with return."}},{"id":"pair-04-early-return","region":"pair-parrot","order":4,"title":"The Impatient Loop","story":"count_even() only ever looks at the first number.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def count_even(nums):\n    count = 0\n    for n in nums:\n        if n % 2 == 0:\n            count += 1\n        return count\n","tests":[{"kind":"eval","label":"mixed","expr":"count_even([2, 4, 5, 6])","expect":"3"},{"kind":"eval","label":"none","expr":"count_even([1, 3])","expect":"0"},{"kind":"eval","label":"all","expr":"count_even([2, 4])","expect":"2","hidden":true},{"kind":"eval","label":"empty","expr":"count_even([])","expect":"0","hidden":true}],"hints":["How many times does the loop body run before return?","Look at the indentation of return.","def count_even(nums):\n    count = 0\n    for n in nums:\n        if n % 2 == 0:\n            count += 1\n    return count\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["loops","indentation"],"requires":["pair-03-print"],"solution":"def count_even(nums):\n    count = 0\n    for n in nums:\n        if n % 2 == 0:\n            count += 1\n    return count\n","alt":"def count_even(nums):\n    return len([n for n in nums if n % 2 == 0])\n","parrot":{"says":"Squawk! I return as soon as I know the answer. Efficient!"},"diagnose":{"question":"What makes the loop stop after one item?","options":["return is inside the loop, so it runs on the first pass","range is missing","n % 2 is wrong","count is a reserved word"],"answer":0,"why":"A return inside the loop ends the whole function. Return after the loop finishes."}},{"id":"pair-05-text-number","region":"pair-parrot","order":5,"title":"Text Plus Number","story":"The greeting crashes with a TypeError, and Chilaka blames Python.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def greet(name, age):\n    return \"Hi \" + name + \", you are \" + age\n","tests":[{"kind":"eval","label":"basic","expr":"greet(\"Asha\", 12)","expect":"'Hi Asha, you are 12'"},{"kind":"eval","label":"other","expr":"greet(\"Ravi\", 40)","expect":"'Hi Ravi, you are 40'","hidden":true}],"hints":["Which of the joined things is not text?","str() turns a number into text.","def greet(name, age):\n    return \"Hi \" + name + \", you are \" + str(age)\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["strings","types"],"requires":["pair-04-early-return"],"solution":"def greet(name, age):\n    return \"Hi \" + name + \", you are \" + str(age)\n","alt":"def greet(name, age):\n    return f\"Hi {name}, you are {age}\"\n","parrot":{"says":"Squawk! Python should understand that 12 is a nice thing to say!"},"diagnose":{"question":"What does the error mean?","options":["You cannot join text and a number with +; convert the number to text","age is not defined","The string has too few quotes","return needs brackets"],"answer":0,"why":"+ joins text to text. Convert with str(age) or use an f-string."}},{"id":"pair-06-mutate","region":"pair-parrot","order":6,"title":"Deleting While Looping","story":"remove_negatives() leaves some negative numbers behind.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def remove_negatives(nums):\n    for n in nums:\n        if n < 0:\n            nums.remove(n)\n    return nums\n","tests":[{"kind":"eval","label":"adjacent","expr":"remove_negatives([1, -2, -3, 4])","expect":"[1, 4]"},{"kind":"eval","label":"all","expr":"remove_negatives([-1, -2, -3])","expect":"[]"},{"kind":"eval","label":"none","expr":"remove_negatives([1, 2])","expect":"[1, 2]","hidden":true}],"hints":["Run it on [-1, -2, -3] and watch which items are visited.","Instead of deleting, collect the numbers you want to keep.","def remove_negatives(nums):\n    keep = []\n    for n in nums:\n        if n >= 0:\n            keep.append(n)\n    return keep\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["lists","loops"],"requires":["pair-05-text-number"],"solution":"def remove_negatives(nums):\n    keep = []\n    for n in nums:\n        if n >= 0:\n            keep.append(n)\n    return keep\n","alt":"def remove_negatives(nums):\n    return [n for n in nums if n >= 0]\n","parrot":{"says":"Squawk! I delete each negative as I find it. Same list, no waste!"},"diagnose":{"question":"Why are some negatives skipped?","options":["Removing items while looping shifts the list so the next item is skipped","remove only works on strings","The condition should be n > 0","Lists cannot be looped over"],"answer":0,"why":"Changing a list while looping over it skips items. Build a new list instead."}},{"id":"pair-07-int-div","region":"pair-parrot","order":7,"title":"Average Trouble","story":"average() claims the average of 1 and 2 is 1.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def average(nums):\n    return sum(nums) // len(nums)\n","tests":[{"kind":"eval","label":"half","expr":"average([1, 2])","expect":"1.5"},{"kind":"eval","label":"whole","expr":"average([2, 4, 6])","expect":"4.0"},{"kind":"eval","label":"single","expr":"average([5])","expect":"5.0","hidden":true}],"hints":["What is 3 // 2 in Python?","Which divide operator keeps the decimals?","def average(nums):\n    return sum(nums) / len(nums)\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["math","operators"],"requires":["pair-06-mutate"],"solution":"def average(nums):\n    return sum(nums) / len(nums)\n","alt":"def average(nums):\n    total = 0\n    for n in nums:\n        total += n\n    return total / len(nums)\n","parrot":{"says":"Squawk! Averages are whole numbers, I think. Probably."},"diagnose":{"question":"Which operator causes the wrong answer?","options":["// throws away the fraction; use /","sum cannot take a list","len is wrong","return is missing"],"answer":0,"why":"// is floor division. A true average needs / which keeps decimals."}},{"id":"pair-08-shared-list","region":"pair-parrot","order":8,"title":"The Shared Basket","story":"Every shopper's basket mysteriously contains items from other shoppers.","goal":"Diagnose the bug, then fix the code so every check passes.","type":"pair","starter":"def add_item(item, basket=[]):\n    basket.append(item)\n    return basket\n","tests":[{"kind":"eval","label":"first","expr":"add_item(\"rice\")","expect":"['rice']"},{"kind":"eval","label":"second is fresh","expr":"(add_item(\"rice\"), add_item(\"dal\"))[1]","expect":"['dal']"},{"kind":"eval","label":"explicit","expr":"add_item(\"x\", [\"y\"])","expect":"['y', 'x']","hidden":true}],"hints":["Call add_item twice with no basket. What does the second call return?","Use None as the default, then create the list inside.","def add_item(item, basket=None):\n    if basket is None:\n        basket = []\n    basket.append(item)\n    return basket\n"],"socratic":["What did you expect it to do?","What does it do instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":35,"skills":["functions","defaults"],"requires":["pair-07-int-div"],"solution":"def add_item(item, basket=None):\n    if basket is None:\n        basket = []\n    basket.append(item)\n    return basket\n","alt":"def add_item(item, basket=None):\n    basket = [] if basket is None else basket\n    basket.append(item)\n    return basket\n","parrot":{"says":"Squawk! A default basket, free for everyone! Brilliant!"},"diagnose":{"question":"Why do baskets share items?","options":["The default list is created once and reused by every call","append returns a new list","item must be a number","The function is missing a loop"],"answer":0,"why":"A default [] is built once, when the function is defined. Use None and make a new list inside."}},{"id":"f-sort","region":"problem-solving","order":4,"title":"Fill the Bubble Sort","story":"Bubble sort swaps neighbours that are in the wrong order until everything is sorted.","goal":"Print the list sorted from smallest to largest.","type":"fill","starter":"nums = [5, 2, 9, 1]\nfor i in range(len(nums)):\n    for j in range(len(nums) - 1 - i):\n        if nums[j] ___ nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint(nums)\n","tests":[{"kind":"stdout","label":"Sorted","expect":"[1, 2, 5, 9]"}],"hints":["Swap when the left neighbour is bigger than the right one.","Use the > comparison.","nums = [5, 2, 9, 1]\nfor i in range(len(nums)):\n    for j in range(len(nums) - 1 - i):\n        if nums[j] > nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint(nums)\n"],"socratic":["When are two neighbours in the wrong order?","What happens if you use < instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Bubble Sort”?","xp":20,"skills":["sorting"],"requires":["w-binary"],"solution":"nums = [5, 2, 9, 1]\nfor i in range(len(nums)):\n    for j in range(len(nums) - 1 - i):\n        if nums[j] > nums[j + 1]:\n            nums[j], nums[j + 1] = nums[j + 1], nums[j]\nprint(nums)\n"},{"id":"o-two-pointer","region":"problem-solving","order":8,"title":"Order the Two Pointers","story":"Check a palindrome with two markers moving toward the middle. The lines are shuffled.","goal":"Put the lines in order so the program prints True.","type":"order","starter":"ok = True\n    if word[left] != word[right]:\n    left += 1\n    right -= 1\n        ok = False\nwhile left < right:\nprint(ok)\nword = \"level\"\nleft, right = 0, len(word) - 1\n","lines":["ok = True","    if word[left] != word[right]:","    left += 1","    right -= 1","        ok = False","while left < right:","print(ok)","word = \"level\"","left, right = 0, len(word) - 1"],"tests":[{"kind":"stdout","label":"Prints True","expect":"True"}],"hints":["Set up the variables first, loop in the middle, print at the end.","Both markers move inside the loop, after the comparison.","word = \"level\"\nleft, right = 0, len(word) - 1\nok = True\nwhile left < right:\n    if word[left] != word[right]:\n        ok = False\n    left += 1\n    right -= 1\nprint(ok)\n"],"socratic":["What must exist before the loop starts?","Which lines are inside the loop?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["two pointers","order"],"requires":["w-anagram"],"solution":"word = \"level\"\nleft, right = 0, len(word) - 1\nok = True\nwhile left < right:\n    if word[left] != word[right]:\n        ok = False\n    left += 1\n    right -= 1\nprint(ok)\n"},{"id":"p-big-o","region":"problem-solving","order":1,"title":"Count the Steps","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"steps = 0\nfor i in range(4):\n    for j in range(3):\n        steps += 1\nprint(steps)","options":["7","3","12","4"],"answer":2,"why":"The inner loop runs 3 times for each of the 4 outer rounds: 4 x 3 = 12. Nested loops multiply work, which is why they get slow.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","How many times does the inner loop run in total?","The output is:\n12"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["complexity"],"requires":["cc-boss"],"solution":"12"},{"id":"p-recursion-trace","region":"problem-solving","order":5,"title":"Trace the Recursion","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def f(n):\n    if n == 0:\n        return 0\n    return n + f(n - 1)\nprint(f(4))","options":["4","24","10","0"],"answer":2,"why":"f(4) = 4 + f(3) = 4 + 3 + f(2) = ... = 4 + 3 + 2 + 1 + 0 = 10. Each call waits for the smaller one to finish.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Write out f(4), f(3), f(2), f(1), f(0) in a column.","The output is:\n10"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["recursion"],"requires":["f-sort"],"solution":"10"},{"id":"proj-maze","region":"problem-solving","order":9,"title":"Project: Maze Walker","story":"The maze garden is a grid. S is where you start, E is the exit, # is a hedge. Is there a way out?","goal":"Write solvable(grid) for a list of strings. Move up, down, left or right through any cell that is not #. Return True if E can be reached from S.","type":"write-code","starter":"# define solvable (a queue or a stack both work)\n","tests":[{"kind":"eval","label":"Straight corridor","expr":"solvable([\"S.E\"])","expect":"True"},{"kind":"eval","label":"Blocked","expr":"solvable([\"S#E\"])","expect":"False"},{"kind":"eval","label":"Winding path","expr":"solvable([\"S.#\", \"..#\", \"#.E\"])","expect":"True"},{"kind":"eval","label":"No way out","expr":"solvable([\"S.#\", \"##.\", \".#E\"])","expect":"False"},{"kind":"eval","label":"Big open garden","expr":"solvable([\"S\" + \".\" * 29] + [\".\" * 30] * 28 + [\".\" * 29 + \"E\"])","expect":"True","hidden":true}],"hints":["Explore from S, remembering which cells you have visited so you never go in circles.","Keep a queue of cells to explore. Take one, add its unvisited open neighbours, repeat. If you reach E, return True; if the queue empties, return False.","from collections import deque\n\n\ndef solvable(grid):\n    rows, cols = len(grid), len(grid[0])\n    start = None\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"S\":\n                start = (r, c)\n    queue = deque([start])\n    seen = {start}\n    while queue:\n        r, c = queue.popleft()\n        if grid[r][c] == \"E\":\n            return True\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                queue.append((nr, nc))\n    return False\n"],"socratic":["How do you avoid walking in circles?","When can you be sure there is no way out?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Maze Walker”?","xp":80,"skills":["BFS","grids"],"requires":["o-two-pointer"],"solution":"from collections import deque\n\n\ndef solvable(grid):\n    rows, cols = len(grid), len(grid[0])\n    start = None\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"S\":\n                start = (r, c)\n    queue = deque([start])\n    seen = {start}\n    while queue:\n        r, c = queue.popleft()\n        if grid[r][c] == \"E\":\n            return True\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nr, nc = r + dr, c + dc\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                queue.append((nr, nc))\n    return False\n","alt":"def solvable(grid):\n    rows, cols = len(grid), len(grid[0])\n    stack = [(r, c) for r in range(rows) for c in range(cols) if grid[r][c] == \"S\"]\n    seen = set(stack)\n    while stack:\n        r, c = stack.pop()\n        if grid[r][c] == \"E\":\n            return True\n        for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):\n            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n                seen.add((nr, nc))\n                stack.append((nr, nc))\n    return False\n","project":true},{"id":"ps-boss","region":"problem-solving","order":10,"title":"Boss: The Endless Search","story":"This binary search sometimes loops forever and sometimes misses an item that is really there.","goal":"Fix binary_search so it finds every item and always stops.","type":"fix-the-bug","starter":"def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low < high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            low = mid\n        else:\n            high = mid - 1\n    return -1\n","tests":[{"kind":"eval","label":"Found at the end","expr":"binary_search([1, 3, 5, 7], 7)","expect":"3"},{"kind":"eval","label":"Single item","expr":"binary_search([1], 1)","expect":"0"},{"kind":"eval","label":"Missing","expr":"binary_search([1, 3], 4)","expect":"-1"},{"kind":"eval","label":"Found at the start","expr":"binary_search([1, 3, 5], 1)","expect":"0","hidden":true}],"hints":["Two bugs. One makes the loop stop too early when low and high meet. The other fails to shrink the range, so it can repeat forever.","Use while low <= high, and move low to mid + 1 (not mid).","def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n"],"socratic":["What happens when low and high are the same position?","Does low = mid shrink the range when mid equals low?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":70,"skills":["debugging","search"],"requires":["proj-maze"],"solution":"def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        elif items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n","alt":"def binary_search(items, target):\n    low, high = 0, len(items)\n    while low < high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid\n    return -1\n","boss":true},{"id":"w-anagram","region":"problem-solving","order":7,"title":"Anagram Check","story":"Two words are anagrams if they use the same letters. The garden gate checks for them.","goal":"Write is_anagram(a, b) ignoring case and spaces.","type":"write-code","starter":"# define is_anagram\n","tests":[{"kind":"eval","label":"Classic","expr":"is_anagram(\"Listen\", \"Silent\")","expect":"True"},{"kind":"eval","label":"Not anagrams","expr":"is_anagram(\"hello\", \"world\")","expect":"False"},{"kind":"eval","label":"Spaces ignored","expr":"is_anagram(\"Dormitory\", \"dirty room\")","expect":"True","hidden":true}],"hints":["Two words are anagrams if their letters, when sorted, are identical.","Clean both words (lowercase, no spaces), then compare sorted(...) of each.","def is_anagram(a, b):\n    return sorted(a.replace(\" \", \"\").lower()) == sorted(b.replace(\" \", \"\").lower())\n"],"socratic":["What is the same about the letters of two anagrams?","What must you ignore?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Anagram Check”?","xp":30,"skills":["sorting","strings"],"requires":["w-two-sum"],"solution":"def is_anagram(a, b):\n    return sorted(a.replace(\" \", \"\").lower()) == sorted(b.replace(\" \", \"\").lower())\n","alt":"from collections import Counter\n\n\ndef is_anagram(a, b):\n    ca = Counter(a.replace(\" \", \"\").lower())\n    cb = Counter(b.replace(\" \", \"\").lower())\n    return ca == cb\n","clean":{"label":"Solve it in 3 lines or fewer","tests":[{"kind":"maxlines","max":3,"label":"3 lines or fewer"}]}},{"id":"w-binary","region":"problem-solving","order":3,"title":"Binary Search","story":"The gate numbers are sorted. Halve the search each time and find a gate among a million in about twenty steps.","goal":"Write binary_search(items, target) for a sorted list: return the index or -1. It must be fast: a hidden check searches half a million items.","type":"write-code","starter":"# define binary_search\n","tests":[{"kind":"eval","label":"Found","expr":"binary_search([1, 3, 5, 7], 5)","expect":"2"},{"kind":"eval","label":"Not found","expr":"binary_search([1, 3, 5, 7], 4)","expect":"-1"},{"kind":"eval","label":"Empty list","expr":"binary_search([], 1)","expect":"-1"},{"kind":"eval","label":"Huge list, fast","expr":"binary_search(list(range(0, 1000000, 2)), 999998)","expect":"499999","hidden":true},{"kind":"source","label":"No .index()","pattern":"\\.index\\(","absent":true}],"hints":["Look at the middle item. If it is too small, throw away the left half. If too big, throw away the right half.","Keep low and high markers. Loop while low <= high and move one marker past mid each time.","def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n"],"socratic":["What do you learn by checking the middle item?","Why must you move a marker past mid, not onto it?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Binary Search”?","xp":55,"skills":["search","complexity"],"requires":["w-linear"],"solution":"def binary_search(items, target):\n    low, high = 0, len(items) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if items[mid] == target:\n            return mid\n        if items[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n","alt":"def binary_search(items, target):\n    lo, hi = 0, len(items)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if items[mid] < target:\n            lo = mid + 1\n        elif items[mid] > target:\n            hi = mid\n        else:\n            return mid\n    return -1\n"},{"id":"w-linear","region":"problem-solving","order":2,"title":"Find It","story":"The maze garden hides a gate number in a long list. Search it yourself, without shortcuts.","goal":"Write find_index(items, target) returning the position of the first match, or -1. Do not use .index().","type":"write-code","starter":"# define find_index\n","tests":[{"kind":"eval","label":"Found","expr":"find_index([5, 7, 9], 9)","expect":"2"},{"kind":"eval","label":"Not found","expr":"find_index([5, 7, 9], 4)","expect":"-1"},{"kind":"eval","label":"First match wins","expr":"find_index([1, 2, 2], 2)","expect":"1","hidden":true},{"kind":"source","label":"No .index()","pattern":"\\.index\\(","absent":true}],"hints":["Walk the list from the start and compare each item.","enumerate(items) gives (position, value) pairs.","def find_index(items, target):\n    for i, item in enumerate(items):\n        if item == target:\n            return i\n    return -1\n"],"socratic":["What should you return when you reach the end?","Which loop gives you the position and the value?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Find It”?","xp":30,"skills":["search"],"requires":["p-big-o"],"solution":"def find_index(items, target):\n    for i, item in enumerate(items):\n        if item == target:\n            return i\n    return -1\n","alt":"def find_index(items, target):\n    i = 0\n    while i < len(items):\n        if items[i] == target:\n            return i\n        i += 1\n    return -1\n"},{"id":"w-two-sum","region":"problem-solving","order":6,"title":"Two Sum","story":"Two garden stones add up to the magic number. Which two?","goal":"Write two_sum(nums, target) returning a tuple (i, j) with i < j and nums[i] + nums[j] == target, or None if none exist.","type":"write-code","starter":"# define two_sum\n","tests":[{"kind":"eval","label":"Classic","expr":"two_sum([2, 7, 11, 15], 9)","expect":"(0, 1)"},{"kind":"eval","label":"Not the first item","expr":"two_sum([3, 2, 4], 6)","expect":"(1, 2)"},{"kind":"eval","label":"Same value twice","expr":"two_sum([3, 3], 6)","expect":"(0, 1)"},{"kind":"eval","label":"No answer","expr":"two_sum([1, 2], 10) is None","expect":"True","hidden":true}],"hints":["A slow way checks every pair. Can you remember earlier numbers in a dictionary instead?","For each number, ask: have I already seen target - number? Store number -> position as you go.","def two_sum(nums, target):\n    seen = {}\n    for j, n in enumerate(nums):\n        if target - n in seen:\n            return (seen[target - n], j)\n        seen[n] = j\n    return None\n"],"socratic":["What partner would the current number need?","How can a dictionary answer 'have I seen it?' quickly?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Two Sum”?","xp":50,"skills":["dicts","search"],"requires":["p-recursion-trace"],"solution":"def two_sum(nums, target):\n    seen = {}\n    for j, n in enumerate(nums):\n        if target - n in seen:\n            return (seen[target - n], j)\n        seen[n] = j\n    return None\n","alt":"def two_sum(nums, target):\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            if nums[i] + nums[j] == target:\n                return (i, j)\n    return None\n","clean":{"label":"One pass: use a single loop (no nested loop)","tests":[{"kind":"source","label":"Only one for loop","pattern":"\\bfor\\b[\\s\\S]*\\bfor\\b","absent":true}]}},{"id":"do-boss-healthcheck","region":"python-devops","order":14,"title":"Boss: The Lying Health Check","story":"The health checker says everything is fine while two services are down. The code has three bugs.","goal":"Fix health_report(services): services is a dict name -> status code. Return a sorted list of names whose status is NOT in the 200s (200 to 299 are healthy).","type":"fix-the-bug","starter":"def health_report(services):\n    down = []\n    for name in services:\n        if services[name] == 200:\n            down.append(name)\n    return down.sort\n","tests":[{"kind":"eval","label":"two down","expr":"health_report({\"web\": 200, \"db\": 503, \"cache\": 500, \"api\": 204})","expect":"['cache', 'db']"},{"kind":"eval","label":"all fine","expr":"health_report({\"a\": 200, \"b\": 201})","expect":"[]"},{"kind":"eval","label":"redirect is down","expr":"health_report({\"a\": 301})","expect":"['a']","hidden":true},{"kind":"eval","label":"boundary","expr":"health_report({\"x\": 299, \"y\": 300})","expect":"['y']","hidden":true}],"hints":["Run it with a dict. What does it return? .sort without brackets is not a call, and it returns None anyway.","A healthy status is 200 <= code < 300. You want the services that are NOT healthy.","def health_report(services):\n    down = []\n    for name in services:\n        if not (200 <= services[name] < 300):\n            down.append(name)\n    return sorted(down)\n"],"socratic":["Which services should be in the answer?","What does list.sort() return?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":50,"skills":["devops","debugging"],"requires":["do-group-by"],"solution":"def health_report(services):\n    down = []\n    for name in services:\n        if not (200 <= services[name] < 300):\n            down.append(name)\n    return sorted(down)\n","alt":"def health_report(services):\n    return sorted(n for n, code in services.items() if code < 200 or code >= 300)\n","boss":true},{"id":"do-count-errors","region":"python-devops","order":1,"title":"Count the Errors","story":"Dawn on-call. The log file has hundreds of lines and you only need the number of ERROR lines.","goal":"Write count_errors(lines): return how many lines contain the word ERROR.","type":"write-code","starter":"def count_errors(lines):\n    # count lines containing ERROR\n    pass\n","tests":[{"kind":"eval","label":"2 errors","expr":"count_errors([\"INFO ok\", \"ERROR disk\", \"WARN slow\", \"ERROR db\"])","expect":"2"},{"kind":"eval","label":"none","expr":"count_errors([\"INFO a\", \"INFO b\"])","expect":"0"},{"kind":"eval","label":"empty","expr":"count_errors([])","expect":"0","hidden":true},{"kind":"eval","label":"case matters","expr":"count_errors([\"error lower\", \"ERROR up\"])","expect":"1","hidden":true}],"hints":["Loop over the lines and check each one with the in operator.","Keep a counter. Add 1 when \"ERROR\" in line.","def count_errors(lines):\n    n = 0\n    for line in lines:\n        if \"ERROR\" in line:\n            n += 1\n    return n\n"],"socratic":["What do you check for each line?","What should happen when the list is empty?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Count the Errors”?","xp":30,"skills":["devops","loops"],"requires":["py-16-bugfix-5"],"solution":"def count_errors(lines):\n    n = 0\n    for line in lines:\n        if \"ERROR\" in line:\n            n += 1\n    return n\n","alt":"def count_errors(lines):\n    return sum(1 for line in lines if \"ERROR\" in line)\n"},{"id":"do-group-by","region":"python-devops","order":13,"title":"Group the Logs by Service","story":"Log lines look like service:message. Group the messages per service.","goal":"Write group_by(entries): return a dict mapping each service to the list of its messages, in order.","type":"write-code","starter":"def group_by(entries):\n    # split each entry on the first colon\n    pass\n","tests":[{"kind":"eval","label":"two services","expr":"sorted(group_by([\"db:slow\", \"web:ok\", \"db:down\"]).items())","expect":"[('db', ['slow', 'down']), ('web', ['ok'])]"},{"kind":"eval","label":"message with colon","expr":"group_by([\"a:x:y\"])","expect":"{'a': ['x:y']}","hidden":true},{"kind":"eval","label":"empty","expr":"group_by([])","expect":"{}","hidden":true}],"hints":["Use split(\":\", 1) to get the service and the rest.","dict.setdefault(service, []).append(message)","def group_by(entries):\n    groups = {}\n    for entry in entries:\n        service, message = entry.split(\":\", 1)\n        groups.setdefault(service, []).append(message)\n    return groups\n"],"socratic":["What is the key and what is the value?","What if a service appears for the first time?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Group the Logs by Service”?","xp":30,"skills":["devops","dicts"],"requires":["do-human-size"],"solution":"def group_by(entries):\n    groups = {}\n    for entry in entries:\n        service, message = entry.split(\":\", 1)\n        groups.setdefault(service, []).append(message)\n    return groups\n","alt":"def group_by(entries):\n    groups = {}\n    for e in entries:\n        s, m = e.split(\":\", 1)\n        if s not in groups:\n            groups[s] = []\n        groups[s].append(m)\n    return groups\n"},{"id":"do-human-size","region":"python-devops","order":12,"title":"Bytes for Humans","story":"df says 1610612736. Nobody reads that.","goal":"Write human(n): return the size with one decimal and the unit B, KB, MB or GB (1024 per step), like \"1.5 GB\" or \"512.0 B\".","type":"write-code","starter":"def human(n):\n    # divide by 1024 while n >= 1024\n    pass\n","tests":[{"kind":"eval","label":"gb","expr":"human(1610612736)","expect":"'1.5 GB'"},{"kind":"eval","label":"mb","expr":"human(5 * 1024 * 1024)","expect":"'5.0 MB'"},{"kind":"eval","label":"bytes","expr":"human(512)","expect":"'512.0 B'","hidden":true},{"kind":"eval","label":"kb","expr":"human(2048)","expect":"'2.0 KB'","hidden":true}],"hints":["Keep a list of units and divide while the number is 1024 or more.","Format with f\"{n:.1f} {unit}\".","def human(n):\n    units = [\"B\", \"KB\", \"MB\", \"GB\"]\n    i = 0\n    n = float(n)\n    while n >= 1024 and i < len(units) - 1:\n        n /= 1024\n        i += 1\n    return f\"{n:.1f} {units[i]}\"\n"],"socratic":["When do you switch to the next unit?","How many decimals?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Bytes for Humans”?","xp":30,"skills":["devops","math"],"requires":["do-retry"],"solution":"def human(n):\n    units = [\"B\", \"KB\", \"MB\", \"GB\"]\n    i = 0\n    n = float(n)\n    while n >= 1024 and i < len(units) - 1:\n        n /= 1024\n        i += 1\n    return f\"{n:.1f} {units[i]}\"\n","alt":"def human(n):\n    for unit in [\"B\", \"KB\", \"MB\"]:\n        if n < 1024:\n            return \"%.1f %s\" % (n, unit)\n        n = n / 1024\n    return \"%.1f GB\" % n\n"},{"id":"do-json-port","region":"python-devops","order":4,"title":"JSON Settings","story":"Services ship their settings as JSON. Dig out the port, or fall back to 80.","goal":"Write get_port(text): parse the JSON text and return cfg[\"server\"][\"port\"]; return 80 if server or port is missing.","type":"write-code","starter":"import json\n\ndef get_port(text):\n    # use json.loads\n    pass\n","tests":[{"kind":"eval","label":"present","expr":"get_port('{\"server\": {\"port\": 8443}}')","expect":"8443"},{"kind":"eval","label":"no port","expr":"get_port('{\"server\": {}}')","expect":"80"},{"kind":"eval","label":"no server","expr":"get_port('{}')","expect":"80","hidden":true},{"kind":"eval","label":"other keys","expr":"get_port('{\"name\": \"x\", \"server\": {\"port\": 9, \"tls\": true}}')","expect":"9","hidden":true}],"hints":["json.loads turns JSON text into dicts and lists.","dict.get(key, default) avoids KeyError.","import json\n\ndef get_port(text):\n    cfg = json.loads(text)\n    return cfg.get(\"server\", {}).get(\"port\", 80)\n"],"socratic":["What does json.loads return?","What if a key is missing?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “JSON Settings”?","xp":30,"skills":["devops","json"],"requires":["do-parse-kv"],"solution":"import json\n\ndef get_port(text):\n    cfg = json.loads(text)\n    return cfg.get(\"server\", {}).get(\"port\", 80)\n","alt":"import json\n\ndef get_port(text):\n    cfg = json.loads(text)\n    try:\n        return cfg[\"server\"][\"port\"]\n    except KeyError:\n        return 80\n"},{"id":"do-merge-config","region":"python-devops","order":10,"title":"Defaults and Overrides","story":"Every service has default settings, and each environment overrides a few. Combine them without damaging the defaults.","goal":"Write merge(defaults, overrides): return a NEW dict with the defaults, updated by the overrides. Do not change either input.","type":"write-code","starter":"def merge(defaults, overrides):\n    # return a new dict\n    pass\n","tests":[{"kind":"eval","label":"override","expr":"merge({\"a\": 1, \"b\": 2}, {\"b\": 9})","expect":"{'a': 1, 'b': 9}"},{"kind":"eval","label":"adds","expr":"merge({\"a\": 1}, {\"c\": 3})","expect":"{'a': 1, 'c': 3}"},{"kind":"eval","label":"inputs untouched","expr":"(lambda d, o: (merge(d, o), d))({\"a\": 1}, {\"a\": 2})[1]","expect":"{'a': 1}","hidden":true},{"kind":"eval","label":"empty overrides","expr":"merge({\"x\": 1}, {})","expect":"{'x': 1}","hidden":true}],"hints":["Make a copy first: dict(defaults) or defaults.copy().","Then update the copy with the overrides and return it.","def merge(defaults, overrides):\n    result = dict(defaults)\n    result.update(overrides)\n    return result\n"],"socratic":["What happens if you update defaults directly?","Which side wins on a clash?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Defaults and Overrides”?","xp":30,"skills":["devops","dicts"],"requires":["do-redact"],"solution":"def merge(defaults, overrides):\n    result = dict(defaults)\n    result.update(overrides)\n    return result\n","alt":"def merge(defaults, overrides):\n    return {**defaults, **overrides}\n"},{"id":"do-parse-kv","region":"python-devops","order":3,"title":"Read a Config","story":"Config files are just KEY=VALUE lines. Turn one into a dictionary.","goal":"Write parse_kv(text): return a dict of key to value (both text). Ignore blank lines and lines starting with #.","type":"write-code","starter":"def parse_kv(text):\n    # parse KEY=VALUE lines\n    pass\n","tests":[{"kind":"eval","label":"basic","expr":"parse_kv(\"a=1\\nb=two\")","expect":"{'a': '1', 'b': 'two'}"},{"kind":"eval","label":"comments","expr":"parse_kv(\"# note\\nport=80\\n\\nhost=x\")","expect":"{'port': '80', 'host': 'x'}"},{"kind":"eval","label":"value with equals","expr":"parse_kv(\"url=a=b\")","expect":"{'url': 'a=b'}","hidden":true},{"kind":"eval","label":"empty","expr":"parse_kv(\"\")","expect":"{}","hidden":true}],"hints":["splitlines() gives you the lines. Skip empty ones and the ones that start with #.","Use line.split(\"=\", 1) so only the first = splits.","def parse_kv(text):\n    cfg = {}\n    for line in text.splitlines():\n        line = line.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n        key, value = line.split(\"=\", 1)\n        cfg[key] = value\n    return cfg\n"],"socratic":["Which lines must be skipped?","Why split only once?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Read a Config”?","xp":30,"skills":["devops","strings"],"requires":["do-status-counts"],"solution":"def parse_kv(text):\n    cfg = {}\n    for line in text.splitlines():\n        line = line.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n        key, value = line.split(\"=\", 1)\n        cfg[key] = value\n    return cfg\n","alt":"def parse_kv(text):\n    pairs = [l.split(\"=\", 1) for l in text.splitlines() if l.strip() and not l.strip().startswith(\"#\")]\n    return {k: v for k, v in pairs}\n"},{"id":"do-redact","region":"python-devops","order":9,"title":"Hide the Password","story":"Logs must never contain passwords. Mask them before they are shipped.","goal":"Write redact(line): replace the value after password= with **** (the value ends at a space or the end of the line).","type":"write-code","starter":"import re\n\ndef redact(line):\n    # use re.sub\n    pass\n","tests":[{"kind":"eval","label":"middle","expr":"redact(\"user=asha password=s3cret ip=1.1.1.1\")","expect":"'user=asha password=**** ip=1.1.1.1'"},{"kind":"eval","label":"end","expr":"redact(\"login password=abc123\")","expect":"'login password=****'"},{"kind":"eval","label":"no password","expr":"redact(\"nothing here\")","expect":"'nothing here'","hidden":true},{"kind":"eval","label":"twice","expr":"redact(\"password=a password=b\")","expect":"'password=**** password=****'","hidden":true}],"hints":["A regular expression can find password= followed by non-space characters.","re.sub(r\"password=\\S+\", \"password=****\", line)","import re\n\ndef redact(line):\n    return re.sub(r\"password=\\S+\", \"password=****\", line)\n"],"socratic":["What marks the start of the secret?","Where does it end?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Hide the Password”?","xp":30,"skills":["devops","regex"],"requires":["do-top-ip"],"solution":"import re\n\ndef redact(line):\n    return re.sub(r\"password=\\S+\", \"password=****\", line)\n","alt":"def redact(line):\n    words = line.split(\" \")\n    out = []\n    for w in words:\n        out.append(\"password=****\" if w.startswith(\"password=\") else w)\n    return \" \".join(out)\n"},{"id":"do-retry","region":"python-devops","order":11,"title":"Try, Try Again","story":"Networks flake. Wrap a call so it is retried a few times before giving up.","goal":"Write retry(fn, times): call fn() until it works and return its result. If it still fails after `times` attempts, let the last error escape.","type":"write-code","starter":"def make_flaky(fail_times):\n    state = {\"calls\": 0}\n    def fn():\n        state[\"calls\"] += 1\n        if state[\"calls\"] <= fail_times:\n            raise ConnectionError(\"down\")\n        return \"ok after \" + str(state[\"calls\"])\n    return fn\n\ndef retry(fn, times):\n    # loop, try/except\n    pass\n","tests":[{"kind":"eval","label":"works second time","expr":"retry(make_flaky(1), 3)","expect":"'ok after 2'"},{"kind":"eval","label":"works first time","expr":"retry(make_flaky(0), 3)","expect":"'ok after 1'"},{"kind":"raises","label":"gives up","expr":"retry(make_flaky(5), 3)","exc":"ConnectionError"},{"kind":"eval","label":"exactly enough","expr":"retry(make_flaky(2), 3)","expect":"'ok after 3'","hidden":true}],"hints":["Use a for loop over range(times) with try/except inside.","Remember the last error. After the loop, raise it.","def make_flaky(fail_times):\n    state = {\"calls\": 0}\n    def fn():\n        state[\"calls\"] += 1\n        if state[\"calls\"] <= fail_times:\n            raise ConnectionError(\"down\")\n        return \"ok after \" + str(state[\"calls\"])\n    return fn\n\ndef retry(fn, times):\n    last = None\n    for _ in range(times):\n        try:\n            return fn()\n        except Exception as e:\n            last = e\n    raise last\n"],"socratic":["When should the loop stop early?","What should happen after the last failure?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Try, Try Again”?","xp":40,"skills":["devops","errors"],"requires":["do-merge-config"],"solution":"def make_flaky(fail_times):\n    state = {\"calls\": 0}\n    def fn():\n        state[\"calls\"] += 1\n        if state[\"calls\"] <= fail_times:\n            raise ConnectionError(\"down\")\n        return \"ok after \" + str(state[\"calls\"])\n    return fn\n\ndef retry(fn, times):\n    last = None\n    for _ in range(times):\n        try:\n            return fn()\n        except Exception as e:\n            last = e\n    raise last\n","alt":"def make_flaky(fail_times):\n    state = {\"calls\": 0}\n    def fn():\n        state[\"calls\"] += 1\n        if state[\"calls\"] <= fail_times:\n            raise ConnectionError(\"down\")\n        return \"ok after \" + str(state[\"calls\"])\n    return fn\n\ndef retry(fn, times):\n    attempt = 1\n    while True:\n        try:\n            return fn()\n        except Exception:\n            if attempt >= times:\n                raise\n            attempt += 1\n"},{"id":"do-semver","region":"python-devops","order":6,"title":"Which Version Is Newer?","story":"A deploy script must not install an older release. Compare version strings like 1.10.2 and 1.9.0 properly.","goal":"Write is_newer(a, b): True when version a is newer than version b. Compare number by number, not as text.","type":"write-code","starter":"def is_newer(a, b):\n    # compare dotted versions numerically\n    pass\n","tests":[{"kind":"eval","label":"minor","expr":"is_newer(\"1.10.0\", \"1.9.0\")","expect":"True"},{"kind":"eval","label":"older","expr":"is_newer(\"1.2.3\", \"1.2.4\")","expect":"False"},{"kind":"eval","label":"same","expr":"is_newer(\"2.0.0\", \"2.0.0\")","expect":"False","hidden":true},{"kind":"eval","label":"major","expr":"is_newer(\"3.0.0\", \"2.99.99\")","expect":"True","hidden":true}],"hints":["As text, \"10\" is smaller than \"9\". Convert each piece to an int.","Python compares lists of numbers from left to right: [1, 10] > [1, 9].","def is_newer(a, b):\n    pa = [int(x) for x in a.split(\".\")]\n    pb = [int(x) for x in b.split(\".\")]\n    return pa > pb\n"],"socratic":["Why does text comparison fail for 10 and 9?","What can you compare instead?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Which Version Is Newer?”?","xp":30,"skills":["devops","lists"],"requires":["do-threshold"],"solution":"def is_newer(a, b):\n    pa = [int(x) for x in a.split(\".\")]\n    pb = [int(x) for x in b.split(\".\")]\n    return pa > pb\n","alt":"def is_newer(a, b):\n    return tuple(map(int, a.split(\".\"))) > tuple(map(int, b.split(\".\")))\n"},{"id":"do-status-counts","region":"python-devops","order":2,"title":"Status Code Tally","story":"The load balancer logs one request per line: METHOD PATH STATUS. Management wants a count per status code.","goal":"Write status_counts(lines): return a dict mapping each status code (as text) to how many times it appears.","type":"write-code","starter":"def status_counts(lines):\n    # last word of each line is the status\n    pass\n","tests":[{"kind":"eval","label":"tally","expr":"sorted(status_counts([\"GET / 200\", \"GET /x 404\", \"POST /a 200\"]).items())","expect":"[('200', 2), ('404', 1)]"},{"kind":"eval","label":"single","expr":"status_counts([\"GET / 500\"])","expect":"{'500': 1}"},{"kind":"eval","label":"empty","expr":"status_counts([])","expect":"{}","hidden":true},{"kind":"eval","label":"many","expr":"sorted(status_counts([\"A /a 301\", \"B /b 301\", \"C /c 301\"]).items())","expect":"[('301', 3)]","hidden":true}],"hints":["split() turns a line into words. Which word holds the status?","Use counts[code] = counts.get(code, 0) + 1.","def status_counts(lines):\n    counts = {}\n    for line in lines:\n        code = line.split()[-1]\n        counts[code] = counts.get(code, 0) + 1\n    return counts\n"],"socratic":["Which word is the status?","What do you do the first time you see a code?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Status Code Tally”?","xp":30,"skills":["devops","dicts"],"requires":["do-count-errors"],"solution":"def status_counts(lines):\n    counts = {}\n    for line in lines:\n        code = line.split()[-1]\n        counts[code] = counts.get(code, 0) + 1\n    return counts\n","alt":"def status_counts(lines):\n    counts = {}\n    for line in lines:\n        code = line.split()[2]\n        if code in counts:\n            counts[code] += 1\n        else:\n            counts[code] = 1\n    return counts\n"},{"id":"do-threshold","region":"python-devops","order":5,"title":"CPU Alarm","story":"Monitoring samples CPU every minute. Find the minutes where it went over the limit.","goal":"Write over_limit(values, limit): return the list of positions (0-based) whose value is greater than limit.","type":"write-code","starter":"def over_limit(values, limit):\n    # return indexes above limit\n    pass\n","tests":[{"kind":"eval","label":"two","expr":"over_limit([10, 95, 40, 99], 90)","expect":"[1, 3]"},{"kind":"eval","label":"none","expr":"over_limit([1, 2, 3], 50)","expect":"[]"},{"kind":"eval","label":"equal is ok","expr":"over_limit([90, 91], 90)","expect":"[1]","hidden":true},{"kind":"eval","label":"empty","expr":"over_limit([], 5)","expect":"[]","hidden":true}],"hints":["enumerate gives you the position and the value together.","Greater than, not greater or equal.","def over_limit(values, limit):\n    hits = []\n    for i, v in enumerate(values):\n        if v > limit:\n            hits.append(i)\n    return hits\n"],"socratic":["What do you need besides the value?","Is a value equal to the limit over it?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “CPU Alarm”?","xp":30,"skills":["devops","lists"],"requires":["do-json-port"],"solution":"def over_limit(values, limit):\n    hits = []\n    for i, v in enumerate(values):\n        if v > limit:\n            hits.append(i)\n    return hits\n","alt":"def over_limit(values, limit):\n    return [i for i, v in enumerate(values) if v > limit]\n"},{"id":"do-top-ip","region":"python-devops","order":8,"title":"Noisiest Visitor","story":"One address is hammering the login page. Which one?","goal":"Write top_ip(lines): each line starts with an IP address; return the IP that appears most often.","type":"write-code","starter":"def top_ip(lines):\n    # count the first word\n    pass\n","tests":[{"kind":"eval","label":"clear winner","expr":"top_ip([\"1.1.1.1 GET /\", \"2.2.2.2 GET /\", \"2.2.2.2 POST /login\", \"2.2.2.2 GET /\"])","expect":"'2.2.2.2'"},{"kind":"eval","label":"single","expr":"top_ip([\"9.9.9.9 GET /\"])","expect":"'9.9.9.9'"},{"kind":"eval","label":"later winner","expr":"top_ip([\"a x\", \"b x\", \"b x\", \"c x\", \"b x\", \"a x\"])","expect":"'b'","hidden":true}],"hints":["Count with a dict first.","max(counts, key=counts.get) returns the key with the biggest value.","def top_ip(lines):\n    counts = {}\n    for line in lines:\n        ip = line.split()[0]\n        counts[ip] = counts.get(ip, 0) + 1\n    return max(counts, key=counts.get)\n"],"socratic":["What do you count?","How do you pick the biggest count?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Noisiest Visitor”?","xp":30,"skills":["devops","dicts"],"requires":["do-uptime"],"solution":"def top_ip(lines):\n    counts = {}\n    for line in lines:\n        ip = line.split()[0]\n        counts[ip] = counts.get(ip, 0) + 1\n    return max(counts, key=counts.get)\n","alt":"from collections import Counter\n\ndef top_ip(lines):\n    return Counter(l.split()[0] for l in lines).most_common(1)[0][0]\n"},{"id":"do-uptime","region":"python-devops","order":7,"title":"Friendly Uptime","story":"Dashboards show 190000 seconds. Humans want days, hours and minutes.","goal":"Write fmt_uptime(seconds): return text like \"2d 3h 4m\" (days, hours, minutes; ignore leftover seconds).","type":"write-code","starter":"def fmt_uptime(seconds):\n    # use // and %\n    pass\n","tests":[{"kind":"eval","label":"mixed","expr":"fmt_uptime(183840)","expect":"'2d 3h 4m'"},{"kind":"eval","label":"under a day","expr":"fmt_uptime(3720)","expect":"'0d 1h 2m'"},{"kind":"eval","label":"zero","expr":"fmt_uptime(0)","expect":"'0d 0h 0m'","hidden":true},{"kind":"eval","label":"exact day","expr":"fmt_uptime(86400)","expect":"'1d 0h 0m'","hidden":true}],"hints":["divmod(seconds, 86400) gives days and the remainder.","Repeat for 3600 (hours) and 60 (minutes).","def fmt_uptime(seconds):\n    days, rest = divmod(seconds, 86400)\n    hours, rest = divmod(rest, 3600)\n    minutes = rest // 60\n    return f\"{days}d {hours}h {minutes}m\"\n"],"socratic":["How many seconds in a day?","What does % give you?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Friendly Uptime”?","xp":30,"skills":["devops","math"],"requires":["do-semver"],"solution":"def fmt_uptime(seconds):\n    days, rest = divmod(seconds, 86400)\n    hours, rest = divmod(rest, 3600)\n    minutes = rest // 60\n    return f\"{days}d {hours}h {minutes}m\"\n","alt":"def fmt_uptime(seconds):\n    d = seconds // 86400\n    h = seconds % 86400 // 3600\n    m = seconds % 3600 // 60\n    return str(d) + \"d \" + str(h) + \"h \" + str(m) + \"m\"\n"},{"id":"f-argparse","region":"real-world","order":4,"title":"Fill the Command Line","story":"Real tools take options from the command line. Pretend the user typed --name Asha.","goal":"Print Hello, Asha","type":"fill","starter":"import argparse\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", default=\"world\")\nargs = parser.parse_args(___)\nprint(\"Hello, \" + args.name)\n","tests":[{"kind":"stdout","label":"Prints the greeting","expect":"Hello, Asha"}],"hints":["parse_args takes a list of the words the user typed.","The list is [\"--name\", \"Asha\"].","import argparse\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", default=\"world\")\nargs = parser.parse_args([\"--name\", \"Asha\"])\nprint(\"Hello, \" + args.name)\n"],"socratic":["What does parse_args normally read?","How would the user's typing look as a list?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Command Line”?","xp":20,"skills":["argparse"],"requires":["w-regex"],"solution":"import argparse\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", default=\"world\")\nargs = parser.parse_args([\"--name\", \"Asha\"])\nprint(\"Hello, \" + args.name)\n"},{"id":"o-pipeline","region":"real-world","order":8,"title":"Order the Log Pipeline","story":"A tiny pipeline counts the error lines in a log. Put it in order.","goal":"Put the lines in order so the program prints 2.","type":"order","starter":"lines = log.split(\"\\n\")\nlog = \"ok\\nerror a\\nok\\nerror b\"\nerrors = [l for l in lines if l.startswith(\"error\")]\nprint(len(errors))\n","lines":["lines = log.split(\"\\n\")","log = \"ok\\nerror a\\nok\\nerror b\"","errors = [l for l in lines if l.startswith(\"error\")]","print(len(errors))"],"tests":[{"kind":"stdout","label":"Prints 2","expect":"2"}],"hints":["Each line uses the variable made by the line before it.","log first, then lines, then errors, then print.","log = \"ok\\nerror a\\nok\\nerror b\"\nlines = log.split(\"\\n\")\nerrors = [l for l in lines if l.startswith(\"error\")]\nprint(len(errors))\n"],"socratic":["Which variable does lines depend on?","Which line can only run last?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["pipelines","order"],"requires":["w-cli"],"solution":"log = \"ok\\nerror a\\nok\\nerror b\"\nlines = log.split(\"\\n\")\nerrors = [l for l in lines if l.startswith(\"error\")]\nprint(len(errors))\n"},{"id":"p-html","region":"real-world","order":5,"title":"Peek Inside HTML","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"html = \"<ul><li>tea<\/li><li>coffee<\/li><\/ul>\"\nprint(html.count(\"<li>\"), html.split(\"<li>\")[1].split(\"<\/li>\")[0])","options":["2 coffee","1 tea","2 tea","3 tea"],"answer":2,"why":"There are two <li> tags. Splitting on <li> gives pieces; piece number 1 starts with tea<\/li>..., and splitting that on <\/li> leaves tea.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What are the pieces after split(\"<li>\")?","The output is:\n2 tea"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["parsing"],"requires":["f-argparse"],"solution":"2 tea"},{"id":"p-json","region":"real-world","order":1,"title":"Read the Payload","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"import json\ndata = json.loads('{\"name\": \"Asha\", \"tags\": [\"a\", \"b\"]}')\nprint(data[\"name\"], len(data[\"tags\"]))","options":["Asha 1","name 2","Asha 2","Error: KeyError"],"answer":2,"why":"json.loads turns JSON text into Python dicts and lists. data[\"name\"] is Asha, and tags is a list of two items.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What type does json.loads give back?","The output is:\nAsha 2"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["json"],"requires":["ps-boss"],"solution":"Asha 2"},{"id":"proj-log-analyser","region":"real-world","order":9,"title":"Project: Log Analyser","story":"The control room gets logs like the ones you searched in the Debug the Outage missions. Build an analyser the night shift can trust.","goal":"Write analyse(log): a dict with total (non-empty lines), errors (lines starting with ERROR) and top_error (the most common error message, or None if there are no errors). Lines look like LEVEL message.","type":"write-code","starter":"# define analyse\n","tests":[{"kind":"eval","label":"Mixed log","expr":"analyse(\"INFO started\\nERROR disk full\\nWARN slow\\nERROR disk full\\nERROR db down\\n\")","expect":"{'total': 5, 'errors': 3, 'top_error': 'disk full'}"},{"kind":"eval","label":"Empty","expr":"analyse(\"\")","expect":"{'total': 0, 'errors': 0, 'top_error': None}"},{"kind":"eval","label":"No errors","expr":"analyse(\"INFO a\\nINFO b\")","expect":"{'total': 2, 'errors': 0, 'top_error': None}","hidden":true}],"hints":["First keep only the non-empty lines. Then collect the messages of the ERROR lines.","line.split(\" \", 1)[1] is the message after the level. Counter(messages).most_common(1) finds the top one.","from collections import Counter\n\n\ndef analyse(log):\n    lines = [l for l in log.splitlines() if l.strip()]\n    errors = [l.split(\" \", 1)[1] for l in lines if l.startswith(\"ERROR \")]\n    top = Counter(errors).most_common(1)[0][0] if errors else None\n    return {\"total\": len(lines), \"errors\": len(errors), \"top_error\": top}\n"],"socratic":["Which lines count towards total?","How do you find the most common message?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Log Analyser”?","xp":85,"skills":["logs","dicts","Counter"],"requires":["o-pipeline"],"solution":"from collections import Counter\n\n\ndef analyse(log):\n    lines = [l for l in log.splitlines() if l.strip()]\n    errors = [l.split(\" \", 1)[1] for l in lines if l.startswith(\"ERROR \")]\n    top = Counter(errors).most_common(1)[0][0] if errors else None\n    return {\"total\": len(lines), \"errors\": len(errors), \"top_error\": top}\n","alt":"def analyse(log):\n    total = 0\n    counts = {}\n    n_errors = 0\n    for line in log.splitlines():\n        if not line.strip():\n            continue\n        total += 1\n        if line.startswith(\"ERROR \"):\n            n_errors += 1\n            msg = line[6:]\n            counts[msg] = counts.get(msg, 0) + 1\n    top = max(counts, key=counts.get) if counts else None\n    return {\"total\": total, \"errors\": n_errors, \"top_error\": top}\n","project":true},{"id":"rw-boss","region":"real-world","order":10,"title":"Boss: The Wrong Alarm","story":"The health checker raises alarms for redirects (301) and lists the broken services in a random order.","goal":"Fix unhealthy(statuses): a service is healthy for status codes 200 to 399. Return the names of the unhealthy services, sorted alphabetically.","type":"fix-the-bug","starter":"def unhealthy(statuses):\n    bad = []\n    for name, code in statuses.items():\n        if code != 200:\n            bad.append(name)\n    return bad\n","tests":[{"kind":"eval","label":"Redirects are fine, result sorted","expr":"unhealthy({\"web\": 200, \"db\": 500, \"api\": 301, \"cache\": 404})","expect":"['cache', 'db']"},{"kind":"eval","label":"All healthy","expr":"unhealthy({\"web\": 204})","expect":"[]"},{"kind":"eval","label":"Empty","expr":"unhealthy({})","expect":"[]","hidden":true}],"hints":["Which status codes count as healthy? Is 301 one of them?","Healthy is 200 <= code < 400. Also sort the result before returning it.","def unhealthy(statuses):\n    bad = []\n    for name, code in statuses.items():\n        if not 200 <= code < 400:\n            bad.append(name)\n    return sorted(bad)\n"],"socratic":["Which codes are healthy?","Does dictionary order match alphabetical order?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":70,"skills":["debugging","logs"],"requires":["proj-log-analyser"],"solution":"def unhealthy(statuses):\n    bad = []\n    for name, code in statuses.items():\n        if not 200 <= code < 400:\n            bad.append(name)\n    return sorted(bad)\n","alt":"def unhealthy(statuses):\n    return sorted(name for name, code in statuses.items() if code < 200 or code >= 400)\n","boss":true},{"id":"w-api","region":"real-world","order":2,"title":"Read the Weather API","story":"The control room receives weather reports from an API as JSON text. Turn each into a friendly line.","goal":"Write parse_weather(text) for JSON like {\"city\": \"Pune\", \"temp_c\": 31.5, \"rain\": false}. Return Pune: 31.5C, dry (or wet if rain is true; a missing rain key counts as dry).","type":"write-code","starter":"import json\n# define parse_weather\n","tests":[{"kind":"eval","label":"Dry day","expr":"parse_weather('{\"city\": \"Pune\", \"temp_c\": 31.5, \"rain\": false}')","expect":"'Pune: 31.5C, dry'"},{"kind":"eval","label":"Wet day","expr":"parse_weather('{\"city\": \"Goa\", \"temp_c\": 29, \"rain\": true}')","expect":"'Goa: 29C, wet'"},{"kind":"eval","label":"Missing rain key","expr":"parse_weather('{\"city\": \"Leh\", \"temp_c\": 1}')","expect":"'Leh: 1C, dry'","hidden":true}],"hints":["Parse the text with json.loads first. Then pick out the fields from the dict.","data.get(\"rain\", False) returns False when the key is missing.","import json\n\n\ndef parse_weather(text):\n    data = json.loads(text)\n    sky = \"wet\" if data.get(\"rain\", False) else \"dry\"\n    return f\"{data['city']}: {data['temp_c']}C, {sky}\"\n"],"socratic":["What type is the result of json.loads?","How do you read a key that may not exist?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Read the Weather API”?","xp":30,"skills":["json","dicts"],"requires":["p-json"],"solution":"import json\n\n\ndef parse_weather(text):\n    data = json.loads(text)\n    sky = \"wet\" if data.get(\"rain\", False) else \"dry\"\n    return f\"{data['city']}: {data['temp_c']}C, {sky}\"\n","alt":"import json\n\n\ndef parse_weather(text):\n    d = json.loads(text)\n    if d.get(\"rain\"):\n        sky = \"wet\"\n    else:\n        sky = \"dry\"\n    return d[\"city\"] + \": \" + str(d[\"temp_c\"]) + \"C, \" + sky\n"},{"id":"w-cli","region":"real-world","order":7,"title":"Tiny CLI","story":"Build a command-line tool that sums numbers, with an option to double the result.","goal":"Write build_parser() (positional numbers, one or more ints, and a --double flag) and run(argv) returning the sum, doubled if the flag is given.","type":"write-code","starter":"import argparse\n# define build_parser and run\n","tests":[{"kind":"eval","label":"Sum","expr":"run([\"1\", \"2\", \"3\"])","expect":"6"},{"kind":"eval","label":"Doubled","expr":"run([\"--double\", \"1\", \"2\"])","expect":"6"},{"kind":"eval","label":"Single number","expr":"run([\"5\"])","expect":"5","hidden":true}],"hints":["add_argument(\"numbers\", nargs=\"+\", type=int) collects one or more numbers.","add_argument(\"--double\", action=\"store_true\") makes a flag that is True when present.","import argparse\n\n\ndef build_parser():\n    parser = argparse.ArgumentParser(description=\"Add numbers\")\n    parser.add_argument(\"numbers\", nargs=\"+\", type=int)\n    parser.add_argument(\"--double\", action=\"store_true\")\n    return parser\n\n\ndef run(argv):\n    args = build_parser().parse_args(argv)\n    total = sum(args.numbers)\n    return total * 2 if args.double else total\n"],"socratic":["What does nargs=\"+\" mean?","What does store_true give when the flag is absent?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Tiny CLI”?","xp":55,"skills":["argparse"],"requires":["w-scrape"],"solution":"import argparse\n\n\ndef build_parser():\n    parser = argparse.ArgumentParser(description=\"Add numbers\")\n    parser.add_argument(\"numbers\", nargs=\"+\", type=int)\n    parser.add_argument(\"--double\", action=\"store_true\")\n    return parser\n\n\ndef run(argv):\n    args = build_parser().parse_args(argv)\n    total = sum(args.numbers)\n    return total * 2 if args.double else total\n","alt":"import argparse\n\n\ndef build_parser():\n    p = argparse.ArgumentParser()\n    p.add_argument(\"numbers\", type=int, nargs=\"*\")\n    p.add_argument(\"--double\", action=\"store_true\")\n    return p\n\n\ndef run(argv):\n    a = build_parser().parse_args(argv)\n    t = 0\n    for n in a.numbers:\n        t += n\n    if a.double:\n        t = t * 2\n    return t\n"},{"id":"w-regex","region":"real-world","order":3,"title":"Log Hunter","story":"The control room keeps logs as lines like 2024-05-01 10:00:02 ERROR disk full. Count how many lines each level has.","goal":"Write count_levels(log) returning a dict from level (the third word on each line) to how many lines have it. Ignore blank lines.","type":"write-code","starter":"# define count_levels\n","tests":[{"kind":"eval","label":"Counts","expr":"count_levels(\"2024-05-01 10:00:01 INFO ok\\n2024-05-01 10:00:02 ERROR disk full\\n2024-05-01 10:00:03 ERROR db down\\n\")","expect":"{'INFO': 1, 'ERROR': 2}"},{"kind":"eval","label":"Empty log","expr":"count_levels(\"\")","expect":"{}"},{"kind":"eval","label":"Blank lines ignored","expr":"count_levels(\"\\n2024-05-01 10:00:01 WARN slow\\n\\n\")","expect":"{'WARN': 1}","hidden":true}],"hints":["Split the log into lines, then each line into words. The level is the third word.","log.splitlines() gives lines. counts.get(level, 0) + 1 keeps the tally.","def count_levels(log):\n    counts = {}\n    for line in log.splitlines():\n        parts = line.split()\n        if len(parts) >= 3:\n            counts[parts[2]] = counts.get(parts[2], 0) + 1\n    return counts\n"],"socratic":["Which word on each line is the level?","What should happen to a blank line?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Log Hunter”?","xp":30,"skills":["split","dicts","logs"],"requires":["w-api"],"solution":"def count_levels(log):\n    counts = {}\n    for line in log.splitlines():\n        parts = line.split()\n        if len(parts) >= 3:\n            counts[parts[2]] = counts.get(parts[2], 0) + 1\n    return counts\n","alt":"import re\nfrom collections import Counter\n\n\ndef count_levels(log):\n    return dict(Counter(re.findall(r\"^\\S+ \\S+ (\\w+)\", log, re.M)))\n"},{"id":"w-scrape","region":"real-world","order":6,"title":"Price Scraper","story":"A shop page lists prices in HTML. Pull them out as numbers.","goal":"Write prices(html) returning a list of ints found in tags like <span class=\"price\">Rs 120<\/span>, in order.","type":"write-code","starter":"import re\n# define prices\n","tests":[{"kind":"eval","label":"Two prices","expr":"prices('<p>x<\/p><span class=\"price\">Rs 120<\/span><span class=\"price\">Rs 45<\/span>')","expect":"[120, 45]"},{"kind":"eval","label":"No prices","expr":"prices('<p>nothing<\/p>')","expect":"[]"},{"kind":"eval","label":"Ignores other numbers","expr":"prices('<b>Rs 9<\/b><span class=\"price\">Rs 7<\/span>')","expect":"[7]","hidden":true}],"hints":["A regular expression can describe the pattern around the number.","re.findall(r'class=\"price\">Rs (\\d+)<', html) returns the captured digits as strings.","import re\n\n\ndef prices(html):\n    found = re.findall(r'class=\"price\">Rs (\\d+)<', html)\n    return [int(p) for p in found]\n"],"socratic":["What text surrounds each price?","What turns the matched text into a number?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Price Scraper”?","xp":30,"skills":["regex","parsing"],"requires":["p-html"],"solution":"import re\n\n\ndef prices(html):\n    found = re.findall(r'class=\"price\">Rs (\\d+)<', html)\n    return [int(p) for p in found]\n","alt":"import re\n\n\ndef prices(html):\n    result = []\n    for m in re.finditer(r'<span class=\"price\">Rs\\s*(\\d+)<\/span>', html):\n        result.append(int(m.group(1)))\n    return result\n"},{"id":"sql-aggregate-fix","region":"sql-aggregate","order":6,"title":"Boss: The Wrong Total","story":"A report asks for categories with more than one product, but it crashes and groups by the wrong column.","goal":"Fix the query: show each category and its product count n, only for categories with more than 1 product.","type":"sql","starter":"SELECT category, COUNT(*)\nFROM products\nWHERE COUNT(*) > 1\nGROUP BY name;","setup":"CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price REAL, stock INTEGER);\nINSERT INTO products VALUES (1,'Mango','fruit',40.0,120),(2,'Banana','fruit',12.0,300),(3,'Rice 5kg','grain',320.0,45),(4,'Dal 1kg','grain',140.0,80),(5,'Ghee','dairy',560.0,20),(6,'Milk','dairy',28.0,200),(7,'Jaggery','sweet',90.0,0),(8,'Tamarind','spice',60.0,35),(9,'Turmeric','spice',45.0,60),(10,'Coconut','fruit',25.0,150);\nCREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT, joined TEXT);\nINSERT INTO customers VALUES (1,'Asha','Hyderabad','2025-01-10'),(2,'Ravi','Vijayawada','2025-02-14'),(3,'Meena','Hyderabad','2025-03-02'),(4,'Kiran','Guntur','2025-03-20'),(5,'Lakshmi','Tirupati','2025-04-05'),(6,'Suresh',NULL,'2025-05-18'),(7,'Divya','Vijayawada','2025-06-01');\nCREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, product_id INTEGER, qty INTEGER, order_date TEXT, status TEXT);\nINSERT INTO orders VALUES (1,1,1,3,'2025-06-01','delivered'),(2,1,3,1,'2
