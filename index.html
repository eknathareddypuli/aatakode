','delivered'),(11,3,5,1,'2025-06-21','delivered'),(12,5,8,3,'2025-06-22','cancelled'),(13,2,1,2,'2025-06-25','delivered'),(14,6,3,1,'2025-06-26','pending');\nDELETE FROM orders WHERE id IN (1,5,9); UPDATE products SET price = price * 2 WHERE id IN (2,6,8); INSERT INTO products VALUES (11,'Pepper','spice',75.0,40); INSERT INTO orders VALUES (15,6,11,4,'2025-07-01','delivered');","expect":[["Ghee"],["Tamarind"],["Turmeric"],["Pepper"]],"ordered":false},{"kind":"source","label":"Uses WHERE","pattern":"\\bWHERE\\b"}],"hints":["WHERE filters rows. IN (...) matches any value in a list, and BETWEEN a AND b includes both ends.","Join the two conditions with AND.","SELECT name FROM products WHERE category IN ('spice', 'dairy') AND stock BETWEEN 20 AND 100;"],"socratic":["Which two things must be true for a row?","Is 20 allowed? Is 100?","Compare the rows you got with the rows expected. What differs?"],"explain":"In one sentence: what does your query do?","xp":25,"skills":["sql","where"],"requires":["sql-columns-alias"],"solution":"SELECT name FROM products WHERE category IN ('spice', 'dairy') AND stock BETWEEN 20 AND 100;","alt":"SELECT name FROM products WHERE (category = 'spice' OR category = 'dairy') AND stock >= 20 AND stock <= 100;"},{"id":"f-methods","region":"strings","order":5,"title":"Fill the Cleaner","story":"Text copied from a form has stray spaces and mixed capitals.","goal":"Print the cleaned text: hello world","type":"fill","starter":"raw = \"  Hello World  \"\nclean = raw.___().lower()\nprint(clean)\n","tests":[{"kind":"stdout","label":"Cleans the text","expect":"hello world"}],"hints":["Which string method removes spaces from both ends?","The method is strip.","raw = \"  Hello World  \"\nclean = raw.strip().lower()\nprint(clean)\n"],"socratic":["Which characters need removing?","Can you chain two methods on one string?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Cleaner”?","xp":20,"skills":["methods"],"requires":["p-immutable"],"solution":"raw = \"  Hello World  \"\nclean = raw.strip().lower()\nprint(clean)\n"},{"id":"o-initials","region":"strings","order":9,"title":"Order the Initials","story":"Print a person's initials in capitals. The lines are shuffled.","goal":"Put the lines in order: read first and last name, build the initials, print them in capitals.","type":"order","starter":"initials = first[0] + last[0]\nprint(initials.upper())\nlast = input()\nfirst = input()\n","lines":["initials = first[0] + last[0]","print(initials.upper())","last = input()","first = input()"],"tests":[{"kind":"stdout","label":"asha rao","expect":"AR","stdin":["asha","rao"]},{"kind":"stdout","label":"ravi kumar","expect":"RK","stdin":["ravi","kumar"],"hidden":true}],"hints":["initials needs first and last to exist already.","Read both names first, then build, then print.","first = input()\nlast = input()\ninitials = first[0] + last[0]\nprint(initials.upper())\n"],"socratic":["Which lines create variables?","Which line uses them?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["strings","order"],"requires":["w-palindrome"],"solution":"first = input()\nlast = input()\ninitials = first[0] + last[0]\nprint(initials.upper())\n"},{"id":"p-format","region":"strings","order":7,"title":"Format Magic","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"print(f\"{3.14159:.2f}|{7:03d}|{'hi':>4}\")","options":["3.14|7|  hi","3.14|007|  hi","3.1|007|hi","3|007|  hi"],"answer":1,"why":".2f keeps two decimals, 03d pads with zeros to width 3, and >4 right-aligns in a field of width 4.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","After the colon, each code tells Python how to format the value.","The output is:\n3.14|007|  hi"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["f-strings","formatting"],"requires":["w-vowels"],"solution":"3.14|007|  hi"},{"id":"p-immutable","region":"strings","order":4,"title":"Can You Edit a String?","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"word = \"cat\"\nword[0] = \"b\"\nprint(word)","options":["bat","cat","Error: TypeError","bcat"],"answer":2,"why":"Strings are immutable: you cannot change a letter in place. To get \"bat\" you must build a new string.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Can you assign to a single character of a string?","The output is:\nError: TypeError"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["strings","immutability"],"requires":["w-reverse"],"solution":"Error: TypeError"},{"id":"p-index","region":"strings","order":2,"title":"Pick the Letter","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"s = \"python\"\nprint(s[0], s[-1], s[1:3])","options":["p n yth","p n yt","y n yt","p o yt"],"answer":1,"why":"Index 0 is the first letter, -1 is the last. A slice s[1:3] starts at 1 and stops before 3, giving yt.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Count positions from zero. What does -1 mean?","The output is:\np n yt"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["indexing","slicing"],"requires":["w-shout"],"solution":"p n yt"},{"id":"proj-password","region":"strings","order":11,"title":"Project: Password Meter","story":"The post office wants a quick strength meter for new passwords.","goal":"Read a password. Score 1 point each for: 8+ characters, a digit, an uppercase letter, a lowercase letter. 4 points: strong, 2 or 3: medium, otherwise weak.","type":"write-code","starter":"pw = input()\n# score the password and print weak, medium or strong\n","tests":[{"kind":"stdout","label":"abc is weak","expect":"weak","stdin":["abc"]},{"kind":"stdout","label":"abcdefgh1 is medium","expect":"medium","stdin":["abcdefgh1"]},{"kind":"stdout","label":"Abcdefg1 is strong","expect":"strong","stdin":["Abcdefg1"]},{"kind":"stdout","label":"ABC is weak","expect":"weak","stdin":["ABC"]},{"kind":"stdout","label":"12345678 is medium","expect":"medium","stdin":["12345678"],"hidden":true}],"hints":["Keep a score variable and add 1 for each rule that holds. any(...) can check characters.","any(ch.isdigit() for ch in pw) is True when there is a digit. isupper and islower work the same way.","pw = input()\nscore = 0\nif len(pw) >= 8:\n    score += 1\nif any(ch.isdigit() for ch in pw):\n    score += 1\nif any(ch.isupper() for ch in pw):\n    score += 1\nif any(ch.islower() for ch in pw):\n    score += 1\nif score == 4:\n    print(\"strong\")\nelif score >= 2:\n    print(\"medium\")\nelse:\n    print(\"weak\")\n"],"socratic":["Which four rules add points?","How do you check whether any character is a digit?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Password Meter”?","xp":50,"skills":["strings","if","any"],"requires":["w-title-maker"],"solution":"pw = input()\nscore = 0\nif len(pw) >= 8:\n    score += 1\nif any(ch.isdigit() for ch in pw):\n    score += 1\nif any(ch.isupper() for ch in pw):\n    score += 1\nif any(ch.islower() for ch in pw):\n    score += 1\nif score == 4:\n    print(\"strong\")\nelif score >= 2:\n    print(\"medium\")\nelse:\n    print(\"weak\")\n","alt":"pw = input()\nrules = [len(pw) >= 8, any(c.isdigit() for c in pw), any(c.isupper() for c in pw), any(c.islower() for c in pw)]\nscore = sum(rules)\nprint(\"strong\" if score == 4 else \"medium\" if score >= 2 else \"weak\")\n","project":true},{"id":"str-boss","region":"strings","order":12,"title":"Boss: The Jumbled Label","story":"A name label printer is broken. It should print names as Last, First with proper capitals. Find both bugs.","goal":"Fix the program: for input asha rao it must print Rao, Asha.","type":"fix-the-bug","starter":"name = input()\nparts = name.split()\nfirst = parts[0].capitalize()\nlast = parts[1].capitalize\nprint(first + \" \" + last)\n","tests":[{"kind":"stdout","label":"asha rao","expect":"Rao, Asha","stdin":["asha rao"]},{"kind":"stdout","label":"RAVI KUMAR","expect":"Kumar, Ravi","stdin":["RAVI KUMAR"]},{"kind":"stdout","label":"mEEra rEDDY","expect":"Reddy, Meera","stdin":["mEEra rEDDY"],"hidden":true}],"hints":["One method call is missing something that makes it actually run. Compare it with the line above.","After fixing that, check the order and the separator between the two names.","name = input()\nparts = name.split()\nfirst = parts[0].capitalize()\nlast = parts[1].capitalize()\nprint(last + \", \" + first)\n"],"socratic":["What is the difference between last.capitalize and last.capitalize()?","Which part of the output order is wrong?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":55,"skills":["debugging","methods"],"requires":["proj-password"],"solution":"name = input()\nparts = name.split()\nfirst = parts[0].capitalize()\nlast = parts[1].capitalize()\nprint(last + \", \" + first)\n","alt":"first, last = input().split()\nprint(f\"{last.capitalize()}, {first.capitalize()}\")\n","boss":true},{"id":"w-palindrome","region":"strings","order":8,"title":"Palindrome Gate","story":"The temple gate opens only to words that read the same both ways. Spaces and capitals do not count.","goal":"Read a phrase. Print yes if it is a palindrome (ignoring spaces and case), otherwise no.","type":"write-code","starter":"text = input()\n# yes or no\n","tests":[{"kind":"stdout","label":"level","expect":"yes","stdin":["level"]},{"kind":"stdout","label":"Nurses Run","expect":"yes","stdin":["Nurses Run"]},{"kind":"stdout","label":"python","expect":"no","stdin":["python"]},{"kind":"stdout","label":"A man a plan a canal Panama","expect":"yes","stdin":["A man a plan a canal Panama"],"hidden":true}],"hints":["First clean the text: remove spaces and lowercase it. Then compare it with its reverse.","text.replace(\" \", \"\").lower() cleans it; [::-1] reverses.","text = input()\nclean = text.replace(\" \", \"\").lower()\nprint(\"yes\" if clean == clean[::-1] else \"no\")\n"],"socratic":["What should you remove before comparing?","How do you get the reverse of a string?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Palindrome Gate”?","xp":30,"skills":["slicing","methods"],"requires":["p-format"],"solution":"text = input()\nclean = text.replace(\" \", \"\").lower()\nprint(\"yes\" if clean == clean[::-1] else \"no\")\n","alt":"text = input().replace(\" \", \"\").lower()\nif text == text[::-1]:\n    print(\"yes\")\nelse:\n    print(\"no\")\n"},{"id":"w-reverse","region":"strings","order":3,"title":"Reverse Echo","story":"Chilaka's echo repeats your word backwards.","goal":"Read a word and print it reversed.","type":"write-code","starter":"word = input()\n# print it backwards\n","tests":[{"kind":"stdout","label":"parrot","expect":"torrap","stdin":["parrot"]},{"kind":"stdout","label":"a","expect":"a","stdin":["a"]},{"kind":"stdout","label":"Aata","expect":"ataA","stdin":["Aata"],"hidden":true}],"hints":["A slice can have a step: text[start:stop:step]. What step walks backwards?","word[::-1] reads the whole word with a step of -1.","word = input()\nprint(word[::-1])\n"],"socratic":["What does a negative step do in a slice?","Which letter should appear first in the output?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Reverse Echo”?","xp":30,"skills":["slicing"],"requires":["p-index"],"solution":"word = input()\nprint(word[::-1])\n","alt":"word = input()\nrev = \"\"\nfor ch in word:\n    rev = ch + rev\nprint(rev)\n","clean":{"label":"Do it in 2 lines (use slicing, no loop)","tests":[{"kind":"maxlines","max":2,"label":"2 lines or fewer"}]}},{"id":"w-shout","region":"strings","order":1,"title":"Shout It","story":"The market crier announces each word in capitals, along with how long it is.","goal":"Read a word. Print it in capitals, a space, then its length (like ALICE 5).","type":"write-code","starter":"word = input()\n# print the word in capitals and its length\n","tests":[{"kind":"stdout","label":"alice","expect":"ALICE 5","stdin":["alice"]},{"kind":"stdout","label":"Python","expect":"PYTHON 6","stdin":["Python"]},{"kind":"stdout","label":"empty-ish","expect":"A 1","stdin":["a"],"hidden":true}],"hints":["Strings have built-in tools called methods. word.upper() gives the capital version.","len(word) counts the characters. print() can show two things separated by a space.","word = input()\nprint(word.upper(), len(word))\n"],"socratic":["Which method makes capital letters?","Which function counts characters?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Shout It”?","xp":30,"skills":["strings","methods"],"requires":["py-10-bugfix-3"],"solution":"word = input()\nprint(word.upper(), len(word))\n","alt":"word = input()\nprint(word.upper() + \" \" + str(len(word)))\n"},{"id":"w-title-maker","region":"strings","order":10,"title":"Title Maker","story":"The market sign painter capitalises every word on a sign.","goal":"Read a sentence and print it with each word capitalised.","type":"write-code","starter":"sentence = input()\n# capitalise every word\n","tests":[{"kind":"stdout","label":"Three words","expect":"Hello Wide World","stdin":["hello wide world"]},{"kind":"stdout","label":"One word","expect":"Aata","stdin":["aata"]},{"kind":"stdout","label":"Mixed case","expect":"Python Is Fun","stdin":["pYTHON iS fUN"],"hidden":true}],"hints":["Split the sentence into words, fix each word, then join them back with spaces.","words = sentence.split() gives a list. \" \".join(list) glues it back.","sentence = input()\nwords = sentence.split()\nfixed = []\nfor w in words:\n    fixed.append(w.capitalize())\nprint(\" \".join(fixed))\n"],"socratic":["How do you break a sentence into words?","Which method fixes the capitals of one word?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Title Maker”?","xp":30,"skills":["split","join"],"requires":["o-initials"],"solution":"sentence = input()\nwords = sentence.split()\nfixed = []\nfor w in words:\n    fixed.append(w.capitalize())\nprint(\" \".join(fixed))\n","alt":"print(input().title())\n","fade":{"example":{"title":"Worked example: shout every word","code":"words = \"go team go\".split()\nprint(\" \".join(w.upper() for w in words))\n","note":"split() cuts text into words; join() glues them back together."},"partial":"sentence = input()\nwords = sentence.split()\n____\nfor w in words:\n    fixed.append(w.capitalize())\nprint(\" \".join(fixed))\n","blanks":["fixed = []"]}},{"id":"w-vowels","region":"strings","order":6,"title":"Vowel Counter","story":"A poet wants to know how musical a word is.","goal":"Read a word. Print how many vowels (a, e, i, o, u, any case) it has.","type":"write <script>AK.py.setRunnerSource("\"\"\"AataKode Python runner. Runs inside Pyodide in the learner's browser.\n\nLearner code is compiled with the filename \"<mission>\" so the tracer can\n(1) stop infinite loops, (2) record step-through snapshots, and\n(3) ignore everything that is not the learner's own code.\n\"\"\"\nimport sys, io, json, re, builtins\n\n_FN = \"<mission>\"\n\n\nclass _Limit(Exception):\n    pass\n\n\ndef _short(v, n=60):\n    try:\n        r = repr(v)\n    except Exception:\n        r = \"<unprintable>\"\n    return r if len(r) <= n else r[: n - 1] + \"\u2026\"\n\n\ndef _visible(d):\n    res = {}\n    for k, v in list(d.items()):\n        if k.startswith(\"__\") or callable(v) or type(v).__name__ == \"module\":\n            continue\n        res[k] = _short(v)\n    return res\n\n\ndef _norm(s):\n    lines = [l.rstrip() for l in str(s).replace(\"\\r\", \"\").split(\"\\n\")]\n    while lines and lines[-1] == \"\":\n        lines.pop()\n    return \"\\n\".join(lines)\n\n\ndef _exec(code, stdin=None, echo=False, trace=False, limit=150000, max_steps=300):\n    buf = io.StringIO()\n    ns = {\"__name__\": \"__main__\"}\n    queue = list(stdin or [])\n    steps = []\n    count = [0]\n\n    def fake_input(prompt=\"\"):\n        if echo:\n            buf.write(str(prompt))\n        if not queue:\n            raise EOFError(\"input() was called but there is no input left\")\n        v = str(queue.pop(0))\n        if echo:\n            buf.write(v + \"\\n\")\n        return v\n\n    def tracer(frame, event, arg):\n        if frame.f_code.co_filename != _FN:\n            return None\n        if event == \"line\":\n            count[0] += 1\n            if count[0] > limit:\n                raise _Limit()\n            if trace and len(steps) < max_steps:\n                stack = []\n                f = frame\n                while f is not None:\n                    if f.f_code.co_filename == _FN:\n                        name = f.f_code.co_name\n                        stack.append(\"main\" if name == \"<module>\" else name)\n                    f = f.f_back\n                stack.reverse()\n                steps.append({\n                    \"line\": frame.f_lineno,\n                    \"vars\": _visible(frame.f_locals),\n                    \"stack\": stack,\n                    \"out\": len(buf.getvalue()),\n                })\n        return tracer\n\n    err = None\n    old_out, old_in = sys.stdout, builtins.input\n    sys.stdout = buf\n    builtins.input = fake_input\n    try:\n        try:\n            co = compile(code, _FN, \"exec\")\n        except SyntaxError as e:\n            err = {\"type\": type(e).__name__, \"msg\": e.msg, \"line\": e.lineno}\n            co = None\n        if co is not None:\n            sys.settrace(tracer)\n            try:\n                exec(co, ns)\n            finally:\n                sys.settrace(None)\n    except _Limit:\n        err = {\"type\": \"Timeout\", \"msg\": \"ran for too long\", \"line\": None}\n    except BaseException as e:\n        line = None\n        tb = e.__traceback__\n        while tb is not None:\n            if tb.tb_frame.f_code.co_filename == _FN:\n                line = tb.tb_lineno\n            tb = tb.tb_next\n        err = {\"type\": type(e).__name__, \"msg\": str(e), \"line\": line}\n    finally:\n        sys.stdout = old_out\n        builtins.input = old_in\n    return {\"out\": buf.getvalue(), \"err\": err, \"steps\": steps, \"ns\": ns}\n\n\ndef _guarded(fn, limit=150000):\n    count = [0]\n\n    def tr(frame, event, arg):\n        if frame.f_code.co_filename != _FN:\n            return None\n        if event == \"line\":\n            count[0] += 1\n            if count[0] > limit:\n                raise _Limit()\n        return tr\n\n    buf = io.StringIO()\n    old = sys.stdout\n    sys.stdout = buf\n    sys.settrace(tr)\n    try:\n        return fn()\n    finally:\n        sys.settrace(None)\n        sys.stdout = old\n\n\ndef _run(code, stdin_json, trace):\n    r = _exec(code, json.loads(stdin_json), echo=True, trace=bool(trace))\n    return json.dumps({\"out\": r[\"out\"], \"err\": r[\"err\"], \"steps\": r[\"steps\"]})\n\n\ndef _res(t, ok, **extra):\n    d = {\"label\": t.get(\"label\") or t.get(\"kind\"), \"ok\": bool(ok), \"hidden\": bool(t.get(\"hidden\")), \"star\": bool(t.get(\"star\"))}\n    if not t.get(\"hidden\"):\n        d.update({k: v for k, v in extra.items() if v is not None})\n    return d\n\n\ndef _grade(code, tests_json):\n    tests = json.loads(tests_json)\n    results = []\n    base = None\n    for t in tests:\n        k = t[\"kind\"]\n        if k == \"source\":\n            found = re.search(t[\"pattern\"], code) is not None\n            results.append(_res(t, (not found) if t.get(\"absent\") else found))\n        elif k == \"raises\":\n            if base is None:\n                base = _exec(code, [])\n            if base[\"err\"]:\n                results.append(_res(t, False, err=base[\"err\"], expect=t[\"exc\"]))\n                continue\n            try:\n                _guarded(lambda: eval(t[\"expr\"], base[\"ns\"]))\n                results.append(_res(t, False, got=\"no error\", expect=t[\"exc\"], expr=t[\"expr\"]))\n            except _Limit:\n                results.append(_res(t, False, err={\"type\": \"Timeout\", \"msg\": \"ran for too long\", \"line\": None}, expr=t[\"expr\"]))\n            except BaseException as e:\n                results.append(_res(t, type(e).__name__ == t[\"exc\"], got=type(e).__name__, expect=t[\"exc\"], expr=t[\"expr\"]))\n        elif k == \"maxlines\":\n            n = len([l for l in code.split(\"\\n\") if l.strip() and not l.strip().startswith(\"#\")])\n            results.append(_res(t, n <= t[\"max\"], got=str(n), expect=\"at most \" + str(t[\"max\"])))\n        elif k == \"stdout\":\n            r = _exec(code, t.get(\"stdin\") or [])\n            exp = _norm(t[\"expect\"])\n            if r[\"err\"]:\n                results.append(_res(t, False, err=r[\"err\"], got=_norm(r[\"out\"]), expect=exp, stdin=t.get(\"stdin\")))\n            else:\n                got = _norm(r[\"out\"])\n                results.append(_res(t, got == exp, got=got, expect=exp, stdin=t.get(\"stdin\")))\n        elif k == \"eval\":\n            if base is None:\n                base = _exec(code, [])\n            if base[\"err\"]:\n                results.append(_res(t, False, err=base[\"err\"], expect=t[\"expect\"]))\n                continue\n            try:\n                expected = eval(t[\"expect\"], {})\n                value = _guarded(lambda: eval(t[\"expr\"], base[\"ns\"]))\n                results.append(_res(t, value == expected, got=_short(value, 80), expect=_short(expected, 80), expr=t[\"expr\"]))\n            except _Limit:\n                results.append(_res(t, False, err={\"type\": \"Timeout\", \"msg\": \"ran for too long\", \"line\": None}, expr=t[\"expr\"]))\n            except BaseException as e:\n                results.append(_res(t, False, err={\"type\": type(e).__name__, \"msg\": str(e), \"line\": None}, expr=t[\"expr\"]))\n        else:\n            results.append(_res(t, False, got=\"unknown test kind\"))\n    return json.dumps(results)\n\n\n# ---------------------------------------------------------------- SQL missions (sqlite3 runs inside the browser too)\nimport sqlite3\n\n\ndef _sql_stmts(script):\n    out, cur = [], \"\"\n    for line in script.splitlines(True):\n        cur += line\n        if sqlite3.complete_statement(cur):\n            out.append(cur.strip())\n            cur = \"\"\n    if cur.strip():\n        out.append(cur.strip())\n    return out\n\n\ndef _sql_con(setup):\n    con = sqlite3.connect(\":memory:\")\n    con.executescript(setup or \"\")\n    ticks = [0]\n\n    def guard():\n        ticks[0] += 1\n        return 1 if ticks[0] > 6000 else 0\n\n    con.set_progress_handler(guard, 1000)\n    return con\n\n\ndef _sql_play(con, query):\n    cols = rows = err = None\n    try:\n        for st in _sql_stmts(query):\n            cur = con.execute(st)\n            if cur.description is not None:\n                cols = [d[0] for d in cur.description]\n                rows = cur.fetchall()\n    except Exception as e:\n        err = {\"type\": type(e).__name__, \"msg\": str(e), \"line\": None}\n    return cols, rows, err\n\n\ndef _nrow(r):\n    return [round(v, 4) if isinstance(v, float) else v for v in r]\n\n\ndef _fmt_rows(cols, rows, limit=10):\n    if rows is None:\n        return \"(no rows returned)\"\n    lines = [\" | \".join(cols or [])] if cols else []\n    for r in rows[:limit]:\n        lines.append(\" | \".join(\"NULL\" if v is None else str(v) for v in _nrow(r)))\n    if len(rows) > limit:\n        lines.append(\"\u2026 \" + str(len(rows) - limit) + \" more rows\")\n    return \"\\n\".join(lines) if lines else \"(empty)\"\n\n\ndef _same_rows(got, exp, ordered):\n    g = [_nrow(r) for r in (got or [])]\n    e = [_nrow(r) for r in exp]\n    if not ordered:\n        g = sorted(g, key=repr)\n        e = sorted(e, key=repr)\n    return g == e\n\n\ndef _sql_grade(query, setup, tests_json):\n    tests = json.loads(tests_json)\n    results = []\n    for t in tests:\n        k = t[\"kind\"]\n        if k == \"source\":\n            found = re.search(t[\"pattern\"], query, re.I | re.S) is not None\n            results.append(_res(t, (not found) if t.get(\"absent\") else found))\n            continue\n        con = _sql_con(t.get(\"setup\") or setup)\n        cols, rows, err = _sql_play(con, query)\n        if err:\n            results.append(_res(t, False, err=err))\n            continue\n        if k == \"rows\":\n            ok = _same_rows(rows, t[\"expect\"], t.get(\"ordered\", False)) and (not t.get(\"cols\") or [c.lower() for c in (cols or [])] == [c.lower() for c in t[\"cols\"]])\n            results.append(_res(t, ok, got=_fmt_rows(cols, rows), expect=_fmt_rows(t.get(\"cols\"), [tuple(r) for r in t[\"expect\"]])))\n        elif k == \"cols\":\n            ok = [c.lower() for c in (cols or [])] == [c.lower() for c in t[\"expect\"]]\n            results.append(_res(t, ok, got=\", \".join(cols or []) or \"(no columns)\", expect=\", \".join(t[\"expect\"])))\n        elif k == \"after\":\n            c2, r2, e2 = _sql_play(con, t[\"query\"])\n            if e2:\n                results.append(_res(t, False, err=e2))\n            else:\n                ok = _same_rows(r2, t[\"expect\"], t.get(\"ordered\", False))\n                results.append(_res(t, ok, got=_fmt_rows(c2, r2), expect=_fmt_rows(c2, [tuple(r) for r in t[\"expect\"]])))\n        else:\n            results.append(_res(t, False, got=\"unknown test kind\"))\n    return json.dumps(results)\n\n\ndef _sql_run(query, setup):\n    con = _sql_con(setup)\n    cols, rows, err = _sql_play(con, query)\n    return json.dumps({\"cols\": cols, \"rows\": [_nrow(r) for r in (rows or [])][:200], \"count\": len(rows or []), \"err\": err, \"hasRows\": rows is not None})\n\n\ndef _sql_schema(setup):\n    con = _sql_con(setup)\n    out = []\n    for (name,) in con.execute(\"select name from sqlite_master where type='table' and name not like 'sqlite_%' order by name\").fetchall():\n        info = con.execute(\"pragma table_info(\" + name + \")\").fetchall()\n        rows = con.execute(\"select * from \" + name + \" limit 5\").fetchall()\n        total = con.execute(\"select count(*) from \" + name).fetchone()[0]\n        out.append({\"name\": name, \"cols\": [{\"name\": c[1], \"type\": c[2], \"pk\": bool(c[5])} for c in info], \"rows\": [_nrow(r) for r in rows], \"total\": total})\n    return json.dumps(out)\n");</script>

  /* ---- python-style missions: write-code, fix-the-bug, fill, order */
  const draftArr = (id, n, fallback) => { try { const a = JSON.parse(S.drafts[id]); if (Array.isArray(a) && a.length === n) return a; } catch (e) { /* none */ } return fallback; };
  function buildCodeEditor(m, mid, changed) {
    mid.innerHTML = '<div class="editor"><div class="gutter" id="gutter" aria-hidden="true">1<\/div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code editor. Press Escape then Tab to leave the editor."><\/textarea><\/div>';
    const ta = $("#code"), gut = $("#gutter"); ta.value = S.drafts[m.id] != null ? S.drafts[m.id] : m.starter;

    let timer = null;
    ta.addEventListener("input", () => { sync(); changed(); clearTimeout(timer); timer = setTimeout(() => { S.drafts[m.id] = ta.value; save(); }, 400); });
    ta.addEventListener("scroll", () => (gut.scrollTop = ta.scrollTop));
    let escaped = false; ta.addEventListener("focus", () => (escaped = false));

      if (e.key === "Tab" && !escaped) { e.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); sync(); changed(); return; }
      if (e.key === "Enter") { e.preventDefault(); const s = ta.selectionStart, line = ta.value.slice(0, s).split("\n").pop(); const indent = line.match(/^ */)[0] + (/:\s*$/.test(line) ? "    " : ""); ta.setRangeText("\n" + indent, s, ta.selectionEnd, "end"); sync(); changed(); }
    });

  function buildFill(m, mid, changed) {

      parts.map((p, i) => esc(p) + (i < n ? '<input class="blank" data-i="' + i + '" size="' + Math.max(5, (vals[i] || "").length + 1) + '" value="' + esc(vals[i] || "") + '" aria-label="Blank ' + (i + 1) + ' of ' + n + '" autocomplete="off" autocapitalize="off" spellcheck="false">' : "")).join("") + "<\/div>";
    $$(".blank", mid).forEach((inp) => inp.addEventListener("input", () => { vals[Number(inp.dataset.i)] = inp.value; inp.size = Math.max(5, inp.value.length + 1); S.drafts[m.id] = JSON.stringify(vals); save(); changed(); }));
    return { getCode: () => parts.map((p, i) => p + (i < n ? vals[i] || "" : "")).join(""), reset: () => { vals = new Array(n).fill(""); $$(".blank", mid).forEach((x) => { x.value = ""; x.size = 5; }); S.drafts[m.id] = JSON.stringify(vals); save(); changed(); } };
  }
  function buildOrder(m, mid, changed) {
    let lines = draftArr(m.id, m.lines.length, m.lines.slice()), dragFrom = -1;
    const box = document.createElement("div");
    mid.innerHTML = '<p class="muted">Arrange the lines (drag them, or use the arrow buttons). Indentation shows which lines belong together.<\/p>'; mid.appendChild(box);
    const persist = () => { S.drafts[m.id] = JSON.stringify(lines); save(); changed(); };
    const move = (i, j) => { if (j < 0 || j >= lines.length) return; const x = lines.splice(i, 1)[0]; lines.splice(j, 0, x); persist(); draw(j); };
    function draw(focusIdx, focusDir) {
      box.innerHTML = '<ol class="order">' + lines.map((l, i) => '<li draggable="true" data-i="' + i + '"><span class="grip" aria-hidden="true">⠿<\/span><code>' + esc(l) + '<\/code><span class="mv"><button class="btn small" data-up="' + i + '" aria-label="Move line ' + (i + 1) + ' up">▲<\/button><button class="btn small" data-dn="' + i + '" aria-label="Move line ' + (i + 1) + ' down">▼<\/button><\/span><\/li>').join("") + "<\/ol>";
      $$("[data-up]", box).forEach((b) => (b.onclick = () => move(Number(b.dataset.up), Number(b.dataset.up) - 1)));
      $$("[data-dn]", box).forEach((b) => (b.onclick = () => move(Number(b.dataset.dn), Number(b.dataset.dn) + 1)));

      });

    }

  function renderStepper(r, code) {

    $("#midpane").innerHTML = '<div class="term"><div class="log" id="tlog" role="log" aria-live="polite"><\/div><form id="tform"><span class="mono" id="tprompt"><\/span><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command"><\/form><\/div>' +
      (hasAnswer ? '<label class="muted" for="ans" style="display:block;margin-top:.6rem">Your answer<\/label><input class="input" id="ans" autocomplete="off" placeholder="Type what you found, e.g. a name or a path">' : "") +
      '<div class="row" style="margin-top:.6rem"><button class="btn good" id="checkBtn">✔ ' + esc(hasAnswer ? "Check my answer" : "Check my fix") + '<\/button><button class="btn small" id="treset">↺ Reset server<\/button><\/div>';
    const log = $("#tlog"), inp = $("#tin"), prompt = () => ($("#tprompt").textContent = "oncall@aata:" + T.cwd + "$"); prompt();
    const put = (txt, cls) => { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = txt; log.appendChild(d); log.scrollTop = log.scrollHeight; };

    const hist = []; let hp = 0;

  VIEWS.profile = function (v) {
    const rk = AK.rankFor(S.xp), st = AK.streakStatus(S, new Date()), badges = AK.allBadges(DATA), pyRegions = DATA.regions.filter((r) => r.track === "python");

      '<h3 style="margin-top:1rem">' + esc(rankName(S.xp)) + " · " + S.xp + ' XP · ⭐ ' + AK.totalStars(S) + '<\/h3><div class="bar" role="progressbar" aria-valuenow="' + rk.pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + rk.pct + '%"><\/i><\/div><div class="muted">' + (rk.next ? (rk.next.xp - S.xp) + " XP to " + (S.settings.lang === "te" ? rk.next.te : rk.next.en) : "Top rank reached 🌳") + '<\/div>' +
      '<p>🔥 Streak: <b>' + st.count + "<\/b> day" + (st.count === 1 ? "" : "s") + " · best " + S.streak.best + " · ❄ freezes: " + S.streak.freezes + ' · 📅 daily quests: ' + S.dailyDone + '<\/p><p class="muted">Learn on 7 days in a row to earn a freeze that saves your streak if you miss a day. <a href="#/daily">Today\'s Daily Quest →<\/a><\/p><\/div>' +
      '<div class="card"><h3>Skills<\/h3>' + (skillKeys.length ? skillKeys.slice(0, 12).map((k) => '<div class="skillrow"><span>' + esc(k) + '<\/span><div class="bar"><i style="width:' + Math.round((skills[k] / maxSk) * 100) + '%"><\/i><\/div><span>' + skills[k] + "<\/span><\/div>").join("") + (skillKeys.length > 12 ? '<p class="muted">+ ' + (skillKeys.length - 12) + " more skills<\/p>" : "") : '<p class="muted">Solve missions to grow your skills.<\/p>') + "<\/div><\/div>" +
      '<h3 style="margin-top:1.4rem">Chilaka\'s wardrobe <span class="muted" style="font-size:.8rem">(free, unlocked by clearing regions)<\/span><\/h3><div class="wardrobe" id="wardrobe">' +
      OUTFITS.map((o) => { const open = outfitUnlocked(o); return '<button class="outfit' + (S.settings.outfit === o.id ? " on" : "") + '" data-o="' + o.id + '"' + (open ? "" : " disabled") + ' title="' + esc(open ? o.name : "Locked: " + o.hint) + '">' + parrot(48, o.id) + "<div>" + esc(o.name) + (open ? "" : " 🔒") + "<\/div><\/button>"; }).join("") + "<\/div>" +

      '<div class="grid g2" style="margin-top:1.4rem"><div class="card"><h3>Your data<\/h3><p class="muted">Everything lives on this device. Export a backup, move it to another device, or start over.<\/p><div class="row"><button class="btn" id="exp">⬇ Export progress<\/button><label class="btn" for="imp">⬆ Import<\/label><input type="file" id="imp" accept="application/json,.json" class="sr"><button class="btn small" id="wipe">Reset everything<\/button><\/div><p id="datamsg" class="muted"><\/p><\/div>' +

    $("#selLang").value = S.settings.lang; $("#selTheme").value = S.settings.theme; $("#selMotion").value = S.settings.motion; $("#selEditor").value = S.settings.editor;
    const refreshCard = () => ($("#card").value = AK.encodeCard(S)); refreshCard();

      const f = e.target.files[0]; if (!f) return; const rd = new FileReader();

  /* ---- teacher dashboard (works offline: students share cards, nothing is uploaded) */
  VIEWS.teacher = function (v) {
    const load = () => { try { return JSON.parse(store.get(ROSTER_KEY) || "[]"); } catch (e) { return []; } };
    let roster = load(); const saveR = () => store.set(ROSTER_KEY, JSON.stringify(roster));
    const total = DATA.missions.length;

      const regs = DATA.regions, order = roster.map((c, i) => i).sort((a, b) => roster[b].x - roster[a].x);
      const solvedTotal = roster.reduce((n, c) => n + c.s.length, 0), goal = Number(store.get(goalKey)) || Math.max(10, roster.length * 10);
      v.innerHTML = '<h2>🍎 Teacher dashboard<\/h2><div class="card"><p>Free for every teacher, and it works with no server. Students open <b>Profile → Teacher card<\/b> and send you their code. Paste the codes below (one per line) to see class progress. Cards are self-reported: the tests run on each student\'s device, so use this for encouragement and check-ins, not exams.<\/p>' +
        '<textarea class="input" id="cards" rows="3" placeholder="Paste AK1:… codes here, one per line"><\/textarea><div class="row" style="margin-top:.5rem"><button class="btn primary" id="addCards">Add to class<\/button><button class="btn" id="csv"' + (roster.length ? "" : " disabled") + '>⬇ Export CSV<\/button><button class="btn small" id="clearR"' + (roster.length ? "" : " disabled") + '>Clear class<\/button><span class="muted" id="tmsg"><\/span><\/div><\/div>' +

          order.map((i, pos) => { const c = roster[i]; return "<tr><td>" + (pos + 1) + "<\/td><td>" + esc(c.n || "(no name)") + "<\/td><td>" + esc(c.c || "") + "<\/td><td>" + esc(AK.rankFor(c.x).current.en) + "<\/td><td>" + c.x + "<\/td><td>" + c.s.length + "/" + total + "<\/td>" +
            regs.map((r) => { const ms = AK.regionMissions(DATA, r.id), d = ms.filter((m) => c.s.includes(m.id)).length; return "<td>" + (d === ms.length ? "✔" : d + "/" + ms.length) + "<\/td>"; }).join("") +
            "<td>🔥 " + c.k + "<\/td><td>" + c.b.length + "<\/td><td>" + esc((c.t || "").slice(0, 10)) + '<\/td><td><button class="btn small" data-rm="' + i + '" aria-label="Remove ' + esc(c.n || "student") + '">✕<\/button><\/td><\/tr>'; }).join("") + "<\/tbody><\/table><\/div>" : '<p class="muted" style="margin-top:1rem">No students yet.<\/p>');
      $("#addCards").onclick = () => {

  /* ---- about */
  VIEWS.about = function (v) {
    v.innerHTML = '<h2>About AataKode<\/h2><div class="grid g2"><div class="card"><h3>The promise<\/h3><p>Every lesson, project, badge and class tool is free, forever. No ads, no tracking, no locked missions.<\/p><p class="muted">Premium is planned only for things that cost money to run: cloud sync across devices, an unlimited AI tutor, human code review, and private groups. It is not available yet, and it will never gate learning.<\/p><\/div>' +
      '<div class="card"><h3>How your data works<\/h3><p>Your progress is stored in this browser. Export it from your Profile to back it up or move it. Nothing is uploaded; the Python engine runs inside your browser.<\/p><\/div>' +
      '<div class="card"><h3>Help build it<\/h3><p>Missions are plain JSON files, checked automatically in CI. Add a mission, a hint, or a translation.<\/p><a class="btn" href="' + REPO + '">Open the repository<\/a><\/div>' +
      '<div class="card"><h3>About the Telugu interface<\/h3><p class="muted">The navigation, ranks and badges have a Telugu interface; lessons are in English for now. Corrections from native speakers are very welcome.<\/p><\/div><\/div>';

    state: () => S, save: save, toast: toast, esc: esc, $: $, $$: $$, t: t, lt: lt, DATA: DATA, byId: byId, regionById: regionById, VIEWS: VIEWS, route: route, renderHeader: renderHeader,

  };
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});

<script>/* AataKode feel layer: sound, haptics, parrot buddy, typing feel, village scene.
   Everything here is optional polish: it reads settings (sound / haptics / buddy / motion) and never blocks learning. */
(function () {
  "use strict";
  var C = window.AK_CORE, AK = window.AK;
  if (!C) return;
  var $ = C.$, $$ = C.$$, esc = C.esc;
  var UI = (window.AK_UI = window.AK_UI || { hooks: {}, mission: {}, views: {} });
  var FX = (window.AK_FX = {});
  var S = function () { return C.state(); };
  var cfg = function (k) { var v = (S().settings || {})[k]; return v === undefined ? "on" : v; };

  /* ---------------------------------------------------------------- sound (tiny WebAudio synth, no files) */
  var ctx = null;
  function audio() {
    if (cfg("sound") === "off") return null;
    try {
      if (!ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

    $("#submitBtn").onclick = async function () {
      var api = await engine(); if (!api) return; var code = ta.value, results = api.sqlGrade(code, m.setup, C.allTests(m));
      C.lightTests(m, results, function () {
        if (results.every(function (r) { return r.ok; })) C.finishMission(m, w, { code: code, cleanPass: null });
        else { C.tries[m.id] = (C.tries[m.id] || 0) + 1; C.toast("Not yet. Read the failed checks and try again."); H.failed(m); }
      });
    };
    $("#rewardSlot").innerHTML = S().solved[m.id] ? '<div class="reward"><b>✔ You solved this mission.<\/b> <a href="#/map">Back to the map<\/a><\/div>' : "";
    C.bindExplain(m); C.setPyPill();
  };

  /* ---------------------------------------------------------------- Pair Parrot */
  var pairDone = {};
  UI.mission.pair = function (v, m, w) {
    if (S().solved[m.id] || pairDone[m.id]) { C.missionPython(v, m, w); return; }
    var d = m.diagnose, first = true;
    v.innerHTML = '<div class="mhead"><a class="btn small" href="#/map">← Back<\/a><span class="tag">' + esc(C.lt(C.regionById[m.region], "title")) + ' · PAIR PARROT<\/span><h2>' + esc(m.title) + '<\/h2><span class="chip gold">' + m.xp + ' XP<\/span><\/div>' +
      '<div class="card"><div class="row" style="align-items:flex-start"><div>' + C.parrot(80) + '<\/div><div class="grow"><div class="story">' + esc(m.story) + '<\/div><div class="bubble pairsay">🦜 ' + esc(m.parrot.says) + '<\/div><\/div><\/div>' +
      '<h3 style="margin-top:1rem">Parrot\'s code<\/h3>' + codeBox(m.starter) + '<h3>Step 1: Diagnose<\/h3><p>' + esc(d.question) + '<\/p><div class="opts" id="dopts">' + d.options.map(function (o, i) { return '<button class="btn opt" data-i="' + i + '">' + esc(o) + "<\/button>"; }).join("") + '<\/div><div id="dres"><\/div><\/div>';
    $$(".opt", v).forEach(function (b) { b.onclick = function () {
      var i = Number(b.dataset.i);
      if (i === d.answer) {
        sfx("ok"); buzz(10); $$(".opt", v).forEach(function (x) { x.disabled = true; }); b.classList.add("right"); C.diag[m.id] = first; pairDone[m.id] = true;
        $("#dres").innerHTML = '<div class="reward"><b>' + (first ? "Spot on! " : "Got it. ") + "<\/b>" + esc(d.why) + '<div style="margin-top:.6rem"><button class="btn primary" id="toFix">Step 2: Fix the code →<\/button><\/div><\/div>';
        $("#toFix").onclick = function () { C.missionPython(v, m, w); };
      } else { first = false; b.classList.add("wrong"); b.disabled = true; sfx("no"); buzz([30, 40, 30]); C.toast("Not that one. Look at what the code does."); }
    }; });
  };

  /* ---------------------------------------------------------------- hooks: worked-example fading, golf, speed, cheat sheets */
  H.fade = function (m) {
    if (!m.fade) return null; var lv = AK.scaffoldLevel(S(), DATA, m);
    if (lv >= 2 && (S().drafts || {})[m.id] == null) return Object.assign({}, m, { starter: m.fade.partial });
    return null;
  };
  var speedRun = { id: null, t0: 0 };
  H.python = function (m, ed, mid) {
    if (m.fade) {
      var lv = AK.scaffoldLevel(S(), DATA, m), names = { 3: "Worked example + half-filled code", 2: "Half-filled code", 1: "Blank editor" };
      var box = document.createElement("div"); box.className = "card fade-card";
      box.innerHTML = '<div class="row spread"><b>🪜 Guided help: ' + names[lv] + '<\/b><span class="row"><button class="btn small" data-lv="up">More help<\/button><button class="btn small" data-lv="down">Less help<\/button><\/span><\/div>' +
        (lv >= 3 ? '<div class="fade-ex"><b>' + esc(m.fade.example.title) + "<\/b>" + codeBox(m.fade.example.code) + '<div class="muted">' + esc(m.fade.example.note) + "<\/div><\/div>" : "") + (lv >= 2 ? '<div class="muted" style="font-size:.85rem">Fill in the <code>____<\/code> in the editor.<\/div>' : '<div class="muted" style="font-size:.85rem">No scaffolding: you have this skill. Write it yourself.<\/div>');
      mid.parentNode.insertBefore(box, mid);
      $$("[data-lv]", box).forEach(function (b) { b.onclick = function () { AK.setScaffold(S(), m.id, lv + (b.dataset.lv === "up" ? 1 : -1)); delete S().drafts[m.id]; C.save(); C.missionPython($("#view"), m, C.weekly()); }; });
    }
    if (m.golf) {
      var g = m.golf, bar = document.createElement("div"); bar.className = "golfbar"; mid.appendChild(bar);
      var upd = function () { var n = AK.golfStrokes(ed.getCode()), rk = AK.golfRank(n, g.par), rec = (S().golf || {})[m.id]; bar.innerHTML = '<span class="chip">⛳ Strokes <b>' + n + '<\/b><\/span><span class="chip">Par ' + g.par + '<\/span><span class="chip">' + esc(rk.label) + '<\/span>' + (rec ? '<span class="chip gold">Your best ' + rec.best + "<\/span>" : "") + '<span class="muted" style="font-size:.8rem">Comments and blank lines are free.<\/span>'; };
      upd(); var ta = $("#code"); if (ta) ta.addEventListener("input", upd);
    }
    if (speedRun.id === m.id) {
      speedRun.t0 = Date.now(); var chip = document.createElement("span"); chip.className = "chip gold"; chip.id = "speedchip"; chip.textContent = "⏱ 0.0s"; var hd = $(".mhead"); if (hd) hd.appendChild(chip);
      var iv = setInterval(function () { var c = $("#speedchip"); if (!c || speedRun.id !== m.id) { clearInterval(iv); return; } c.textContent = "⏱ " + AK.fmtMs(Date.now() - speedRun.t0); }, 200);
    }
  };
  H.passed = function (m, o) {
    var st = S();
    if (m.golf && o && o.code) {
      var r = AK.golfRecord(st, DATA, m, AK.golfStrokes(o.code), new Date()); C.save();
      setTimeout(function () { C.toast("⛳ " + r.rank.label + " · " + AK.golfStrokes(o.code) + " strokes" + (r.improved ? " · new best!" : "")); (r.newBadges || []).length && C.badgeToasts(r.newBadges); }, 700);
    }
    if (speedRun.id === m.id && speedRun.t0 && st.solved[m.id]) {
      var ms = Date.now() - speedRun.t0, r2 = AK.speedRecord(st, DATA, m.id, ms, new Date()); speedRun = { id: null, t0: 0 }; C.save();
      setTimeout(function () { C.toast("⏱ " + AK.fmtMs(ms) + (r2.pb ? " · personal best! +" + r2.seeds + " 🌱" : " · best " + AK.fmtMs(r2.best))); (r2.newBadges || []).length && C.badgeToasts(r2.newBadges); }, 700);
    }
  };
  var GIT_SHEET = '<p class="muted">Commands in this simulated repository:<\/p><ul class="mono" style="font-size:.85rem;padding-left:1.1rem"><li>git status · git diff · git diff --staged<\/li><li>git add FILE · git commit -m "msg"<\/li><li>git log --oneline · git blame FILE<\/li><li>git switch -c NAME · git switch NAME<\/li><li>git merge NAME · git branch -d NAME<\/li><li>git restore FILE · git restore --staged FILE<\/li><li>git commit --amend -m "msg" · git revert HEAD<\/li><li>git reset --hard HEAD~1 · git reflog<\/li><li>git stash · git stash pop · git tag NAME<\/li><\/ul><p class="muted">Edit a file with <code>echo "text" &gt; file<\/code>. Nothing touches your real computer.<\/p>';
  var CASE_SHEET = '<p class="muted">Detective toolkit:<\/p><ul class="mono" style="font-size:.85rem;padding-left:1.1rem"><li>ls /case · cat FILE<\/li><li>grep PATTERN FILES · grep -r PATTERN DIR<\/li><li>grep -l PATTERN FILES (names only)<\/li><li>cut -d\' \' -f1 FILE · sort · uniq -c · sort -rn<\/li><li>diff FILE1 FILE2 · wc -l<\/li><\/ul><p class="muted">Cross-check at least two witnesses before you answer.<\/p>';
  var OPS_SHEET = '<p class="muted">Commands in this simulated server:<\/p><ul class="mono" style="font-size:.85rem;padding-left:1.1rem"><li>ls -l · cat · head · tail · grep · wc · sort · uniq · cut · awk<\/li><li>ps · top · kill PID · pgrep · pkill<\/li><li>systemctl status|start|restart NAME · journalctl -u NAME<\/li><li>chmod 755 FILE · chown USER FILE · sudo CMD<\/li><li>df -h · du -a · free -h · uptime<\/li><li>curl URL · curl -I URL<\/li><li>sed -i \'s/old/new/\' FILE · echo "x" &gt;&gt; FILE · rm · cp · mv · touch<\/li><li>crontab -l · diff A B · find<\/li><\/ul><p class="muted">Pipes (|), chaining (; &amp;&amp;) and redirects (&gt; &gt;&gt;) work.<\/p>';
  H.terminal = function (m) { var p = $("#tab-cheat"); if (!p) return; p.innerHTML = m.tool === "git" ? GIT_SHEET : m.mystery ? CASE_SHEET : OPS_SHEET; };

  /* ---------------------------------------------------------------- Outage of the Day + Arena hub */
  function outageDay() { return AK.outageOfDay(DATA.missions, new Date()); }
  function dayCard() {
    var d = outageDay(); if (!d) return "";
    var done = (S().outageDays || {})[AK.dateKey(new Date())] === d.id;
    return '<div class="card" style="margin-top:1rem"><span class="tag">OUTAGE OF THE DAY<\/span><h3 style="margin:.4rem 0 .2rem">📟 ' + esc(d.title) + '<\/h3><p class="muted">' + esc(d.goal) + '<\/p><div class="row"><a class="btn ' + (done ? "" : "primary") + '" href="#/mission/' + d.id + '/day">' + (done ? "Replay" : "Take today\'s call →") + '<\/a><span class="chip gold">+15 bonus XP · +5 🌱<\/span>' + (done ? '<span class="tag">✔ done today<\/span>' : "") + "<\/div><\/div>";
  }
  var oldArena = VIEWS.arena;
  VIEWS.arena = function (v) {
    var st = S(), golf = DATA.missions.filter(function (m) { return m.golf; }), gdone = golf.filter(function (m) { return (st.golf || {})[m.id]; }).length;
    var tile = function (href, ico, title, sub) { return '<a class="card tile" href="' + href + '"><span class="tico">' + ico + "<\/span><b>" + title + '<\/b><span class="muted">' + sub + "<\/span><\/a>"; };
    oldArena(v);
    var hub = '<div class="grid g3" style="margin:1rem 0">' +
      tile("#/speed", "⏱", "Speed Run", "Race solved missions. Best: " + (Object.keys(st.speed || {}).length || "none yet")) +
      tile("#/speed/blitz", "⚡", "Predict Blitz", "6 questions, beat the clock. Best " + ((st.blitz || {}).best || 0)) +
      tile("#/golf", "⛳", "Code Golf Shrine", gdone + " of " + golf.length + " holes played") +
      tile("#/dungeon", "🕳", "Endless Dungeon", "Best floor: " + ((st.dungeon || {}).best || 0)) +
      tile("#/placement", "🎯", "Placement Quiz", st.placed ? "Placed at " + esc(st.placed.region) : "Skip what you already know") +
      tile("#/pair", "🦜", "Pair Parrot", "Debug with Chilaka") + "<\/div>";
    var h2 = $("h2", v); h2.insertAdjacentHTML("afterend", hub + dayCard());
  };
  VIEWS.pair = function () { var m = DATA.missions.filter(function (x) { return x.type === "pair"; })[0]; location.hash = "#/mission/" + (DATA.missions.filter(function (x) { return x.type === "pair" && !S().solved[x.id]; })[0] || m).id; };
  var oldHome = VIEWS.home;
  VIEWS.home = function (v) {
    oldHome(v); var st = S(), extra = dayCard();
    if (!st.placed && Object.keys(st.solved).length < 3) extra += '<div class="card" style="margin-top:1rem"><div class="row spread"><div><b>🎯 Already know some Python?<\/b><div class="muted">Take the 10-question placement quiz and skip ahead.<\/div><\/div><a class="btn" href="#/placement">Take the quiz<\/a><\/div><\/div>';
    var sec = $(".grid.g3", v); if (sec) sec.insertAdjacentHTML("afterend", extra);
  };

  /* ---------------------------------------------------------------- Speed Run + Blitz */
  VIEWS.speed = function (v, arg) {
    if (arg === "blitz") return blitz(v);
    var st = S(), list = DATA.missions.filter(function (m) { return st.solved[m.id] && (m.type === "write-code" || m.type === "fix-the-bug" || m.type === "pair"); });
    v.innerHTML = '<h2>⏱ Speed Run<\/h2><p class="muted">Replay a solved mission against the clock. Your personal best earns seeds. The timer starts when the editor opens.<\/p>' +
      (list.length ? '<div class="grid g3">' + list.map(function (m) { var r = (st.speed || {})[m.id]; return '<div class="card"><b>' + esc(m.title) + '<\/b><div class="muted" style="font-size:.85rem">' + (r ? "Best " + AK.fmtMs(r.best) + " · " + r.runs + " runs" : "Not raced yet") + '<\/div><button class="btn small primary" data-race="' + m.id + '" style="margin-top:.5rem">▶ Race<\/button><\/div>'; }).join("") + "<\/div>" : '<div class="card">Solve a coding mission first. Then you can race it here.<\/div>') +
      '<p style="margin-top:1rem"><a class="btn" href="#/speed/blitz">⚡ Predict Blitz<\/a><\/p>';
    $$("[data-race]", v).forEach(function (b) { b.onclick = function () { speedRun = { id: b.dataset.race, t0: 0 }; location.hash = "#/mission/" + b.dataset.race; }; });
  };
  function blitz(v) {
    var qs = shuffle(DATA.missions.filter(function (m) { return m.type === "predict" && !m.stdin; })).slice(0, 6), i = 0, ok = 0, bad = 0, t0 = Date.now();
    function ask() {
      if (i >= qs.length) { var ms = Date.now() - t0, r = AK.blitzRecord(S(), DATA, ok, bad, qs.length, ms, new Date()); C.save(); sfx("solved"); refresh();
        v.innerHTML = '<h2>⚡ Blitz result<\/h2><div class="card"><div style="font-size:2rem">' + r.score + ' points' + (r.pb ? " 🏆 new best!" : "") + '<\/div><p>' + ok + " right, " + bad + " wrong, " + AK.fmtMs(ms) + ' · +' + r.seeds + ' 🌱<\/p><div class="row"><button class="btn primary" id="again">Again<\/button><a class="btn" href="#/arena">Arena<\/a><\/div><\/div>'; (r.newBadges || []).length && C.badgeToasts(r.newBadges); $("#again").onclick = function () { blitz(v); }; return; }
      var m = qs[i]; v.innerHTML = '<div class="row spread"><h2>⚡ Predict Blitz<\/h2><span class="chip">' + (i + 1) + " / " + qs.length + '<\/span><\/div><div class="card">' + codeBox(m.code) + '<div class="opts">' + m.options.map(function (o, k) { return '<button class="btn opt" data-k="' + k + '"><pre class="mono" style="margin:0;white-space:pre-wrap">' + esc(o) + "<\/pre><\/button>"; }).join("") + "<\/div><\/div>";
      $$(".opt", v).forEach(function (b) { b.onclick = function () { var k = Number(b.dataset.k), right = k === m.answer; $$(".opt", v).forEach(function (x) { x.disabled = true; }); b.classList.add(right ? "right" : "wrong"); if (!right) $$(".opt", v)[m.answer].classList.add("right"); right ? ok++ : bad++; sfx(right ? "ok" : "no"); buzz(right ? 10 : [30, 40, 30]); i++; setTimeout(ask, right ? 450 : 1100); }; });
    }
    ask();
  }

  /* ---------------------------------------------------------------- Code Golf Shrine */
  VIEWS.golf = function (v) {
    var st = S(), gs = DATA.missions.filter(function (m) { return m.golf; });
    v.innerHTML = '<h2>⛳ Code Golf Shrine<\/h2><p class="muted">Solve the hole, then shrink your code. Strokes are counted in characters (comments and blank lines are free). Beat par for a birdie.<\/p><div class="grid g3">' +
      gs.map(function (m) { var r = (st.golf || {})[m.id]; return '<a class="card" style="text-decoration:none;color:inherit" href="#/mission/' + m.id + '"><b>' + esc(m.title) + '<\/b><div class="muted" style="font-size:.85rem">Par ' + m.golf.par + (r ? " · your best " + r.best + " · " + esc(AK.golfRank(r.best, m.golf.par).label) : " · not played") + "<\/div><\/a>"; }).join("") + "<\/div>";
  };

  /* ---------------------------------------------------------------- Endless Dungeon */
  VIEWS.dungeon = function (v) {
    var run = { seed: Math.floor(Math.random() * 1e6) + 1, floor: 1, lives: 3, cleared: 0 };
    v.innerHTML = '<h2>🕳 Endless Dungeon<\/h2><div class="card">Loading the Python engine…<\/div>';
    C.ensurePy().then(function (api) { floor(); function floor() {
      var def = AK.dungeonFloor(run.seed, run.floor), b = AK.dungeonBuild(def, function (c) { return api.run(c, [], false); });
      if (!b) { run.floor++; floor(); return; }
      v.innerHTML = '<div class="row spread"><h2>🕳 Floor ' + run.floor + '<\/h2><span class="chip">' + "❤".repeat(run.lives) + "🖤".repeat(3 - run.lives) + '<\/span><span class="chip gold">Best ' + ((S().dungeon || {}).best || 0) + '<\/span><\/div><div class="card"><p class="muted">' + esc(b.title) + " · predict the output<\/p>" + codeBox(b.code) + '<div class="opts">' + b.options.map(function (o, k) { return '<button class="btn opt" data-k="' + k + '"><pre class="mono" style="margin:0;white-space:pre-wrap">' + esc(o) + "<\/pre><\/button>"; }).join("") + '<\/div><div id="dmsg"><\/div><\/div>';
      $$(".opt", v).forEach(function (btn) { btn.onclick = function () {
        var k = Number(btn.dataset.k), right = k === b.answer; $$(".opt", v).forEach(function (x) { x.disabled = true; }); btn.classList.add(right ? "right" : "wrong"); if (!right) $$(".opt", v)[b.answer].classList.add("right");
        if (right) { var n = AK.dungeonCleared(S(), run.floor); run.cleared++; C.save(); sfx("ok"); buzz(10); $("#dmsg").innerHTML = '<p class="muted">Cleared! +' + n + " 🌱<\/p>"; run.floor++; refresh(); setTimeout(floor, 800); }
        else { run.lives--; sfx("no"); buzz([30, 40, 30]); if (run.lives <= 0) { var r = AK.dungeonEnd(S(), DATA, run.cleared, new Date()); C.save(); refresh(); setTimeout(function () { v.innerHTML = '<h2>🕳 The dungeon wins this time<\/h2><div class="card"><div style="font-size:2rem">' + run.cleared + ' floors cleared' + (r.pb ? " 🏆 new best!" : "") + '<\/div><p class="muted">Best: ' + r.best + '<\/p><div class="row"><button class="btn primary" id="again">Descend again<\/button><a class="btn" href="#/arena">Arena<\/a><\/div><\/div>'; (r.newBadges || []).length && C.badgeToasts(r.newBadges); $("#again").onclick = function () { VIEWS.dungeon(v); }; }, 1200); }
          else { $("#dmsg").innerHTML = '<p class="muted">Not quite. ' + run.lives + " lives left.<\/p>"; run.floor++; setTimeout(floor, 1300); } }
      }; });
    } }, function () { v.innerHTML = '<div class="card">' + esc(C.PY_OFFLINE) + "<\/div>"; });
  };

  /* ---------------------------------------------------------------- Placement quiz */
  VIEWS.placement = function (v) {
    var qs = (DATA.placement || []).slice().sort(function (a, b) { return a.level - b.level; }), i = 0, okMap = {}, miss = 0;
    if (!qs.length) { v.innerHTML = '<div class="card">No placement quiz in this build.<\/div>'; return; }
    function ask() {
      if (i >= qs.length || miss >= 2) {
        var res = AK.applyPlacement(S(), DATA, okMap, new Date()); C.save(); refresh(); sfx("solved");
        v.innerHTML = '<h2>🎯 Your starting point<\/h2><div class="card"><div style="font-size:1.6rem">' + res.region.icon + " " + esc(res.region.title) + '<\/div><p>You got ' + S().placed.score + " of " + S().placed.total + ' right. Earlier regions are open and you start here.<\/p><div class="row"><a class="btn primary" href="#/map">Open the map<\/a><\/div><\/div>'; (res.newBadges || []).length && C.badgeToasts(res.newBadges); return;
      }
      var q = qs[i]; v.innerHTML = '<div class="row spread"><h2>🎯 Placement quiz<\/h2><span class="chip">' + (i + 1) + " / " + qs.length + '<\/span><\/div><p class="muted">Predict the output. It stops early after two misses, so a wrong answer is fine.<\/p><div class="card">' + codeBox(q.code) + '<div class="opts">' + q.options.map(function (o, k) { return '<button class="btn opt" data-k="' + k + '"><pre class="mono" style="margin:0;white-space:pre-wrap">' + esc(o) + "<\/pre><\/button>"; }).join("") + '<\/div><\/div><p><button class="btn small" id="skipq">I am not sure<\/button><\/p>';
      var next = function (right, k) { okMap[q.id] = right; if (!right) miss++; $$(".opt", v).forEach(function (x) { x.disabled = true; }); if (k !== null) { $$(".opt", v)[k].classList.add(right ? "right" : "wrong"); } if (!right) $$(".opt", v)[q.answer].classList.add("right"); sfx(right ? "ok" : "no"); i++; setTimeout(ask, right ? 500 : 1100); };
      $$(".opt", v).forEach(function (b) { b.onclick = function () { var k = Number(b.dataset.k); next(k === q.answer, k); }; });
      $("#skipq").onclick = function () { next(false, null); };
    }
    ask();
  };

  /* ---------------------------------------------------------------- settings card on the profile page */
  var oldProfile = VIEWS.profile;
  VIEWS.profile = function (v) {
    oldProfile(v); var st = S(), cfg = function (k) { return st.settings[k] || "on"; };
    var sel = function (id, label, opts) { return '<label class="muted" for="' + id + '">' + label + '<\/label><select class="input" id="' + id + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (cfg(id.replace("set_", "")) === o[0] ? " selected" : "") + ">" + o[1] + "<\/option>"; }).join("") + "<\/select>"; };
    var card = document.createElement("div"); card.className = "card"; card.style.marginTop = "1rem";
    card.innerHTML = "<h3>🎛 Feel<\/h3><div class=\"grid g3\"><div>" + sel("set_sound", "Sound", [["on", "On"], ["quiet", "Quiet"], ["off", "Off"]]) + "<\/div><div>" + sel("set_haptics", "Vibration (phones)", [["on", "On"], ["off", "Off"]]) + "<\/div><div>" + sel("set_buddy", "Parrot buddy", [["on", "On"], ["off", "Off"]]) + '<\/div><\/div><p class="muted" style="font-size:.85rem">Sounds are generated in your browser. Nothing is downloaded and nothing is recorded.<\/p><button class="btn small" id="testSound">🔊 Test<\/button>';
    v.appendChild(card);
    ["sound", "haptics", "buddy"].forEach(function (k) { $("#set_" + k).onchange = function (e) { st.settings[k] = e.target.value; C.save(); if (k === "buddy" && e.target.value === "off") FX.buddyOff(); }; });
    $("#testSound").onclick = function () { sfx("solved"); buzz([20, 40, 20]); };
  };

  UI.start = function () { window.addEventListener("hashchange", C.route); C.route(); };
})();
