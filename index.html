unt == 0:\n        return 0.0\n    return total / count\n"},{"id":"w-json","region":"files-errors","order":8,"title":"Save Progress","story":"A game saves progress as JSON so a player can come back tomorrow.","goal":"Write save_progress(path, data) and load_progress(path, default=None). Loading a missing file returns default.","type":"write-code","starter":"import json\n# define save_progress and load_progress\n","tests":[{"kind":"eval","label":"Round trip","expr":"(save_progress(\"p.json\", {\"xp\": 5}), load_progress(\"p.json\"))[1]","expect":"{'xp': 5}"},{"kind":"eval","label":"Missing file gives default","expr":"load_progress(\"nope.json\", {})","expect":"{}"},{"kind":"eval","label":"Default is None","expr":"load_progress(\"nope2.json\") is None","expect":"True","hidden":true}],"hints":["json.dump(data, file) writes, json.load(file) reads.","A missing file raises FileNotFoundError: catch it and return default.","import json\n\n\ndef save_progress(path, data):\n    with open(path, \"w\") as f:\n        json.dump(data, f)\n\n\ndef load_progress(path, default=None):\n    try:\n        with open(path) as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return default\n"],"socratic":["Which error does open raise for a missing file?","What should the caller get back then?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Save Progress”?","xp":30,"skills":["json","files","try/except"],"requires":["w-csv"],"solution":"import json\n\n\ndef save_progress(path, data):\n    with open(path, \"w\") as f:\n        json.dump(data, f)\n\n\ndef load_progress(path, default=None):\n    try:\n        with open(path) as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return default\n","alt":"import json\n\n\ndef save_progress(path, data):\n    f = open(path, \"w\")\n    f.write(json.dumps(data))\n    f.close()\n\n\ndef load_progress(path, default=None):\n    try:\n        f = open(path)\n    except FileNotFoundError:\n        return default\n    data = json.loads(f.read())\n    f.close()\n    return data\n"},{"id":"w-raise","region":"files-errors","order":9,"title":"Strict Age","story":"The registration form must refuse impossible ages.","goal":"Write check_age(age) returning age if it is between 0 and 150, otherwise raising ValueError.","type":"write-code","starter":"# define check_age\n","tests":[{"kind":"eval","label":"Valid age","expr":"check_age(30)","expect":"30"},{"kind":"raises","label":"Negative age is refused","expr":"check_age(-1)","exc":"ValueError"},{"kind":"raises","label":"Huge age is refused","expr":"check_age(200)","exc":"ValueError"},{"kind":"eval","label":"Edge: 0 is allowed","expr":"check_age(0)","expect":"0","hidden":true}],"hints":["Use if to detect a bad value, then raise ValueError(\"message\").","The check is: age < 0 or age > 150.","def check_age(age):\n    if age < 0 or age > 150:\n        raise ValueError(\"age out of range\")\n    return age\n"],"socratic":["Which keyword makes an error on purpose?","Which ages are allowed?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Strict Age”?","xp":30,"skills":["raise"],"requires":["w-json"],"solution":"def check_age(age):\n    if age < 0 or age > 150:\n        raise ValueError(\"age out of range\")\n    return age\n","alt":"def check_age(age):\n    if not 0 <= age <= 150:\n        raise ValueError(f\"bad age: {age}\")\n    return age\n"},{"id":"w-safe-int","region":"files-errors","order":2,"title":"Safe Converter","story":"Letters arrive with messy numbers. The post office must never crash on a bad one.","goal":"Write to_int(text, default=0) that returns int(text), or default if the text is not a whole number.","type":"write-code","starter":"# define to_int\n","tests":[{"kind":"eval","label":"Good number","expr":"to_int(\"42\")","expect":"42"},{"kind":"eval","label":"Bad number gives default","expr":"to_int(\"abc\")","expect":"0"},{"kind":"eval","label":"Custom default","expr":"to_int(\"x\", -1)","expect":"-1"},{"kind":"eval","label":"Spaces are fine","expr":"to_int(\" 7 \")","expect":"7","hidden":true}],"hints":["Wrap the risky conversion in try and catch ValueError.","Inside except, return default.","def to_int(text, default=0):\n    try:\n        return int(text)\n    except ValueError:\n        return default\n"],"socratic":["Which line might raise an error?","What should the function return when it does?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Safe Converter”?","xp":30,"skills":["try/except","defaults"],"requires":["p-try"],"solution":"def to_int(text, default=0):\n    try:\n        return int(text)\n    except ValueError:\n        return default\n","alt":"def to_int(text, default=0):\n    text = text.strip()\n    if text.lstrip(\"-\").isdigit():\n        return int(text)\n    return default\n"},{"id":"w-write-read","region":"files-errors","order":4,"title":"Notebook","story":"The post office keeps notes in files so they survive after the program stops.","goal":"Write save_note(path, text) that writes text to a file, and read_note(path) that returns the file's text.","type":"write-code","starter":"# define save_note and read_note\n","tests":[{"kind":"eval","label":"Round trip","expr":"save_note(\"n.txt\", \"hello\") or read_note(\"n.txt\")","expect":"'hello'"},{"kind":"eval","label":"Overwrites","expr":"(save_note(\"n2.txt\", \"one\"), save_note(\"n2.txt\", \"two\"), read_note(\"n2.txt\"))[2]","expect":"'two'","hidden":true},{"kind":"source","label":"Uses open","pattern":"open\\("}],"hints":["open(path, \"w\") opens a file for writing. Use with so it closes itself.","Reading is open(path) and .read(). Use \"w\" to write.","def save_note(path, text):\n    with open(path, \"w\") as f:\n        f.write(text)\n\n\ndef read_note(path):\n    with open(path) as f:\n        return f.read()\n"],"socratic":["Which mode opens a file for writing?","What does with do when the block ends?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Notebook”?","xp":30,"skills":["files","with"],"requires":["f-except"],"solution":"def save_note(path, text):\n    with open(path, \"w\") as f:\n        f.write(text)\n\n\ndef read_note(path):\n    with open(path) as f:\n        return f.read()\n","alt":"def save_note(path, text):\n    f = open(path, \"w\")\n    f.write(text)\n    f.close()\n\n\ndef read_note(path):\n    f = open(path, \"r\")\n    data = f.read()\n    f.close()\n    return data\n"},{"id":"f-fstring","region":"first-steps","order":5,"title":"Fill the Banner","story":"Chilaka is printing the scoreboard. Fill the gaps so the variables appear inside the sentence.","goal":"Print: Asha scored 42 points","type":"fill","starter":"name = \"Asha\"\nscore = 42\nprint(f\"{___} scored {___} points\")\n","tests":[{"kind":"stdout","label":"Prints the banner","expect":"Asha scored 42 points"},{"kind":"source","label":"Uses an f-string","pattern":"f\""}],"hints":["Inside an f-string, curly brackets hold the name of a variable.","The first blank is the name variable, the second is the score variable.","name = \"Asha\"\nscore = 42\nprint(f\"{name} scored {score} points\")\n"],"socratic":["What do the curly brackets do inside an f-string?","Which variable belongs in each gap?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Banner”?","xp":20,"skills":["f-strings","variables"],"requires":["py-03-input-math"],"solution":"name = \"Asha\"\nscore = 42\nprint(f\"{name} scored {score} points\")\n"},{"id":"o-greeting","region":"first-steps","order":9,"title":"Line Up the Program","story":"Chilaka dropped the program lines on the floor. Put them back in an order that works.","goal":"Greet the person, then print how many letters are in their name.","type":"order","starter":"greeting = \"Hello, \" + name\nprint(len(name))\nname = input()\nprint(greeting)\n","lines":["greeting = \"Hello, \" + name","print(len(name))","name = input()","print(greeting)"],"tests":[{"kind":"stdout","label":"Asha","expect":"Hello, Asha\n4","stdin":["Asha"]},{"kind":"stdout","label":"Ravi","expect":"Hello, Ravi\n4","stdin":["Ravi"]},{"kind":"stdout","label":"Meera","expect":"Hello, Meera\n5","stdin":["Meera"],"hidden":true}],"hints":["A variable must exist before a later line uses it. Which line creates name?","Read first, build the greeting, then print.","name = input()\ngreeting = \"Hello, \" + name\nprint(greeting)\nprint(len(name))\n"],"socratic":["Which line must come first, and why?","Which lines need a variable that another line creates?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["input","order"],"requires":["p-print-sep"],"solution":"name = input()\ngreeting = \"Hello, \" + name\nprint(greeting)\nprint(len(name))\n"},{"id":"p-division","region":"first-steps","order":6,"title":"Three Kinds of Division","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)","options":["3\n3\n1","3.5\n3.5\n1","3.5\n3\n0.5","3.5\n3\n1"],"answer":3,"why":"/ is true division (3.5), // throws away the remainder (3), and % gives just the remainder (1).","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","One operator keeps decimals, one drops them, one keeps only the leftover.","The output is:\n3.5\n3\n1"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["arithmetic"],"requires":["f-fstring"],"solution":"3.5\n3\n1"},{"id":"p-print-sep","region":"first-steps","order":8,"title":"Print Tricks","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"print(\"a\", \"b\", sep=\"-\")\nprint(\"x\", end=\"!\")\nprint(\"y\")","options":["a-b\nx!y","a b\nx!y","a-b\nx\ny","a-b\nx!\ny"],"answer":0,"why":"sep changes what goes between items. end changes what print adds at the finish. The second print ends with ! instead of a new line, so y joins it.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Normally print ends with a new line. What did end change?","The output is:\na-b\nx!y"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["print"],"requires":["w-swap"],"solution":"a-b\nx!y"},{"id":"p-types","region":"first-steps","order":3,"title":"Type Detective","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"a = 5\nb = \"5\"\nc = 5.0\nprint(a + a, b + b, c + c)","options":["10 55 10.0","10 10 10.0","10 55 10","Error: TypeError"],"answer":0,"why":"Quotes make \"5\" text, so + glues text together (55). A decimal point makes 5.0 a float, and floats add to floats (10.0).","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Is b a number or text? What does + do to text?","The output is:\n10 55 10.0"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["types","print"],"requires":["py-02-variables"],"solution":"10 55 10.0"},{"id":"proj-receipt","region":"first-steps","order":10,"title":"Project: Stall Receipt","story":"Chilaka's snack stall needs receipts. Read the item, the price and how many, then print one tidy receipt line.","goal":"Read item, price and quantity (three inputs). Print: <item> x<quantity> = <total>","type":"write-code","starter":"item = input()\n# read the price and the quantity as whole numbers, then print the receipt line\n","tests":[{"kind":"stdout","label":"Samosa","expect":"Samosa x3 = 30","stdin":["Samosa","10","3"]},{"kind":"stdout","label":"Tea","expect":"Tea x2 = 30","stdin":["Tea","15","2"]},{"kind":"stdout","label":"Zero","expect":"Laddu x0 = 0","stdin":["Laddu","7","0"],"hidden":true}],"hints":["You need three input() calls. Two of them must become whole numbers.","Multiply price by quantity, and put everything into one print using an f-string.","item = input()\nprice = int(input())\nqty = int(input())\nprint(f\"{item} x{qty} = {price * qty}\")\n"],"socratic":["Which inputs should be numbers?","What goes inside the f-string braces?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Stall Receipt”?","xp":40,"skills":["input","f-strings","arithmetic"],"requires":["o-greeting"],"solution":"item = input()\nprice = int(input())\nqty = int(input())\nprint(f\"{item} x{qty} = {price * qty}\")\n","alt":"item = input()\nprice = int(input())\nqty = int(input())\ntotal = price * qty\nprint(item + \" x\" + str(qty) + \" = \" + str(total))\n","project":true,"clean":{"label":"Finish in 4 lines (use an f-string and skip the extra variable)","tests":[{"kind":"maxlines","max":4,"label":"4 lines or fewer"}]}},{"id":"py-01-hello","region":"first-steps","order":1,"title":"Say Hello","story":"Chilaka the parrot only repeats what you teach it. Today's lesson: the very first word.","goal":"Make the program print exactly: Hello, Aata!","type":"write-code","starter":"# Teach Chilaka to say hello\n","tests":[{"kind":"stdout","label":"Prints the greeting","expect":"Hello, Aata!"},{"kind":"source","label":"Uses print()","pattern":"print\\s*\\("}],"hints":["Python shows text on the screen with a function called print(). What goes inside the brackets?","Text goes inside quotes. The shape is print(\"...\").","print(\"Hello, Aata!\")"],"socratic":["Which function shows something on the screen?","How does Python know something is plain text and not a command?","Compare your output with the goal letter by letter. What differs?"],"explain":"In one sentence: what do the quotation marks do?","xp":20,"skills":["print","strings"],"requires":[],"solution":"print(\"Hello, Aata!\")\n","alt":"print('Hello, ' + 'Aata!')\n"},{"id":"py-02-variables","region":"first-steps","order":2,"title":"Name Tag","story":"Chilaka needs a name tag and a lives counter. Variables are labelled boxes that remember things.","goal":"Create name = \"Chilaka\" and lives = 3, then print: Chilaka has 3 lives (use the variables).","type":"write-code","starter":"# 1. make a variable called name\n# 2. make a variable called lives\n# 3. print the sentence using both variables\n","tests":[{"kind":"stdout","label":"Prints the sentence","expect":"Chilaka has 3 lives"},{"kind":"eval","label":"name holds \"Chilaka\"","expr":"name","expect":"'Chilaka'"},{"kind":"eval","label":"lives holds 3","expr":"lives","expect":"3"}],"hints":["A variable is a labelled box: name = \"Chilaka\" puts text in a box called name.","Make both variables first. Then give print() the variable names themselves, without quotes around them.","name = \"Chilaka\"\nlives = 3\nprint(name, \"has\", lives, \"lives\")"],"socratic":["What is the difference between name and \"name\"?","How can print() show several things on one line?","Did you create both variables before printing?"],"explain":"In one sentence: why use a variable instead of typing the text again?","xp":25,"skills":["variables","print"],"requires":["py-01-hello"],"solution":"name = \"Chilaka\"\nlives = 3\nprint(name, \"has\", lives, \"lives\")\n","alt":"name = \"Chilaka\"\nlives = 3\nprint(f\"{name} has {lives} lives\")\n"},{"id":"py-03-input-math","region":"first-steps","order":4,"title":"Snack Calculator","story":"Chilaka runs a snack stall. Each snack costs 5 rupees, and customers tell you how many they want.","goal":"Read a number of snacks with input() and print the total cost (5 rupees each).","type":"write-code","starter":"# Read how many snacks, then print the total cost (5 rupees each)\nsnacks = input()\n","tests":[{"kind":"stdout","label":"3 snacks cost 15","expect":"15","stdin":["3"]},{"kind":"stdout","label":"10 snacks cost 50","expect":"50","stdin":["10"]},{"kind":"stdout","label":"0 snacks cost 0","expect":"0","stdin":["0"]}],"hints":["input() always gives you text. What happens if you multiply text by 5?","Turn the text into a whole number with int(...) before doing maths.","snacks = int(input())\nprint(snacks * 5)"],"socratic":["What type of value does input() give back?","What does \"3\" * 5 do in Python? Try it in your head.","Which function turns text into a whole number?"],"explain":"In one sentence: why did we need int() here?","xp":30,"skills":["input","int","arithmetic"],"requires":["p-types"],"solution":"snacks = int(input())\nprint(snacks * 5)\n","alt":"n = input()\ntotal = int(n) * 5\nprint(total)\n"},{"id":"py-04-bugfix-1","region":"first-steps","order":11,"title":"Chilaka's Broken Greeting","story":"Chilaka greets visitors and tells them their age next year, but the program refuses to run. Boss fight: find every bug.","goal":"Fix the program: it should print Hello <name>! and then Next year you will be <age + 1>.","type":"fix-the-bug","starter":"name = input()\nage = input()\nprint(\"Hello \" + name + \"!\"\nprint(\"Next year you will be \" + age + 1)\n","tests":[{"kind":"stdout","label":"Asha, 12","expect":"Hello Asha!\nNext year you will be 13","stdin":["Asha","12"]},{"kind":"stdout","label":"Ravi, 9","expect":"Hello Ravi!\nNext year you will be 10","stdin":["Ravi","9"]},{"kind":"stdout","label":"Meera, 0","expect":"Hello Meera!\nNext year you will be 1","stdin":["Meera","0"],"hidden":true}],"hints":["Read the error message. Python tells you the line. Count your brackets there.","After fixing the bracket, a second bug hides in the last line: you cannot add a number to text. Convert the age and the result.","name = input()\nage = int(input())\nprint(\"Hello \" + name + \"!\")\nprint(\"Next year you will be \" + str(age + 1))"],"socratic":["Which line does the error point to, and what is missing there?","What type is age after input()? What type does + need on both sides?","Which function turns a number back into text for printing?"],"explain":"In one sentence: name the two bugs you fixed.","xp":50,"skills":["debugging","types","syntax"],"requires":["proj-receipt"],"solution":"name = input()\nage = int(input())\nprint(\"Hello \" + name + \"!\")\nprint(\"Next year you will be \" + str(age + 1))\n","alt":"name = input()\nage = int(input())\nprint(f\"Hello {name}!\")\nprint(f\"Next year you will be {age + 1}\")\n","boss":true},{"id":"w-swap","region":"first-steps","order":7,"title":"Swap the Seats","story":"Two parrots sit on the wrong perches. Without retyping their names, swap them.","goal":"Swap the values: afterwards a must be \"right\" and b must be \"left\".","type":"write-code","starter":"a = \"left\"\nb = \"right\"\n# swap them using only a and b (and maybe one helper variable)\n","tests":[{"kind":"eval","label":"a is now \"right\"","expr":"a","expect":"'right'"},{"kind":"eval","label":"b is now \"left\"","expr":"b","expect":"'left'"},{"kind":"source","label":"Starts from the same values","pattern":"a\\s*=\\s*\"left\""}],"hints":["If you overwrite a first, the old value is gone. Where could you park it for a moment?","Use a third variable, temp: save one value in it, move the other, then use temp.","a = \"left\"\nb = \"right\"\ntemp = a\na = b\nb = temp\n"],"socratic":["What happens to a if you write a = b first?","Where can the old value of a wait safely?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Swap the Seats”?","xp":30,"skills":["variables"],"requires":["p-division"],"solution":"a = \"left\"\nb = \"right\"\ntemp = a\na = b\nb = temp\n","alt":"a = \"left\"\nb = \"right\"\na, b = b, a\n","clean":{"label":"Do the swap in one line (Python can assign two names at once)","tests":[{"kind":"maxlines","max":3,"label":"3 lines in total, including the two starting lines"}]}},{"id":"f-return","region":"functions","order":4,"title":"Fill the Return","story":"The workshop's doubling machine hands back its answer.","goal":"Print 8","type":"fill","starter":"def double(n):\n    ___ n * 2\n\nprint(double(4))\n","tests":[{"kind":"stdout","label":"Prints 8","expect":"8"}],"hints":["A function hands a value back to the caller with a special keyword.","The keyword is return.","def double(n):\n    return n * 2\n\nprint(double(4))\n"],"socratic":["What does the caller receive?","Which word sends a value back?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Return”?","xp":20,"skills":["return"],"requires":["w-area"],"solution":"def double(n):\n    return n * 2\n\nprint(double(4))\n"},{"id":"o-func-order","region":"functions","order":10,"title":"Order the Machines","story":"Two machines are built from one another. Put them in a working order.","goal":"Put the lines in order so the program prints 27.","type":"order","starter":"def cube(n):\n    return n * n\ndef square(n):\n    return n * square(n)\nprint(cube(3))\n","lines":["def cube(n):","    return n * n","def square(n):","    return n * square(n)","print(cube(3))"],"tests":[{"kind":"stdout","label":"Prints 27","expect":"27"}],"hints":["A function must be defined before the line that calls it runs.","square comes before cube because cube uses it. The print comes last.","def square(n):\n    return n * n\ndef cube(n):\n    return n * square(n)\nprint(cube(3))\n"],"socratic":["What must exist before a call?","Why does cube need square defined first?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["def","order"],"requires":["w-star-args"],"solution":"def square(n):\n    return n * n\ndef cube(n):\n    return n * square(n)\nprint(cube(3))\n"},{"id":"p-default","region":"functions","order":8,"title":"The Shared Bag","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def add(item, bag=[]):\n    bag.append(item)\n    return bag\nadd(1)\nprint(add(2))","options":["[2]","[1, 2]","[1]","Error: TypeError"],"answer":1,"why":"The default list is created once, when the function is defined, and shared by every call. This is a famous trap: use None as the default instead.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","When is the default value created?","The output is:\n[1, 2]"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["defaults","mutability"],"requires":["w-kwargs"],"solution":"[1, 2]"},{"id":"p-return-none","region":"functions","order":5,"title":"The Missing Return","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def hi():\n    print(\"hi\")\nx = hi()\nprint(x)","options":["hi","hi\nNone","hi\nhi","Error: NameError"],"answer":1,"why":"hi() prints but returns nothing, so x is None. The second print shows None.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does a function give back if it has no return?","The output is:\nhi\nNone"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["return"],"requires":["f-return"],"solution":"hi\nNone"},{"id":"p-scope","region":"functions","order":2,"title":"Inside or Outside?","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"x = 10\ndef change():\n    x = 99\nchange()\nprint(x)","options":["99","Error: NameError","None","10"],"answer":3,"why":"Assigning x inside the function creates a new local variable. The outer x is untouched.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which x does the function change?","The output is:\n10"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["scope"],"requires":["py-14-def"],"solution":"10"},{"id":"proj-toolkit","region":"functions","order":13,"title":"Project: Text Toolkit","story":"The workshop's final order: a toolkit of three text helpers.","goal":"Write word_count(text), longest_word(text) (first one wins a tie, empty text gives \"\") and is_palindrome(text) (ignore case and spaces).","type":"write-code","starter":"# define the three functions\n","tests":[{"kind":"eval","label":"word_count","expr":"word_count(\"a bb ccc\")","expect":"3"},{"kind":"eval","label":"word_count empty","expr":"word_count(\"\")","expect":"0"},{"kind":"eval","label":"longest_word","expr":"longest_word(\"go to market now\")","expect":"'market'"},{"kind":"eval","label":"longest tie","expr":"longest_word(\"ab cd\")","expect":"'ab'"},{"kind":"eval","label":"longest empty","expr":"longest_word(\"\")","expect":"''","hidden":true},{"kind":"eval","label":"palindrome yes","expr":"is_palindrome(\"Never odd or even\")","expect":"True"},{"kind":"eval","label":"palindrome no","expr":"is_palindrome(\"hello\")","expect":"False"}],"hints":["Each function is small. word_count can use split().","For longest_word loop with a variable that remembers the best so far. For the palindrome, reuse the cleaning idea from earlier.","def word_count(text):\n    return len(text.split())\n\n\ndef longest_word(text):\n    best = \"\"\n    for w in text.split():\n        if len(w) > len(best):\n            best = w\n    return best\n\n\ndef is_palindrome(text):\n    clean = text.replace(\" \", \"\").lower()\n    return clean == clean[::-1]\n"],"socratic":["Which built-in splits text into words?","How can a loop remember the longest word so far?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Text Toolkit”?","xp":60,"skills":["functions","strings"],"requires":["w-fib"],"solution":"def word_count(text):\n    return len(text.split())\n\n\ndef longest_word(text):\n    best = \"\"\n    for w in text.split():\n        if len(w) > len(best):\n            best = w\n    return best\n\n\ndef is_palindrome(text):\n    clean = text.replace(\" \", \"\").lower()\n    return clean == clean[::-1]\n","alt":"def word_count(text):\n    return len(text.split())\n\n\ndef longest_word(text):\n    words = text.split()\n    return max(words, key=len) if words else \"\"\n\n\ndef is_palindrome(text):\n    t = \"\".join(text.lower().split())\n    return t == t[::-1]\n","project":true},{"id":"py-14-def","region":"functions","order":1,"title":"Spell: Double It","story":"Chilaka learns a spell. A function is a spell you write once and cast as many times as you like.","goal":"Define a function double(x) that gives back x times 2.","type":"write-code","starter":"# define double(x) so that double(4) gives back 8\n","tests":[{"kind":"eval","label":"double(4) is 8","expr":"double(4)","expect":"8"},{"kind":"eval","label":"double(0) is 0","expr":"double(0)","expect":"0"},{"kind":"eval","label":"double(-3) is -6","expr":"double(-3)","expect":"-6"},{"kind":"eval","label":"double(2.5) is 5.0","expr":"double(2.5)","expect":"5.0"},{"kind":"source","label":"Defines a function","pattern":"def\\s+double\\s*\\("}],"hints":["A function starts with def, a name, brackets with parameters, and a colon.","Use return to hand the answer back to whoever called the function.","def double(x):\n    return x * 2"],"socratic":["What keyword starts a function?","What is the difference between printing a value and returning it?","What is the parameter called in double(x)?"],"explain":"In one sentence: what does return do?","xp":30,"skills":["functions","return"],"requires":["py-13-bugfix-4"],"solution":"def double(x):\n    return x * 2\n","alt":"def double(x):\n    return x + x\n"},{"id":"py-15-args","region":"functions","order":6,"title":"The Greeter","story":"A good greeter can be calm or excited. Some functions have optional settings with default values.","goal":"Define greet(name, excited=False) that returns Hello, <name> or Hello, <name>! when excited.","type":"write-code","starter":"# greet(\"Asha\") -> \"Hello, Asha\"\n# greet(\"Ravi\", True) -> \"Hello, Ravi!\"\n","tests":[{"kind":"eval","label":"calm greeting","expr":"greet(\"Asha\")","expect":"'Hello, Asha'"},{"kind":"eval","label":"excited greeting","expr":"greet(\"Ravi\", True)","expect":"'Hello, Ravi!'"},{"kind":"eval","label":"named arguments","expr":"greet(name=\"Meera\", excited=True)","expect":"'Hello, Meera!'"},{"kind":"eval","label":"excited off","expr":"greet(\"Kiran\", False)","expect":"'Hello, Kiran'","hidden":true}],"hints":["Give a parameter a default with =, like excited=False. Callers may then leave it out.","Inside the function, an if on excited chooses between the two endings.","def greet(name, excited=False):\n    if excited:\n        return \"Hello, \" + name + \"!\"\n    return \"Hello, \" + name"],"socratic":["What value does excited have when the caller does not pass it?","Which one decision picks the ending?","What does return do for the early branch?"],"explain":"In one sentence: what is a default parameter?","xp":35,"skills":["functions","default-arguments","if"],"requires":["p-return-none"],"solution":"def greet(name, excited=False):\n    if excited:\n        return \"Hello, \" + name + \"!\"\n    return \"Hello, \" + name\n","alt":"def greet(name, excited=False):\n    return f\"Hello, {name}\" + (\"!\" if excited else \"\")\n"},{"id":"py-16-bugfix-5","region":"functions","order":14,"title":"The Silent Function","story":"average() should hand back the mean of a list, but it prints instead, adds wrongly and crashes on an empty list.","goal":"Fix average(numbers): return the mean, or 0 for an empty list.","type":"fix-the-bug","starter":"def average(numbers):\n    total = 0\n    for n in numbers:\n        total = n\n    print(total / len(numbers))\n","tests":[{"kind":"eval","label":"average of 2, 4, 6","expr":"average([2, 4, 6])","expect":"4.0"},{"kind":"eval","label":"average of one number","expr":"average([5])","expect":"5.0"},{"kind":"eval","label":"average of 1 and 2","expr":"average([1, 2])","expect":"1.5"},{"kind":"eval","label":"empty list gives 0","expr":"average([])","expect":"0"}],"hints":["Test it with [2, 4, 6]. Two things go wrong: the result is not handed back, and the total is wrong.","total = n replaces the total each time. Use += to add. Use return instead of print. Handle the empty list first.","def average(numbers):\n    if len(numbers) == 0:\n        return 0\n    total = 0\n    for n in numbers:\n        total += n\n    return total / len(numbers)"],"socratic":["What does a function give back if it never uses return?","After the loop with total = n, what does total hold?","What happens when you divide by len([])?"],"explain":"In one sentence: name the three bugs you fixed.","xp":50,"skills":["debugging","functions","edge-cases"],"requires":["proj-toolkit"],"solution":"def average(numbers):\n    if len(numbers) == 0:\n        return 0\n    total = 0\n    for n in numbers:\n        total += n\n    return total / len(numbers)\n","alt":"def average(numbers):\n    return sum(numbers) / len(numbers) if numbers else 0\n","boss":true},{"id":"w-area","region":"functions","order":3,"title":"Rectangle Area","story":"The workshop sells rectangular rugs. Write the function that prices the cloth.","goal":"Write rect_area(width, height) that returns width times height.","type":"write-code","starter":"# define rect_area\n","tests":[{"kind":"eval","label":"3 by 4","expr":"rect_area(3, 4)","expect":"12"},{"kind":"eval","label":"2.5 by 2","expr":"rect_area(2.5, 2)","expect":"5.0"},{"kind":"eval","label":"zero side","expr":"rect_area(0, 9)","expect":"0","hidden":true}],"hints":["Start with def rect_area(width, height): and give back the product.","Use return so the answer can be used elsewhere, not print.","def rect_area(width, height):\n    return width * height\n"],"socratic":["What goes in the brackets after the function name?","Why return instead of print?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Rectangle Area”?","xp":30,"skills":["def","return"],"requires":["p-scope"],"solution":"def rect_area(width, height):\n    return width * height\n","alt":"def rect_area(width, height):\n    area = width * height\n    return area\n"},{"id":"w-fib","region":"functions","order":12,"title":"Fibonacci Garden","story":"The workshop's garden grows petals in the Fibonacci pattern: 0, 1, 1, 2, 3, 5, ...","goal":"Write fib(n) returning the nth Fibonacci number (fib(0) = 0, fib(1) = 1).","type":"write-code","starter":"# define fib\n","tests":[{"kind":"eval","label":"fib(0)","expr":"fib(0)","expect":"0"},{"kind":"eval","label":"fib(1)","expr":"fib(1)","expect":"1"},{"kind":"eval","label":"fib(10)","expr":"fib(10)","expect":"55"},{"kind":"eval","label":"fib(20)","expr":"fib(20)","expect":"6765","hidden":true}],"hints":["Each number is the sum of the previous two.","Keep two variables a and b and move them forward n times.","def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n"],"socratic":["What are the first two values?","What do a and b become after one step?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Fibonacci Garden”?","xp":30,"skills":["loops","functions"],"requires":["w-recursion"],"solution":"def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\n","alt":"def fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n"},{"id":"w-kwargs","region":"functions","order":7,"title":"Flexible Greeter","story":"The workshop greeter can change its words and punctuation.","goal":"Write greet(name, greeting=\"Hello\", punctuation=\"!\") returning for example Hello, Asha!","type":"write-code","starter":"# define greet\n","tests":[{"kind":"eval","label":"Defaults","expr":"greet(\"Asha\")","expect":"'Hello, Asha!'"},{"kind":"eval","label":"Custom greeting","expr":"greet(\"Ravi\", \"Namaste\")","expect":"'Namaste, Ravi!'"},{"kind":"eval","label":"Keyword argument","expr":"greet(\"Meera\", punctuation=\"?\")","expect":"'Hello, Meera?'","hidden":true}],"hints":["Parameters with = have default values. Callers can skip them.","Return an f-string: f\"{greeting}, {name}{punctuation}\".","def greet(name, greeting=\"Hello\", punctuation=\"!\"):\n    return f\"{greeting}, {name}{punctuation}\"\n"],"socratic":["What happens if the caller leaves out greeting?","How can a caller change only punctuation?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Flexible Greeter”?","xp":30,"skills":["defaults","kwargs"],"requires":["py-15-args"],"solution":"def greet(name, greeting=\"Hello\", punctuation=\"!\"):\n    return f\"{greeting}, {name}{punctuation}\"\n","alt":"def greet(name, greeting=\"Hello\", punctuation=\"!\"):\n    return greeting + \", \" + name + punctuation\n"},{"id":"w-recursion","region":"functions","order":11,"title":"Factorial Spell","story":"A spell multiplies a number by every smaller number, down to 1. It calls itself!","goal":"Write fact(n) so that fact(0) is 1 and fact(5) is 120.","type":"write-code","starter":"# define fact\n","tests":[{"kind":"eval","label":"0! is 1","expr":"fact(0)","expect":"1"},{"kind":"eval","label":"5! is 120","expr":"fact(5)","expect":"120"},{"kind":"eval","label":"10!","expr":"fact(10)","expect":"3628800","hidden":true}],"hints":["A recursive function needs a stopping case. What is fact(0)?","For other n, return n * fact(n - 1).","def fact(n):\n    if n == 0:\n        return 1\n    return n * fact(n - 1)\n"],"socratic":["What is the smallest case you already know?","How does fact(5) relate to fact(4)?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Factorial Spell”?","xp":30,"skills":["recursion"],"requires":["o-func-order"],"solution":"def fact(n):\n    if n == 0:\n        return 1\n    return n * fact(n - 1)\n","alt":"def fact(n):\n    result = 1\n    for i in range(2, n + 1):\n        result *= i\n    return result\n","clean":{"label":"Solve it with recursion: fact calls itself","tests":[{"kind":"source","label":"Calls itself","pattern":"fact\\(\\s*n\\s*-\\s*1\\s*\\)"}]}},{"id":"w-star-args","region":"functions","order":9,"title":"Sum Any","story":"The workshop adds up however many numbers a customer brings.","goal":"Write total(*nums) that returns the sum of all its arguments (0 for none).","type":"write-code","starter":"# define total\n","tests":[{"kind":"eval","label":"No numbers","expr":"total()","expect":"0"},{"kind":"eval","label":"Three numbers","expr":"total(1, 2, 3)","expect":"6"},{"kind":"eval","label":"Floats","expr":"total(0.5, 0.25)","expect":"0.75","hidden":true}],"hints":["A parameter starting with * collects extra arguments into a tuple.","Loop over the tuple, or use the built-in sum().","def total(*nums):\n    return sum(nums)\n"],"socratic":["What type is nums inside the function?","What should total() return with no arguments?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Sum Any”?","xp":30,"skills":["args"],"requires":["p-default"],"solution":"def total(*nums):\n    return sum(nums)\n","alt":"def total(*nums):\n    result = 0\n    for n in nums:\n        result += n\n    return result\n"},{"id":"f-while","region":"loops","order":5,"title":"Fill the Countdown","story":"Mission control needs a launch countdown that stops before zero.","goal":"Print 3, 2, 1 and then Liftoff.","type":"fill","starter":"n = 3\nwhile n ___ 0:\n    print(n)\n    n -= 1\nprint(\"Liftoff\")\n","tests":[{"kind":"stdout","label":"Counts down","expect":"3\n2\n1\nLiftoff"}],"hints":["The loop should continue while n is still bigger than zero.","Use the > comparison.","n = 3\nwhile n > 0:\n    print(n)\n    n -= 1\nprint(\"Liftoff\")\n"],"socratic":["When should the loop stop?","What happens if n never changes?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Countdown”?","xp":20,"skills":["while"],"requires":["p-offbyone"],"solution":"n = 3\nwhile n > 0:\n    print(n)\n    n -= 1\nprint(\"Liftoff\")\n"},{"id":"o-while-sum","region":"loops","order":9,"title":"Order the Adder","story":"Add up 1 to 5 with a while loop. The lines are shuffled.","goal":"Put the lines in order so the program prints 15.","type":"order","starter":"    count += 1\n    total += count\ntotal = 0\ncount = 0\nwhile count < 5:\nprint(total)\n","lines":["    count += 1","    total += count","total = 0","count = 0","while count < 5:","print(total)"],"tests":[{"kind":"stdout","label":"Prints 15","expect":"15"}],"hints":["Both counters must exist before the loop starts. The print belongs after the loop.","Inside the loop, increase count first, then add it to total.","total = 0\ncount = 0\nwhile count < 5:\n    count += 1\n    total += count\nprint(total)\n"],"socratic":["What must exist before the loop?","Which lines are inside the loop (indented)?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["while","accumulate","order"],"requires":["p-continue"],"solution":"total = 0\ncount = 0\nwhile count < 5:\n    count += 1\n    total += count\nprint(total)\n"},{"id":"p-break","region":"loops","order":7,"title":"Break vs Continue","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"for n in [4, 8, 15, 16]:\n    if n % 5 == 0:\n        break\n    print(n)\nprint(\"done\")","options":["4\n8\n15\ndone","4\n8\n16\ndone","4\n8\ndone","done"],"answer":2,"why":"break leaves the whole loop at 15. 16 is never reached. The last print runs once, after the loop.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which number triggers break, and what happens to the numbers after it?","The output is:\n4\n8\ndone"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["break"],"requires":["w-times-table"],"solution":"4\n8\ndone"},{"id":"p-continue","region":"loops","order":8,"title":"Skip with Continue","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"for n in range(5):\n    if n % 2 == 0:\n        continue\n    print(n)","options":["1\n3","0\n2\n4","1\n2\n3","1"],"answer":0,"why":"continue jumps straight to the next round, skipping the print. Only odd numbers get printed.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","When n is even, does the print line run?","The output is:\n1\n3"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["for","continue"],"requires":["p-break"],"solution":"1\n3"},{"id":"p-offbyone","region":"loops","order":4,"title":"Off by One","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"total = 0\nfor n in range(1, 5):\n    total += n\nprint(total)","options":["15","10","6","4"],"answer":1,"why":"range(1, 5) is 1, 2, 3, 4. The sum is 10, because 5 is never included.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","List the values n takes. Does it ever equal 5?","The output is:\n10"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["range","accumulate"],"requires":["py-09-accumulate"],"solution":"10"},{"id":"p-range","region":"loops","order":2,"title":"Where Does Range Stop?","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"for i in range(3):\n    print(i)","options":["1\n2\n3","0\n1\n2","0\n1\n2\n3","1\n2"],"answer":1,"why":"range(3) starts at 0 and stops before 3, so you get 0, 1, 2. Computers count from zero.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Does range include its end number?","The output is:\n0\n1\n2"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["for","range"],"requires":["py-08-for-range"],"solution":"0\n1\n2"},{"id":"proj-guess","region":"loops","order":11,"title":"Project: Guess the Number","story":"Chilaka hides a number. You keep guessing until you find it, and the game counts your tries.","goal":"Read the secret number, then keep reading guesses. Print Too low or Too high after each wrong guess. When right, print: Got it in N tries","type":"write-code","starter":"secret = int(input())\n# keep reading guesses until one is right\n","tests":[{"kind":"stdout","label":"Three tries","expect":"Too low\nToo high\nGot it in 3 tries","stdin":["7","3","9","7"]},{"kind":"stdout","label":"First try","expect":"Got it in 1 tries","stdin":["5","5"]},{"kind":"stdout","label":"Many tries","expect":"Too high\nToo high\nToo low\nGot it in 4 tries","stdin":["4","9","8","1","4"],"hidden":true}],"hints":["You do not know how many guesses are coming, so use while True and stop with break.","Count tries with a variable that goes up by 1 on every guess.","secret = int(input())\ntries = 0\nwhile True:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\n    else:\n        print(\"Got it in \" + str(tries) + \" tries\")\n        break\n"],"socratic":["How does the loop know when to stop?","Where should the tries counter go up?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Guess the Number”?","xp":50,"skills":["while","break","if"],"requires":["w-star-pyramid"],"solution":"secret = int(input())\ntries = 0\nwhile True:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\n    else:\n        print(\"Got it in \" + str(tries) + \" tries\")\n        break\n","alt":"secret = int(input())\ntries = 0\nguess = None\nwhile guess != secret:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\nprint(f\"Got it in {tries} tries\")\n","project":true},{"id":"py-08-for-range","region":"loops","order":1,"title":"Count the Seeds","story":"Chilaka counts seeds out loud, one at a time, from 1 up to however many there are.","goal":"Read n and print the numbers 1 to n, one per line.","type":"write-code","starter":"n = int(input())\n# print 1, 2, 3 ... n, each on its own line\n","tests":[{"kind":"stdout","label":"n = 5","expect":"1\n2\n3\n4\n5","stdin":["5"]},{"kind":"stdout","label":"n = 1","expect":"1","stdin":["1"]},{"kind":"stdout","label":"n = 3","expect":"1\n2\n3","stdin":["3"]},{"kind":"source","label":"Uses a loop","pattern":"\\b(for|while)\\b"}],"hints":["A for loop repeats a block: for i in range(...): (indented lines).","range(1, n) stops before n. How can you make it include n?","for i in range(1, n + 1):\n    print(i)"],"socratic":["Which numbers does range(1, 4) give you?","How do you make the loop include n itself?","What variable holds the current number inside the loop?"],"explain":"In one sentence: why did we write n + 1?","xp":30,"skills":["for","range"],"requires":["py-07-bugfix-2"],"solution":"n = int(input())\nfor i in range(1, n + 1):\n    print(i)\n","alt":"n = int(input())\ni = 1\nwhile i <= n:\n    print(i)\n    i += 1\n"},{"id":"py-09-accumulate","region":"loops","order":3,"title":"Fruit Basket Total","story":"Fruits arrive one by one with their weights in grams. Chilaka needs the running total.","goal":"The first input is how many weights follow. Read them all and print their sum.","type":"write-code","starter":"count = int(input())\n# read that many numbers and print their total\n","tests":[{"kind":"stdout","label":"three weights","expect":"60","stdin":["3","10","20","30"]},{"kind":"stdout","label":"one weight","expect":"7","stdin":["1","7"]},{"kind":"stdout","label":"four weights","expect":"10","stdin":["4","1","2","3","4"]},{"kind":"stdout","label":"no weights","expect":"0","stdin":["0"]}],"hints":["Keep a running total in a variable that starts at 0, and add to it inside the loop.","Inside the loop, call input() each time, convert with int(), and add it to total.","total = 0\nfor _ in range(count):\n    total += int(input())\nprint(total)"],"socratic":["What value should the total start with?","How many times should input() be called?","Where does the print belong: inside or after the loop?"],"explain":"In one sentence: why does total start at 0?","xp":35,"skills":["for","accumulator","input"],"requires":["p-range"],"solution":"count = int(input())\ntotal = 0\nfor _ in range(count):\n    total += int(input())\nprint(total)\n","alt":"count = int(input())\nprint(sum(int(input()) for _ in range(count)))\n"},{"id":"py-10-bugfix-3","region":"loops","order":12,"title":"The Endless Climb","story":"Chilaka climbs a tree, calling out each step. The program never stops and floods the screen.","goal":"Fix the loop so it prints Step 1 up to Step n, then stops.","type":"fix-the-bug","starter":"steps = int(input())\ncount = 1\nwhile count <= steps:\n    print(\"Step\", count)\n","tests":[{"kind":"stdout","label":"3 steps","expect":"Step 1\nStep 2\nStep 3","stdin":["3"]},{"kind":"stdout","label":"1 step","expect":"Step 1","stdin":["1"]},{"kind":"stdout","label":"5 steps","expect":"Step 1\nStep 2\nStep 3\nStep 4\nStep 5","stdin":["5"],"hidden":true}],"hints":["A while loop runs as long as its condition is true. What changes count inside the loop?","Nothing changes count, so the condition stays true forever. Add a line that moves count forward.","steps = int(input())\ncount = 1\nwhile count <= steps:\n    print(\"Step\", count)\n    count += 1"],"socratic":["After each step, what is the value of count?","What would make the condition count <= steps become false?","Which line moves count to the next number?"],"explain":"In one sentence: why was the loop infinite?","xp":50,"skills":["debugging","while","infinite-loop"],"requires":["proj-guess"],"solution":"steps = int(input())\ncount = 1\nwhile count <= steps:\n    print(\"Step\", count)\n    count += 1\n","alt":"steps = int(input())\nfor count in range(1, steps + 1):\n    print(\"Step\", count)\n","boss":true},{"id":"w-star-pyramid","region":"loops","order":10,"title":"Star Pyramid","story":"The festival stage lights form a pyramid. Print it for any height.","goal":"Read n. Print n rows: row 1 has 1 star, row 2 has 2 stars, up to n.","type":"write-code","starter":"n = int(input())\n# print a pyramid of stars\n","tests":[{"kind":"stdout","label":"Height 3","expect":"*\n**\n***","stdin":["3"]},{"kind":"stdout","label":"Height 1","expect":"*","stdin":["1"]},{"kind":"stdout","label":"Height 5","expect":"*\n**\n***\n****\n*****","stdin":["5"],"hidden":true}],"hints":["One loop runs once per row. How many stars does row i need?","You can multiply text: \"*\" * 3 gives \"***\".","n = int(input())\nfor i in range(1, n + 1):\n    print(\"*\" * i)\n"],"socratic":["How many stars belong in row 4?","Is there a shortcut to repeat a string?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Star Pyramid”?","xp":30,"skills":["for","nested loops"],"requires":["o-while-sum"],"solution":"n = int(input())\nfor i in range(1, n + 1):\n    print(\"*\" * i)\n","alt":"n = int(input())\nfor i in range(1, n + 1):\n    row = \"\"\n    for j in range(i):\n        row += \"*\"\n    print(row)\n","clean":{"label":"Use one loop only (skip the inner loop)","tests":[{"kind":"source","label":"No nested loop","pattern":"for[^\\n]*:\\s*\\n\\s+for","absent":true}]}},{"id":"w-times-table","region":"loops","order":6,"title":"Times Table Painter","story":"The school wall needs times tables painted. Print one for any number.","goal":"Read n. Print n x 1 = ... through n x 10 = ..., one per line, like: 3 x 1 = 3","type":"write-code","starter":"n = int(input())\n# print the table for n, 1 to 10\n","tests":[{"kind":"stdout","label":"Table of 3","expect":"3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30","stdin":["3"]},{"kind":"stdout","label":"Table of 12","expect":"12 x 1 = 12\n12 x 2 = 24\n12 x 3 = 36\n12 x 4 = 48\n12 x 5 = 60\n12 x 6 = 72\n12 x 7 = 84\n12 x 8 = 96\n12 x 9 = 108\n12 x 10 = 120","stdin":["12"]},{"kind":"stdout","label":"Table of 0","expect":"0 x 1 = 0\n0 x 2 = 0\n0 x 3 = 0\n0 x 4 = 0\n0 x 5 = 0\n0 x 6 = 0\n0 x 7 = 0\n0 x 8 = 0\n0 x 9 = 0\n0 x 10 = 0","stdin":["0"],"hidden":true}],"hints":["Use for i in range(...) and decide which numbers you need: 1 to 10 inclusive.","range(1, 11) gives 1..10. Print an f-string inside the loop.","n = int(input())\nfor i in range(1, 11):\n    print(f\"{n} x {i} = {n * i}\")\n"],"socratic":["Which numbers should i take?","What stays the same each round, and what changes?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Times Table Painter”?","xp":30,"skills":["for","range","f-strings"],"requires":["f-while"],"solution":"n = int(input())\nfor i in range(1, 11):\n    print(f\"{n} x {i} = {n * i}\")\n","alt":"n = int(input())\ni = 1\nwhile i <= 10:\n    print(str(n) + \" x \" + str(i) + \" = \" + str(n * i))\n    i += 1\n"},{"id":"f-debug-print","region":"modules-debug","order":6,"title":"Fill the Print Detective","story":"Print debugging means printing variables to watch them change. Complete the detective's trace.","goal":"Show n and total on every round.","type":"fill","starter":"total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(\"n =\", ___, \"total =\", ___)\n","tests":[{"kind":"stdout","label":"Trace output","expect":"n = 1 total = 1\nn = 2 total = 3\nn = 3 total = 6"}],"hints":["Print the two variables themselves, not their names in quotes.","The first blank is n, the second is total.","total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(\"n =\", n, \"total =\", total)\n"],"socratic":["Which two variables change each round?","Why print inside the loop?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Print Detective”?","xp":20,"skills":["debugging"],"requires":["p-traceback"],"solution":"total = 0\nfor n in [1, 2, 3]:\n    total += n\n    print(\"n =\", n, \"total =\", total)\n"},{"id":"fx-average","region":"modules-debug","order":7,"title":"Case: The Wrong Average","story":"The toolshed's average function gives answers that are always too low. Be the detective.","goal":"Fix average(nums) so average([2, 4, 6]) is 4.0 and average([10]) is 10.0.","type":"fix-the-bug","starter":"def average(nums):\n    total = 0\n    for i in range(1, len(nums)):\n        total += nums[i]\n    return total / len(nums)\n","tests":[{"kind":"eval","label":"Three numbers","expr":"average([2, 4, 6])","expect":"4.0"},{"kind":"eval","label":"One number","expr":"average([10])","expect":"10.0"},{"kind":"eval","label":"Floats","expr":"average([1.5, 2.5])","expect":"2.0","hidden":true}],"hints":["Add a print inside the loop to see which numbers are being added.","range(1, ...) starts at position 1. Which item is skipped?","def average(nums):\n    total = 0\n    for i in range(len(nums)):\n        total += nums[i]\n    return total / len(nums)\n"],"socratic":["Which position does range(1, n) start at?","Which number never gets added?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":40,"skills":["debugging","range"],"requires":["f-debug-print"],"solution":"def average(nums):\n    total = 0\n    for i in range(len(nums)):\n        total += nums[i]\n    return total / len(nums)\n","alt":"def average(nums):\n    return sum(nums) / len(nums)\n"},{"id":"md-boss","region":"modules-debug","order":11,"title":"Boss: The Calendar Crash","story":"The village birthday board shows wrong ages on exactly the days around a birthday. Find the logic bug.","goal":"Fix age_in_years(born, today): the age goes up only on or after the birthday.","type":"fix-the-bug","starter":"from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    years = t.year - b.year\n    if (t.month, t.day) > (b.month, b.day):\n        years -= 1\n    return years\n","tests":[{"kind":"eval","label":"Day before birthday","expr":"age_in_years(\"2000-06-15\", \"2024-06-14\")","expect":"23"},{"kind":"eval","label":"On the birthday","expr":"age_in_years(\"2000-06-15\", \"2024-06-15\")","expect":"24"},{"kind":"eval","label":"After the birthday","expr":"age_in_years(\"2000-06-15\", \"2024-12-01\")","expect":"24"},{"kind":"eval","label":"Early in the year","expr":"age_in_years(\"2000-06-15\", \"2024-01-02\")","expect":"23","hidden":true}],"hints":["Test three dates by hand: before, on and after the birthday. When should years be reduced by one?","You subtract one only if the birthday has NOT happened yet this year.","from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    years = t.year - b.year\n    if (t.month, t.day) < (b.month, b.day):\n        years -= 1\n    return years\n"],"socratic":["What should the age be on the birthday itself?","Which comparison sign is the wrong way round?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":65,"skills":["debugging","datetime"],"requires":["proj-diceduel"],"solution":"from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    years = t.year - b.year\n    if (t.month, t.day) < (b.month, b.day):\n        years -= 1\n    return years\n","alt":"from datetime import date\n\n\ndef age_in_years(born, today):\n    b = date.fromisoformat(born)\n    t = date.fromisoformat(today)\n    had_birthday = (t.month, t.day) >= (b.month, b.day)\n    return t.year - b.year - (0 if had_birthday else 1)\n","boss":true},{"id":"p-import","region":"modules-debug","order":1,"title":"Borrow a Tool","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"import math\nprint(math.sqrt(16), math.floor(2.7), math.ceil(2.1))","options":["4 2 3","4.0 3 2","4.0 2 2","4.0 2 3"],"answer":3,"why":"sqrt always returns a float (4.0). floor rounds down (2) and ceil rounds up (3).","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Which direction does each rounding function go?","The output is:\n4.0 2 3"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["import","math"],"requires":["fe-boss"],"solution":"4.0 2 3"},{"id":"p-shadow","region":"modules-debug","order":8,"title":"Oops, I Renamed max","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"max = 5\nprint(max([1, 9, 3]))","options":["9","5","Error: NameError","Error: TypeError"],"answer":3,"why":"Assigning to max hides Python's built-in function. Now max is the number 5, and numbers cannot be called, so you get a TypeError.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","After line 1, what is max?","The output is:\nError: TypeError"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["debugging","names"],"requires":["fx-average"],"solution":"Error: TypeError"},{"id":"p-traceback","region":"modules-debug","order":5,"title":"Read the Traceback","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"def a():\n    return b()\ndef b():\n    return int(\"x\")\nprint(\"start\")\na()","options":["start\nError: ValueError","Error: ValueError","start","start\nError: TypeError"],"answer":0,"why":"start prints first. Then a() calls b(), which calls int(\"x\"): a ValueError. Tracebacks read bottom to top: the last line names the error, the lines above show who called whom.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What happens before the crash, and which error does int(\"x\") raise?","The output is:\nstart\nError: ValueError"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["debugging","tracebacks"],"requires":["w-counter"],"solution":"start\nError: ValueError"},{"id":"proj-diceduel","region":"modules-debug","order":10,"title":"Project: Dice Duel","story":"Two players each roll a handful of dice. Highest total wins.","goal":"Write roll_many(n, sides=6) returning a list of n random rolls, and play(rolls_a, rolls_b) returning A, B or draw by comparing totals.","type":"write-code","starter":"import random\n# define roll_many and play\n","tests":[{"kind":"eval","label":"A wins","expr":"play([6, 6], [1, 2])","expect":"'A'"},{"kind":"eval","label":"B wins","expr":"play([1], [2])","expect":"'B'"},{"kind":"eval","label":"Draw","expr":"play([3, 3], [2, 4])","expect":"'draw'"},{"kind":"eval","label":"Right number of rolls","expr":"len(roll_many(5))","expect":"5"},{"kind":"eval","label":"Rolls stay in range","expr":"all(1 <= x <= 6 for x in roll_many(100))","expect":"True"},{"kind":"eval","label":"Custom die","expr":"all(1 <= x <= 3 for x in roll_many(60, 3))","expect":"True","hidden":true}],"hints":["Split the job: one function creates rolls, the other compares totals.","A list comprehension can create the rolls: [random.randint(1, sides) for _ in range(n)].","import random\n\n\ndef roll_many(n, sides=6):\n    return [random.randint(1, sides) for _ in range(n)]\n\n\ndef play(rolls_a, rolls_b):\n    a, b = sum(rolls_a), sum(rolls_b)\n    if a > b:\n        return \"A\"\n    if b > a:\n        return \"B\"\n    return \"draw\"\n"],"socratic":["Which function handles randomness?","How do you compare two totals?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Project: Dice Duel”?","xp":60,"skills":["random","functions"],"requires":["w-groups"],"solution":"import random\n\n\ndef roll_many(n, sides=6):\n    return [random.randint(1, sides) for _ in range(n)]\n\n\ndef play(rolls_a, rolls_b):\n    a, b = sum(rolls_a), sum(rolls_b)\n    if a > b:\n        return \"A\"\n    if b > a:\n        return \"B\"\n    return \"draw\"\n","alt":"import random\n\n\ndef roll_many(n, sides=6):\n    rolls = []\n    for _ in range(n):\n        rolls.append(random.randint(1, sides))\n    return rolls\n\n\ndef play(rolls_a, rolls_b):\n    diff = sum(rolls_a) - sum(rolls_b)\n    return \"A\" if diff > 0 else \"B\" if diff < 0 else \"draw\"\n","project":true},{"id":"w-counter","region":"modules-debug","order":4,"title":"Popular Word","story":"Which word does the toolshed hear most often?","goal":"Write most_common(words) returning the word that appears most often in a list.","type":"write-code","starter":"from collections import Counter\n# define most_common\n","tests":[{"kind":"eval","label":"Simple","expr":"most_common([\"a\", \"b\", \"a\"])","expect":"'a'"},{"kind":"eval","label":"Clear winner","expr":"most_common([\"x\", \"y\", \"y\", \"z\", \"z\", \"z\"])","expect":"'z'"},{"kind":"eval","label":"Single","expr":"most_common([\"only\"])","expect":"'only'","hidden":true}],"hints":["Counter counts items for you. Counter(words) is like a dictionary of counts.","Counter has a .most_common(1) method returning a list of (item, count) pairs.","from collections import Counter\n\n\ndef most_common(words):\n    return Counter(words).most_common(1)[0][0]\n"],"socratic":["What does Counter store?","How do you pick just the top item?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Popular Word”?","xp":30,"skills":["collections"],"requires":["w-dates"],"solution":"from collections import Counter\n\n\ndef most_common(words):\n    return Counter(words).most_common(1)[0][0]\n","alt":"def most_common(words):\n    best = None\n    best_count = 0\n    for w in set(words):\n        if words.count(w) > best_count:\n            best, best_count = w, words.count(w)\n    return best\n"},{"id":"w-dates","region":"modules-debug","order":3,"title":"Days Until","story":"The toolshed's calendar counts the days between two dates.","goal":"Write days_until(start, end) for ISO date strings like 2024-03-01. It returns the number of days from start to end (negative if end is earlier).","type":"write-code","starter":"from datetime import date\n# define days_until\n","tests":[{"kind":"eval","label":"A month","expr":"days_until(\"2024-03-01\", \"2024-03-31\")","expect":"30"},{"kind":"eval","label":"Across a leap day","expr":"days_until(\"2024-02-27\", \"2024-03-01\")","expect":"3"},{"kind":"eval","label":"Backwards","expr":"days_until(\"2024-03-31\", \"2024-03-01\")","expect":"-30","hidden":true}],"hints":["date.fromisoformat turns a string into a date you can do maths with.","Subtracting two dates gives a timedelta. Its .days is the number you want.","from datetime import date\n\n\ndef days_until(start, end):\n    return (date.fromisoformat(end) - date.fromisoformat(start)).days\n"],"socratic":["How do you turn text into a date?","What type do you get when subtracting dates?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Days Until”?","xp":30,"skills":["datetime"],"requires":["w-dice"],"solution":"from datetime import date\n\n\ndef days_until(start, end):\n    return (date.fromisoformat(end) - date.fromisoformat(start)).days\n","alt":"from datetime import datetime\n\n\ndef days_until(start, end):\n    a = datetime.strptime(start, \"%Y-%m-%d\")\n    b = datetime.strptime(end, \"%Y-%m-%d\")\n    return (b - a).days\n"},{"id":"w-dice","region":"modules-debug","order":2,"title":"Roll the Dice","story":"The toolshed hosts a dice game. Use the random module for fair rolls.","goal":"Write roll(sides=6) that returns a random whole number from 1 to sides.","type":"write-code","starter":"import random\n# define roll\n","tests":[{"kind":"eval","label":"Always within 1 to 6","expr":"all(1 <= roll() <= 6 for _ in range(200))","expect":"True"},{"kind":"eval","label":"Two-sided die gives both faces","expr":"set(roll(2) for _ in range(200)) == {1, 2}","expect":"True"},{"kind":"eval","label":"One-sided die","expr":"roll(1)","expect":"1","hidden":true}],"hints":["random.randint(a, b) includes both ends.","Use sides as the upper limit, with a default of 6.","import random\n\n\ndef roll(sides=6):\n    return random.randint(1, sides)\n"],"socratic":["Does randint include its last number?","Where does the 6 come from?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Roll the Dice”?","xp":30,"skills":["random","defaults"],"requires":["p-import"],"solution":"import random\n\n\ndef roll(sides=6):\n    return random.randint(1, sides)\n","alt":"import random\n\n\ndef roll(sides=6):\n    return random.choice(range(1, sides + 1))\n"},{"id":"w-groups","region":"modules-debug","order":9,"title":"Group by Length","story":"The toolshed sorts nails by length.","goal":"Write group_by_length(words) returning a dict from length to the list of words of that length, in input order.","type":"write-code","starter":"from collections import defaultdict\n# define group_by_length\n","tests":[{"kind":"eval","label":"Two groups","expr":"group_by_length([\"a\", \"bb\", \"c\"])","expect":"{1: ['a', 'c'], 2: ['bb']}"},{"kind":"eval","label":"Empty","expr":"group_by_length([])","expect":"{}"},{"kind":"eval","label":"Order is kept","expr":"group_by_length([\"xx\", \"yy\", \"z\"])","expect":"{2: ['xx', 'yy'], 1: ['z']}","hidden":true}],"hints":["defaultdict(list) creates an empty list the first time a key is used.","Append each word to groups[len(word)].","from collections import defaultdict\n\n\ndef group_by_length(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[len(w)].append(w)\n    return dict(groups)\n"],"socratic":["What should the key be?","What happens the first time a length appears?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what is the key idea in “Group by Length”?","xp":30,"skills":["collections","dicts"],"requires":["p-shadow"],"solution":"from collections import defaultdict\n\n\ndef group_by_length(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[len(w)].append(w)\n    return dict(groups)\n","alt":"def group_by_length(words):\n    groups = {}\n    for w in words:\n        if len(w) not in groups:\n            groups[len(w)] = []\n        groups[len(w)].append(w)\n    return groups\n"},{"id":"f-self","region":"objects","order":3,"title":"Fill the Counter","story":"A turnstile counts visitors. Every method needs the special first parameter.","goal":"Print 2 after two visitors.","type":"fill","starter":"class Counter:\n    def __init__(___):\n        self.count = 0\n    def hit(self):\n        self.count ___ 1\n\nc = Counter()\nc.hit()\nc.hit()\nprint(c.count)\n","tests":[{"kind":"stdout","label":"Prints 2","expect":"2"}],"hints":["The first parameter of every method is the object itself, conventionally called self.","The second blank adds to the existing count: +=.","class Counter:\n    def __init__(self):\n        self.count = 0\n    def hit(self):\n        self.count += 1\n\nc = Counter()\nc.hit()\nc.hit()\nprint(c.count)\n"],"socratic":["What is the first parameter of a method?","How do you add to an attribute?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what did the blank teach you in “Fill the Counter”?","xp":20,"skills":["classes","self"],"requires":["w-class-basic"],"solution":"class Counter:\n    def __init__(self):\n        self.count = 0\n    def hit(self):\n        self.count += 1\n\nc = Counter()\nc.hit()\nc.hit()\nprint(c.count)\n"},{"id":"o-class-order","region":"objects","order":9,"title":"Order the Lamp","story":"A lamp class and its test run are shuffled. Put them in a working order.","goal":"Put the lines in order so the program prints True.","type":"order","starter":"class Light:\n    def __init__(self):\n        self.on = not self.on\nlamp.toggle()\nlamp = Light()\nprint(lamp.on)\n        self.on = False\n    def toggle(self):\n","lines":["class Light:","    def __init__(self):","        self.on = not self.on","lamp.toggle()","lamp = Light()","print(lamp.on)","        self.on = False","    def toggle(self):"],"tests":[{"kind":"stdout","label":"Prints True","expect":"True"}],"hints":["The class must be defined before you create a lamp from it.","Inside the class, __init__ comes before toggle. Use indentation to see which lines are inside.","class Light:\n    def __init__(self):\n        self.on = False\n    def toggle(self):\n        self.on = not self.on\nlamp = Light()\nlamp.toggle()\nprint(lamp.on)\n"],"socratic":["What must exist before Light() runs?","Which lines belong inside each method?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what decides the order of these lines?","xp":20,"skills":["classes","order"],"requires":["w-dunder"],"solution":"class Light:\n    def __init__(self):\n        self.on = False\n    def toggle(self):\n        self.on = not self.on\nlamp = Light()\nlamp.toggle()\nprint(lamp.on)\n"},{"id":"ob-boss","region":"objects","order":11,"title":"Boss: The Leaky Wallet","story":"A wallet class forgets its cash and refuses to spend every last rupee. Two bugs hide inside.","goal":"Fix Wallet so cash is stored, and spending exactly all the cash works.","type":"fix-the-bug","starter":"class Wallet:\n    def __init__(self, cash):\n        cash = cash\n\n    def spend(self, amount):\n        if amount >= self.cash:\n            return False\n        self.cash -= amount\n        return True\n","tests":[{"kind":"eval","label":"Stores cash","expr":"Wallet(10).cash","expect":"10"},{"kind":"eval","label":"Spend some","expr":"(lambda w: (w.spend(4), w.cash))(Wallet(10))","expect":"(True, 6)"},{"kind":"eval","label":"Refuse overspending","expr":"(lambda w: (w.spend(50), w.cash))(Wallet(10))","expect":"(False, 10)"},{"kind":"eval","label":"Spend everything","expr":"(lambda w: (w.spend(10), w.cash))(Wallet(10))","expect":"(True, 0)","hidden":true}],"hints":["The first bug is in __init__: assigning to plain cash creates a local variable that vanishes.","The second bug is a comparison: is spending exactly all the cash allowed? Check >= against >.","class Wallet:\n    def __init__(self, cash):\n        self.cash = cash\n\n    def spend(self, amount):\n        if amount > self.cash:\n            return False\n        self.cash -= amount\n        return True\n"],"socratic":["What is the difference between cash and self.cash?","Should spending exactly all your cash be allowed?","Compare your output with the goal. What differs?"],"explain":"In one sentence: what was the bug, and how did you fix it?","xp":60,"skills":["debugging","classes"],"requires":["proj-inventory"],"solution":"class Wallet:\n    def __init__(self, cash):\n        self.cash = cash\n\n    def spend(self, amount):\n        if amount > self.cash:\n            return False\n        self.cash -= amount\n        return True\n","alt":"class Wallet:\n    def __init__(self, cash):\n        self.cash = cash\n\n    def spend(self, amount):\n        if self.cash - amount < 0:\n            return False\n        self.cash = self.cash - amount\n        return True\n","boss":true},{"id":"p-class","region":"objects","order":1,"title":"Meet the Dog","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"class Dog:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return self.name + \" says woof\"\nd = Dog(\"Tuffy\")\nprint(d.speak())","options":["name says woof","Error: TypeError","Dog says woof","Tuffy says woof"],"answer":3,"why":"Dog(\"Tuffy\") runs __init__, which stores the name on that object. speak() reads it back through self.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does self refer to inside speak?","The output is:\nTuffy says woof"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["classes"],"requires":["md-boss"],"solution":"Tuffy says woof"},{"id":"p-shared","region":"objects","order":4,"title":"The Shared Box","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"class Box:\n    items = []\n    def add(self, x):\n        self.items.append(x)\na = Box()\nb = Box()\na.add(1)\nprint(b.items)","options":["[]","[1]","[1, 1]","Error: AttributeError"],"answer":1,"why":"items is a class attribute: every Box shares the same list. Put self.items = [] inside __init__ to give each Box its own.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","Where was the list created: per object or once for the class?","The output is:\n[1]"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["classes","mutability"],"requires":["f-self"],"solution":"[1]"},{"id":"p-super","region":"objects","order":6,"title":"Calling the Parent","story":"Be the computer! Read the code and predict what it prints before you run it.","goal":"Predict the exact output.","type":"predict","starter":"","code":"class A:\n    def hi(self):\n        return \"A\"\nclass B(A):\n    def hi(self):\n        return super().hi() + \"B\"\nprint(B().hi())","options":["B","A","AB","BA"],"answer":2,"why":"super().hi() runs the parent's version first, giving \"A\", and then \"B\" is added to the end.","tests":[{"kind":"choice","label":"Choose the output"}],"hints":["Trace the code line by line. After each line, write down what every variable holds.","What does super() refer to?","The output is:\nAB"],"socratic":["What does the first line do?","Which line is the trickiest, and what does Python do there?","Say the result out loud before you choose."],"explain":"In one sentence: why does it print that?","xp":15,"skills":["inheritance"],"requires":["w-account"],"solution":"AB"},{"id":"proj-inventory","region":"objects","order":10,"title":"Project: Shop Inventory","story":"The guild shop needs a stock tracker you can trust.","goal":"Write class Inventory with add(item, qty=1), remove(item, qty=1) and report(). remove raises ValueError if there is not enough stock (or the item is unknown). report returns a sorted list of \"item: qty\" strings and skips items with zero stock.","type":"write-code","starter":"# define class Inventory\n","tests":[{"kind":"eval","label":"Report","expr":"(lambda i: (i.add(\"pen\", 5), i.add(\"ink\", 2), i.remove(\"pen\", 3), i.report())[3])(Inventory())","expect":"['ink: 2', 'pen: 2']"},{"kind":"raises","label":"Unknown item","expr":"Inventory().remove(\"pen\")","exc":"ValueError"},{"kind":"raises","label":"Not enough stock","expr":"(lambda i: (i.add(\"a\", 2), i.remove(\"a\", 3)))(Inventory())","exc":"ValueError"},{"kind":"eval","label":"Zero stock is hidden","expr":"(lambda i: (i.add(\"a\"), i.remove(\"a\"), i.report())[2])(Inventory())","expect":"[]","hidden":true}],"hints":["Keep a dictionary on self: item name to quantity.","In remove, check self.stock.get(item, 0) < qty first and raise. In report, loop over sorted items and skip zeros.","class Inventory:\n    def __init__(self):\n        self.stock = {}\n\n    def add(self, item, qty=1):\n        self.stock[item] = self.stock.get(item, 0) + qty\n\n    def remove(self, item, qty=1):\n        if self.stock.get(item, 0) < qty:\n            raise ValueError(\"not enough \" + item)\n        self.stock[item] -= qty\n\n    def report(self):\n        return [f\"{k}: {v}\" for k, v in sorted(self.stock.items()) if v > 0]\n"],"socratic":["What data structure holds the s
